<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>外部资源 · technical-knowledge</title>
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/base.css" />
    <script src="/static/nav.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/sources.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => TKShell.sidebar({ page: 'sources' }));
      document.addEventListener('DOMContentLoaded', () => TKShell.feedback({
        where: () => '当前页面：<b>外部资源</b>',
        title: () => '外部资源',
      }));
    </script>
    <style>
      /* 外部资源页。
       *
       * 这一页的职责是"说清每个站补了什么"，不是"列一堆链接"。
       * 只列链接的话和浏览器书签没区别 —— 读者不知道点进去会得到什么，
       * 也就不会点。所以每张卡的主体是 gain 那一段，链接是它的落款。
       *
       * 分三层，顺序即重要性：知识文章 → 论文 → 资讯。
       * 用户对资讯类的原话是「不算知识」「放在最后吧」，所以它单独一组、
       * 视觉上也更轻（没有 gain 的长段落）。
       */
      .src-group { margin-top: var(--space-7); }
      .src-group:first-of-type { margin-top: var(--space-5); }
      .src-group > h2 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 var(--space-3);
        color: var(--color-ink);
        font-size: var(--text-h3);
        font-weight: var(--weight-bold);
      }
      .src-group > h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-line);
      }
      .src-group > h2 span {
        order: 3;
        color: var(--color-muted);
        font-size: var(--text-small);
        font-weight: var(--weight-normal);
      }
      .src-note {
        margin: 0 0 var(--space-4);
        color: var(--color-muted);
        font-size: var(--text-body);
      }

      .src-list { display: grid; gap: var(--space-3); }

      .src-card {
        display: grid;
        gap: var(--space-2);
        padding: var(--space-4) var(--space-5);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-panel);
        box-shadow: var(--shadow-sm);
      }
      .src-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .src-head a {
        color: var(--color-ink);
        font-size: var(--text-lg);
        font-weight: var(--weight-bold);
      }
      .src-head a:hover { color: var(--color-accent); }
      /* 外链标记：告诉读者会离开本站。放在名字后面，不抢标题。 */
      .src-head a::after {
        content: " ↗";
        color: var(--color-muted);
        font-size: var(--text-sm);
        font-weight: var(--weight-normal);
      }
      .src-kind { color: var(--color-muted); font-size: var(--text-sm); }

      .src-gain {
        margin: 0;
        color: var(--color-ink-soft);
        font-size: var(--text-body);
        line-height: 1.8;
      }
      /* 资讯组的卡片不必撑那么高，它的价值是"知道发生了什么"，
         不需要一段论证。 */
      .src-card--light .src-gain { color: var(--color-muted); }

      .src-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .src-tags i {
        padding: 2px 8px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        color: var(--color-muted);
        font-size: var(--text-xs);
        font-style: normal;
        white-space: nowrap;
      }

      @media (max-width: 760px) {
        .src-card { padding: var(--space-4); }
        .src-head a { font-size: var(--text-md); }
      }
    </style>
  </head>
  <body class="tk-host">
    <aside class="tk-sidebar" id="tk-sidebar"></aside>
    <div class="tk-shell">
      <section class="hero">
        <div class="eyebrow">SOURCES · 外部资源</div>
        <h1>别人做得更好的地方</h1>
        <p id="src-intro">这一页不重复造已经有人做好的东西。每个站都写清它补了什么、什么情况下该去那里而不是留在这里 —— 与其在本地做一个更差的版本，不如把入口放好。</p>
      </section>

      <div id="src-groups"></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (m) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]
      ));
      const tr = (x) => (window.TKI18N ? window.TKI18N.t(x) : x);
      const lang = () => (window.TKI18N?.lang || "zh");

      /* 英文界面取 en 里的字段，缺了就回退中文。
         显示中文总好过显示空白 —— 和论文页的 fieldOf 同一条规则。 */
      function pick(item, key) {
        if (lang() === "en" && item.en && item.en[key]) return item.en[key];
        return item[key] || "";
      }

      function card(item, light) {
        const tags = (lang() === "en" && item.en && item.en.tags ? item.en.tags : item.tags) || [];
        return `<article class="src-card${light ? " src-card--light" : ""}">
          <div class="src-head">
            <a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">${esc(pick(item, "name"))}</a>
            <span class="src-kind">${esc(pick(item, "kind"))}</span>
          </div>
          <p class="src-gain">${esc(pick(item, "gain"))}</p>
          ${tags.length ? `<div class="src-tags">${tags.map((t) => `<i>${esc(t)}</i>`).join("")}</div>` : ""}
        </article>`;
      }

      /* 计数后缀按语言直接取。走词典会有个坑：中文的「个」是个量词，
         英文里没有对应词（"3 sources" 里 sources 已经由前面的名词承担了）。
         硬塞进词典只会得到一个别扭的英文句子，所以这里显式分支。 */
      const countSuffix = () => (lang() === "en" ? "" : " 个");

      function render() {
        const data = window.TK_SOURCES;
        if (!data || !data.groups) {
          $("#src-groups").innerHTML = `<div class="empty"><p class="empty-title">${esc(tr("资源清单读不到"))}</p><p class="empty-hint">${esc(tr("检查 site/sources.js 是否加载成功，然后刷新。"))}</p></div>`;
          return;
        }
        $("#src-groups").innerHTML = data.groups.map((group) => `
          <section class="src-group">
            <h2>${esc(tr(group.title))}<span>${group.items.length}${countSuffix()}</span></h2>
            <p class="src-note">${esc(tr(group.note))}</p>
            <div class="src-list">${group.items.map((item) => card(item, group.key === "news")).join("")}</div>
          </section>`).join("");
        // 分组标题、说明、intro 都是 tr() 出来的静态中文，需要再过一遍词典；
        // 卡片内是按当前语言直接取的，不重复翻译。
        if (window.TKI18N) window.TKI18N.translateDOM($("#src-groups"));
      }

      document.addEventListener("DOMContentLoaded", render);
      // 切语言后整页重画：卡片里的 name/gain/tags 是按语言直接取的，
      // translateDOM 扫不到它们，不重画就会留下上一种语言的残页。
      document.addEventListener("tk:lang", render);
    </script>
  </body>
</html>
