services:
  knowledge-site:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      KNOWLEDGE_SITE_PASSWORD_FILE: /run/secrets/knowledge_site_password
      KNOWLEDGE_REPOSITORY_ROOT: /app
    secrets:
      - knowledge_site_password
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  knowledge_site_password:
    file: .secrets/knowledge_site_password
