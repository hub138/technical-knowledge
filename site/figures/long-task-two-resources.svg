<svg xmlns="http://www.w3.org/2000/svg" width="820" height="490" viewBox="0 0 820 490" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="820" height="490" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">长任务：提交与结果拆成两个资源</text>

  <rect x="52" y="86" width="130" height="58" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="117" y="110" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E3A8A">客户端</text>
  <text x="117" y="130" text-anchor="middle" font-size="11" fill="#6B7280">浏览器 / 服务</text>

  <rect x="330" y="76" width="180" height="78" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="420" y="101" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2937">服务端</text>
  <text x="420" y="121" text-anchor="middle" font-size="11" fill="#6B7280">202 立即返回</text>
  <text x="420" y="139" text-anchor="middle" font-size="11" fill="#6B7280">连接随即释放</text>

  <rect x="610" y="76" width="160" height="78" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="690" y="101" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4C1D95">任务资源</text>
  <text x="690" y="121" text-anchor="middle" font-size="11" fill="#6B7280">/operations/op_9x2m</text>
  <text x="690" y="139" text-anchor="middle" font-size="11" fill="#6B7280">状态：queued → running</text>

  <line x1="184" y1="106" x2="326" y2="106" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="255" y="97" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">POST /reports</text>
  <text x="255" y="122" text-anchor="middle" font-size="10.5" fill="#64748B">Idempotency-Key</text>

  <line x1="512" y1="98" x2="606" y2="98" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="560" y="89" text-anchor="middle" font-size="11.5" fill="#4C1D95" font-weight="600">建任务</text>

  <line x1="512" y1="136" x2="606" y2="136" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="560" y="128" text-anchor="middle" font-size="11.5" fill="#1E40AF" font-weight="600">回 202 + Location</text>

  <line x1="326" y1="142" x2="184" y2="142" stroke="#2563EB" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="255" y="160" text-anchor="middle" font-size="11" fill="#1E40AF">202 Accepted</text>

  <rect x="330" y="196" width="440" height="54" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="550" y="218" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">worker 执行中（几分钟到几小时）</text>
  <text x="550" y="238" text-anchor="middle" font-size="11" fill="#6B7280">连接早已释放，客户端可断开、重启、换设备</text>
  <line x1="512" y1="176" x2="512" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="156" x2="690" y2="192" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="52" y="300" width="130" height="58" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="117" y="324" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E3A8A">客户端</text>
  <text x="117" y="344" text-anchor="middle" font-size="11" fill="#6B7280">随时可查</text>

  <line x1="184" y1="322" x2="326" y2="322" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="255" y="313" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">GET /operations/op_9x2m</text>
  <text x="255" y="338" text-anchor="middle" font-size="10.5" fill="#64748B">按 Retry-After 间隔</text>

  <line x1="326" y1="342" x2="184" y2="342" stroke="#059669" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="255" y="360" text-anchor="middle" font-size="11" fill="#065F46">200 + {status, progress}</text>

  <line x1="512" y1="292" x2="512" y2="308" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="310" width="180" height="52" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.4"/>
  <text x="420" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">状态端点</text>
  <text x="420" y="351" text-anchor="middle" font-size="10.5" fill="#6B7280">事实源 · 机器可读</text>

  <line x1="512" y1="336" x2="606" y2="336" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="608" y="310" width="162" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="689" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">终态 succeeded</text>
  <text x="689" y="351" text-anchor="middle" font-size="10.5" fill="#065F46">resultUrl 稳定可取</text>

  <line x1="690" y1="292" x2="690" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="608" y="204" width="162" height="50" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="689" y="225" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991B1B">终态不可逆</text>
  <text x="689" y="243" text-anchor="middle" font-size="10.5" fill="#B91C1C">failed/canceled 同样只进不出</text>

  <rect x="105" y="408" width="610" height="60" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="429" text-anchor="middle" font-size="12" fill="#6B7280">提交（202 + 任务资源）与结果交付（终态）分离，</text>
  <text x="410" y="447" text-anchor="middle" font-size="12" fill="#6B7280">同步接口超时、线程占用、客户端重启丢结果三个问题各得各的解</text>
  <text x="410" y="463" text-anchor="middle" font-size="12" fill="#6B7280">Webhook 通知只是「该去查了」的信号，状态端点才是事实源</text>
</svg>
