<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">三次 write 的一次 read：字节河没有消息边界</text>

  <rect x="52" y="72" width="150" height="46" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="127" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">发送端</text>
  <text x="127" y="110" text-anchor="middle" font-size="11" fill="#6B7280">write 100B × 3</text>

  <rect x="52" y="146" width="150" height="46" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="127" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">发送缓冲区</text>
  <text x="127" y="184" text-anchor="middle" font-size="11" fill="#6B7280">Nagle 攒包 / MSS 分段</text>

  <rect x="52" y="220" width="150" height="46" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="127" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">网络分段</text>
  <text x="127" y="258" text-anchor="middle" font-size="11" fill="#6B7280">段数随 RTT 与缓冲变化</text>

  <rect x="52" y="294" width="150" height="46" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="127" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">接收缓冲区</text>
  <text x="127" y="332" text-anchor="middle" font-size="11" fill="#6B7280">段按到达序堆放</text>

  <line x1="127" y1="118" x2="127" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="127" y1="192" x2="127" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="127" y1="266" x2="127" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="204" y1="317" x2="266" y2="317" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="235" y="305" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">read</text>

  <rect x="268" y="290" width="170" height="54" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="353" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">应用一次拿到 250B</text>
  <text x="353" y="332" text-anchor="middle" font-size="10.5" fill="#92400E">也可能是 50B，都合法</text>

  <line x1="440" y1="317" x2="494" y2="317" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="467" y="305" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">怎么切？</text>

  <line x1="496" y1="296" x2="552" y2="180" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="512" y="242" font-size="11.5" font-weight="600" fill="#065F46">有成帧规则</text>

  <line x1="496" y1="330" x2="552" y2="330" stroke="#DC2626" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="520" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991B1B">没有</text>

  <rect x="554" y="96" width="216" height="150" rx="10" fill="#F8FAFC" stroke="#059669" stroke-width="1.6"/>
  <text x="662" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">按规则切出完整消息</text>
  <text x="662" y="148" text-anchor="middle" font-size="11" fill="#374151">长度前缀：读满 N 字节一条</text>
  <text x="662" y="170" text-anchor="middle" font-size="11" fill="#374151">定界符：遇到约定字节一条</text>
  <text x="662" y="192" text-anchor="middle" font-size="11" fill="#374151">剩余字节留在缓冲区</text>
  <text x="662" y="214" text-anchor="middle" font-size="11" fill="#374151">等下一段 read 补齐</text>
  <rect x="570" y="224" width="184" height="14" rx="4" fill="#D1FAE5"/>

  <rect x="554" y="276" width="216" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="662" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#991B1B">把 250B 当一条消息解析</text>
  <text x="662" y="322" text-anchor="middle" font-size="11" fill="#B91C1C">半条消息 / 拼包错位 / 多出尾巴</text>
  <text x="662" y="341" text-anchor="middle" font-size="11" fill="#B91C1C">调网络参数救不了</text>

  <rect x="105" y="366" width="610" height="40" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="391" text-anchor="middle" font-size="12" fill="#6B7280">发送端「写几次」与接收端「读到什么粒度」之间没有对应关系，边界由应用层成帧规则补齐</text>
</svg>
