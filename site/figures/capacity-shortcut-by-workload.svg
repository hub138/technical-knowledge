<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" lang="zh-CN" aria-labelledby="sc-title sc-desc">
<title id="sc-title">容量模型工程简化：按负载形态分派主导约束</title>
<desc id="sc-desc">短输出场景主导约束是 decode 带宽，长输出场景是显存，长输入场景是 prefill 算力，各配一行估算公式。</desc>
<defs>
<marker id="sa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
</defs>
<rect width="800" height="500" fill="#ffffff"/>
<style>
.b { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; font-size: 13.5px; font-weight: 600; }
.s { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; font-size: 11px; }
.m { font-family: 'SFMono-Regular',Consolas,'Courier New',monospace; fill: #334155; font-size: 10.5px; }
.in { fill: rgba(34,211,238,0.12); stroke: #0891b2; stroke-width: 1.5; }
.c1 { fill: rgba(5,150,105,0.12); stroke: #059669; stroke-width: 1.5; }
.c2 { fill: rgba(251,191,36,0.15); stroke: #d97706; stroke-width: 1.5; }
.c3 { fill: rgba(167,139,250,0.15); stroke: #7c3aed; stroke-width: 1.5; }
</style>
<g transform="translate(280 30)">
<rect class="in" width="240" height="70" rx="8"/>
<text x="120" y="28" text-anchor="middle" class="b">流量预估</text>
<text x="120" y="50" text-anchor="middle" class="s">输入长度 S_in · 输出长度 S_out · QPS R</text>
</g>
<g transform="translate(30 180)">
<rect class="c1" width="230" height="120" rx="8"/>
<text x="115" y="28" text-anchor="middle" class="b">短输出 S_out &lt; 256</text>
<text x="115" y="48" text-anchor="middle" class="s">主导约束：decode 带宽</text>
<text x="115" y="76" text-anchor="middle" class="m">卡数 ≈ R × S_out × 模型权重字节数</text>
<text x="115" y="94" text-anchor="middle" class="m">/ (带宽 × 系数 0.3-0.5)</text>
</g>
<g transform="translate(285 180)">
<rect class="c2" width="230" height="120" rx="8"/>
<text x="115" y="28" text-anchor="middle" class="b">长输出 S_out &gt; 4096</text>
<text x="115" y="48" text-anchor="middle" class="s">主导约束：显存</text>
<text x="115" y="76" text-anchor="middle" class="m">卡数 ≈ R × S_out × TPOT</text>
<text x="115" y="94" text-anchor="middle" class="m">× KV/请求 / 单卡 KV 预算</text>
</g>
<g transform="translate(540 180)">
<rect class="c3" width="230" height="120" rx="8"/>
<text x="115" y="28" text-anchor="middle" class="b">长输入 S_in &gt; 8192</text>
<text x="115" y="48" text-anchor="middle" class="s">主导约束：prefill 算力</text>
<text x="115" y="76" text-anchor="middle" class="m">卡数 ≈ R × S_in × 参数量 × 2</text>
<text x="115" y="94" text-anchor="middle" class="m">/ 单卡 TFLOPS</text>
</g>
<line x1="360" y1="100" x2="160" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#sa)"/>
<line x1="400" y1="100" x2="400" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#sa)"/>
<line x1="440" y1="100" x2="640" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#sa)"/>
<text x="215" y="140" class="s">输出短</text>
<text x="406" y="140" class="s">输出长</text>
<text x="560" y="140" class="s">输入长</text>
<g transform="translate(120 360)">
<rect width="560" height="70" rx="8" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 3"/>
<text x="280" y="28" text-anchor="middle" class="s">先用简化公式估量级，压测前再按第二到四步完整推导；</text>
<text x="280" y="50" text-anchor="middle" class="s">流量分布（输入/输出长度）变了，主导约束会换，公式也要换</text>
</g>
<line x1="160" y1="300" x2="230" y2="352" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="400" y1="300" x2="400" y2="352" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="640" y1="300" x2="570" y2="352" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
</svg>
