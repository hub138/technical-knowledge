<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="820" height="500" fill="#FFFFFF"/>
  <text x="410" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Fencing Token：旧主写入被过期令牌拦下</text>

  <rect x="50" y="205" width="170" height="66" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="135" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#1E3A8A">协调服务</text>
  <text x="135" y="256" text-anchor="middle" font-size="11" fill="#6B7280">单调递增发号</text>

  <rect x="355" y="92" width="140" height="58" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="425" y="127" text-anchor="middle" font-size="15" font-weight="600" fill="#065F46">新主</text>

  <rect x="355" y="332" width="140" height="58" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="425" y="367" text-anchor="middle" font-size="15" font-weight="600" fill="#991B1B">旧主</text>

  <rect x="612" y="205" width="150" height="66" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="687" y="234" text-anchor="middle" font-size="15" font-weight="600" fill="#4C1D95">存储层</text>
  <text x="687" y="256" text-anchor="middle" font-size="11" fill="#6B7280">只认最大令牌</text>

  <line x1="222" y1="212" x2="348" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="272" y="152" font-size="12.5" fill="#065F46" font-weight="600">发放 token 34</text>

  <line x1="222" y1="262" x2="348" y2="350" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="258" y="322" font-size="12.5" fill="#991B1B" font-weight="600">曾发放 token 33</text>

  <line x1="497" y1="122" x2="640" y2="200" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="545" y="148" font-size="12.5" fill="#065F46" font-weight="600">写入 附 34</text>

  <line x1="497" y1="352" x2="640" y2="276" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="543" y="330" font-size="12.5" fill="#991B1B" font-weight="600">写入 附 33</text>

  <line x1="687" y1="203" x2="687" y2="170" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="612" y="118" width="150" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
  <text x="687" y="140" text-anchor="middle" font-size="12.5" font-weight="600" fill="#065F46">34 ≥ 34 接受</text>
  <text x="687" y="157" text-anchor="middle" font-size="11" fill="#065F46">写入成功</text>

  <line x1="687" y1="273" x2="687" y2="306" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="612" y="308" width="150" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
  <text x="687" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991B1B">33 &lt; 34 拒绝</text>
  <text x="687" y="347" text-anchor="middle" font-size="11" fill="#991B1B">旧主写入被挡</text>

  <rect x="105" y="438" width="610" height="44" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="457" text-anchor="middle" font-size="12" fill="#6B7280">令牌随主节点切换单调递增，存储层只认最大令牌，</text>
  <text x="410" y="474" text-anchor="middle" font-size="12" fill="#6B7280">持有过期令牌的旧主即使自认是主也无法写入</text>
</svg>
