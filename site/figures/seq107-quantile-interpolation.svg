<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="桶内线性插值机制图：累积桶阶梯线、p99 目标位次线、插值读数点与真实值点的对照">
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="600" font-family="'Noto Sans SC', system-ui, sans-serif">桶内线性插值：p99 读数是怎么来的</text>
  <text x="380" y="48" text-anchor="middle" font-size="11" fill="#6b7280" font-family="'Noto Sans SC', system-ui, sans-serif">ZOOZ 公开案例：桶边界 1/2/4/8/16/32ms，告警阈值 10ms 正落在 8ms 与 16ms 的空隙里</text>

  <line x1="60" y1="300" x2="720" y2="300" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="185" x2="720" y2="185" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="60" y1="127" x2="720" y2="127" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="60" y1="70" x2="720" y2="70" stroke="#e5e7eb" stroke-width="1"/>

  <text x="52" y="304" text-anchor="end" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">0%</text>
  <text x="52" y="131" text-anchor="end" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">75%</text>
  <text x="52" y="189" text-anchor="end" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">50%</text>
  <text x="52" y="74" text-anchor="end" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">100%</text>
  <text x="26" y="185" font-size="11" fill="#374151" font-family="'Noto Sans SC', system-ui, sans-serif" transform="rotate(-90 26 185)">累积计数占比</text>

  <line x1="60" y1="300" x2="60" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">1ms</text>
  <line x1="190" y1="300" x2="190" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="190" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">2ms</text>
  <line x1="320" y1="300" x2="320" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="320" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">4ms</text>
  <line x1="450" y1="300" x2="450" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="450" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">8ms</text>
  <line x1="580" y1="300" x2="580" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="580" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">16ms</text>
  <line x1="710" y1="300" x2="710" y2="306" stroke="#9ca3af" stroke-width="1"/>
  <text x="710" y="321" text-anchor="middle" font-size="10" fill="#6b7280" font-family="system-ui, sans-serif">32ms</text>

  <path d="M60,288 L190,288 L190,196 L320,196 L320,127 L450,127 L450,81 L580,81 L580,70 L710,70" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <line x1="60" y1="72" x2="720" y2="72" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="718" y="63" text-anchor="end" font-size="11" fill="#dc2626" font-family="'Noto Sans SC', system-ui, sans-serif">p99 目标位次 99%</text>

  <circle cx="461" cy="72" r="5" fill="#059669"/>
  <text x="461" y="56" text-anchor="middle" font-size="11" fill="#059669" font-weight="600" font-family="'Noto Sans SC', system-ui, sans-serif">真实 p99 ≈ 8.5ms</text>

  <circle cx="554" cy="72" r="5" fill="#dc2626"/>
  <text x="562" y="96" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600" font-family="'Noto Sans SC', system-ui, sans-serif">插值读数 14.4ms</text>

  <line x1="461" y1="82" x2="554" y2="82" stroke="#b45309" stroke-width="1.2"/>
  <line x1="461" y1="78" x2="461" y2="86" stroke="#b45309" stroke-width="1.2"/>
  <line x1="554" y1="78" x2="554" y2="86" stroke="#b45309" stroke-width="1.2"/>
  <text x="507" y="118" text-anchor="middle" font-size="10" fill="#b45309" font-family="'Noto Sans SC', system-ui, sans-serif">误差上界＝所在桶的宽度（8→16ms 共 8ms）</text>

  <line x1="60" y1="345" x2="90" y2="345" stroke="#2563eb" stroke-width="2.5"/>
  <text x="97" y="349" font-size="11" fill="#374151" font-family="'Noto Sans SC', system-ui, sans-serif">le 桶累积计数（1000 次请求：≤1ms 5%，≤2ms 45%，≤4ms 75%，≤8ms 95%，≤16ms 100%）</text>
  <text x="380" y="371" text-anchor="middle" font-size="10" fill="#9ca3af" font-family="'Noto Sans SC', system-ui, sans-serif">按 ZOOZ 工程团队公开复盘数据绘制（engineering.zooz.com）</text>
</svg>
