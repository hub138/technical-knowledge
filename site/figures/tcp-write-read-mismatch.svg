<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="440" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">发送侧三次 write，接收侧一次 read：错位发生在哪</text>

  <text x="150" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">发送侧</text>
  <rect x="60" y="100" width="180" height="38" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="150" y="124" text-anchor="middle" font-size="11.5" fill="#1E3A8A">write 消息A 100B</text>
  <rect x="60" y="146" width="180" height="38" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="150" y="170" text-anchor="middle" font-size="11.5" fill="#1E3A8A">write 消息B 100B</text>
  <rect x="60" y="192" width="180" height="38" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="150" y="216" text-anchor="middle" font-size="11.5" fill="#1E3A8A">write 消息C 100B</text>

  <line x1="240" y1="119" x2="292" y2="119" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="165" x2="292" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="211" x2="292" y2="211" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="294" y="100" width="120" height="130" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="354" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">发送缓冲区</text>
  <text x="354" y="150" text-anchor="middle" font-size="10.5" fill="#6B7280">合并成段或分段</text>
  <text x="354" y="168" text-anchor="middle" font-size="10.5" fill="#6B7280">由 MSS 与</text>
  <text x="354" y="186" text-anchor="middle" font-size="10.5" fill="#6B7280">Nagle 决定</text>

  <line x1="414" y1="165" x2="466" y2="165" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="440" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1F2937">网络</text>

  <rect x="468" y="100" width="120" height="130" rx="9" fill="#F8FAFC" stroke="#475569" stroke-width="1.6"/>
  <text x="528" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">接收缓冲区</text>
  <text x="528" y="152" text-anchor="middle" font-size="10.5" fill="#6B7280">段按到达序堆放</text>
  <text x="528" y="174" text-anchor="middle" font-size="10.5" fill="#6B7280">边界信息</text>
  <text x="528" y="192" text-anchor="middle" font-size="10.5" fill="#6B7280">已经不存在</text>

  <line x1="588" y1="165" x2="640" y2="165" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="614" y="152" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2937">read</text>

  <rect x="642" y="126" width="130" height="78" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="707" y="150" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400E">拿到 250B</text>
  <text x="707" y="172" text-anchor="middle" font-size="10.5" fill="#92400E">可能是 A+B+C</text>
  <text x="707" y="190" text-anchor="middle" font-size="10.5" fill="#92400E">各一部分</text>

  <rect x="105" y="270" width="610" height="72" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="410" y="294" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A8A">两个错位来源都在接收侧缓冲区</text>
  <text x="410" y="316" text-anchor="middle" font-size="11.5" fill="#374151">来源一：Nagle 与拥塞窗口把三次写合并成一段发出，一次 read 全部取走（粘连）</text>
  <text x="410" y="335" text-anchor="middle" font-size="11.5" fill="#374151">来源二：单条消息超过 MSS，一次 write 切成多段到达，先读到半条（半包）</text>

  <rect x="105" y="366" width="610" height="48" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="386" text-anchor="middle" font-size="12" fill="#6B7280">「粘包」不是 TCP 故障：每一段在 TCP 内部都有清晰边界，</text>
  <text x="410" y="404" text-anchor="middle" font-size="12" fill="#6B7280">错位发生在应用把「一次 read 的返回」当成「一条消息」的那一刻</text>
</svg>
