<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     version="1.1"
     width="990px" height="660px"
     viewBox="0 0 990 660" >

  <title>B-Tree</title>

  <!-- common text classes -->
  <style type="text/css">
  .text_small   {font-style:normal;
                 font-weight:normal;
                 font-size:12px;
                 font-family:"Open Sans", sans-serif;
                 fill:black;
                }
  .text_small_red {font-style:normal;
                 font-weight:bold;
                 font-size:12px;
                 font-family:"Open Sans", sans-serif;
                 fill:red;
                }
  .text_normal  {font-style:normal;
                 font-weight:normal;
                 font-size:16px;
                 font-family:"Open Sans", sans-serif;
                 fill:black;
                }
  .text_big     {font-style:normal;
                 font-weight:normal;
                 font-size:24px;
                 font-family:"Open Sans", sans-serif;
                 fill:black;
                }
  .text_comment {font-style:italic;
                 font-weight:normal;
                 font-size:14px;
                 font-family:"Open Sans", sans-serif;
                 fill:black;
                }
  </style>

  <defs>

    <!-- blue rectangles for physical pages -->
    <symbol id="page_50" stroke="blue" stroke-width="0.3px" fill="aqua">
      <title>Physical Page</title>
      <rect width="50" height="25" />
    </symbol>
    <symbol id="page_115" stroke="blue" stroke-width="0.3px" fill="aqua">
      <title>Physical Page</title>
      <rect width="115" height="25" />
    </symbol>
    <symbol id="page_155" stroke="blue" stroke-width="0.3px" fill="aqua">
      <title>Physical Page</title>
      <rect width="155" height="25" />
    </symbol>

    <symbol id="entry" stroke-width="0.3px" fill="white">
      <title>Index entry</title>
      <rect rx="5" width="31" height="15" />
      <path d="M 26,0 v 15" stroke="black" />
    </symbol>

    <symbol id="note_130" stroke="black" fill="lightyellow">
      <title>Note</title>
      <path d="M 130,10 v 50 h -130 v -60 h 120 v 10 h 10 l -10,-10" />
    </symbol>

    <symbol id="note_755" stroke="black" fill="lightyellow">
      <title>Note</title>
      <path d="M 755,10 v 20 h -755 v -30 h 745 v 10 h 10 l -10,-10" />
    </symbol>

    <symbol id="note_860" stroke="black" fill="lightyellow">
      <title>Note</title>
      <path d="M 860,10 v 20 h -860 v -30 h 850 v 10 h 10 l -10,-10" />
    </symbol>

    <!-- marker start/end -->
    <marker id="arrowhead_start"
            markerWidth="10"
            markerHeight="10"
            refX="0"
            refY="3"
            orient="auto">
      <path d="M 6,0 l -6,3 l 6,3" stroke="black" fill="none" />
    </marker>
    <marker id="arrowhead_end"
            markerWidth="10"
            markerHeight="10"
            refX="6"
            refY="3"
            orient="auto">
      <path d="M 0,0 l 6,3 l -6,3" stroke="black" fill="none" />
    </marker>
    <marker id="arrowhead_dot"
            markerWidth="4"
            markerHeight="4"
            refX="2"
            refY="2">
      <circle cx="2" cy="2" r="2" fill="black" />
    </marker>

    <!-- double linking arrow -->
    <path id="arrow_d" d="M 0,0 h 20" stroke="black"
          marker-start="url(#arrowhead_start)" marker-end="url(#arrowhead_end)" />
  </defs>


  <!-- start of rendering area -->
  <!-- an enclosing rectangle -->
  <rect x="1" y="1" rx="5" width="99%" height="99%" stroke="black" fill="none" />

  <!-- caption -->
  <text class="text_big" transform="translate(435, 40)">B-Tree Index</text>

  <!-- left padding -->
  <g transform="translate(30, 0)">

    <!-- delimiter -->
    <path d="M 0,70 h 920" stroke="black" stroke-width="0.3px" />

    <!-- META page -->
    <g transform="translate(0, 110)">
      <text class="text_normal">Meta page</text>
      <use xlink:href="#page_115" transform="translate(400, -18)" />
      <path d="M 450,0 l -40 60" stroke="black" marker-start="url(#arrowhead_dot)"
                                                marker-end="url(#arrowhead_end)" />
    </g>

    <!-- delimiter -->
    <path d="M 0,140 h 920" stroke="black" stroke-width="0.3px" />

    <!-- non leaf pages -->
    <g transform="translate(0, 175)">
      <text class="text_normal" transform="translate(0, 60)">Internal pages (non-leaf)</text>

      <!-- first level -->
      <g transform="translate(400, 0)" >
        <use xlink:href="#page_115"    />

        <!-- minus infinity -->
        <use xlink:href="#entry" transform="translate(10, 5)" />
        <text class="text_small"  transform="translate(15, 17)">-∞</text>

        <path d="M 40,17 l -180, 65" stroke="black" marker-start="url(#arrowhead_dot)"
                                                    marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry"  transform="translate(60, 5)" />
        <text class="text_small"  transform="translate(65, 17)">17</text>
        <path d="M 90,17 l  50, 65" stroke="black" marker-start="url(#arrowhead_dot)"
                                                   marker-end="url(#arrowhead_end)" />
      </g>

      <!-- second level -->
      <g transform="translate(0, 90)">

        <g transform="translate(240, 0)">
          <use xlink:href="#page_155" />
          <use xlink:href="#entry" transform="translate(5, 5)" />
          <!-- high key -->
          <text class="text_small_red" transform="translate(7, 17)" >17</text>

          <!-- minus infinity -->
          <use xlink:href="#entry" transform="translate(42, 5)" />
          <text class="text_small"  transform="translate(47, 17)">-∞</text>
          <path d="M 70,17 l -180, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                      marker-end="url(#arrowhead_end)" />

          <!-- regular entries -->
          <use xlink:href="#entry" transform="translate(79, 5)" />
          <text class="text_small" transform="translate(84, 17)">13</text>
          <path d="M 107,17 l -90, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                   marker-end="url(#arrowhead_end)" />

          <use xlink:href="#entry" transform="translate(114, 5)" />
          <text class="text_small" transform="translate(119, 17)">15</text>
          <path d="M 142,17 l 10, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                     marker-end="url(#arrowhead_end)" />

          <path d="M 160,12 h 130" stroke="black" marker-start="url(#arrowhead_start)"
                                                  marker-end="url(#arrowhead_end)" />
        </g>

        <g transform="translate(540, 0)">
          <use xlink:href="#page_115" />
          <use xlink:href="#entry" transform="translate(5, 5)" />
          <text class="text_small"  transform="translate(10, 17)">-∞</text>
          <path d="M 33,17 l -30, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                     marker-end="url(#arrowhead_end)" />

          <use xlink:href="#entry" transform="translate(40, 5)" />
          <text class="text_small" transform="translate(45, 17)">19</text>
          <path d="M 68,17 l 70, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                    marker-end="url(#arrowhead_end)" />

          <use xlink:href="#entry" transform="translate(77, 5)" />
          <text class="text_small" transform="translate(82, 17)">21</text>
          <path d="M 105,17 l 175, 90" stroke="black" marker-start="url(#arrowhead_dot)"
                                                      marker-end="url(#arrowhead_end)" />
        </g>
      </g>

      <!-- Note -->
      <g transform="translate(730, 30)">
        <use xlink:href="#note_130" />
        <text class="text_comment"  transform="translate(10, 20)">The tree</text>
        <text class="text_comment"  transform="translate(10, 35)">grows upwards</text>
        <text class="text_comment"  transform="translate(10, 50)">on demand</text>
        <path d="M 120,50 v -35" stroke="black" marker-end="url(#arrowhead_end)" />
      </g>

    </g> <!-- end of non-leaf pages -->

    <!-- delimiter -->
    <path d="M 0,350 h 920" stroke="black" stroke-width="0.3px" />

    <!-- leaf pages -->
    <g transform="translate(0, 380)">
      <text class="text_normal" y="20">Leaf pages</text>

      <g transform="translate(110, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small_red" transform="translate(7, 17)" >13</text>

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(43, 17)">11</text>
        <path d="M 69,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                              marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(75, 5)" />
        <text class="text_small" transform="translate(77, 17)">12</text>
        <path d="M 105,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                              marker-end="url(#arrowhead_end)" />

        <use xlink:href="#arrow_d" transform="translate(118,12)" />
      </g>

      <g transform="translate(250, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small_red" transform="translate(7, 17)" >15</text>

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(45, 17)">13</text>
        <path d="M 68,16 v 70"     stroke="black" marker-start="url(#arrowhead_dot)"
                                                  marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(77, 5)" />
        <text class="text_small" transform="translate(82, 17)">14</text>
        <path d="M 105,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                               marker-end="url(#arrowhead_end)" />

        <use xlink:href="#arrow_d" transform="translate(118,12)" />
      </g>

      <g transform="translate(390, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small_red" transform="translate(7, 17)" >17</text>

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(45, 17)">15</text>
        <path d="M 68,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                              marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(77, 5)" />
        <text class="text_small" transform="translate(82, 17)">16</text>
        <path d="M 105,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                               marker-end="url(#arrowhead_end)" />

        <use xlink:href="#arrow_d" transform="translate(118,12)" />
      </g>

      <g transform="translate(530, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small_red" transform="translate(7, 17)" >19</text>

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(45, 17)">17</text>
        <path d="M 68,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                              marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(77, 5)" />
        <text class="text_small" transform="translate(82, 17)">18</text>
        <path d="M 105,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                               marker-end="url(#arrowhead_end)" />

        <use xlink:href="#arrow_d" transform="translate(118,12)" />
      </g>

      <g transform="translate(670, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small_red" transform="translate(7, 17)" >21</text>

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(45, 17)">19</text>
        <path d="M 68,16 v 70"   stroke="black" marker-start="url(#arrowhead_dot)"
                                                marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(75, 5)" />
        <text class="text_small" transform="translate(80, 17)">20</text>
        <path d="M 106,16 v 70"  stroke="black" marker-start="url(#arrowhead_dot)"
                                                marker-end="url(#arrowhead_end)" />

        <use xlink:href="#arrow_d" transform="translate(118,12)" />
      </g>

      <g transform="translate(810, 0)">
        <use xlink:href="#page_115" />
        <use xlink:href="#entry" transform="translate(5, 5)" />
        <text class="text_small" transform="translate(7, 17)" >21</text>
        <path d="M 35,16 v 70"   stroke="black" marker-start="url(#arrowhead_dot)"
                                                marker-end="url(#arrowhead_end)" />

        <use xlink:href="#entry" transform="translate(40, 5)" />
        <text class="text_small" transform="translate(45, 17)">22</text>
        <path d="M 68,16 v 70" stroke="black" marker-start="url(#arrowhead_dot)"
                                              marker-end="url(#arrowhead_end)" />
      </g>

      <!-- a note -->
      <g transform="translate(140, 40)">
        <use xlink:href="#note_755" />
        <text class="text_comment" transform="translate(100, 20)">
           Single tuple IDs (pointers to rows in data file) or arrays of tuple IDs ('posting lists')</text>
      </g>
    </g>  <!-- end of leaf pages -->

    <!-- delimiter -->
    <path d="M 0,495 h 920" stroke="black" stroke-width="0.3px" />

    <!-- Legend -->
    <text class="text_big" transform="translate(30, 620) rotate(270)" >Legend</text>

    <g transform="translate(60, 520)">
      <use xlink:href="#note_860" />
      <g transform="translate(10, 3)">
        <use xlink:href="#page_50" />
        <use xlink:href="#entry" transform="translate(10, 5)" />
        <text class="text_small_red" transform="translate(15, 17)" >n</text>
      </g>
      <text class="text_comment" transform="translate(70, 20)">
        'high key': First index entry per page is a high bound for its keys;
        no link; not used at rightmost page per level</text>
    </g>

    <g transform="translate(60, 560)">
      <use xlink:href="#note_860" />
      <g transform="translate(10, 3)">
        <use xlink:href="#page_50" />
        <use xlink:href="#entry" transform="translate(10, 5)" />
        <text class="text_small" transform="translate(15, 17)">-∞</text>
        <path d="M 40,14" stroke="black" marker-start="url(#arrowhead_dot)" />
      </g>
      <text class="text_comment" transform="translate(70, 20)">
        'minus infinity': Second (or first) index entry per page; not a real key;
        pointer to left child; not used at leaf level</text>
    </g>

    <g transform="translate(60, 600)">
      <use xlink:href="#note_860" />
      <g transform="translate(10, 3)">
        <use xlink:href="#page_50" />
        <use xlink:href="#entry" transform="translate(10, 5)" />
        <text class="text_small" transform="translate(18, 17)" >n</text>
        <path d="M 39,14" stroke="black" marker-start="url(#arrowhead_dot)" />
      </g>
      <text class="text_comment" transform="translate(70, 20)">Regular index entry with 'key | pointer' pair</text>
    </g>

  </g>

</svg>
