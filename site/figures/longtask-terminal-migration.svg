<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" role="img" lang="zh-CN" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
<style>
