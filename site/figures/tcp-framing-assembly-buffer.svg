<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">成帧与装配：字节河切回消息的两道工序</text>

  <rect x="52" y="88" width="130" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="117" y="107" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A8A">发送端应用</text>
  <text x="117" y="123" text-anchor="middle" font-size="10.5" fill="#6B7280">write 3 x 100B</text>

  <rect x="52" y="158" width="130" height="42" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  <text x="117" y="177" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1F2937">接收缓冲区</text>
  <text x="117" y="193" text-anchor="middle" font-size="10.5" fill="#6B7280">段按到达序堆放</text>

  <rect x="52" y="228" width="130" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="117" y="247" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400E">应用 read</text>
  <text x="117" y="263" text-anchor="middle" font-size="10.5" fill="#92400E">拿走当前全部字节</text>

  <line x1="117" y1="130" x2="117" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="117" y1="200" x2="117" y2="224" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="186" y1="249" x2="240" y2="249" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="213" y="239" text-anchor="middle" font-size="10.5" font-weight="600" fill="#991B1B">无成帧</text>

  <rect x="242" y="220" width="196" height="58" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="340" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#991B1B">250B 被当成一条消息</text>
  <text x="340" y="261" text-anchor="middle" font-size="10.5" fill="#B91C1C">半条消息 / 拼包错位 / 多出尾巴</text>

  <line x1="186" y1="179" x2="492" y2="179" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="339" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">有成帧规则（长度前缀 / 定界符 / 定长）</text>

  <rect x="494" y="104" width="276" height="230" rx="10" fill="#F8FAFC" stroke="#059669" stroke-width="1.6"/>
  <text x="632" y="130" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065F46">装配缓冲区循环切分</text>

  <rect x="514" y="148" width="40" height="32" rx="5" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="534" y="169" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E3A8A">A</text>
  <rect x="556" y="148" width="40" height="32" rx="5" fill="#D1FAE5" stroke="#059669"/>
  <text x="576" y="169" text-anchor="middle" font-size="11.5" font-weight="600" fill="#065F46">B</text>
  <rect x="598" y="148" width="40" height="32" rx="5" fill="#FEF3C7" stroke="#D97706"/>
  <text x="618" y="169" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400E">C?</text>
  <text x="703" y="169" text-anchor="middle" font-size="10.5" fill="#64748B">read 追加</text>

  <line x1="534" y1="184" x2="534" y2="202" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="576" y1="184" x2="576" y2="202" stroke="#059669" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="618" y1="184" x2="618" y2="202" stroke="#D97706" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="534" y="218" text-anchor="middle" font-size="10.5" fill="#1E40AF">交付 A</text>
  <text x="576" y="218" text-anchor="middle" font-size="10.5" fill="#065F46">交付 B</text>
  <text x="618" y="218" text-anchor="middle" font-size="10.5" fill="#92400E">留尾巴</text>

  <rect x="514" y="232" width="236" height="42" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.3"/>
  <text x="632" y="249" text-anchor="middle" font-size="10.5" fill="#065F46">read 500B：交付完整 A、B</text>
  <text x="632" y="266" text-anchor="middle" font-size="10.5" fill="#065F46">read 50B：C 补齐后才交付</text>

  <rect x="514" y="282" width="236" height="36" rx="7" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.3"/>
  <text x="632" y="305" text-anchor="middle" font-size="10.5" fill="#4C1D95">缓冲区设上限：超限断开防恶意长度</text>

  <line x1="440" y1="179" x2="490" y2="179" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="105" y="374" width="610" height="56" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="395" text-anchor="middle" font-size="12" fill="#6B7280">TCP 只保证字节按序完整到达，「粘」是应用层没定义边界的错觉：</text>
  <text x="410" y="413" text-anchor="middle" font-size="12" fill="#6B7280">成帧规则决定怎么切，装配缓冲区决定切不动时怎么办</text>
</svg>
