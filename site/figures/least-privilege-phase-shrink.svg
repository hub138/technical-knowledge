<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="820" height="470" fill="#FFFFFF"/>
  <text x="410" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">能力随任务阶段收敛：权限只在需要的时间窗内存在</text>

  <line x1="70" y1="356" x2="760" y2="356" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="760" y="374" text-anchor="end" font-size="11.5" fill="#64748B">任务时间线</text>

  <line x1="128" y1="330" x2="128" y2="96" stroke="#2563EB" stroke-width="2"/>
  <rect x="66" y="66" width="126" height="60" rx="9" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="129" y="91" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1E3A8A">调查阶段</text>
  <text x="129" y="111" text-anchor="middle" font-size="11" fill="#374151">只读权限</text>

  <line x1="304" y1="330" x2="304" y2="96" stroke="#7C3AED" stroke-width="2"/>
  <rect x="242" y="66" width="126" height="60" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="305" y="91" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4C1D95">修改阶段</text>
  <text x="305" y="111" text-anchor="middle" font-size="11" fill="#374151">只写独立工作区</text>

  <line x1="480" y1="330" x2="480" y2="96" stroke="#059669" stroke-width="2"/>
  <rect x="418" y="66" width="126" height="60" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="481" y="91" text-anchor="middle" font-size="13.5" font-weight="600" fill="#065F46">发布阶段</text>
  <text x="481" y="111" text-anchor="middle" font-size="11" fill="#374151">单独审批通道</text>

  <line x1="656" y1="330" x2="656" y2="96" stroke="#DC2626" stroke-width="2"/>
  <rect x="594" y="66" width="126" height="60" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="657" y="91" text-anchor="middle" font-size="13.5" font-weight="600" fill="#991B1B">任务结束</text>
  <text x="657" y="111" text-anchor="middle" font-size="11" fill="#374151">全部撤权 + 对账</text>

  <rect x="70" y="176" width="116" height="34" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-dasharray="4 3"/>
  <text x="128" y="198" text-anchor="middle" font-size="11.5" fill="#1E40AF">read orders 表</text>

  <rect x="246" y="176" width="116" height="34" rx="7" fill="#EDE9FE" stroke="#7C3AED" stroke-dasharray="4 3"/>
  <text x="304" y="198" text-anchor="middle" font-size="11.5" fill="#5B21B6">write 工作区</text>
  <line x1="190" y1="193" x2="242" y2="193" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="216" y="184" text-anchor="middle" font-size="10.5" fill="#B45309">收 read</text>

  <rect x="422" y="176" width="116" height="34" rx="7" fill="#D1FAE5" stroke="#059669" stroke-dasharray="4 3"/>
  <text x="480" y="198" text-anchor="middle" font-size="11.5" fill="#065F46">审批后发布</text>
  <line x1="366" y1="193" x2="418" y2="193" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="392" y="184" text-anchor="middle" font-size="10.5" fill="#B45309">收 write</text>

  <line x1="542" y1="193" x2="594" y2="193" stroke="#D97706" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="568" y="184" text-anchor="middle" font-size="10.5" fill="#B45309">收审批权</text>

  <rect x="90" y="248" width="640" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-dasharray="5 4"/>
  <text x="410" y="270" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991B1B">清理留到任务结束的反面教材：任意时点被攻破，攻击者都拿到全量能力</text>
  <text x="410" y="289" text-anchor="middle" font-size="11.5" fill="#B91C1C">逐阶段收回：每个时点暴露的只有当前阶段那一格</text>

  <rect x="105" y="404" width="610" height="44" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="5 4"/>
  <text x="410" y="423" text-anchor="middle" font-size="12" fill="#6B7280">进入下一阶段立即收回上一阶段能力，</text>
  <text x="410" y="440" text-anchor="middle" font-size="12" fill="#6B7280">中途缺权限走短期加签，到期自动收回，不固化为常驻通道</text>
</svg>
