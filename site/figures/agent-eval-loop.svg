<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" lang="zh-CN" aria-labelledby="loop-title loop-desc">
<title id="loop-title">Agent 评测离线在线闭环</title>
<desc id="loop-desc">离线测试集筛选候选，灰度上线，在线验证与监控，失败案例回流离线测试集。</desc>
<defs>
<marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
<marker id="ahg" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="ahr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e11d48"/></marker>
</defs>
<rect width="820" height="560" fill="#ffffff"/>
<style>
.n { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
.n-off { fill: rgba(34,211,238,0.12); stroke: #0891b2; }
.n-on { fill: rgba(251,191,36,0.15); stroke: #d97706; }
.n-back { fill: rgba(225,29,72,0.10); stroke: #e11d48; }
.n-pub { fill: rgba(5,150,105,0.12); stroke: #059669; }
.t { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; font-size: 14px; font-weight: 600; }
.s { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; font-size: 11px; }
.e { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; font-size: 11px; }
.lbl { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; fill: #ffffff; font-size: 11px; font-weight: 600; }
</style>
<g transform="translate(40 40)">
<rect class="n n-off" width="180" height="80" rx="8"/>
<text x="90" y="34" text-anchor="middle" class="t">离线评测</text>
<text x="90" y="56" text-anchor="middle" class="s">黄金轨迹 + 异常集</text>
</g>
<g transform="translate(320 40)">
<rect class="n n-on" width="180" height="80" rx="8"/>
<text x="90" y="34" text-anchor="middle" class="t">灰度上线</text>
<text x="90" y="56" text-anchor="middle" class="s">先放开一小部分用户</text>
</g>
<g transform="translate(590 40)">
<rect class="n n-on" width="190" height="80" rx="8"/>
<text x="95" y="30" text-anchor="middle" class="t">在线评测</text>
<text x="95" y="50" text-anchor="middle" class="s">满意度 · 完成率 · 介入率</text>
<text x="95" y="66" text-anchor="middle" class="s">真实流量验证</text>
</g>
<g transform="translate(590 380)">
<rect class="n n-back" width="190" height="80" rx="8"/>
<text x="95" y="30" text-anchor="middle" class="t">测试集回流</text>
<text x="95" y="52" text-anchor="middle" class="s">失败案例补覆盖盲区</text>
<text x="95" y="68" text-anchor="middle" class="s">按难度分层入离线集</text>
</g>
<g transform="translate(320 380)">
<rect class="n n-pub" width="180" height="80" rx="8"/>
<text x="90" y="34" text-anchor="middle" class="t">全量发布</text>
<text x="90" y="56" text-anchor="middle" class="s">持续监控在线指标</text>
</g>
<line x1="220" y1="80" x2="312" y2="80" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<text x="266" y="72" text-anchor="middle" class="e">选出候选 1-2 个</text>
<line x1="500" y1="80" x2="582" y2="80" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<text x="541" y="72" text-anchor="middle" class="e">放验证流量</text>
<line x1="685" y1="120" x2="685" y2="372" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<rect x="655" y="235" width="120" height="20" rx="4" fill="#e11d48"/>
<text x="715" y="249" text-anchor="middle" class="lbl">失败案例</text>
<line x1="588" y1="420" x2="508" y2="420" stroke="#059669" stroke-width="2" marker-end="url(#ahg)"/>
<text x="548" y="412" text-anchor="middle" class="e">指标正常</text>
<line x1="410" y1="378" x2="410" y2="128" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahr)"/>
<rect x="352" y="242" width="116" height="20" rx="4" fill="#e11d48"/>
<text x="410" y="256" text-anchor="middle" class="lbl">指标异常，回排查</text>
<line x1="320" y1="430" x2="150" y2="430" stroke="#64748b" stroke-width="0" />
<path d="M 320 430 L 200 430 Q 130 430 130 360 L 130 128" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="72" y="235" width="116" height="20" rx="4" fill="#64748b"/>
<text x="130" y="249" text-anchor="middle" class="lbl">更新测试集后重筛</text>
</svg>
