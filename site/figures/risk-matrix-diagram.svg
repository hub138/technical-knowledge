  <rect x="0" y="0" width="608" height="510" fill="#ffffff"/>
  <defs fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><marker id="mtx-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><path d="M 0 0.8 L 9 5 L 0 9.2" fill="none" stroke="#8f5c0c" stroke-width="1.4px" stroke-linecap="round" stroke-linejoin="round" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></path></marker></defs><!-- cells --><rect x="84" y="12" width="256" height="208" fill="#ffffff" stroke="#cbc4b1" stroke-width="1" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></rect><rect x="340" y="12" width="256" height="208" fill="#ffffff" stroke="#cbc4b1" stroke-width="1" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></rect><rect x="84" y="220" width="256" height="208" fill="#ffffff" stroke="#cbc4b1" stroke-width="1" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></rect><rect x="340" y="220" width="256" height="208" fill="#ffffff" stroke="#cbc4b1" stroke-width="1" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></rect><!-- centre dividers, a touch stronger --><line x1="340" y1="12" x2="340" y2="428" stroke="#cbc4b1" stroke-width="1.25px" fill="#000000" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></line><line x1="84" y1="220" x2="596" y2="220" stroke="#cbc4b1" stroke-width="1.25px" fill="#000000" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></line><!-- cell labels --><g fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><text x="212" y="120.5" text-anchor="middle" font-size="14px" font-weight="520" fill="#15171e" stroke="none" font-family="sans-serif">Transfer or plan</text></g><g fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><text x="468" y="120.5" text-anchor="middle" font-size="14px" font-weight="520" fill="#15171e" stroke="none" font-family="sans-serif">Mitigate or avoid</text></g><g fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><text x="212" y="328.5" text-anchor="middle" font-size="14px" font-weight="520" fill="#15171e" stroke="none" font-family="sans-serif">Accept</text></g><g fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><text x="468" y="320" text-anchor="middle" font-size="14px" font-weight="520" fill="#15171e" stroke="none" font-family="sans-serif">Monitor and</text><text x="468" y="337" text-anchor="middle" font-size="14px" font-weight="520" fill="#15171e" stroke="none" font-family="sans-serif">control</text></g><g fill="#000000" stroke="none" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"><!-- x-axis: low → high, left to right --><line x1="84" y1="454" x2="596" y2="454" stroke="#8f5c0c" stroke-width="1.1px" marker-end="url(#mtx-arrow)" fill="#000000" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></line><text x="84" y="476" text-anchor="start" font-size="10.5px" letter-spacing="1.26px" fill="#6d717c" stroke="none" font-family="sans-serif" font-weight="400" text-transform="uppercase">Low</text><text x="340" y="476" text-anchor="middle" font-size="11px" font-weight="560" letter-spacing="1.32px" fill="#8f5c0c" stroke="none" font-family="sans-serif" text-transform="uppercase">Likelihood</text><text x="596" y="476" text-anchor="end" font-size="10.5px" letter-spacing="1.26px" fill="#6d717c" stroke="none" font-family="sans-serif" font-weight="400" text-transform="uppercase">High</text><!-- y-axis: low → high, bottom to top --><line x1="58" y1="428" x2="58" y2="12" stroke="#8f5c0c" stroke-width="1.1px" marker-end="url(#mtx-arrow)" fill="#000000" font-family="serif" font-size="17px" font-weight="400" text-anchor="start"></line><text transform="rotate(-90 40 428)" x="40" y="428" text-anchor="start" font-size="10.5px" letter-spacing="1.26px" fill="#6d717c" stroke="none" font-family="sans-serif" font-weight="400" text-transform="uppercase">Low</text><text transform="rotate(-90 40 220)" x="40" y="220" text-anchor="middle" font-size="11px" font-weight="560" letter-spacing="1.32px" fill="#8f5c0c" stroke="none" font-family="sans-serif" text-transform="uppercase">Impact</text><text transform="rotate(-90 40 12)" x="40" y="12" text-anchor="end" font-size="10.5px" letter-spacing="1.26px" fill="#6d717c" stroke="none" font-family="sans-serif" font-weight="400" text-transform="uppercase">High</text></g>
