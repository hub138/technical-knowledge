/* 破折号单独成元素，不写在文本节点里。
 *
 * 原来写的是 <b>问题</b> —— 说明，那个文本节点的值是 " —— 说明"（带前导空格和
 * 破折号）。i18n 的 translateDOM 按整段文本查词典，带上前缀就永远查不到，
 * 英文界面下这一句会停在中文。拆开之后每个文本节点都是一句干净的译文。 */
.claim-list i{color:var(--color-faint);font-style:normal;padding:0 2px}
.claim-list span{color:var(--color-muted)}

/* 主张区右边原来空着一块。放论文里实测出来的数字，替主张做旁证——
   道理说了不算，得有别人测过的数。
   窄屏没有这块空白，整块收掉，不做折叠。 */
.claim-row{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}

2) 0 0;color:var(--color-muted);font-size:var(--text-sm);line-height:1.9}
.cite-block{margin:0 0 11px}
.cite-block>b{display:block;margin:0 0 7px;color:var(--color-ink);font-weight:var(--weight-semibold)}
.cite-list{margin:0;padding:0;list-style:none;display:grid;gap:5px}

.cite-list li{display:grid;gap:1px;padding:7px 10px;border:1px solid var(--color-line);border-left:2px solid var(--color-accent-line);border-radius:var(--radius-sm);background:var(--color-panel)}

.cite-id{font-family:var(--font-mono)}
.cite-more{display:inline-block;margin-top:7px;color:var(--color-accent);font-size:var(--text-sm);font-weight:var(--weight-semibold)}

.reader-sources a{color:var(--color-accent);text-decoration:none}
.reader-sources a:hover{text-decoration:underline}
.source-sep{margin:0 5px;color:var(--color-line-strong)}
.source-toggle{margin-left:8px;padding:1px 8px;border:1px solid var(--color-line);border-radius:var(--radius-full);background:transparent;color:var(--color-muted);font:inherit;font-size:var(--text-xs);cursor:pointer;transition:border-color var(--duration-fast) var(--ease-out),color var(--duration-fast) var(--ease-out)}
.source-toggle:hover{border-color:var(--color-accent);color:var(--color-accent)}.reader-sources a{color:var(--color-accent);margin-right:9px}.reader-layout{display:block}@media(max-width:1199px){.reader-toc{display:none}}@media(min-width:1200px){.reader-layout{display:grid;grid-template-columns:minmax(0,1fr) 204px;column-gap:26px;align-items:start}#reader-#reader-toc{grid-column:2}}.reader-siblings{margin:16px 0 0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.reader-siblings .rail-head{margin:0;padding:0;border:0;flex:0 0 auto;gap:4px;display:flex;align-items:center}.reader-siblings .rail-list{gap:7px}.reader-siblings .rail-head span{font-size:var(--text-xs);color:var(--color-muted)}.reader-siblings .rail-list{display:flex;flex-wrap:wrap;gap:7px}.reader-siblings .rail-list a{padding:5px 11px;border:1px solid var(--color-line);border-radius:15px;background:var(--color-panel);white-space:nowrap}.reader-toc{position:sticky;top:96px;max-height:calc(100vh - 130px);overflow:auto;font-size:var(--text-sm)}.rail-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--color-line);color:var(--color-muted);font-size:var(--text-xs);font-weight:700;letter-spacing:.06em}.rail-toggle{border:0;background:none;color:var(--color-muted);cursor:pointer;padding:0 2px;font-size:var(--text-base);line-height:1}.rail-toggle:hover{color:var(--color-accent)}.rail-list{margin:0;padding:0;list-style:none;display:grid;gap:2px}.rail-list a{display:block;padding:5px 8px;border-radius:5px;color:var(--color-muted);text-decoration:none;line-height:1.5}.rail-list a:hover{background:var(--color-accent-soft);color:var(--color-accent)}.rail-list a[aria-current="page"]{background:var(--color-accent-soft);color:var(--color-accent);font-weight:700}.rail-list .rail-group{margin:9px 0 3px;padding-left:8px;color:var(--color-muted);font-size:var(--text-2xs);font-weight:700;letter-spacing:.05em}.toc-list a{padding-left:8px}.toc-list a[data-level="3"]{padding-left:21px;font-size:var(--text-sm);color:var(--color-muted)}.toc-list a[data-level="4"]{padding-left:34px;font-size:var(--text-sm);color:var(--color-muted)}.reader-siblings.collapsed .rail-list,.reader-toc.collapsed .rail-list{display:none}.reader-body{max-width:960px;font-size:var(--text-lg);line-height:1.85}.reader-body h1{font-size:var(--text-3xl)}.reader-body h2{font-size:var(--text-2xl);border-bottom:1px solid var(--color-line);padding-bottom:5px;margin-top:31px}.reader-body h3{font-size:var(--text-xl);margin-top:25px}.reader-body p{margin:14px 0}.reader-body ul,.reader-body ol{padding-left:25px}.reader-body li{margin:5px 0}.reader-body blockquote{border-left:3px solid var(--color-accent);padding:4px 15px;color:var(--color-muted);background:var(--color-surface)}.reader-body a{color:var(--color-accent)}.reader-body img{max-width:100%;max-height:600px;border:1px solid var(--color-line);border-radius:6px}.reader-body code{background:var(--color-surface);color:var(--color-accent-ink);border:1px solid var(--color-accent-line);border-radius:4px;padding:1px 4px;font-family:var(--font-mono);font-size:.88em}.reader-body .code-block,.reader-body pre.mermaid{background:var(--color-surface);border:1px solid var(--color-line);color:var(--color-ink);border-radius:7px;padding:14px 16px;overflow:auto;font-size:var(--text-base);line-height:1.65}.reader-body .code-block code,.reader-body pre.mermaid code{background:none;border:0;padding:0;color:inherit;font-size:inherit}.reader-body table{border-collapse:collapse;width:100%;margin:var(--space-5) 0;font-size:var(--text-sm)}
/* 表格是正文的一部分，不是数据报表：行距要够读，

<script>
const $=s=>document.querySelector(s),state={notes:[],edges:[],papers:[],domain:'all',topic:'all',expandedDomains:new Set(),query:'',sort:'title',selected:null,graphMode:'network',zoom:1,pan:{x:0,y:0},view:'home',notesSignature:'',learningStatus:null};const order=['总览','AI系统','后端与分布式系统','数据系统','计算机系统与性能','软件构建与质量','Clippings'],topicOrder={'AI系统':['概览','模型基础与训练','模型与上下文','知识与检索','Agent与工作流','推理服务与平台','数据与MLOps','质量与运营','安全与治理','生态与选型'],'后端与分布式系统':['概览','服务设计','任务与并发','分布式可靠性','基础设施'],'数据系统':['概览','数据建模与SQL','事务与存储','查询与索引','数据管道与流处理','数据治理','可靠性与运维'],'计算机系统与性能':['概览','操作系统与运行时','处理器与内存','存储与网络','观测与诊断','性能工程'],'软件构建与质量':['概览','语言与运行时','算法与数据结构','架构与代码','开发工具','测试与交付']},colors=['#147766','#3f70a8','#a45b2a','#7862a3','#567b42','#9b4660','#697772'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ordered=a=>[...a].sort((x,y)=>(order.indexOf(x)<0?99:order.indexOf(x))-(order.indexOf(y)<0?99:order.indexOf(y))||x.localeCompare(y,'zh-CN'));const orderedTopics=(domain,a)=>[...a].sort((x,y)=>{const ranks=topicOrder[domain]||[];const rx=ranks.indexOf(x),ry=ranks.indexOf(y);return (rx<0?999:rx)-(ry<0?999:ry)||x.localeCompare(y,'zh-CN')});
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
/* POST 并把后端的中文错误原样带出来 —— json() 只做 GET，且错误信息是
   JSON body，直接 throw 会显示成 [object Object]。 */
async function postJson(url,payload){
  const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let data=null;try{data=await r.json()}catch{}
  if(!r.ok)throw Error((data&&data.error)||'请求失败');
  return data||{};
}
function alertUser(message){const box=$('#app-alert');box.textContent=message;box.classList.add('open');clearTimeout(alertUser.timer);alertUser.timer=setTimeout(()=>box.classList.remove('open'),5200)}
/* Re-translate after each view change: the SPA builds its markup in JS, so the
   strings the i18n walk saw at load are not the strings on screen now. */
function retranslate(){window.TKI18N?.translateDOM()}
function show(view){state.view=view;$('#home').style.display=view==='home'?'block':'none';$('#directory').style.display=view==='directory'?'block':'none';$('#reader').classList.toggle('open',view==='reader');$('#graph-view').classList.toggle('open',view==='graph');$('#reader-actions').hidden=view!=='reader';updateReaderStudy();updateSharedNav(view);retranslate()}function noteList(){const q=state.query.toLowerCase();return state.notes.filter(n=>n.category!=='总览'&&(state.domain==='all'||n.category===state.domain)&&(state.topic==='all'||n.topic===state.topic)&&(!q||[n.title,n.path,n.topic,n.search_text,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.sort==='updated'?(b.updated||'').localeCompare(a.updated||'')||a.title.localeCompare(b.title,'zh-CN'):a.title.localeCompare(b.title,'zh-CN'))}
function renderDomains(){
  const domains=ordered(new Set(state.notes.map(n=>n.category))).filter(d=>d!=='总览'&&d!=='Clippings'),clippingCount=state.notes.filter(n=>n.category==='Clippings').length;
  $('#domains').innerHTML=domains.map(d=>{
    const inDomain=state.notes.filter(n=>n.category===d);
    const open=state.expandedDomains.has(d),active=state.domain===d;
    // 时效性文章（type: radar）单独置顶：它标记的是"这份动态有没有更新"，
    // 属于领域级的信息，不属于任何一个主题，所以放在领域标题下方、主题列表之上。
    const radars=inDomain.filter(n=>n.type==='radar').sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
    // 归档是维护资料，不参与领域计数；单独列在最后，避免和真正的知识主题混在一起。
    const current=inDomain.filter(n=>n.topic!=='归档');
    const archived=inDomain.filter(n=>n.topic==='归档');
    const topics=orderedTopics(d,new Set(current.map(n=>n.topic)));
    const radarCards=radars.map(n=>`<button class="radar-card" data-path="${esc(n.path)}" title="时效性内容，每周更新：${esc(n.title)}"><span class="radar-icon" aria-hidden="true">⚡</span><span class="radar-text"><strong>${esc(n.title)}</strong><small>每周更新</small></span></button>`).join('');
    const archiveRow=archived.length?`<button class="topic-button archived" data-domain="${esc(d)}" data-topic="归档"><span>归档</span><span class="count">${archived.length}</span></button>`:'';
    return `<section class="nav-section"><button class="domain-button ${active?'active':''}" data-domain="${esc(d)}" aria-expanded="${open}"><span class="domain-label"><span class="domain-chevron" aria-hidden="true">${open?'▼':'▶'}</span><span>${esc(d)}</span></span><span class="count">${current.length}</span></button>${open?radarCards+topics.map(t=>`<button class="topic-button ${active&&state.topic===t?'active':''}" data-domain="${esc(d)}" data-topic="${esc(t)}"><span>${esc(t)}</span><span class="count">${current.filter(n=>n.topic===t).length}</span></button>`).join('')+archiveRow:''}</section>`;
  }).join('')+(clippingCount?`<div class="sidebar-support"><p>保留资料</p><button class="domain-button ${state.domain==='Clippings'?'active':''}" data-domain="Clippings"><span>Clippings</span><span class="count">${clippingCount}</span></button></div>`:'');
  document.querySelectorAll('.nav-section .domain-button').forEach(button=>button.onclick=()=>{const domain=button.dataset.domain;if(state.expandedDomains.has(domain)){state.expandedDomains.delete(domain);renderDomains();return}state.expandedDomains.add(domain);select(domain,'all')});
  document.querySelectorAll('.sidebar-support .domain-button').forEach(button=>button.onclick=()=>select(button.dataset.domain,'all'));
  document.querySelectorAll('.topic-button').forEach(button=>button.onclick=()=>select(button.dataset.domain,button.dataset.topic));
  document.querySelectorAll('.radar-card').forEach(button=>button.onclick=()=>openNote(button.dataset.path));
}
function renderDirectory(){
  const list=noteList(),groups=new Map();
  for(const n of list){const k=state.domain==='all'?n.category:n.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)}
  const groupRank=g=>state.domain==='all'?(order.indexOf(g)<0?999:order.indexOf(g)):(topicOrder[state.domain]||[]).indexOf(g)<0?999:(topicOrder[state.domain]||[]).indexOf(g);
  // 命中片段高亮：让"为什么这篇被搜出来"直接可见，而不是只列出标题。
  const q=state.query.trim();
  const mark=text=>{
    const raw=String(text??'');
    if(!q)return esc(raw);
    const at=raw.toLowerCase().indexOf(q.toLowerCase());
    if(at<0)return esc(raw);
    return esc(raw.slice(0,at))+'<mark class="hit">'+esc(raw.slice(at,at+q.length))+'</mark>'+esc(raw.slice(at+q.length));
  };
  const sections=[...groups].sort(([a],[b])=>groupRank(a)-groupRank(b)||a.localeCompare(b,'zh-CN')).map(([g,items])=>{
    const rows=items.map(n=>`<article class="note-row" data-path="${esc(n.path)}"><div><h3>${mark(n.title)}</h3><div class="path">${esc(n.topic)} · ${esc(n.change_rate||'')}</div></div><p>${q?mark(n.excerpt||''):esc(n.excerpt||'')}</p></article>`).join('');
    return `<section class="topic-section"><h3 class="topic-title"><span>${esc(g==='总览'?'入口':g)}</span><small>${items.length}</small></h3>${rows}</section>`;
  }).join('');
  // 空结果给可执行的下一步，而不是一句"没有匹配内容"就结束。
  const empty=groups.size?'':
    `<div class="empty"><p class="empty-title">没有找到“${esc(q)}”</p><p class="empty-hint">试试更短的关键词（如 “RAG”“缓存”），或按 <kbd>Esc</kbd> 清空搜索回到全部知识。</p>${state.domain!=='all'?`<button type="button" class="empty-action" id="empty-clear-domain">清除「${esc(state.domain)}」筛选</button>`:''}</div>`;
  $('#directory').innerHTML=`<div class="directory-head"><div><h2>${esc(state.query?'搜索结果':state.topic!=='all'?state.topic:state.domain==='all'?'全部知识':state.domain)}</h2><p>${list.length} 篇 · 主题按知识对象归属</p></div><div class="sort"><button data-sort="title" class="${state.sort==='title'?'active':''}">按标题</button><button data-sort="updated" class="${state.sort==='updated'?'active':''}">按更新</button></div></div>${sections}${empty}`;
  const clearDomain=$('#empty-clear-domain');
  if(clearDomain)clearDomain.onclick=()=>select('all','all');
  document.querySelectorAll('.note-row').forEach(row=>{row.setAttribute('tabindex','0');row.setAttribute('role','button');row.setAttribute('aria-label',row.querySelector('h3')?.textContent||'打开笔记');row.onclick=()=>openNote(row.dataset.path);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNote(row.dataset.path)}}});
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;renderDirectory()});
}
/* 首页的「知识地形」。
 *
 * 它的职责和 /?view=graph 不同：图谱页是拿来查关系的（缩放、平移、五个视图），
 * 这里是拿来一眼看懂这个知识库长什么样的。所以它不放交互，只放形状和数字，
 * 尺寸小、不用等布局、进页面就在。
 *
 * 每个领域一条横排，条内每个主题一个圆，半径按篇数。这样看的人先得到
 * 「AI 系统比计算机系统厚得多」这个结论，再决定要不要点进去。
 */
function renderAtlas(){
  const box=$('#home-atlas');
  if(!box)return;
  const tr=(x)=>window.TKI18N?window.TKI18N.t(x):x;
  const notes=state.notes.filter(n=>n.category!=='总览'&&n.category!=='Clippings'&&!n.exclude_from_graph);
  const domains=ordered(new Set(notes.map(n=>n.category)));
  /* 页头说 184 篇（全部非剪藏的笔记），这里只统计 153 篇（已归入领域、进图谱的）。
     两个数都对，但口径不同，所以要把口径写出来，否则看起来像自相矛盾。 */
  const noteLine=$('#atlas-note');
  if(noteLine)noteLine.textContent=`${notes.length} 篇已归入领域的笔记按主题分布。圆越大，主题下的笔记越多。归档来源与剪藏不计入。`;
  box.innerHTML=domains.map((d,di)=>{
    const group=notes.filter(n=>n.category===d);
    const ts=orderedTopics(d,new Set(group.map(n=>n.topic)))
      .map(t=>({t,n:group.filter(x=>x.topic===t).length}))
      .sort((a,b)=>b.n-a.n);
    const color=colors[di%colors.length];
    const dots=ts.map(item=>{
      const r=Math.round(6+Math.sqrt(item.n)*3.6);
      const size=r*2;
      return `<button type="button" class="atlas-topic" data-domain="${esc(d)}" data-topic="${esc(item.t)}"
        title="${esc(item.t)} · ${item.n} 篇"
        style="--dot:${size}px;--ink:${color}"><i></i><span>${esc(tr(item.t))}</span><b>${item.n}</b></button>`;
    }).join('');
    return `<div class="atlas-row">
      <button type="button" class="atlas-domain" data-domain="${esc(d)}" style="--ink:${color}">
        <i></i><span>${esc(tr(d))}</span><b>${group.length}</b>
      </button>
      <div class="atlas-dots">${dots}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.atlas-topic').forEach(el=>{
    el.onclick=()=>select(el.dataset.domain, el.dataset.topic);
  });
  box.querySelectorAll('.atlas-domain').forEach(el=>{
    el.onclick=()=>select(el.dataset.domain, 'all');
  });
}

/* 挑论文里带数字的结论当旁证。没有数字的不要 —— 旁证的力量全在数字上。
   优先挑被多篇笔记引用的，再按新近排。
   整块是按当前语言渲染的，不是翻译 DOM —— 语言切换必须重跑一遍 renderHome，
   所以 tki18n:change 里也要调 renderHome。 */
function homeQuotes(){
  const zh=window.TKI18N?.lang!=='en';
  /* 只要近两年的。旧论文的数字对今天的判断没有价值 —— 2022 年的一个基准分
     既不是现在的水平，也不代表现在的做法，摆在首页当论据是误导。
     这一块的职责是"给这几条结论一个可查的出处"，出处的时效性就是它的价值。 */
  const since=String(new Date().getFullYear()-2);
  const pool=state.papers.filter(p=>(zh?p.result_zh:p.key_result)&&String(p.published||'')>=since);
  pool.sort((a,b)=>(b.evidence_count+b.survey_count)-(a.evidence_count+a.survey_count)||String(b.published).localeCompare(String(a.published)));
  const cards=pool.slice(0,3).map(p=>{
    const text=zh?p.result_zh:p.key_result;
    const first=(p.authors||[])[0]||'';
    const who=first?first.split(' ').pop()+(zh?' 等':' et al.')+' · ':'';
    return `<a class="quote-card" href="/paper?id=${esc(p.id)}" target="_blank" rel="noopener noreferrer"><b>${esc(text)}</b><span>${esc(who)}arXiv ${esc(p.id)} · ${esc(String(p.published).slice(0,4))}</span></a>`;
  }).join('');
  if(!cards)return '';
  const head=zh?'论文站在追踪这些结论背后的原始数字':'The paper tracker follows the raw numbers behind these conclusions';
  const all=zh?'进入论文追踪':'Open paper tracking';
  const unit=zh?'篇':'papers';
  return `<p class="claim-quotes-head">${esc(head)} · <a href="/papers">${esc(all)} · ${state.papers.length} ${esc(unit)} →</a></p>${cards}`;
}

/* 来源常有十几个，全铺开会把标题和正文之间的呼吸挤掉。
   默认只显示前几条，其余收起来并给出条数。 */
/* 来源分两类显示。
 *
 * 论文和普通链接不是一回事：一篇 arXiv 论文有标题、作者、年份，而且这个知识
 * 页的结论可能就建立在它上面。以前它和"某篇博客"一样被折成一行小链接，读者
 * 看到一个裸编号，看不出这篇东西是什么、有多重。
 *
 * 所以论文单独成块，带标题和作者年份，并可跳到论文页看它支撑的其他结论；
 * 其余来源保持原来的紧凑链接串 —— 那些确实只是链接，铺开反而占地方。
 */
function renderPapers(papers){
  if(!papers?.length)return'';
  const items=papers.map(p=>{
    const authors=(p.authors||[]);
    const shown=authors.slice(0,2).join(', ')+(authors.length>2?(' '+tr('等')):'');
    const year=(p.published||'').slice(0,4);
    const meta=[shown,year].filter(Boolean).join(' · ');
    const title=p.title||p.id;
    return '<li><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(title)+'</a>'
      +'<span class="cite-meta">'+esc(meta)+'<span class="cite-id">arXiv:'+esc(p.id)+'</span></span></li>';
  }).join('');
  return '<div class="cite-block"><b>'+esc(tr('论据'))+'</b><ul class="cite-list">'+items+'</ul>'
    +'<a class="cite-more" href="/papers">'+esc(tr('看这些论文还支撑了什么'))+' →</a></div>';
}

function renderSources(sources,papers){
  const block=renderPapers(papers);
  if(!sources?.length)return block;
  /* 论文已经从 sources 里单独取出来了，这里跳过它们的裸链接，
     否则同一篇论文会在页面上出现两次。 */
  const paperUrls=new Set((papers||[]).map(p=>p.url));
  const seen=new Set(),visible=[];
  for(const source of sources){
    const value=String(source);
    if(paperUrls.has(value))continue;
    const key=/^https?:\/\//.test(value)?sourceLabel(value):value;
    if(seen.has(key))continue;seen.add(key);visible.push(value);
  }
  if(!visible.length)return block;
  const link=x=>{
    if(/^https?:\/\//.test(x))return '<a href="'+esc(x)+'" title="'+esc(x)+'" target="_blank" rel="noreferrer">'+esc(sourceLabel(x))+'</a>';
    if(x.startsWith('[[')){const t=x.slice(2,-2).split('|')[0];return '<a href="/?path='+encodeURIComponent(t)+'">'+esc(t.split('/').pop())+'</a>'}
    return esc(x);
  };
  const sep='<span class="source-sep">·</span>';
  const shown=visible.slice(0,4),rest=visible.slice(4);
  const more=rest.length?('<span class="source-more" hidden>'+sep+rest.map(link).join(sep)+'</span><button type="button" class="source-toggle" aria-expanded="false">还有 '+rest.length+' 个</button>'):'';
  return block+'<b>'+esc(tr('来源'))+'</b><span class="source-list">'+shown.map(link).join(sep)+'</span>'+more;
}

function renderRelations(note){
  // 知识库管理记录的是维护方法而不是技术知识，它的页面照常可读，
  // 但不展示入链和延伸：否则维护资料会挂在正文下方，看起来像技术知识的关联。
  const root=$('#reader-relations');
  if(note.exclude_from_graph){root.innerHTML='';root.hidden=true;return}
  root.hidden=false;
  const notesByPath=new Map(state.notes.map(item=>[item.path,item]));
  const incoming=[],outgoing=[],seenIncoming=new Set(),seenOutgoing=new Set();
  for(const edge of state.edges){
    if(edge.target===note.path&&!seenIncoming.has(edge.source)&&notesByPath.has(edge.source)){seenIncoming.add(edge.source);incoming.push(notesByPath.get(edge.source))}
    if(edge.source===note.path&&!seenOutgoing.has(edge.target)&&notesByPath.has(edge.target)){seenOutgoing.add(edge.target);outgoing.push(notesByPath.get(edge.target))}
  }
  const moduleOf=item=>`${item.category==='总览'?'首页':item.category} / ${item.topic==='首页'?'入口':item.topic}`;

  const mobile=matchMedia('(max-width:760px)').matches;
  const incomingNodes=incoming.slice(0,mobile?1:3),outgoingNodes=outgoing.slice(0,3);
  const width=mobile?360:1120,height=mobile?410:220,nodeWidth=mobile?290:250,nodeHeight=54;
  const current={x:mobile?35:435,y:mobile?100:83};
  const inputY=index=>mobile?24:incomingNodes.length===1?83:20+index*68;
  const outputY=index=>mobile?185+index*69:20+index*68;
  const node=(item,x,y,kind='')=>`<g class="relation-node ${kind}" data-note="${esc(item.path)}" role="button" tabindex="0" aria-label="打开 ${esc(item.title)}"><title>${esc(item.title)}：${esc(moduleOf(item))}</title><rect x="${x}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="5"></rect><text class="relation-node-title" x="${x+12}" y="${y+22}">${esc(compact(item.title))}</text><text class="relation-node-meta" x="${x+12}" y="${y+40}">${esc(compact(moduleOf(item)))}</text></g>`;
  const edge=(x1,y1,x2,y2,kind='')=>`<path class="relation-edge ${kind}" marker-end="url(#relation-arrow)" d="M${x1} ${y1} C${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"></path>`;
  const lines=[];

    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth/2,current.y+nodeHeight,current.x+nodeWidth/2,y));nodes.push(node(item,35,y))});
  }else{
    incomingNodes.forEach((item,index)=>{const y=inputY(index);lines.push(edge(40+nodeWidth,y+nodeHeight/2,current.x,current.y+nodeHeight/2,'incoming'));nodes.push(node(item,40,y))});
    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth,current.y+nodeHeight/2,830,y+nodeHeight/2));nodes.push(node(item,830,y))});
  }

function graphCanvas(){

   *
   * 之前写死 1200x690，而 svg 的 CSS 是 width:100% + height:min(70vh,700px)：

   * 后内容缩在中间 —— 实测内容只占画布宽度的 67%，左边距 8%、右边距 25%，
   * 看起来就是"整体偏左、右边空一大块"。

  const W=Math.max(320, Math.round(box.width)||(mobile?720:1200));

/* 窄屏的「知识图谱」：按领域分组的清单。
 *
 * 和力图表达同一件事（哪个领域厚、哪个主题重），但不依赖横向空间。
 * 用 foreignObject 装 HTML，因为这是文字排版而不是图形，交给浏览器排更合适 ——
 * 手写 SVG 的 text 不会换行，窄屏上必然溢出。

function renderNetworkList(svg, domains, notes, tr){
  const FO=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
  FO.setAttribute('x','0'); FO.setAttribute('y','0');
  FO.setAttribute('width','100%'); FO.setAttribute('height','100%');
  const box=document.createElement('div');
  box.className='graph-list';
  box.innerHTML=domains.map((d,di)=>{
    const group=notes.filter(n=>n.category===d);
    const ts=orderedTopics(d,new Set(group.map(n=>n.topic)))
      .map(t=>({t,n:group.filter(x=>x.topic===t).length}))
      .sort((a,b)=>b.n-a.n);
    const color=colors[di%colors.length];
    return `<section class="graph-list-domain" style="--ink:${color}">
      <h3><i></i>${esc(tr(d))}<b>${group.length}</b></h3>
      <ul>${ts.map(item=>`<li><button type="button" data-domain="${esc(d)}" data-topic="${esc(item.t)}">
        <span>${esc(tr(item.t))}</span><b>${item.n}</b>
      </button></li>`).join('')}</ul>
    </section>`;
  }).join('');
  FO.append(box);
  svg.append(FO);
  box.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>select(b.dataset.domain, b.dataset.topic);
  });
}

function renderNetwork(){
  /* 这个视图要回答一个问题：这个知识库里到底有什么，怎么分布的。
   *
   * 之前画的是 153 个圆点加 33 个主题点、全部互相连线 —— 那是一个
   * 力导向图的默认外观，不是这张图的答案。点太小看不出是哪篇，线太密
   * 看不出谁连谁，读半天只得到"东西挺多"。
   *
   * 现在的画法：五个领域各占一列，一列里的主题按篇数从上往下排，
   * 每个主题是一个圆，半径表示它有几篇笔记。同一领域内的主题之间连线，
   * 线只在跨主题引用真实存在时才画。看的人一眼能得到三件事：
   * 哪个领域最厚、哪个主题最重、哪些主题互相引用。
   */
  const tr=(x)=>window.TKI18N?window.TKI18N.t(x):x;
  const{svg,world,W,H,mobile}=graphCanvas();
  const notes=state.notes.filter(n=>n.category!=='总览'&&n.category!=='Clippings'&&!n.exclude_from_graph);
  const domains=ordered(new Set(notes.map(n=>n.category)));

  /* 窄屏改画清单，不画力图。
   *
   * 五列布局在 390px 宽下每列只有 78px：主题名、圆、篇数三者必然互相覆盖，
   * 实测文字糊成一团，比不看还糟。图的价值在于"一眼看出分布"，而这个前提
   * 在窄屏不成立 —— 硬画出来的东西读不出任何结论。
   *
   * 所以窄屏换成按领域分组的清单：同样的信息（哪个领域厚、哪个主题重），
   * 用可点的行表达，手机上本来也是清单比图好用。
   */
  if(mobile && W<620){
    renderNetworkList(svg, domains, notes, tr);
    return;
  }
  const positions=new Map(), topicPos=new Map();
  /* 列中心要按「标签 + 圆」这个整体来居中，不能只按圆。
   *
   * 主题名现在挂在圆心左侧（text-anchor:end），整列的视觉宽度因此向左边多出
   * 一个标签宽。列中心仍按 colW 均分的话，圆的位置没变、但内容的实际左边界
   * 被推到更左 —— 实测左边距 27px、右边距 110px，整幅图看起来偏左。
   *
   * labelW 是给左侧标签预留的宽度；把圆心右移它的一半，标签和圆就一起居中。
   */
  const padX=mobile?26:40, top=mobile?96:104;
  const colW=(W-padX*2)/domains.length;
  const labelW=Math.min(colW*.42, mobile?72:104);

  domains.forEach((d,di)=>{
    const cx=padX+colW*(di+.5)+labelW/2;
    const group=notes.filter(n=>n.category===d);
    const ts=orderedTopics(d,new Set(group.map(n=>n.topic)))
      .map(t=>({t,n:group.filter(x=>x.topic===t).length}))
      .sort((a,b)=>b.n-a.n);
    // A column is a stack of topics. The tallest stack decides the spacing for
    // all of them, so the columns stay aligned and comparable.
    const gap=(H-top-58)/Math.max(ts.length,1);
    ts.forEach((item,ti)=>{
      const y=top+gap*(ti+.5);
      topicPos.set(`${d}/${item.t}`,{x:cx,y,d,t:item.t,n:item.n});
      /* Notes sit on a ring around their topic, not beside it.
       *
       * The previous version put them on "a short arc to the right" and added a
       * hard-coded +18px, while using r*0.5 for x and a different radius for y.
       * The result was dots that did not lie on any circle around the topic:
       * measured, they drifted right of the ring and traced an ellipse. It read
       * as everything being slightly off-grid, which is what it was.
       *
       * One radius, one angle, same origin as the topic circle. The radius
       * grows with the count so a topic with 14 notes does not stack them on
       * top of each other, and stays clear of the ring itself.
       */
      const ns=group.filter(n=>n.topic===item.t);
      const ring=Math.max(18, 10+Math.sqrt(item.n)*4.2);
      ns.forEach((n,ni)=>{
        const a=-Math.PI/2 + (ni/Math.max(ns.length,1))*Math.PI*2;
        positions.set(n.path,{x:cx+Math.cos(a)*ring, y:y+Math.sin(a)*ring});
      });
    });
    // Domain heading. The count is the point: 60 vs 14 is the first thing a
    // reader wants to know.
    /* 领域名可能比一列还宽（"Computer systems and performance"），用 foreignObject
       让它按列宽换行。SVG 的 text 不会自动折行，之前五个标题在 1440 下会互相压住。 */
    const head=svgEl('foreignObject',{x:cx-colW/2+6,y:top-56,width:colW-12,height:40});
    const headBox=document.createElement('div');
    headBox.className='domain-head';
    headBox.append(document.createTextNode(tr(d)));
    const headCount=document.createElement('span');
    headCount.textContent=`${group.length} 篇 · ${ts.length} 个主题`;
    headBox.append(headCount);
    head.append(headBox);
    world.append(head);
  });

  // Edges first, so nodes draw over them. Only draw an edge when both ends
  // resolve — a dangling reference would otherwise silently disappear.
  /* 连线分两类画，因为它们的信息量不同。
   *
   * 实测 528 条引用里，373 条是同领域的（两端在同一列），74 条横跨 2-4 列。
   * 同领域的两篇笔记本来就同属一个主题，位置上已经挨在一起，那条线只是
   * 在圆和圆之间重复了"它们相关"这件从位置就能读出来的事 —— 而代价是
   * 一列之内几十条线互相交叉，把节点糊住。跨领域的引用才是图里有信息量的
   * 部分：它说明两个原本分开放置的领域之间真的有关联。
   *
   * 所以：跨领域的照画，同领域的只在两端在列内离得够远时画（近的不画，
   * 远的那条反而说明"这个主题的两头有联系"）。两类用不同的 class，
   * 视觉权重也不同。
   */
  const noteDomain=(path)=>{
    const n=state.notes.find(x=>x.path===path);
    return n?n.category:'';
  };
  for(const e of state.edges){
    const a=positions.get(e.source), b=positions.get(e.target);
    if(!a||!b)continue;
    const crossDomain=noteDomain(e.source)!==noteDomain(e.target);
    if(!crossDomain){
      // 列内距离阈值：同一主题的笔记围在环上，彼此很近，那些线纯属噪音。
      const dx=a.x-b.x, dy=a.y-b.y;
      if(Math.hypot(dx,dy)<90)continue;
    }
    const line=svgEl('line',{
      x1:a.x,y1:a.y,x2:b.x,y2:b.y,
      class:crossDomain?'edge edge--cross':'edge edge--inner',
    });
    line.dataset.source=e.source; line.dataset.target=e.target;
    world.append(line);
  }

  // Topic rings. Radius carries the count: sqrt so area, not radius, is
  // proportional to how many notes a topic holds.
  topicPos.forEach(tp=>{
    const r=9+Math.sqrt(tp.n)*3.1;
    const color=colors[domains.indexOf(tp.d)%colors.length];
    /* 圆到笔记点的连线去掉。
     *
     * 点已经落在以圆心为中心的那个环上，线只重复了一遍"它们属于这个主题"
     * 这件已经从位置能读出来的事，代价是每个主题多 n 条线 —— 十四个笔记的
     * 主题就是十四条，全站加起来糊成一片。删掉之后环本身就在表达归属。
     */
    const g=svgEl('g',{class:'topic-node',transform:`translate(${tp.x},${tp.y})`,tabindex:'0',role:'button','aria-label':`${tp.d} / ${tp.t}，${tp.n} 篇`});
    g.onclick=()=>select(tp.d,tp.t);
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(tp.d,tp.t)}};
    g.append(svgEl('circle',{r,stroke:color,fill:color,'fill-opacity':.14}));
    /* 名字放在圆的左边，不是上面。
     *
     * 笔记点从正上方开始顺时针排满一圈，名字压在正上方就会和点重叠 ——
     * 之前"模型基础与训练"直接糊在环上。列内圆心之间的横向空间充足，
     * 左侧是唯一不与环冲突的方向。 */
    g.append(svgEl('text',{x:-r-8,y:4,'text-anchor':'end',class:'topic-name'},tr(tp.t)));
    g.append(svgEl('text',{y:4,'text-anchor':'middle',class:'topic-count'},String(tp.n)));
    world.append(g);
  });

  notes.forEach(n=>{
    const p=positions.get(n.path);
    if(!p)return;
    const color=colors[domains.indexOf(n.category)%colors.length];
    const g=svgEl('g',{class:'node',transform:`translate(${p.x},${p.y})`,tabindex:'0',role:'button','aria-label':n.title});
    g.onclick=()=>openNote(n.path);
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNote(n.path)}};
    g.onmouseenter=()=>document.querySelectorAll('.edge').forEach(e=>{if(e.dataset.source===n.path||e.dataset.target===n.path)e.classList.add('focused')});
    g.onmouseleave=()=>document.querySelectorAll('.edge.focused').forEach(e=>e.classList.remove('focused'));
    g.append(svgEl('circle',{r:4,fill:color}),svgEl('text',{y:-9,'text-anchor':'middle'},n.title.length>20?n.title.slice(0,19)+'…':n.title));
    world.append(g);
  });

  $('#legend').innerHTML=domains.map((d,i)=>`<span><i style="background:${colors[i%colors.length]}"></i>${esc(tr(d))}</span>`).join('')
    +`<span style="color:var(--color-muted)">圆越大，主题下的笔记越多</span>`;
}

function bindGraph(){const svg=$('#graph');let drag=null;svg.onwheel=e=>{e.preventDefault();state.zoom=Math.max(.55,Math.min(2.5,state.zoom*(e.deltaY<0?1.1:.9)));applyTransform()};svg.onpointerdown=e=>{if(e.target.closest('.node,.topic-node,.diagram-group,.point-group'))return;drag={x:e.clientX,y:e.clientY,px:state.pan.x,py:state.pan.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag)state.pan={x:drag.px+e.clientX-drag.x,y:drag.py+e.clientY-drag.y},applyTransform()};svg.onpointerup=()=>drag=null;$('#graph-zoom-in').onclick=()=>{state.zoom=Math.min(2.5,state.zoom*1.18);applyTransform()};$('#graph-zoom-out').onclick=()=>{state.zoom=Math.max(.55,state.zoom/1.18);applyTransform()};$('#graph-reset').onclick=()=>{state.zoom=1;state.pan={x:0,y:0};applyTransform()};document.querySelectorAll('[data-visual]').forEach(button=>button.onclick=()=>{state.graphMode=button.dataset.visual;state.zoom=1;state.pan={x:0,y:0};document.querySelectorAll('[data-visual]').forEach(item=>item.setAttribute('aria-selected',String(item===button)));renderGraph()})}

/* ── 键盘操作 ──────────────────────────────────────────────────────────
   阅读时手不离键盘：/ 搜索、j/k 移动、Enter 打开、Esc 返回、
   g+字母跳转、t 切主题、? 看帮助。
   "g" 前缀用 1.2 秒窗口，超时自动清除，避免误触后吞掉下一次按键。 */
function kbdOverlay(open){
  const el=$('#kbd-overlay');
  if(!el)return;
  el.hidden=!open;
  el.classList.toggle('open',open);
  if(open){const close=$('#kbd-close');if(close)close.focus()}
  else if(document.activeElement&&el.contains(document.activeElement))$('#kbd-hint')?.focus();
}
function moveSelection(delta){
  const rows=[...document.querySelectorAll('#directory .note-row')];
  if(!rows.length)return;
  const at=rows.indexOf(document.activeElement);
  const next=at<0?(delta>0?0:rows.length-1):Math.min(rows.length-1,Math.max(0,at+delta));
  rows[next].focus();
  rows[next].scrollIntoView({block:'nearest'});
}
function toggleThemeFromKeyboard(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  try{localStorage.setItem('tk-theme',next)}catch{}
  TKShell.applyTheme(next);
}
function bindKeyboard(){
  let gPending=0;
  document.addEventListener('keydown',event=>{
    const tag=(event.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||event.target.isContentEditable;
    if(event.key==='Escape'){
      if($('#kbd-overlay')?.classList.contains('open')){kbdOverlay(false);event.preventDefault();return}
      if(typing&&event.target.id==='search'){event.target.value='';state.query='';loadHome(false);event.preventDefault();return}
      if(state.view==='reader'){$('#reader-back').click();event.preventDefault()}
      return;
    }
    if(typing)return;
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const key=event.key;
    if(key==='?'||(key==='/'&&event.shiftKey)){kbdOverlay(!$('#kbd-overlay')?.classList.contains('open'));event.preventDefault();return}
    if(key==='/'){$('#search')?.focus();event.preventDefault();return}
    if(key==='t'){toggleThemeFromKeyboard();event.preventDefault();return}
    if(key==='j'||key==='ArrowDown'){moveSelection(1);event.preventDefault();return}
    if(key==='k'||key==='ArrowUp'){moveSelection(-1);event.preventDefault();return}
    // "g <letter>" 跳转。链式状态：第一次 g 只记时间并等待，
    // 第二次按键才查表 —— 但第二次也可能是 g（g g = 图谱），
    // 所以必须先查表再决定是否继续等待。
    if(key==='g'&&Date.now()-gPending>=1200){gPending=Date.now();return}
    if(Date.now()-gPending<1200){
      gPending=0;
      const targets={h:()=>loadHome(true),g:()=>showGraph(),p:()=>location.assign('/projects')};
      const run=targets[key.toLowerCase()];
      if(run){run();event.preventDefault()}
      return;
    }
  });
  $('#kbd-hint').onclick=()=>kbdOverlay(true);
  $('#kbd-close').onclick=()=>kbdOverlay(false);
  $('#kbd-overlay').onclick=event=>{if(event.target.id==='kbd-overlay')kbdOverlay(false)};
}
/* ── 反馈 ──────────────────────────────────────────────────────────────
   面板由 site/shell.js 统一渲染，工作台页面用的是同一份。
   这里只提供主站才知道的两件事：正在读哪一篇，以及这一篇的标题。 */
function currentArticle(){
  if(state.view!=='reader'||!state.selected)return {path:'',title:''};
  return {path:state.selected,title:($('#reader-title')?.textContent||'').trim()};
}

function bindFeedback(){
  feedbackUi=TKShell.feedback({

    where:()=>{
      const article=currentArticle();
      const tr=(x)=>window.TKI18N?window.TKI18N.t(x):x;
      return article.title?`${tr('正在读：')}<b>${esc(article.title)}</b>`:tr('当前在首页，没有具体文章');
    },
    title:()=>currentArticle().title||document.title,
  });
}
/* 访问记录：只在阅读文章时上报，避免给每次首页刷新都写一行。 */
let lastVisitPath=null;
function reportVisit(){
  const article=currentArticle();
  if(!article.path||article.path===lastVisitPath)return;
  lastVisitPath=article.path;
  TKShell.visit({
    path:article.path,title:article.title,
    name:feedbackUi?.name()||'',
    screen:`${screen.width}x${screen.height}`,

function bindProgress(){
  const bar=$('#progress-bar');
  if(!bar)return;
  const update=()=>{
    const article=$('#reader-body');
    if(state.view!=='reader'||!article){bar.style.transform='scaleX(0)';return}
    const top=article.getBoundingClientRect().top+window.scrollY;
    const total=Math.max(1,article.offsetHeight-window.innerHeight);
    const ratio=Math.min(1,Math.max(0,(window.scrollY-top)/total));
    bar.style.transform=`scaleX(${ratio})`;
  };
  window.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update,{passive:true});
  bindProgress.update=update;
}
/* ── 下载 / 复制 / 打印 ──────────────────────────────────────────────
   下载直接用 /api/note 已经返回的 raw（未渲染 Markdown），
   所以不需要额外的后端接口；中文文件名用 a.download 传递，
   不受 HTTP 头的 latin-1 限制。 */
function safeFileName(title,path){
  const base=(title||path.split('/').pop()||'note').replace(/[\\/:*?"<>|\n\r\t]+/g,'_').trim();
  return (base.slice(0,80)||'note')+'.md';
}
async function downloadCurrentNote(){
  const article=currentArticle();
  if(!article.path){alertUser('先打开一篇文章再下载');return}
  try{
    const note=await json('/api/note?path='+encodeURIComponent(article.path));
    const header=`---\ntitle: ${note.title||article.title}\nupdated: ${note.updated||''}\nsource: ${location.origin}/?path=${encodeURIComponent(article.path)}\n---\n\n`;
    const blob=new Blob([note.raw||''],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=safeFileName(note.title,article.path);
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alertUser('已开始下载 Markdown 原文');
  }catch(error){console.error(error);alertUser('下载失败，请稍后重试')}
}
async function copyCurrentLink(){
  const article=currentArticle();
  if(!article.path){alertUser('先打开一篇文章再复制');return}
  const url=location.origin+'/?path='+encodeURIComponent(article.path);
  try{
    await navigator.clipboard.writeText(url);
    alertUser('链接已复制');
  }catch{
    // 剪贴板在非安全上下文会被拒绝，退回手动选择。
    const input=document.createElement('input');
    input.value=url;document.body.appendChild(input);input.select();
    document.execCommand('copy');input.remove();
    alertUser('链接已复制');
  }
}
function bindReaderTools(){
  const download=$('#reader-download'),copy=$('#reader-copy'),printBtn=$('#reader-print');
  if(download)download.onclick=downloadCurrentNote;
  if(copy)copy.onclick=copyCurrentLink;
  if(printBtn)printBtn.onclick=()=>window.print();
}
function dataSignature(data){return data.notes.map(note=>[note.path,note.updated,note.title,note.search_text].join('\u0000')).join('\u0001')+'\u0002'+JSON.stringify(data.edges)}
async function refreshNotes(initial=false){const data=await json('/api/notes'),signature=dataSignature(data);if(signature===state.notesSignature)return;state.notes=data.notes;state.edges=data.edges;state.notesSignature=signature;renderDomains();if(initial){selectFromUrl();return}if(state.view==='home')renderHome();else if(state.view==='directory')renderDirectory();else if(state.view==='graph')renderGraph()}
/* 论文只在启动时取一次。它跟着 vault 走，不像笔记那样几秒一变，
   放进 10 秒的轮询里纯属白跑。取不到就不显示，首页其余部分照常。 */
async function refreshPapers(){try{state.papers=(await json('/api/papers')).papers||[]}catch(error){console.error(error)}if(state.view==='home')renderHome()}
async function refreshLearningStatus(notify=false){try{state.learningStatus=await json('/api/learning/status');if(state.view==='home')applyHomeStatus()}catch(error){console.error(error);if(!state.learningStatus&&state.view==='home')applyHomeStatus();if(notify)alertUser('学习工具状态暂时不可用，入口仍然可以打开')}}
async function initialize(){
  /* 主题由 shell.js 在加载时就应用并接管按钮，这里不需要再初始化。
     顺序要紧：renderSharedNav() 会重建整个侧边栏（替换 innerHTML 和 className），
     所以「手机上先收起」必须在它之后设置，否则收起状态会被这次重建抹掉 ——
     现象就是手机首屏被 390px 高的域树占满，而折叠按钮看起来没反应。 */
  bindGraph();bindKeyboard();bindFeedback();bindProgress();bindReaderTools();renderSharedNav();bindNavigation();
  // 首页里凡是按数据渲染出来的部分（论文金句、领域卡片）都不是静态文本，
  // translateDOM 扫不到。切语言后必须整块重画，否则会留下上一种语言的残页。
  document.addEventListener('tk:lang',()=>{if(state.view==='home')renderHome();else if(state.view==='graph')renderGraph()});
  // 先给出骨架，避免首屏是一片空白让人以为坏了。
  showLoading();
  const loadingWarning=setTimeout(()=>{if(!state.notes.length)alertUser('知识内容加载较慢，仍在重试…')},6000);
  try{await refreshNotes(true);clearTimeout(loadingWarning)}
  catch(error){console.error(error);showLoadError()}
  await refreshPapers();
  await refreshLearningStatus(true);

function showLoading(){
  const box=$('#directory');

  </div>`;
  show('directory');
}
function showLoadError(){
  $('#directory').innerHTML=`<div class="empty"><p class="empty-title">知识内容暂时读不到</p><p class="empty-hint">本机服务可能正在重启。稍等几秒后重试，或检查站点是否在运行。</p><button type="button" class="empty-action" id="load-retry">重新加载</button></div>`;
  const retry=$('#load-retry');
  if(retry)retry.onclick=()=>{
    showLoading();
    // refreshNotes 在数据签名没变时会直接返回，错误界面就会一直挂着。
    // 重试是明确的用户意图，这里强制重新渲染一次。
    refreshNotes(true).then(()=>renderActiveView()).catch(()=>showLoadError());
  };
  show('directory');
}
/* 按当前视图重画内容。重试、以及任何"数据没变但界面需要恢复"的场合都用它。 */
function renderActiveView(){
  if(state.view==='home')renderHome();
  else if(state.view==='graph')renderGraph();
  else renderDirectory();
}
async function refreshApp(){await Promise.allSettled([refreshNotes(),refreshLearningStatus()])}
initialize();setInterval(refreshApp,10000);

    if(!nodes.length)return;
    nodes.forEach((node,index)=>{node.dataset.mermaidSource=node.textContent||'';node.id=node.id||`mermaid-${index}-${Date.now()}`});
    await window.mermaid.run({nodes});
  };
}
</script>
</body></html>
