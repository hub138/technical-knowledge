<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent 开发知识体系</title>
<style>
:root{--bg:#f8f9fb;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--dim:#9ca3af;--blue:#2563eb;--blue-bg:#eff6ff;--purple:#7c3aed;--purple-bg:#f5f3ff;--green:#059669;--green-bg:#ecfdf5;--amber:#d97706;--amber-bg:#fffbeb;--red:#dc2626;--red-bg:#fef2f2;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;font-size:14px}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.sidebar-title{padding:16px 20px 12px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
.nav-tree{padding:8px 0}
.nav-group{margin-bottom:2px}
.nav-group-label{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);user-select:none}
.nav-group-label:hover{background:var(--bg)}
.nav-group-label .arrow{font-size:10px;color:var(--dim);transition:transform .2s;width:12px}
.nav-group-label .arrow.open{transform:rotate(90deg)}
.nav-children{display:none}
.nav-children.show{display:block}
.nav-item{padding:5px 16px 5px 36px;font-size:12px;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg);font-weight:600}

/* Main */
.main{flex:1;min-width:0}
.top-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:20}
.top-tab{padding:14px 24px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.top-tab:hover{color:var(--text)}
.top-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Q&A Banner */
.qa-banner{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 28px}
.qa-banner h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--amber)}
.qa-item{margin-bottom:10px;font-size:13px;line-height:1.8}
.qa-item .q{font-weight:600;color:var(--text)}
.qa-item .q::before{content:"Q: ";color:var(--blue);font-weight:700}
.qa-item .a{color:var(--muted);margin-left:0}
.qa-item .a::before{content:"A: ";color:var(--green);font-weight:700}

/* Content */
.content{padding:24px 28px;width:100%;max-width:none}
.content.knowledge-view{max-width:1440px}
.content.eval-view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.content.eval-view .section{margin-bottom:0}
.section{margin-bottom:40px}
.section-title{font-size:18px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:22px}
.section-desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.kp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:border-color .15s}
.kp:hover{border-color:var(--blue)}
.kp h4{font-size:15px;font-weight:600;margin-bottom:8px}
.kp .tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kp .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--dim)}
.kp .body{font-size:13px;line-height:1.9;color:var(--text)}
.kp .body b{color:var(--text)}
.kp .body p{margin-bottom:10px}
.kp .body ul{margin:6px 0 10px 18px}
.kp .body li{margin-bottom:4px}
.kp .refs{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.kp .refs a{font-size:11px;color:var(--blue);text-decoration:none;margin-right:12px}
.kp .refs a:hover{text-decoration:underline}

/* Eval dimensions */
.eval-dim{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.eval-dim h4{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.eval-dim h4 .num{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.eval-dim .why{font-size:12px;color:var(--amber);margin-bottom:10px;font-style:italic}
.eval-dim .check-list{font-size:13px;color:var(--text);line-height:1.9}
.eval-dim .check-list b{color:var(--text)}
.eval-dim .good-bad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.eval-dim .good{background:var(--green-bg);border-radius:var(--radius);padding:10px 14px;font-size:12px}
.eval-dim .bad{background:var(--red-bg);border-radius:var(--radius);padding:10px 14px;font-size:12px}
.eval-dim .good b{color:var(--green)}
.eval-dim .bad b{color:var(--red)}
.eval-dim .link{font-size:11px;color:var(--blue);margin-top:8px}
.eval-dim .improve{font-size:12px;background:var(--amber-bg);border-radius:var(--radius);padding:8px 12px;margin-top:8px;color:var(--amber)}

.local-notice{background:var(--amber-bg);border:1px solid #fde68a;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:13px;color:var(--amber)}
.local-notice b{color:#92400e}
@media(max-width:1100px){.content.eval-view{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}.top-tabs{overflow-x:auto;padding:0 8px}.top-tab{padding:12px 14px;white-space:nowrap}.content,.qa-banner{padding-left:16px;padding-right:16px}.good-bad{grid-template-columns:1fr!important}}
</style>
</head>

<div class="main">

<script>
// ==================== DATA ====================
const KNOWLEDGE = {
  qa: [
    {q:"作为 Agent 开发者需要掌握哪些知识？",a:"6 大类——①推理与决策 ②工具与协议 ③记忆系统 ④检索增强(RAG) ⑤多Agent协作 ⑥工程落地。前四类是 Agent 的内部能力，第五类是多 Agent 系统设计，第六类是把 Agent 变成生产系统的工程能力。"},
    {q:"这些知识之间是什么关系？",a:"推理决策是大脑、工具协议是手脚、记忆是经验、RAG 是外部知识源、多Agent是团队协作、工程落地是生产保障。一个完整的 Agent 系统六者缺一不可，但优先级——推理决策和工具协议是核心中的核心。"},
    {q:"哪些必须深入到能从零手写？",a:"推理决策（能从零写 ReAct Loop）、工具协议（能手写 Function Calling 解析和 MCP Server）、记忆系统（能设计三层架构）。RAG 和多Agent 需要理解原理并能调优。工程落地需要知道指标和工具，不一定要从零搭。"},
  ],
  categories: [
    {
      id:"reasoning", icon:"🧠", name:"推理与决策",
      desc:"Agent 如何思考、规划、做出决策。这是 Agent 区别于 Chatbot 的核心——不只是生成文本，而是闭环决策。",
      items: [
        {
          title:"ReAct 范式：推理+行动交替循环",
          tags:["ReAct","核心","必会"],
          body:`<p><b>ReAct = Reasoning + Acting</b>（Google 2022）。核心思想：让 LLM 在生成中交替进行<b>推理(Thought)和行动(Action)</b>，并接收外部工具返回的<b>观察(Observation)</b>，把推理锚定在真实数据上。</p>
<p><b>标准循环：</b></p>
<ul>
<li><b>Thought</b>：LLM 分析当前状态，决定下一步做什么</li>
<li><b>Action</b>：调用工具（Function Call），如 search_order(order_id="123")</li>
<li><b>Observation</b>：工具返回结果，如 {"status":"已发货","items":[...]}</li>
<li>回到 Thought，基于 Observation 决定下一步，直到输出 Final Answer</li>
</ul>
<p><b>为什么 ReAct 比 CoT 好：</b>CoT 纯靠模型内部知识推理，容易"空想"——比如模型不知道今天天气，只能猜。ReAct 调天气 API 获取真实数据，推理基于事实。</p>
<p><b>消息格式设计：</b>Observation 用 <b>tool 角色而非 assistant 角色</b>回传。因为 Observation 是外部系统返回的内容，不是模型生成的。如果放 assistant 角色，模型会以为自己说了这些话，后续推理会混乱。</p>
<p><b>消息格式示例：</b></p>
<pre>system: 你是客服Agent，可用工具：search_order
user: 帮我查订单123的状态
assistant: Thought: 用户要查订单状态，调用search_order
        Action: search_order(order_id="123")
tool: {"status":"已发货","carrier":"顺丰"}
assistant: Thought: 订单已发货，用顺丰。用户可能想查物流
        Final Answer: 您的订单123已通过顺丰发货。</pre>
<p><b>终止条件设计：</b>①最大步数硬限制（通常 10 步）；②LLM 主动输出 finish_reason=stop；③连续 2 步调用相同工具且参数相同→疑似死循环→强制停止。</p>
<p><b>生产实践：</b>ReAct 的 Token 消耗通常高于 CoT（每步都要携带历史）。系统 A 可采用混合模式——简单任务用 Plan-Execute（节省 Token），不确定路径的任务才用 ReAct。</p>`,
          refs:[{t:"ReAct: Synergizing Reasoning and Acting (Google 2022)",u:"https://arxiv.org/abs/2210.03629"}]
        },
        {
          title:"CoT / Plan-Execute / ToT / Reflection 对比与选型",
          tags:["CoT","Plan-Execute","ToT","Reflection","选型"],
          body:`<p><b>四种推理范式核心区别：</b></p>
<ul>
<li><b>CoT (Chain of Thought)</b>：纯脑内推理，一步步想，不调工具。适合数学题、逻辑推理等不需要外部数据的任务。<b>缺点：</b>知识截止日期前的内容可能过时或幻觉。</li>
<li><b>ReAct</b>：推理+行动交替。每步 Thought→Action→Observation。<b>适合</b>需要查资料、调 API 的任务。<b>代价</b>：Token 消耗 4-8x。</li>
<li><b>Plan-and-Execute</b>：先制定完整计划，再逐步执行。<b>省 Token</b>（一次规划）、可控性强，但灵活度低——中间步骤发现错误时调整成本高。</li>
<li><b>Tree of Thoughts (ToT)</b>：每步探索多条推理路径，用 BFS/DFS+评估函数选最优。<b>效果好但 Token 消耗是 CoT 的 3 倍</b>，只适合需要探索多路径的复杂推理。</li>
<li><b>Reflection / Reflexion</b>：让 Agent 自我审查输出质量，决定是否重试或修正。Reflexion 框架通过 episodic memory 存储失败经验，下次遇到类似任务避免重复犯错。<b>HumanEval 通过率从 80% 提升到 91%</b>。</li>
</ul>
<p><b>选型决策树：</b></p>
<ul>
<li>任务路径不确定，需要观察中间结果 → <b>ReAct</b></li>
<li>步骤明确可预判 → <b>Plan-Execute</b>（省 Token 可控）</li>
<li>需要探索多种可能解 → <b>ToT</b>（贵但准）</li>
<li>长链路任务容易出错 → <b>Reflection</b>（加倍 Token 但提升成功率）</li>
<li>生产级系统 → <b>混合</b>：大步骤 Plan-Execute 规划，子步骤 ReAct 灵活执行，关键节点 Reflection 自检</li>
</ul>
<p><b>关键 trade-off：</b>系统 A 在复杂任务上采用 ReAct 可提升任务完成率，但会增加 Token 消耗。因此简单查询走直接生成或固定流程，复杂多步任务才启用 ReAct。</p>`,
          refs:[{t:"Tree of Thoughts (Yao et al. 2023)",u:"https://arxiv.org/abs/2305.10601"},{t:"Reflexion: Language Agents with Verbal RL (Shinn et al. 2023)",u:"https://arxiv.org/abs/2303.11366"}]
        },
        {
          title:"Agent Loop 设计与终止策略",
          tags:["Agent Loop","终止条件","死循环"],
          body:`<p><b>Agent Loop 是 Agent 的核心工作引擎</b>——Think → Act → Observe 的循环，直到任务完成。</p>
<p><b>完整循环示例（退换货场景）：</b></p>
<pre>Round 1: Think "需要查订单" → Act search_order(123) → Observe {status:"已发货"}
Round 2: Think "已发货不能直接退，需查退货政策" → Act check_policy(category="book") → Observe {returnable:true}
Round 3: Think "符合退货条件" → Act create_return(order_id=123) → Observe {return_id:"R456"}
Round 4: Think "任务完成" → 输出最终回复</pre>
<p><b>防死循环三层设计：</b></p>
<ul>
<li><b>第一层：硬限制</b>——max_steps=10，到了强制停止。在 System Prompt 里动态更新"你已经执行了 X/N 步"，模型会自觉收敛。</li>
<li><b>第二层：循环检测</b>——连续 2 步调用相同工具且参数相同 → 疑似死循环 → 强制跳出并告知用户"我可能需要更多信息"。</li>
<li><b>第三层：Token 预算</b>——设单次任务最大 Token 消耗，超限自动停止。</li>
</ul>
<p><b>错误处理设计：</b>工具调用失败时，把错误信息包装为 Observation 回传 LLM，让它自主决定重试/换工具/降级。不要在代码层静默吞掉错误——LLM 看不到错误就不知道要调整策略。</p>`,
          refs:[]
        },
      ]
    },
    {
      id:"tools", icon:"🔧", name:"工具与协议",
      desc:"Agent 如何与外部世界交互。从 Function Calling 到 MCP/A2A 标准协议。",
      items: [
        {
          title:"Function Calling 完整实现",
          tags:["FC","核心","必会"],
          body:`<p><b>三步走流程：</b></p>
<ul>
<li><b>定义阶段</b>：在 API 的 tools 参数或 System Prompt 中定义 Tool Schema——name、description（给 LLM 看的，要说清何时用）、parameters（JSON Schema，含 type/enum/required）。</li>
<li><b>调用阶段</b>：LLM 判断需要调工具，输出 function_call JSON（function.name + function.arguments）。</li>
<li><b>执行阶段</b>：代码层解析 JSON → Pydantic 校验参数 → 执行实际函数 → 将结果包装为 tool 角色消息回传 LLM。</li>
</ul>
<p><b>Schema 设计原则（踩过的坑）：</b></p>
<ul>
<li>参数尽量用 <b>enum</b> 而非 free text——减少 LLM 输出随机性。如支付方式用 enum["alipay","wechat"] 而非 string。</li>
<li><b>number vs integer 要区分</b>——LLM 真的会搞混。金额是 number，数量是 integer。</li>
<li>description 要写<b>使用场景</b>而非定义——"当用户提供订单号时调用此工具查询订单详情"而非"查询订单"。</li>
<li>必填字段标 required，可选字段给 default 值。</li>
</ul>
<p><b>稳定性保障三层：</b></p>
<ul>
<li><b>校验层</b>：Pydantic 验证参数格式，不合法→回传错误信息让 LLM 重生成（最多 2 次）。</li>
<li><b>执行层</b>：try/except 包裹，超时 30s，网络错误重试 3 次（指数退避）。</li>
<li><b>权限层</b>：所有工具调用经网关——敏感操作（支付/删除/外发）需 Human-in-the-loop 审批。</li>
</ul>
<p><b>安全关键原则</b>：LLM 永远不直接执行任何操作——tool_calls 只是建议，代码层有最终决定权。</p>`,
          refs:[{t:"OpenAI Function Calling Guide",u:"https://platform.openai.com/docs/guides/function-calling"}]
        },
        {
          title:"MCP 协议：架构、实现与局限",
          tags:["MCP","标准化","2026热点"],
          body:`<p><b>MCP (Model Context Protocol)</b> 是 Anthropic 提出、捐给 Linux Foundation 的<b>工具调用标准协议</b>。定义了 LLM 与外部系统的通用通信接口。</p>
<p><b>三层架构：</b></p>
<ul>
<li><b>Host</b>：LLM 应用（你的 Agent 系统）</li>
<li><b>Client</b>：协议客户端，1:1 连接一个 Server</li>
<li><b>Server</b>：暴露三种能力——Tools（模型可调用的函数）、Resources（应用可控的数据）、Prompts（预定义提示模板）</li>
</ul>
<p><b>传输层</b>：stdio（本地进程通信）或 SSE（远程服务）。</p>
<p><b>核心价值——一次开发，多模型复用：</b></p>
<ul>
<li>原来开发一个"查数据库慢 SQL"工具，要分别适配 OpenAI/Claude/通义千问的 Function Calling 格式</li>
<li>用 MCP 写一次，任何支持 MCP 的模型都能调用</li>
</ul>
<p><b>vs Function Calling 的关系：</b>FC 是各模型厂商的 API 能力（格式略有差异）；MCP 是工具层的标准协议。<b>打个比方</b>——FC 像各自厂商的拨号盘，MCP 像定义了全球统一的电话号码格式。</p>
<p><b>vs Skill 的关系：</b>Skill 是能力单元（"查天气"），FC 是调用方式，MCP 是通信协议。三者层次不同。</p>
<p><b>局限（必须知道）：①</b>协议还在快速迭代，兼容性风险；<b>②</b>多一层抽象增加 50-100ms 延迟；<b>③</b>流式支持不完善；<b>④</b>安全信任模型（工具提供方和调用方）仍在建设中。</p>
<p><b>vs A2A 的关系：</b>MCP 管 Agent↔工具（垂直集成），A2A 管 Agent↔Agent（水平协作）。一个完整的多 Agent 系统两者都需要。</p>`,
          refs:[{t:"MCP Specification",u:"https://modelcontextprotocol.io/"},{t:"Google A2A Protocol",u:"https://github.com/google/A2A"}]
        },
        {
          title:"工具设计模式：错误处理与安全控制",
          tags:["错误处理","安全","权限"],
          body:`<p><b>工具调用失败的三层处理：</b></p>
<ul>
<li><b>参数校验失败</b>：LLM 输出的 JSON 格式不对（多了字段/类型错误/缺必填）→ 用 Pydantic 校验 → 错误信息回传 LLM 让它重生成（"参数 amount 应为 number，你传了 string"）→ 最多 2 次，2 次失败降级返回提示。</li>

// ==================== RENDER ====================
let currentTab = 'knowledge';

function buildNav(tab = currentTab) {
  const tree = document.getElementById('navTree');
  const title = document.querySelector('.sidebar-title');
  let html = '';

  if(tab === 'knowledge') {
    title.textContent = 'AI Agent 开发知识体系';
    KNOWLEDGE.categories.forEach(cat => {
      html += `<div class="nav-group"><div class="nav-group-label" onclick="toggleNav(this)"><span class="arrow open">▶</span>${cat.icon} ${cat.name}</div><div class="nav-children show">`;
      cat.items.forEach((item,i) => {
        const itemTitle = item.title.length > 20 ? item.title.substring(0,20)+'...' : item.title;
        html += `<div class="nav-item" onclick="scrollToSection('${cat.id}-${i}',this)">${itemTitle}</div>`;
      });
      html += `</div></div>`;
    });
  } else {
    title.textContent = 'Agent 系统评估框架';
    html = `<div class="nav-group"><div class="nav-group-label"><span class="arrow open">▶</span>🔍 九项评估维度</div><div class="nav-children show">`;
    EVAL.dims.forEach(dim => {
      html += `<div class="nav-item" onclick="scrollToSection('eval-${dim.num}',this)">${dim.num}. ${dim.title}</div>`;
    });
    html += `</div></div>`;
  }
  tree.innerHTML = html;
}

function toggleNav(el) {
  el.querySelector('.arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

function scrollToSection(id, navItem) {
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(navItem) navItem.classList.add('active');
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderQA(tab) {
  const banner = document.getElementById('qaBanner');
  const qa = tab==='knowledge' ? KNOWLEDGE.qa : EVAL.qa;
  let html = `<h3>📋 我关注的问题与回答</h3>`;
  qa.forEach(item => {
    html += `<div class="qa-item"><div class="q">${item.q}</div><div class="a">${item.a}</div></div>`;
  });
  banner.innerHTML = html;
}

function renderKnowledge() {
  let html = '';
  KNOWLEDGE.categories.forEach(cat => {
    html += `<div class="section"><h2 class="section-title">${cat.icon} ${cat.name}</h2><p class="section-desc">${cat.desc}</p>`;
    cat.items.forEach((item,i) => {
      html += `<div class="kp" id="${cat.id}-${i}"><h4>${item.title}</h4>`;
      if(item.tags) html += `<div class="tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
      html += `<div class="body">${item.body}</div>`;
      if(item.refs && item.refs.length) {
        html += `<div class="refs">引用：${item.refs.map(r=>`<a href="${r.u}" target="_blank">📄 ${r.t}</a>`).join('')}</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderEval() {
  let html = '';
  EVAL.dims.forEach(dim => {
    html += `<div class="section" id="eval-${dim.num}"><div class="eval-dim"><h4><span class="num">${dim.num}</span>${dim.title}</h4>`;
    html += `<div class="why">为什么评估这个：${dim.why}</div>`;
    html += `<div class="check-list">${dim.checks}</div>`;
    if(dim.good && dim.bad) {
      html += `<div class="good-bad"><div class="good">${dim.good}</div><div class="bad">${dim.bad}</div></div>`;
    }
    if(dim.improve) html += `<div class="improve">💡 ${dim.improve}</div>`;
    if(dim.link) html += `<div class="link">${dim.link}</div>`;
    html += `</div></div>`;
  });
  return html;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.top-tab[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelector('.sidebar').style.display = 'block';
  renderQA(tab);
  const content = document.getElementById('content');
  content.className = `content ${tab}-view`;
  if(tab==='knowledge') content.innerHTML = renderKnowledge();
  else content.innerHTML = renderEval();
  buildNav(tab);
}

// Init
buildTab();
function buildTab(){document.querySelectorAll('.top-tab').forEach(tab=>{tab.addEventListener('click',function(){switchTab(this.dataset.tab)})})}
buildNav();
const requestedTab = new URLSearchParams(window.location.search).get('tab');
switchTab(['knowledge','eval'].includes(requestedTab) ? requestedTab : 'knowledge');
</script>
