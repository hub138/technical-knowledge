*{box-sizing:border-box}.pano-view{display:none}.pano-view.open{display:block}
/* 全景页 tab：矩阵（默认）与八层栈共用一条切换带，样式跟图谱 tab 同词汇。 */

.pano-tab{border:1px solid var(--color-line);background:var(--color-panel);color:var(--color-muted);border-radius:6px;padding:6px 14px;font-size:var(--text-sm);cursor:pointer;min-height:44px;box-sizing:border-box}

.pano-unassigned{color:var(--color-faint);font-size:var(--text-xs)}.pano-body{padding:20px 30px 40px}body{margin:0;background:var(--color-bg);color:var(--color-ink);font:var(--text-md)/var(--leading-normal) var(--font-sans)}button,input{font:inherit}button{cursor:pointer}.app{display:block;min-height:100vh}.sidebar{background:var(--color-surface);border-right:1px solid var(--color-line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 20px;border-bottom:1px solid var(--color-line)}.mark{width:34px;height:34px;border:1px solid var(--color-accent);border-radius:9px;display:grid;place-items:center;color:var(--color-accent);font-weight:800}.brand strong{display:block;font-size:var(--text-md)}.brand small{display:block;color:var(--color-muted);font-size:var(--text-xs)}.nav-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 0}.nav-actions button,.nav-section button{border:1px solid transparent;background:transparent;color:var(--color-ink-soft);text-align:left;border-radius:6px;padding:8px 10px}.nav-actions button:hover,.nav-actions button.active,.nav-section button:hover,.nav-section button.active{background:var(--color-accent-soft);border-color:var(--color-accent-line);color:var(--color-accent)}
.nav-section{border-top:1px solid var(--color-line);padding:12px 0}.nav-section h3{font-size:var(--text-xs);color:var(--color-muted);font-weight:700;margin:2px 8px 6px;text-transform:uppercase;letter-spacing:.08em}.nav-section button{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;width:100%;font-size:var(--text-h3)}.nav-section button .count{flex:none;padding-top:2px}.count{font-size:var(--text-small);color:var(--color-muted)}
.count,.fact-stars,.fact-open,.fact-live,.fact-key,.fact-none{font-variant-numeric:tabular-nums}.main{min-width:0;overflow-x:clip}.topbar{display:flex;gap:14px;align-items:center;flex-wrap:nowrap;padding:13px 30px;background:var(--color-bg-veil);border-bottom:1px solid var(--color-line);position:sticky;top:0;z-index:var(--z-sticky);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.topbar h1{font-size:var(--text-xl);margin:0;white-space:nowrap}/* 顶栏搜索（.tk-search）：皮肤（图标/几何/焦点环）真源在 site/base.css
的「搜索框皮肤（.tk-search）」规范 —— 2026-09-22 收编，本地只留放置：
   在顶栏 flex 行里占满中段。不要在这里写任何 input 皮肤。 */
.search{flex:1}
/* .hero 的标题几何统一由 .view-head 提供（site/base.css），这里不再重复定义字号与间距。 */
/* 标题下面那句：说明这个库收的是什么、每条笔记讲什么、读完能拿到什么判断。
 * 数字由脚本按当前内容算出（不再写死"186 篇"），见 renderHome 里的
 * 叙述段 —— 这个 span 只负责把它渲染出来，样式交给 .hero p。 */
.hero-lede{color:var(--color-ink-soft);margin:0}
/* 导语两段式：第一句事实（数量/覆盖面）一行，第二句判断（写给谁）
   独立换行占整行 —— 竖线分隔在长句里读起来粘连，换行后两层信息
   各占一行更清楚（2026-09-22 用户要求：换行、去竖线）。 */
.hero-lede .hero-lede-lead{display:block;margin-top:6px;font-weight:var(--weight-semibold);color:var(--color-ink)}
.hero-lede b{font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hero-meta{flex:none;color:var(--color-muted);font-size:var(--text-small);font-variant-numeric:tabular-nums;white-space:nowrap;padding:0;background:transparent;border:0}.section{margin-top:28px}.section h2{font-size:var(--text-2xl);line-height:1.3;margin:0 0 7px}.section>p{color:var(--color-ink-soft);margin:0 0 16px}.domain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--space-3);align-items:stretch}/* 【反复迭代后结果·rt16】原来 align-items:start 使同行卡片只按自身内容收缩，首行实测三卡高 249/199/228 底边参差，视觉碎。改 stretch 后同行等高，配合卡内徽章 b 的 margin-top:auto 钉底，行内对齐由参差变整齐。多个 AI 并行优化期间由本注释锁定此决策。 *//* flex 而非定宽 grid 列：问题名长短不一（「它怎么运作」6 字、「什么时候
   不该用它」8 字），定宽列一旦装不下就把后面的破折号和说明挤到顶格（实测截图）。 */
/* 2026-09-22：flex-wrap 由 wrap 改 nowrap。
 * 原因：li 里有 <b>问题名</b><i>分隔符</i><span>说明</span> 三个 flex item，
 * wrap 允许在任意两个 item 之间断行 —— 实测「它怎么运作」「它想解决什么」
 * 这些短问题名后面都会断开，说明整个掉到下一行（截图确认），读起来像两条。
 * 分隔符跟在问题名后面是同一个语义单元，不该跟后面的说明分开。
 * 改 nowrap 后断行只发生在 <b> 与 <span> 之间；span 内部文字照常自动换行，
 * 所以窄屏（390px）不会溢出 —— 前提是 span 要能收缩，故加 min-width:0
 * （flex item 默认 min-width:auto，长单词会把容器顶宽）。 */
.claim-list li{display:flex;gap:10px;align-items:baseline;flex-wrap:nowrap}
.claim-list li b{flex:none;white-space:nowrap}
/* 破折号单独成元素，不写在文本节点里。
 *
 * 原来写的是 <b>问题</b> —— 说明，那个文本节点的值是 " —— 说明"（带前导空格和
 * 破折号）。i18n 的 translateDOM 按整段文本查词典，带上前缀就永远查不到，
 * 英文界面下这一句会停在中文。拆开之后每个文本节点都是一句干净的译文。 */
/* <i>——</i> 是 i18n 架构必须的占位（见上方注释：translateDOM 按整段文本
 * 查词典，破折号不能并进说明文本里），删不得。
 * 2026-09-22 改观感：中文破折号"——"占两个全角宽，四条并列时形成一列
 * 粗重的灰块，比旁边的正文还抢眼 —— 它只是个分隔符，不该有这个分量。
 * 压到 .45em 宽的一条细线，视觉退到背景里：读的人看到的是"问题 → 说明"
 * 这个关系，而不是四个破折号。
 * 用 background 画线而不是改字符：字符一改，英文版词典 key 就跟着变。 */
.claim-list i{
  color:transparent;font-style:normal;flex:none;margin-right:-4px;
  /* 宽度试过 .45em：太窄，flex 判定可以在 <i> 后面断行，第二条
   * 「它怎么运作」的说明被甩到下一行（截图实测）。.9em 才撑得住不断行，
   * 同时仍比原来的全角「——」(2em) 轻一半以上。 */
  width:.9em;height:1px;background:var(--color-faint);
  align-self:center;position:relative;top:-.1em;
  color:transparent;font-size:1px;
}
.claim-list span{color:var(--color-muted);min-width:0}

/* 主张区右边原来空着一块。放论文里实测出来的数字，替主张做旁证——
   道理说了不算，得有别人测过的数。
   窄屏没有这块空白，整块收掉，不做折叠。 */
.claim-row{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
/* 两块等宽。
 *
 * 右栏原来是 336px 固定宽，而左栏是 1fr（约 620px）—— 五条短句在 336px 里
 * 每句换 3-4 行，和左边四条一行一个的排法完全不成对比，看起来像两块
 * 不同性质的东西。它们是对等的，宽度也该对等。
 *
 * 1fr 1fr 让两栏平分；gap 用 20px 保持呼吸。 */
@media (min-width:1180px){.claim-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* 窄屏撤销问题名强制单行：nowrap 在 390px 会把 7em 列撑爆产生横向溢出，移动端回到自然换行。 */

.claim-row .claim{margin:0}
/* 右侧方法论块的补充样式。复用左边 .claim-list 的排法，只加两条：
   紧凑一档的行距（五条比四条多），以及底部的入口链接。 */
/* 右栏用的行高必须和左栏**完全一致**。
 *
 * 原来这里是 1.55，而左栏走默认行高（26px vs 25px）。单行差 1px 看不出来，
 * 但四条累积成 3-4px —— 两栏并排时右侧每行都比左侧低一点，看起来像没对齐。
 * 既然两栏是同一个框架的两种应用，行高就该由同一个值决定。 */
/* 行高和左栏一致，且**不要**再加 margin。
 *
 * 第一版写了 `li + li { margin-top: 4px }`，而父级 ul 已经有 gap:10px ——
 * 两者叠加成 14px，右侧每行比左侧低 4px，越往下差得越多。
 * 间距由 gap 一处决定；改行高时也只动行高。 */
/* 行高写死成 26px，不用比例。
 *
 * line-height 用倍数时，浏览器按字号算完再舍入：左栏 16px×1.65=26.4→26，
 * 右栏因为 --text-small 得到的实际字号不同，舍入成 25 或 26.4→26，一路
 * 累积仍会差 2px。两栏要逐行对齐，行高就得是一个**绝对值**。 */
/* 两栏标题下的一句说明：这一栏是什么、有多少、读者能拿走什么。
 *
 * 标题是结论（"看完能判断"），读者需要一句事实垫在下面才落得下来。
 * 字号比正文小一档、颜色浅一档 —— 它是导语，不是内容。
 * 两栏都要有，否则一边有导语一边没有，看上去像漏了。 */
.claim-sub{
  margin:6px 0 12px;color:var(--color-muted);
  font-size:var(--text-small);line-height:1.65;
}
/* 这一栏装的是什么 —— 知识，还是论文。
 *
 * 之前两栏各自只有一句"读者能拿走什么"的标题（"看完能判断…"），没有一个字
 * 说这一栏是什么。读者要低头读那行小字才知道左边是知识、右边是论文，而这是
 * 站点的两块主推内容 —— 一眼看不出来就是没标清楚。
 *
 * 现在拆成两层：标签先说"这一栏是什么"，标题再说"你拿走什么"。扫描顺序和
 * 读者的认知顺序一致，不用读正文。
 *
 * 沿用 .eyebrow 的约定：accent 色 + 加字距，不另造一套样式。site/base.css 那份
 * 还带 text-transform:uppercase，中文没有大小写，对这里没作用，所以不抄。
 * 字距是唯一"这是标签不是句子"的信号，必须留。
 *
 * 字号从 --text-small(13px) 提到 15px。
 * 原来 13px 等于下面那行小字、还小于 16px 的标题 —— 全卡片里"这一栏是什么"
 * 这个唯一的分类标识，反而是最弱的一档，层级是反的。有人直接反馈"字太小"。 */
.claim-eyebrow{
  margin:0 0 2px;
  display:flex;align-items:center;gap:var(--space-2);
  color:var(--color-accent);
  font-size:calc(var(--text-body) - 1px);
  font-weight:var(--weight-bold);
  letter-spacing:var(--tracking-caps);
  line-height:1.3;
}
/* 为什么是 15px 而不是和标题一样的 16px：同字号会让"标签"和"结论"糊成一层，
   扫描时读不出"先知道这是哪一栏、再知道能拿走什么"的顺序。辨识交给 accent 色、
   下面那条短横、以及 0.11em 宽字距，不靠尺寸压过标题。
   15px 不在 tokens 的 11/13/16/18 阶梯上，是刻意的 —— 它是独立的 display
   小标题，不属于正文那一档。用 calc 从 --text-body 派生，主题和字号基准变了都跟着走。 */
.claim-eyebrow::before{
  content:"";flex:none;width:18px;height:2px;
  border-radius:var(--radius-full);background:currentColor;
}
.claim-list--tight li { line-height: 26px; }
/* 窄屏放不下两栏，右侧整块收掉（不做折叠）。
   ≥1180 时两块并排，各走上面那条 .claim,.claim-quotes 的卡片样式。 */
.claim-quotes{display:none}
@media (min-width:1180px){.claim-quotes{display:grid}}


.quote-card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--color-line);border-left:2px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-panel);text-decoration:none;color:inherit}
.quote-card:hover{border-left-color:var(--color-ink)}
.quote-card b{font-size:var(--text-base);color:var(--color-ink);font-weight:var(--weight-semibold);line-height:1.45}
.quote-card span{font-size:var(--text-xs);color:var(--color-muted);font-family:var(--font-mono);line-height:1.4}
.quote-card:hover span{color:var(--color-ink-soft)}

/* 知识地形：首页第一屏之后的第一个视觉块。
   每个领域一条横排，左侧是领域名和总数，右侧是该领域下所有主题的圆。 */

.hero p b{font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.hero p span{font-weight:inherit}

/* ── 近七天优质好文：杂志式编辑布局 ────────────────────────────────
 *
 * 旧版是横滚 4 列竖卡（268px 宽）：标题 3 行 + 摘要 4 行 + 脚注，
 * 密度低、要不停横向拉滚动条，读者实际只看到前 4 张。
 * 换成 NYT / The Verge 式杂志布局：
 *   - 左侧 hero：本周最高分那篇，大封面 + 大标题 + 完整摘要
 *   - 右侧双列紧凑行：小缩略图 + 单行标题 + 行内来源，一屏看 8+ 篇
 *   - 整块垂直排布，扫读路径从"拉横条"变"向下扫"
 */
.digest-setup{
  margin:0;padding:13px 16px;border:1px dashed var(--color-line);
  border-radius:var(--radius-sm);background:var(--color-surface);
  color:var(--color-ink-soft);font-size:var(--text-body);line-height:1.7;
}
.digest-setup code{
  padding:1px 6px;border-radius:4px;background:var(--color-panel);
  color:var(--color-accent-ink);font-size:var(--text-small);
  font-family:var(--font-mono);word-break:break-all;
}
.digest{margin:34px 0 0;position:relative}
.digest-head{
  display:flex;align-items:baseline;gap:10px;margin:0 0 14px;
  flex-wrap:wrap;
}
@media (max-width:700px){
  .digest-head .digest-chip{order:3}
  .digest-head .digest-note{order:1;flex:1 0 100%}
}
.digest-head h2{font-size:var(--text-h2);margin:0;line-height:1.3}
.digest-note{color:var(--color-muted);font-size:var(--text-small)}
.digest-chip{
  display:inline-flex;align-items:center;gap:4px;
  height:28px;padding:0 12px;
  /* 手机端热区补到 44：box-sizing 保持视觉 28px，命中区上下各外扩 8px。 */
  border:1px solid var(--color-line);border-radius:999px;
  background:var(--color-panel);
  color:var(--color-ink-soft);
  font-size:var(--text-small);font-weight:var(--weight-medium);
  text-decoration:none;white-space:nowrap;
  transition:border-color var(--duration-fast) var(--ease-out),
             background var(--duration-fast) var(--ease-out),
             color var(--duration-fast) var(--ease-out);
}
.digest-chip:hover{
  border-color:var(--color-accent-line);
  background:var(--color-accent-soft);
  color:var(--color-accent-ink);
}
.digest-chip--out{color:var(--color-muted)}
/* 箭头尺寸/透明度不再本地写死，走 tokens.css 的 --arrow-*（单一来源）。
 * 原来 11px + .7：在深底上偏虚，读不出是个箭头。 */
.digest-chip--out i{font-style:normal;font-size:var(--arrow-size);opacity:var(--arrow-opacity)}
.digest-chip--out:hover{color:var(--color-accent-ink)}
.digest-chip--out:hover i{opacity:1}
/* 手动刷新按钮：外观同 chip，行为同按钮。↻ 图标在请求期间旋转，
   disabled 态去 pointer 事件防连点（fetch 中按钮仍在原位）。 */
.digest-chip--refresh{cursor:pointer;font-family:inherit}
.digest-chip--refresh i{font-style:normal;font-size:var(--arrow-size);display:inline-block;transition:transform var(--duration-fast) linear}
.digest-chip--refresh i.is-spinning{animation:digest-spin 1s linear infinite}
.digest-chip--refresh:disabled{opacity:.55;cursor:default}
@keyframes digest-spin{to{transform:rotate(360deg)}}
/* 「全部来源」药丸靠右，和标题拉开距离 —— 它是"离开这块去别页"的
   操作，不跟标题挤在一行读。 */
.digest-head .digest-all{margin-left:auto}
.digest-all{color:var(--color-accent);font-size:var(--text-small);font-weight:var(--weight-semibold);text-decoration:none}
.digest-all:hover{text-decoration:underline}

/* 杂志主体：左 hero 右清单的网格。
 * 2026-09-22 比例改 7fr:5fr → 5fr:7fr。
 * 原因：7:5 是照"有封面"设计的（大封面撑满宽列才不空）。实测首篇常无封面
 * （BestBlogs 不少条目没有 cover），此时 58% 宽的列里只有标题+2 行摘要
 * 约 4 行内容，右侧清单一列却有 8 行，左列 2/3 高度是空白 —— 用户反馈
 * "又宽又高"正是这个空洞。改 5:7 后：左列收窄到 42%，与内容体量匹配；
 * 右列加宽，单行标题从 18-20 字放宽到 26-28 字，少一半截断（"..."）。
 * 有封面时 5fr 列封面按比例缩小，仍不空。 */
.digest-grid{display:grid;grid-template-columns:5fr 7fr;gap:0}
@media (max-width:1020px){
  /* 中屏以下 hero 与清单上下排，整块不塌。
   1fr 列会被条目内容的 min-content 顶穿（一条 24 字中文标题不可断，
   min-content 即 400+px），必须同时给两列 minmax(0,1fr) 才真给得出
   收缩权 —— 单写 1fr 在窄屏是装饰。 */
  .digest-grid{grid-template-columns:minmax(0,1fr)}
  .digest-hero,.digest-list{min-width:0}
}
/* ── hero 特写卡 ── */
.digest-hero{
  display:flex;flex-direction:column;text-decoration:none;
  border-right:1px solid var(--color-line);
  padding-right:22px;
}
@media (max-width:1020px){
  .digest-hero{border-right:0;padding-right:0;padding-bottom:18px;border-bottom:1px solid var(--color-line)}
}
/* rt12 修复：首图过大。16/9 在 579px 宽的 hero 列里会算出 326px 高——
 * 400px 原图被拉伸 1.45× 不说，还主导整个模块（右列清单一行才 95px 高）。
 * max-height 钳到 240px：宽列封面变为横幅式裁切（object-fit:cover 已有），
 * 窄屏宽度不足 427px 时仍按 16/9 自然缩小、不受钳制影响。 */
.digest-hero-cover{
  position:relative;display:block;height:186px;aspect-ratio:16/9;max-height:240px;
  /* height 兜底：aspect-ratio 需要 Chromium 88+，旧内核没有它时
     容器没有内在高度，img 绝对定位后整块塌成 0 高。186px 是
     330px 宽按 16/9 算出的高度，支持的浏览器由 aspect-ratio 接管。 */
  @supports (width: aspect-ratio: 1) { height: auto; }
  border-radius:var(--radius-md);overflow:hidden;
  background:var(--color-surface);
  margin-bottom:14px;
}
/* 无封面兜底块：不是"占位灰块"，而是把评分这个已有信息放大成视觉主体。
 * 高度只给 132px（有封面时 16/9 算下来约 150px），避免无图时反而更占地方。
 * 用 accent 渐变而不是纯灰：这一格要承担"看这里"的引导作用。 */
.digest-hero-cover--score{
  aspect-ratio:auto;height:132px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(135deg,var(--color-accent-soft),var(--color-surface));
  border:1px solid var(--color-accent-line);
}
.digest-hero-cover--score i{
  font-style:normal;font-size:34px;font-weight:var(--weight-bold);
  color:var(--color-accent-ink);line-height:1;
  font-variant-numeric:tabular-nums;
}
.digest-hero-cover--score em{
  font-style:normal;font-size:var(--text-xs);
  color:var(--color-muted);letter-spacing:.04em;
}
/* hero 封面用 cover：选最高分那篇做特写，视觉冲击优先，
 * 原图完整性让位（紧凑行里同一篇还有一张 contain 小图可看）。 */
.digest-hero-cover img{
  position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.digest-hero-badge{
  position:absolute;left:10px;top:10px;
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;
  background:var(--color-bg-veil);color:var(--color-accent-ink);
  font-size:var(--text-xs);font-weight:var(--weight-bold);
  font-variant-numeric:tabular-nums;
}
/* UI 图标一律内联 SVG（design-craft 硬规则 6：不许拿 emoji 当图标）。
 * 统一 24 viewBox + currentColor：颜色随语义 token 走，深浅主题自适应，
 * 尺寸由字号决定（1em），不写死 px。 */
.ic{
  width:1em;height:1em;flex:0 0 auto;display:inline-block;
  vertical-align:-0.125em;
  fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;
}
.ic--fill{fill:currentColor;stroke:none}
/* 2026-09-22 首篇过重：原 --text-xl 让无封面的纯文字卡在 58% 宽的列里
 * 显得又宽又空 —— 大字号 + 3 行摘要撑出的体量，和右侧一行一条的紧凑行
 * 差出三四个层级，读者视线被单篇钉住，失去"一屏扫多篇"的杂志感。
 * 降一档到 --text-lg，与 .digest-item-title 拉开"主次"而非"大小类别"的差。 */
.digest-hero-title{
  color:var(--color-ink);font-size:var(--text-lg);
  font-weight:var(--weight-bold);line-height:1.4;margin:0 0 7px;
}
.digest-hero:hover .digest-hero-title{color:var(--color-accent)}
/* 摘要 3 行 → 2 行（同上，为首篇减重）：
 * 特写卡的作用是"吸引点进去"，不是"在这里读完"。2 行已足够给出判断依据，
 * 第三行多数是截断的残句（"用 characterization..."），反而是噪点。
 * data-clamp="3" 在 HTML 里也同步改，避免 clamp 逻辑与样式两处不一致。 */
.digest-hero-sum{
  color:var(--color-muted);font-size:var(--text-body);
  line-height:1.6;margin:0 0 10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.digest-hero-meta{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  color:var(--color-faint);font-size:var(--text-xs);
}
.digest-hero-meta .digest-icon{width:16px;height:16px}
.digest-hero-meta .digest-source{color:var(--color-ink-soft);font-weight:var(--weight-medium)}
.digest-hero-meta .digest-facts{font-variant-numeric:tabular-nums}

/* ── 紧凑行清单（右侧两列） ── */
.digest-list{display:grid;grid-template-columns:1fr 1fr;gap:0;padding-left:18px;align-content:start}
@media (max-width:1020px){.digest-list{padding-left:0}}
@media (max-width:760px){.digest-list{grid-template-columns:1fr}}
.digest-item{
  display:flex;gap:11px;align-items:flex-start;
  /* grid 项 min-width:auto 是默认：内容 min-content（24 字中文标题 ≈432px）
     会顶穿 1fr 列。显式归零，让 flex 里的文字块拿回收缩权。 */
  min-width:0;position:relative;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  text-decoration:none;
  transition:background var(--duration-fast) var(--ease-out);
}
.digest-item:hover{background:var(--color-surface)}
/* 紧凑行的缩略图：56px 方图，cover 裁切 —— 小图的作用是"认出这篇"，
 * 不是"看全这张图"。 */
.digest-thumb{
  flex:none;width:56px;height:56px;border-radius:var(--radius-sm);
  overflow:hidden;background:var(--color-surface);
  display:grid;place-items:center;
}
.digest-thumb img{width:100%;height:100%;object-fit:cover;display:block}
/* 没封面的条目用首字母块顶上：56px 空白块比首字母更枯燥。 */
.digest-thumb--text{
  color:var(--color-accent-ink);
  font-weight:var(--weight-bold);font-size:var(--text-lg);
}
.digest-item-title{
  color:var(--color-ink);font-size:var(--text-body);
  font-weight:var(--weight-medium);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  /* 中文长标题是不可断块：一条 24 字的标题按 min-content 把 grid 的 1fr 列
     顶穿容器（390px 实测 scrollWidth 441px、hero 撑到 426px）。min-width:0
     放开收缩权，word-break 让 CJK 长块能断行 —— 两招合用，窄屏不再溢出。 */
  min-width:0;word-break:break-word;
  margin-bottom:3px;
}
.digest-item:hover .digest-item-title{color:var(--color-accent)}
/* 文字块在 flex 里要能收缩：min-width:auto + flex:none 时，meta 行里
   flex:none 的来源串（"Discovered · zhuanlan.zhihu.com" ≈210px）把整块
   min-content 顶到 317px，顶穿 268px 的卡片。min-width:0 + flex:1 收回来。 */
.digest-item-text{flex:1 1 auto;min-width:0}
.digest-item-meta{
  display:flex;align-items:center;gap:5px;
  color:var(--color-faint);font-size:var(--text-xs);
  white-space:nowrap;overflow:hidden;
}
/* 来源名吃掉剩余空间（grow），两个按钮成对靠右；超长刊名收缩截尾是
 * 最后的让位项——按钮完整 > 极端长名的尾巴（实测：仅 22 字符英文刊名
 * 这一行截尾约 3 字符，其余行完整）。 */
.digest-item-meta .digest-source{color:var(--color-ink-soft);font-weight:var(--weight-medium);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.digest-item-meta .digest-facts{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.digest-item-meta .digest-facts{font-variant-numeric:tabular-nums}
.digest-item-meta .digest-score-inline{
  color:var(--color-accent-ink);font-weight:var(--weight-bold);
  font-variant-numeric:tabular-nums;
}
/* 收藏星标在紧凑行里贴右，不占标题行宽度 */
.digest-item .tk-fav-btn{flex:none;align-self:center;margin-left:0}
/* 公众号头像通用：圆角方图 */
.digest-icon{border-radius:50%;object-fit:cover;flex:none;background:var(--color-surface)}
.digest-source{color:var(--color-ink-soft);font-weight:var(--weight-medium)}
.digest-facts{font-variant-numeric:tabular-nums}
/* 清单过长时收起：默认 8 条，展开看全部。
 * 22 条全铺开实测把区块拉到 1095px —— 比旧版横滚区还高，违背
 * "一屏扫完"的初衷。收起态 8 条（两列四行），配一个展开按钮。 */
.digest-list{padding-left:18px;align-content:start}
.digest-list.is-collapsed .digest-item:nth-child(n+9){display:none}
.digest-more{
  grid-column:1/-1;justify-self:start;
  margin-top:4px;padding:5px 14px;
  border:1px solid var(--color-line);border-radius:var(--radius-sm);
  background:var(--color-panel);color:var(--color-ink-soft);
  font-size:var(--text-small);font-weight:var(--weight-medium);cursor:pointer;
}
.digest-more:hover{border-color:var(--color-accent-line);color:var(--color-accent)}
.digest-more i{font-style:normal;margin-left:4px;transition:transform var(--duration-fast) var(--ease-out)}
.digest-list.is-collapsed .digest-more i{transform:rotate(180deg)}
.digest-more span{display:inline-block}
.digest-list:not(.is-collapsed) .digest-more span:first-child{display:none}
.digest-list.is-collapsed .digest-more span:last-child{display:none}
/* 公众号头像通用：圆角方图 */
.digest-icon{border-radius:50%;object-fit:cover;flex:none;background:var(--color-surface)}
.digest-source{color:var(--color-ink-soft);font-weight:var(--weight-medium)}
.digest-facts{font-variant-numeric:tabular-nums}
.atlas{margin:34px 0 0;padding:22px 24px 26px;background-color:var(--color-panel);background-image:var(--wash-panel);border:1px solid var(--color-line);border-radius:var(--radius-md);box-shadow:var(--hairline-top),var(--shadow-xs)}
.atlas-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--ink-rule)}
.atlas-head h2{font-size:var(--text-h2);margin:0 0 6px;letter-spacing:var(--tracking-h2)}
.atlas-head p{margin:0;color:var(--color-muted);font-size:var(--text-small);max-width:60ch}
/* 2026-09-22：「打开完整图谱」的箭头原先写在 i18n 的 key 里
 * （`"打开完整图谱 →": {en:"Open the full graph →"}`），两个麻烦：
 *   1. 箭头进了 key，英文必须手工再写一遍 →，两套语言各自维护一个装饰符；
 *   2. CSS 完全管不到它 —— 字号跟 --text-small 走，贴着文字没有间距，
 *      和本页其它箭头（.domain-card b::after）粗细、间距、hover 都不一致。
 * 现在 key 收成纯文案「打开完整图谱」，箭头由 ::after 统一生成，
 * 和领域卡片用同一套尺寸/间距/hover。改 key 必须同时改 HTML 与词典，
 * 三者不同步英文界面就会漏翻 —— 已一并改。 */
.atlas-open{flex:none;color:var(--color-accent);font-size:var(--text-small);font-weight:var(--weight-semibold);white-space:nowrap}
.atlas-open::after{
  content:'\2192';margin-left:var(--space-2);font-size:var(--text-xs);
  opacity:.8;display:inline-block;transition:transform var(--duration-fast) var(--ease-out);
}
.atlas-open:hover::after{transform:translateX(3px)}
.atlas-open:hover{color:var(--color-accent-hover)}
.atlas-canvas{display:grid;gap:3px}
/* 圆点区右移且垂直居中：老版 dots 与域名挤在一行同一基线，
 * 视觉上像表格单元，没有"地形"的层次感。 */
.atlas-row{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--color-line);border-radius:var(--radius-sm);transition:background var(--duration-fast) var(--ease-out)}
.atlas-row:hover{background:var(--color-surface)}
.atlas-row:last-child{border-bottom:0}
/* 领域名是这一行的轴标签：等宽、右对齐，让右侧的圆有一个统一的起点。 */
.atlas-domain{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:9px;align-items:center;border:0;background:transparent;padding:4px 0;cursor:pointer;text-align:left;color:var(--color-ink);font:var(--weight-semibold) var(--text-small)/1.35 var(--font-sans)}
.atlas-domain i{width:9px;height:9px;border-radius:50%;background:var(--ink)}
.atlas-domain b{color:var(--color-muted);font-size:var(--text-small);font-variant-numeric:tabular-nums}
.atlas-domain:hover span{color:var(--color-accent)}
.atlas-dots{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
/* 每个主题一个圆，半径由 --dot 决定（来自篇数）。圆外的标签在 hover 前保持安静，
   因为这一块是给"看一眼分布"用的，不是给逐条读的。 */
.atlas-topic{display:inline-grid;grid-template-columns:var(--dot) auto auto;gap:7px;align-items:center;border:0;background:transparent;padding:3px 0;cursor:pointer;color:var(--color-muted);font:500 var(--text-small)/1 var(--font-sans)}
.atlas-topic i{width:var(--dot);height:var(--dot);border-radius:50%;background:var(--ink);opacity:.85;transition:transform var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out)}
.atlas-topic b{color:var(--color-muted);font-size:var(--text-micro);font-variant-numeric:tabular-nums}
.atlas-topic:hover{color:var(--color-ink)}
.atlas-topic:hover i{transform:scale(1.18);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
/* 域行 hover 时，该域的圆点整组提亮 + 微升 —— "地形"该有的联动：
 * 鼠标扫过一行，读者看到这行所有山头一起亮。 */
.atlas-row:hover .atlas-topic i{opacity:1}
.atlas-row:hover .atlas-topic{color:var(--color-ink-soft)}
@media(max-width:1100px){.atlas-row{grid-template-columns:170px minmax(0,1fr)}}
@media(max-width:760px){.atlas{padding:18px 16px 20px}.atlas-head{display:block}.atlas-open{display:inline-block;margin-top:10px;padding:9px 14px;border:1px solid var(--color-line);border-radius:var(--radius-sm);background:var(--color-panel);white-space:nowrap}.atlas-row{grid-template-columns:1fr;gap:8px}}
.domain-card{position:relative;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-5);background:var(--color-panel);border:1px solid var(--color-line);border-radius:var(--radius-md);cursor:pointer;transition:border-color var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out)}
/* 左右两块用同一套卡片样式。
 *
 * 原来只有左边 .claim 有边框和内边距，右边是裸的文字 —— 并排看是
 * 一个框 + 一段飘着的文字，读者看不出它们是对等的两块。
 * 现在两边都走这个规则。
 *
 * gap 从 12px 收到 8px、padding 从 18/20 收到 14/16：标题和列表之间
 * 原来空 12px，加上标题自己是 16px 行高，看上去像标题下有个洞。 */
.claim,.claim-quotes{
  display:grid;gap:8px;max-width:760px;margin:0;
  /* 2026-09-22 边界感修复：左边框 3px accent 会吃掉左内边距的视觉宽度，
   * 实际左边 13px、右边 16px 不对称；「什么时候不该用它——代价是什么，
   * 边界在哪」这类长行又贴右缘（用户截图实锤）。水平内边距对称提到
   * 16/20，行尾与右缘留出呼吸，两侧视觉均衡。 */
  padding:16px 20px;border:1px solid var(--color-line);
  border-left:3px solid var(--color-accent);border-radius:var(--radius-sm);
  background:var(--color-panel);
}
.claim-lead--right{color:var(--color-accent)}
.claim-lead{margin:0;color:var(--color-ink);font-size:var(--text-body);font-weight:var(--weight-semibold)}.claim-list b{color:var(--color-ink);font-weight:var(--weight-semibold)}
.claim-list{display:grid;gap:10px;margin:0;padding:0;list-style:none;color:var(--color-muted);font-size:var(--text-body);line-height:1.6}
.claim-list b{color:var(--color-ink)}

.domain-card{transition:border-color var(--duration-base) var(--ease-out),box-shadow var(--duration-base) var(--ease-out),transform var(--duration-base) var(--ease-out)}.domain-card:hover{border-color:var(--color-accent-line);box-shadow:var(--hairline-top),var(--shadow-md);transform:translateY(-2px)}
.domain-card h3{margin:0;font-size:var(--text-lg);font-weight:var(--weight-bold);color:var(--color-ink)}
.domain-card p{margin:0;color:var(--color-muted);font-size:var(--text-sm);line-height:var(--leading-normal);max-width:38ch}
/* 计数不是装饰：它给出"这个领域有多少东西"这一唯一事实，
   所以用 accent 且与标题同排，而不是推到底部当装饰。 */
/* 主题标签给出"这个领域里有什么"，比空着的卡片空白有用。 */
.domain-topics{display:flex;flex-wrap:wrap;align-items:center;gap:0}
.domain-topics i{padding:2px 0;margin-right:2px;white-space:nowrap;border:0;background:transparent;border-radius:0;color:var(--color-muted);font-size:var(--text-xs);font-style:normal;font-weight:650}
.domain-topics i + i::before{content:"·";margin-right:7px;color:var(--color-line-strong);font-weight:var(--weight-normal)}
/* 2026-09-22：卡片底部「94 篇」的箭头原先裸写在 HTML 文本里
 * （`${n+' 篇 →'}`），跟着 <b> 走 --text-sm 同字号同粗细，紧贴数字没有
 * 间距 —— 六张卡片并排，六根粗细不一的箭头贴在数字尾巴上，读起来像
 * 数字的一部分（OCR 实测识别成「94篇→」连在一起）。
 * 现在箭头交给 CSS ::after：字号 --text-xs（比数字的 --text-sm 小一级）、
 * 左边留 --space-2、opacity .8；hover 时右移 3px —— 卡片整体已经会
 * translateY(-2px)，箭头再给一点水平位移，"这是一张能点进去的卡"
 * 这个信号才完整。中间试过 --arrow-size(12px) + 6px 间距，仍嫌粘，见下方。
 * 箭头从文本挪进 CSS 是安全的：t_ 的 key 是「94 篇」，本来就不含箭头。 */
.domain-card b{margin-top:auto;padding-top:var(--space-2);color:var(--color-accent);font-size:var(--text-sm);font-weight:var(--weight-semibold)}
.domain-card b::after{
  /* 间距试过硬编码 6px：只有箭头(12px)的一半宽，OCR 仍把「94篇→」识别成
   * 一个连串，说明视觉上确实粘在数字尾巴上。改用 --space-2(8px) 跟全站
   * 间距节奏对齐，同时箭头降到 --text-xs 并 opacity .8 —— 它是"可以点进去"
   * 的提示，不是内容，不该和数字抢分量。 */
  content:'\2192';margin-left:var(--space-2);font-size:var(--text-xs);
  opacity:.8;display:inline-block;transition:transform var(--duration-fast) var(--ease-out);
}
.domain-card:hover b::after{transform:translateX(3px)}
.domain-card:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
/* 页面末尾的引导条。
 *
 * 两处改动：
 *   1. 位置从「知识地形」和「知识领域」之间移到最后。它夹在两个内容块
 *      中间，把本来连贯的"先看地图 → 再看领域"切开了；而它讲的是
 *      "接下来去哪"，本来就该在末尾。

.pg-row.is-planned .pg-title{color:var(--color-ink)}/* 交互句独立成行：2026-09-22 用户抓到「双击笔记进原文」7 字孤悬第二行、右侧空 600px。CSS 断行算法（pretty/balance）对中文均无解——pretty 不救中文孤行（实测 51+7 不动），balance 切词（只|看）。正解是语义分行：主句与操作句以「；」语义边界拆开各自成行，断点在语义处而非宽度处。先例：下方 .graph-method-note 因「实现」孤字挂行尾改 block，同一决策链。 */.graph-focus-hint{display:block;margin-top:2px;color:var(--color-accent);font-weight:var(--weight-semibold)}

.graph-method-note{display:block;margin-top:4px;color:var(--color-faint);font-size:var(--text-small)}.graph-panel{background:var(--color-panel);border:1px solid var(--color-line);border-radius:8px;padding:10px}

.graph .edge,.graph .node,.graph .topic-node,.graph .domain-head{transition:opacity var(--duration-fast) var(--ease-out)}

.graph.has-focus .edge.focused{stroke:var(--color-warm);stroke-width:2;stroke-opacity:.55;opacity:1}
.graph.has-focus .node.dimmed{opacity:.08}

.domain-head:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;border-radius:4px}.graph-panel svg{display:block;width:100%;height:min(70vh,700px);background:var(--color-surface);border-radius:6px}

.graph-hint{margin-left:auto;color:var(--color-muted);font-size:var(--text-xs)}

   graph-panel 视觉上断开，色点 9px 无描边在深底上发闷。升级为：
   面板化（panel 底 + line 边框 + 圆角，与 graph-panel 同一容器语言），
   色点加同色 33% 外圈（box-shadow 模拟 halo，暗底上更醒目），
   附加语义行（圆越大笔记越多 / 已读 / 已读环）分隔线隔开。 */
.graph-legend{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:center;color:var(--color-muted);font-size:var(--text-sm);padding:8px 12px;margin-top:8px;background:var(--color-panel);border:1px solid var(--color-line);border-radius:8px}

 *   然后 .7px / 22%  → 屏幕上直接消失，用户说"我都看不到"
 *   再  1.4px / 55%  → 看得见了，但线太黑，把节点盖住，用户说"太丑了"

 * 前两次都在调"深不深"，没有分开看两件事：一条线要能看见（对比度），
 * 又不能抢节点的视线（权重）。现在用较细的线宽 + 中等透明度：

/* 2026-09-22 再调（用户反馈：缩小视图后线浅得看不见，太深又压节点）：
 * ① 提一档对比度——inner 从 slate-200 升到 slate-300（1px 的 slate-200 在
 *   浅底上对比度只有约 1.2:1，缩小后直接消失），透明度 .3→.38、.34→.42；
 * ② 线宽改由 vector-effect 定死为屏幕像素（见下方规则），不再随缩放衰减——
 *   这是「缩到 60% 线就没了」的直接原因，与「调深调浅」无关。 */
.edge--cross{stroke:var(--color-muted);stroke-width:1.15;stroke-opacity:.42}
/* 同领域引用：只在列内离得够远时才画。它们补充的是"这个主题的两头有联系"，
   权重再低一档，不参与跨领域的视觉竞争。 */
.edge--inner{stroke:var(--color-line-strong);stroke-width:1;stroke-opacity:.38}
/* 2026-09-22 分级可见（用户两轮反馈：先是「挺吓人的」，压到 .12 后又
 * 「网太浅了不好看」——吓人的源头其实不是网，是标题又大又密）。
 * 最终分级：同域线隐藏（位置已表达归属）；跨域线 .32 —— 看得见织理、
 * 不抢节点，深浅两色下都成立；hover/聚焦相关边 .focused 提亮到不透明。

.graph:not(.has-focus) .edge--cross{opacity:.32}
.graph:not(.has-focus) .edge.focused{opacity:1}

 * 引用都是一条横穿整个画布的斜线。全站有一百多条，叠在一起是一张网 —— 它

.edge.focused{stroke:var(--color-warm);stroke-width:2.6;stroke-opacity:1}.topic-link{stroke:var(--color-line-strong);stroke-width:.9;stroke-opacity:.55}.domain-label{font-size:var(--text-body);color:var(--color-ink);font-weight:750;letter-spacing:var(--tracking-h2)}/* 2026-09-22 域标题降噪（用户反馈「标题的文字太大、太密集」）：

.domain-head span{display:block;margin-top:1px;font-size:10px;font-weight:600;color:var(--color-muted);font-variant-numeric:tabular-nums;letter-spacing:0}.domain-count{font-size:var(--text-xs);fill:var(--color-muted);font-weight:600;font-variant-numeric:tabular-nums}.topic-name{font-size:var(--text-small);fill:var(--color-ink-soft);font-weight:650;pointer-events:none}/* 2026-09-22 缩放可读性（用户反馈「压缩的字体都看不到」）：

.topic-count{font-size:var(--text-xs);fill:var(--color-ink);font-weight:750;pointer-events:none;font-variant-numeric:tabular-nums}

.note-row:focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px;background:var(--color-accent-soft)}

.skeleton-note{margin:0 0 14px;color:var(--color-muted);font-size:var(--text-base)}

@media(max-width:760px){

.reader-body table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}

.section > p a[target="_blank"]{display:inline-block;padding:6px 10px;margin:2px 0;border:1px solid var(--color-line);border-radius:5px;background:var(--color-panel)}
/* 文章页来源区链接（man7.org 等）：裸文本转胶囊芯片，可点。 */
.reader-sources .source-list a{display:inline-block;padding:6px 11px;margin:3px 8px 3px 0;border:1px solid var(--color-line);border-radius:999px;background:var(--color-panel)}
/* 手机上来源行不再特殊处理：全宽度下左对齐与正文同侧，无需补丁。 */
/* 正文内联互链：竖向内边距把命中区拉到 29px 高。行内元素的竖向
   内边距不影响行盒高度，版面零变化，只有热区变大。 */
.reader-body p a,.reader-body li a{padding:5px 2px}
}
/* 阅读进度：长文读到哪了。贴在顶栏下沿的一条细线。 */
.progress-bar{position:fixed;left:286px;right:0;top:0;height:2px;z-index:calc(var(--z-fab) + 1);background:var(--color-accent);transform-origin:0 50%;transform:scaleX(0);transition:transform var(--duration-fast) var(--ease-out)}
@media(max-width:760px){.progress-bar{left:0}}
/* 领域列表布局保护：note-row 两列网格的内容列（minmax(280px,1.3fr)）
   缺 min-width:0 时，超长英文文件名会把整行顶出内容列（瞬态实测
   right=491px）。最小宽度归零 + 长词可断行，网格列宽随之自然收缩。 */
.note-row{min-width:0}
.note-row>div,.note-row h3,.note-row .path{min-width:0;overflow-wrap:anywhere}
@media(max-width:760px){/* 手机上右下角只能放一个悬浮件：键盘提示在触屏上没有意义，隐藏。
   选择器带 .shell 是为了压过文件后面定义的同名基础规则。 */
body .kbd-hint{display:none}}
/* 打印：去掉所有悬浮件和导航，只留文章本身 */

/* ── 手机端触控热区补足（44px 标准，视觉尺寸全部不动）──────────
 * 依据：design-craft 间距章「点击热区最小 44×44」；相邻可点元素
 * 之间已有间距的不需要再扩，只补真实的不足项。 */
@media (max-width: 760px) {
  .digest-chip { box-sizing: content-box; height: 28px; border-block-width: 8px; padding-top: 0; padding-bottom: 0; }
  .digest-more { padding: 12px 14px; }
  .atlas-domain { padding: 11px 0; }
  .atlas-topic { padding: 10px 0; }
  .tk-control { min-width: 44px; height: 44px; }
  .work-actions a { padding: 11px 12px; } /* 35px 高不达触控标准，补到 44 */
  .tk-domain { padding-top: 10px; padding-bottom: 10px; } /* 40px 行补到 44 */
  .pg-filter { position: relative; }
  .pg-filter::before { content: ""; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; } /* 筛选 radio 命中区扩到 44 */
  .pg-io, .pg-clear { padding: 11px 13px; } /* 导出导入钮补到 44 */
  .tk-subnav-toggle { width: 32px; height: 32px; right: 2px; } /* 22px 箭头钮补到 32，外扩后 ≥44 */
  .tk-fav-btn::before { top: -9px; left: -9px; right: -9px; bottom: -9px; } /* 命中区 26→44，视觉圆钮不变 */
}

@media print{.tk-sidebar,.topbar,.kbd-hint,.tk-fab,.tk-fb-overlay,.app-alert,.reader-toc,.reader-siblings,.article-relations,.reader-tools,.progress-bar{display:none!important}body{background:var(--color-panel)}.content{padding:0;max-width:none}.reader-body{max-width:none;font-size:11pt;line-height:1.6}.reader-head{border:0;margin:0 0 12pt}.reader-body a{color:#000;text-decoration:none}.reader-body a[href^="http"]::after{content:" (" attr(href) ")";font-size:9pt;color:#555}}@media(max-width:760px){/* 顶栏：搜索占满一行，主题按钮靠右，不要互相挤压。 */.topbar{grid-template-columns:1fr auto;row-gap:10px}.topbar .search{grid-column:1/-1}.app{display:block}/* 侧边栏本身在 base.css 里变成顶部横条。域树在主站是第二层导航，手机上收进「目录」后面，免得把首屏挤满。 */.tk-mobile-menu{display:block;border:1px solid var(--color-line);background:var(--color-panel);border-radius:6px;padding:6px 9px;color:var(--color-accent);min-height:44px;box-sizing:border-box}#tk-sidebar.collapsed #domains{display:none}.main{padding-top:62px}.topbar{padding:13px 15px}.topbar h1{display:none}.hero{display:block}.hero-meta{flex-wrap:wrap;gap:12px 22px;margin-top:11px}.domain-grid{grid-template-columns:1fr}.directory-head,.view-head{display:block}.sort,.visual-tabs{margin-top:13px}.note-row{display:block}.note-row p{margin-top:6px}.reader h2{font-size:var(--text-2xl)}}

body{background:var(--color-bg);font-size:var(--text-md);line-height:var(--leading-normal)}

.sidebar{background:var(--color-panel);padding:25px 16px 24px}
.nav-actions{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:14px 0 16px}
.nav-actions button{padding:8px 4px;text-align:center;font-size:var(--text-sm);border:1px solid var(--color-line);background:var(--color-panel);color:var(--color-muted)}
.nav-actions button:hover,.nav-actions button.active{background:var(--color-accent-soft);border-color:var(--color-accent-line);color:var(--color-accent)}
.nav-section{border:0;padding:2px 0}
.nav-section button{align-items:center;border:1px solid transparent;padding:9px 10px;border-radius:6px;color:var(--color-muted)}
.nav-section button:hover,.nav-section button.active{background:var(--color-surface);border-color:var(--color-accent-line);color:var(--color-accent-ink)}
.nav-section .topic-button{margin-left:13px;width:calc(100% - 13px);padding:6px 10px;font-size:var(--text-base);color:var(--color-muted)}
/* 时效性文章（type: radar）置顶在领域标题下方、主题列表之上。
   橙色边框 + 阴影 + ⚡，让"这份动态有没有更新"在侧边栏就能一眼看到。 */
/* 雷达卡（每周更新入口）：收敛版。原为琥珀大卡（用户反馈太抢眼、
   点击被引得畸形），现与 tk-subtopic 行同构——同缩进、同左线、同字号，
   仅以小 ⚡ 与浅灰「每周更新」后缀区分；hover/current 走子主题同款
   accent 语言。时效入口的功能保留，视觉音量归位。 */
.radar-card,.nav-section .radar-card{display:flex;align-items:center;gap:6px;box-sizing:border-box;margin:0;padding:5px 8px 5px 26px;border:0;border-left:1px solid var(--color-line);border-radius:0;background:transparent;box-shadow:none;cursor:pointer;text-align:left;color:var(--color-ink-soft);font-size:var(--text-small);line-height:1.4;transition:color var(--duration-fast) var(--ease-out),border-color var(--duration-fast) var(--ease-out),background var(--duration-fast) var(--ease-out)}
.tk-subtopics .radar-card:hover,.nav-section .radar-card:hover{color:var(--color-accent);border-left-color:var(--color-accent);background:var(--color-accent-soft);box-shadow:none}
.radar-card .radar-icon{flex:none;font-size:var(--text-2xs);line-height:1;opacity:.75}
.radar-card .radar-text{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1 1 auto}
.radar-card .radar-text strong{font-size:var(--text-small);font-weight:var(--weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;color:inherit}
.radar-card .radar-text small{font-size:var(--text-2xs);font-weight:var(--weight-normal);color:var(--color-muted);white-space:nowrap;flex:0 1 auto;overflow:hidden;min-width:0}
:root[data-theme="dark"] .radar-card{box-shadow:0 3px 10px rgba(0,0,0,.4)}
:root[data-theme="dark"] .radar-card:hover{box-shadow:0 5px 14px rgba(0,0,0,.5)}
/* hero 光晕深色覆盖：同一套 13%/10% 亮蓝叠在深底上是一条发亮横带（实测
   2026-09-23，rgba(19,23,34) 底 + 亮蓝 13% 可见亮带）。深色改用深色专用
   soft token（本身已是暗蓝），只留隐约层次；浅色保持原样。 */
:root[data-theme="dark"] .hero--display::before{background:
  radial-gradient(50% 48% at 22% 40%,color-mix(in srgb,var(--color-accent-soft) 55%,transparent),transparent 70%),
  radial-gradient(44% 36% at 80% 26%,color-mix(in srgb,var(--color-info-soft,#142c42) 45%,transparent),transparent 72%)}
/* 归档：维护资料，不是知识主题。视觉上比正常主题轻一档。 */
.nav-section .topic-button.archived{color:var(--color-muted);font-style:italic}
.nav-section .topic-button.archived::before{content:"";display:inline-block;width:5px;height:5px;margin-right:6px;border-radius:50%;background:currentColor;opacity:.5;vertical-align:middle}
.nav-section .topic-button.archived .count{opacity:.7}
.domain-button .domain-label{display:flex;align-items:center;gap:7px;min-width:0;line-height:1.35}/* 箭头加大加粗一档。
 *
 * 原来是 5×5 的方框、1.5px 描边 —— 在 16px 的文字旁边显得太细，
 * 像是没渲染完整。改成 6×6、2px 描边、整体 12px 的盒子：
 * 笔画和旁边文字的字重（750）配得上了，缩小到 90% 也还看得清。
 *
 * transform-origin 定在中心，展开旋转时不会偏。 */
.domain-chevron{flex:none;width:13px;height:13px;position:relative;transform-origin:center;transition:transform var(--duration-fast) var(--ease-out)}.domain-chevron::before{content:"";position:absolute;top:1.5px;left:2.5px;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);border-radius:1.5px}.domain-chevron[data-open="true"]{transform:rotate(90deg)}.domain-button[aria-expanded="true"] .domain-chevron{color:var(--color-accent)}
.count{font-variant-numeric:tabular-nums;color:var(--color-muted)}
.topbar{padding:12px 30px;background:var(--color-bg-veil);gap:18px}
.topbar h1{font-size:var(--text-md);font-weight:var(--weight-semibold);color:var(--color-muted)}
/* 顶栏搜索的放置差异：focus 动态伸长（参考 BestBlogs 右上角搜索）——
 * 平时 480px，聚焦时展开到 620px，向左生长、不推挤右侧控件；0.25s
 * 缓出，快于 300ms 感知阈值，动画是"顺手"而不是"表演"。
* 皮肤（高度/图标/焦点环/⌘K）一律走 base.css 的 .tk-search 规范。 */
.search{max-width:880px;transition:flex-basis .25s var(--ease-out)}
.search:focus-within{flex-basis:620px}
/* .content 的盒模型（宽度、左右内边距）由 base.css 的 .tk-shell,.content 统一定义。
 * 这里曾自己写了一套 padding:42px … + max-width:1320px —— 比其他页多出 42px
 * 顶部空隙（其他页顶部留白全部由 hero 自己管），宽度也和全站漂移。
 * 2026-09-20 删除，顶部留白唯一由 .hero 的 26px 决定，与其他页同源。 */
/* The page head itself is defined once in base.css (it is shared with every
   companion page). Only the parts unique to this page live here. */
/* 首页的 hero 不再自带一套间距。
 *
 * 这里原来写着 `.hero{margin:0 0 30px;padding:0 0 30px}` —— 覆盖了
 * base.css 里那个统一的 26/18。结果首页标题距顶 0、其它页距顶 26，
 * 同一个组件在两个地方差 26px 的留白，页面之间切换时会跳。
 *
 * 只保留这一页独有的部分：hero 右侧的信息条（.hero-meta），
 * 以及 flex 的对齐方式。间距交给 base.css。 */
/* 首页的根容器是 .app（不是 .tk-shell），base.css 里
* `.tk-shell .hero:first-child` 那条拿不到 —— 所以这里显式写出规范值。
 * 值就是规范五值（顶 26/底 16/头部底距 20），真源在 base.css
 * 「页面头部规范」；改头部节奏去那里改，这里只是镜像，不是第二真源。
 * 更彻底的做法是把首页也换成 .tk-shell，那是结构改造，另说。 */
/* 2026-09-22 并入全站头部规范：几何（顶 40/底 16/头部底距 32）与
 * `.tk-shell .hero:first-child`（base.css「页面头部规范」）同值同源，
 * 是 hero 宽松套的镜像 —— 首页根容器是 .app 不是 .tk-shell，base.css
 * 那条后代选择器拿不到这里，所以显式写出。真源在 base.css 规范区，
 * 改头部节奏去那里改，这里只是镜像，不是第二真源。曾长期停在旧
 * 统一值 26/20（紧凑套），规范分两形态时漏改了这里 —— 首页比
 * projects/papers 等同形态页矮 14px 顶距、窄 12px 头部底距，实测
 * paddingTop 26 / marginBottom 20 抓到的漂移，2026-09-22 修正。
 * 布局只保留本页语义：导语左、胶囊右。
 * display:flex 是 2026-09-22 才补上的 —— 之前只写 align-items/
 * flex-wrap 而没有 display:flex，全是死属性，胶囊实际是块级堆叠
 * 在导语下方（用户抓到的"太挤"、meta"不是在右边"）。补上后
 * space-between 让胶囊真正贴右、align-items:center 两栏垂直居中，
 * gap 20 保证窄屏不粘连。 */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:40px 0 24px;margin:0 0 32px}
/* 2026-09-22 边界感修复：底部 padding 原 16px，统计条（hero-meta）与下方
 * claim 区之间视觉过于贴近，用户截图反馈"边界感不好看"。提到 24px——
 * 与 claim 卡片新增的水平内边距 20px 同一量级，上下左右呼吸一致。 */
.hero-meta{flex:none;display:flex;gap:26px;white-space:nowrap}
/* 数据条三格：数字是主角（20px 加粗 tabular），标签小灰在旁。
 * 三格口径互斥（篇数 / 领域数 / 来源数），不再出现"篇数"与"全文数"
 * 两个相近数字并列——那会让读者以为内容规模有两个答案。 */
.hero-meta-item{display:flex;align-items:baseline;gap:7px}
.hero-meta-item b{font-size:20px;font-weight:750;color:var(--color-ink);font-variant-numeric:tabular-nums;line-height:1}
.hero-meta-item i{font-style:normal;font-size:var(--text-xs);color:var(--color-muted)}
/* hero 氛围光（Linear 风格）：低透明度径向渐变衬在标题后方，浅深主题
 * 共用 accent 派生色。光斑盒（::before）比 hero 大一圈（inset:-40% -20%），
 * 颜色延伸到标题区外的留白里。四条盒边都不可见面：两个渐变的透明终点
 * 收在盒内（上下靠渐变自身 fade），左右由 mask 椭圆在盒边归零兜底；
 * 不用 overflow:hidden 裁切 —— 裁切线会留下可见的直线边缘。
 * 横向出血由 .main 的 overflow-x:clip 拦截，不产生滚动条；旧内核不支持
 * clip 时由 html 级 hidden（@supports not (overflow: clip) 分支）接住。
 * 光斑盒向下仍超出 hero 盒（340px 高于 hero 本身），hero.scrollHeight 大于
 * clientHeight，模板上的 data-crop 依此声明"有意出血"，layout_audit 跳过。 */
/* overflow-x:clip 需要 Chromium 90+。旧内核把 .main 的 clip 整行丢弃后，
 * 光斑的横向出血（left:-20%）会把整页撑出横向滚动。兜底声明在 html 上：
 * 视口的横向滚动由根元素 overflow 决定，html 级 hidden 照样裁掉出血，
 * .main 与 body 保持 visible，topbar 的 position:sticky 不受影响。 */
@supports not (overflow: clip) {
  html { overflow-x: hidden; }
}
.hero--display{position:relative}
.hero--display::before{content:"";position:absolute;top:-40%;right:-20%;bottom:auto;left:-20%;height:340px;pointer-events:none;
  background:
    radial-gradient(50% 48% at 22% 40%,var(--color-accent-soft),transparent 70%),
    radial-gradient(44% 36% at 80% 26%,var(--color-accent-soft),transparent 72%);
  /* 上面两行用 accent-soft 实色兜底；支持 color-mix 的浏览器用下面更淡
     的 13%/10% 版本，光斑更收敛。 */
  @supports (background: color-mix(in srgb, red 10%, blue)) {
    background:
      radial-gradient(50% 48% at 22% 40%,color-mix(in srgb,var(--color-accent) 13%,transparent),transparent 70%),
      radial-gradient(44% 36% at 80% 26%,color-mix(in srgb,var(--color-info,#4a7a9d) 10%,transparent),transparent 72%);
  }
  -webkit-mask-image:radial-gradient(64% 200% at 50% 50%,#000 46%,transparent 75%);
  mask-image:radial-gradient(64% 200% at 50% 50%,#000 46%,transparent 75%)}
/* 文本层级高于光斑层，导航 z-index 不受影响（光斑 z:auto 贴底层）。 */
.hero--display>div{position:relative;z-index:1}

.section{margin-top:34px}.section h2{font-size:var(--text-xl)}.section>p{margin-bottom:17px}

.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.work-card{background:var(--color-panel);border:1px solid var(--color-line);border-radius:7px;padding:20px;min-height:264px;box-shadow:0 1px 2px rgba(20,42,35,.02)}
.work-card.primary{border-top:3px solid var(--color-accent)}.work-card.research{border-top-color:var(--color-info)}
.work-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:13px}
.work-head h3{font-size:var(--text-lg);line-height:1.35;margin:0 0 4px}.work-head p{font-size:var(--text-sm);color:var(--color-muted);margin:0}
.status{flex:none;padding:3px 7px;border-radius:4px;background:var(--color-accent-soft);color:var(--color-accent);font-size:var(--text-xs);font-weight:750}
.status.ok{background:var(--color-ok-soft);color:var(--color-ok-ink)}
.status.warn{background:var(--color-warn-soft);color:var(--color-warn)}
.status.unknown{background:var(--color-surface);color:var(--color-muted);border:1px solid var(--color-line)}.status.login{background:var(--color-info-soft);color:var(--color-info-ink)}.status.design{background:var(--color-warm-soft);color:var(--color-warm)}.status.local{background:var(--color-violet-soft);color:var(--color-violet)}
.io-grid{display:grid;gap:7px;margin:14px 0}.io-row{display:grid;grid-template-columns:minmax(46px,auto) minmax(0,1fr);gap:9px;padding-top:7px;border-top:1px solid var(--color-line);font-size:var(--text-sm)}.io-row b{color:var(--color-ink);white-space:nowrap}.io-row b{color:var(--color-ink)}.io-row span{color:var(--color-ink-soft)}
.work-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.work-actions a{display:inline-block;padding:6px 9px;border:1px solid var(--color-line);border-radius:5px;background:var(--color-panel);color:var(--color-accent);font-size:var(--text-sm);font-weight:700}.work-actions a:first-child{background:var(--color-accent-soft);border-color:var(--color-accent-line)}.work-actions a:hover{border-color:var(--color-accent)}
/* 2026-09-22：.work-actions 里按钮的箭头原先写在 i18n key 内
 * （`"打开元文档 →": {en:"Open the meta docs →"}`），问题与 .atlas-open 相同：
 * 箭头进了 key，英文要手工再写一遍 →，CSS 管不到字号、间距和 hover。
 * 差异：.atlas-open 是裸文字链接，这里的 a 是带边框的胶囊按钮，
 * 内部已有 6px 9px 的 padding —— 间距用 --space-1(4px) 而非 --space-2(8px)，
 * 否则按钮被箭头撑宽，一排按钮的节奏会散。
 * 类名 .wa-open（work-actions open）供这一排按钮共用，逐个收编。 */
.wa-open::after{
  content:'\2192';margin-left:var(--space-1);font-size:var(--text-xs);
  opacity:.8;display:inline-block;transition:transform var(--duration-fast) var(--ease-out);
}
.wa-open:hover::after{transform:translateX(3px)}
/* 工具卡片的事实徽标：星数、开源许可、部署状态、凭据要求。
   这些是"能不能直接开始用"的判断依据，所以要一眼可见、可核对。
   2026-09-22 静音为文字流：与 projects/index.html 的 .facts 同一套 ——

   JSON body，直接 throw 会显示成 [object Object]。 */
async function postJson(url,payload){
  const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});

 * "谁写的"，名字比标题更快建立可信度。
 *
 * 没有 key / 配额用完 / 网络不通时不显示这一块。唯一例外是"没配 key"：
 * 那是读者自己能解决一次的状态，给一行说明（见下面 unconfigured 分支）。
 */
async function featureDigest(id) {
  try {
    const r = await fetch('/api/digest/feature', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: id || '' }),
    });
    if (!r.ok) return;
    digestCache.featured = id || null;
    renderDigest(digestCache.items, digestCache.status);
  } catch (err) {
  }
}
function renderDigest(items, status) {
  const box = $('#home-digest');
  if (!box) return;
  /* 站长钉选头条：featuredId 命中条目时上特写位；operator = 持运营者
     cookie（meta 由服务端盖章），只有运营者能看到钉选/取消按钮。 */
  const opMeta = document.querySelector('meta[name="tk-operator"]');
  const operator = opMeta && opMeta.getAttribute('content') === '1';
  const featuredId = digestCache ? digestCache.featured : null;
  if (!items || !items.length) {
    if (status === "unconfigured") {
      box.hidden = false;
      box.innerHTML = `<div class="digest-head">
        <h2>近七天优质好文</h2>
        <span class="digest-note">配好 BestBlogs 的 API Key 后，这里会列出它最近七天的早报</span>
        <a class="digest-chip digest-chip--out" href="https://www.bestblogs.dev/reading/brief" target="_blank" rel="noopener noreferrer">先去 BestBlogs 看看<i aria-hidden="true">↗</i></a>
      </div>
      <p class="digest-setup">
        去 bestblogs.dev 的「设置 → API Key」生成一个，存到
        <code>~/.config/technical-knowledge/bestblogs.key</code>，
        或设成环境变量 <code>BESTBLOGS_API_KEY</code>，刷新即可。
      </p>`;
      return;
    }
    box.innerHTML = '';
    box.hidden = true;
    return;
  }
  box.hidden = false;
  /* 按评分排序：说明里写着"评分排序"，但接口给的是按天交错的顺序 ——
   * 实测第一天 88 分排第一，93 分的最高分排在第 10 位。名实不符。
   * 同分的按发布时间新的在前：22 篇里 90 分就有 10 篇，分数只能分出
   * 大档位，日期是唯一稳定的次级排序。
   *
   * 七天窗口里只展示评分前 20：窗口加宽后条目变多，全铺会让"最近最值得读"
   * 被稀释——Top 20 是这页的定位。 */
  const sorted = [...items].sort((a, b) =>
    (b.score || 0) - (a.score || 0) || (b.published_ts || 0) - (a.published_ts || 0)
  ).slice(0, 20);
  /* 收藏置顶：收藏的文章排在整个横滑区最前面，渲染用的是收藏时的
   * 快照——滑出七天窗口也完整可见。收藏区内部按评分降序（与 Top 20
   * 同一条规则），同分的收藏时间新的在前。 */
  const favEntries = [...TKShell.favorites.map.values()]
    .sort((a, b) =>
      (b.item.score || 0) - (a.item.score || 0) || (b.favorited_at || 0) - (a.favorited_at || 0));
  /* 去重按 URL 不按 id：历史收藏数据的 id 有 RAW_ / u: 两种形式，
   * 按 id 比对永远匹配不上，已收藏的文章会在 Top 20 里重复出现。 */
  const favUrls = new Set(favEntries.map((e) => String((e.item || {}).url || "")));
  const rail = [
    ...favEntries.map((entry) => ({ ...entry.item, __fav: true, __fid: entry.id })),
    ...sorted.filter((item) => !favUrls.has(String(item.url || "")))
      .map((item) => ({ ...item, __fav: false, __fid: TKShell.favorites.favId(item) })),
  ];
  /* 杂志布局：第一篇做 hero 特写，其余做紧凑行。rail 默认按评分降序；
   * 站长钉选（featuredId）命中时该篇优先上特写位、从列表剔除——
   * 掉出七天窗口或未钉选则回退评分自动。 */
  let heroIdx = 0, manualHero = false;
  if (featuredId) {
    /* 钉选键是 url：服务端 featured.json 以 url 为键，条目的 id 有 RAW_ / u:
     * 两种形式不稳定，不能当主键。只比 id 会让钉选永远不上特写位（实测）。
     * 仍兼容旧数据里存 id 的情况。 */
    const fi = rail.findIndex((i) => i.url === featuredId || i.id === featuredId);
    if (fi >= 0) { heroIdx = fi; manualHero = true; }
  }
  const heroItem = rail[heroIdx];
  const restItems = rail.filter((_, i) => i !== heroIdx);
  const heroFacts = [];
  if (heroItem.word_count) heroFacts.push(window.TKI18N&&window.TKI18N.lang==='en'?`${heroItem.word_count.toLocaleString()} words`:`${heroItem.word_count.toLocaleString()} 字`);
  if (heroItem.read_minutes) heroFacts.push(window.TKI18N&&window.TKI18N.lang==='en'?`about ${heroItem.read_minutes} min`:`约 ${heroItem.read_minutes} 分钟`);
  if (heroItem.published_full) heroFacts.push(heroItem.published_full);
  TKShell.favorites.register(heroItem.__fid, heroItem);
  const hero = `<a class="digest-hero" href="${esc(heroItem.url)}" target="_blank" rel="noopener noreferrer">
      ${heroItem.cover
        ? `<span class="digest-hero-cover">
            <img src="${esc(heroItem.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">
            <i class="digest-hero-badge">${manualHero ? TKICON.pin+'站长推荐' : ((heroItem.score ? ((window.TKI18N&&window.TKI18N.lang==='en')?'Top · ':'Top · ') : '') + esc(heroItem.score || ''))}</i>
          </span>`
        /* 无封面兜底（2026-09-22 补）：原先这里输出空串，BestBlogs 不少条目
         * 没有 cover，结果"本周最高分特写"反而是整块里唯一的纯文字格，
         * 右侧每条紧凑行都还有 56px 缩略图，视觉上最该突出的那篇最不显眼。
         * 用评分数字顶上，与紧凑行无图时的首字母块同思路。 */
        : `<span class="digest-hero-cover digest-hero-cover--score" aria-hidden="true">
            <i>${esc(heroItem.score || '—')}</i>
            <em>${(window.TKI18N&&window.TKI18N.lang==='en')?'Top score':'本周最高分'}</em>
          </span>`}
      <b class="digest-hero-title">${esc(heroItem.title)}</b>
      ${heroItem.summary ? `<p class="digest-hero-sum" data-clamp="2">${esc(heroItem.summary)}</p>` : ''}
      <span class="digest-hero-meta">
        ${heroItem.source_icon && heroItem.source_icon !== heroItem.cover
          ? `<img class="digest-icon" src="${esc(heroItem.source_icon)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fallback>`
          : ''}
        ${heroItem.source ? `<span class="digest-source">${esc(heroItem.source)}</span>` : ''}
        ${heroFacts.length ? `<span class="digest-facts">${esc(heroFacts.join(' · '))}</span>` : ''}
        <button type="button" class="tk-fav-btn${heroItem.__fav ? ' is-fav' : ''}" data-fav-id="${esc(heroItem.__fid)}" aria-label="${heroItem.__fav ? '取消收藏' : '收藏'}" title="${heroItem.__fav ? '取消收藏' : '收藏'}">${heroItem.__fav ? TKICON.starOn : TKICON.star}</button>
        ${operator ? `<button type="button" class="digest-feature-btn" data-feature="${manualHero ? '' : esc(heroItem.url || '')}" title="${manualHero ? '恢复评分自动' : '钉选为头条'}">${manualHero ? TKICON.close+'自动' : TKICON.pin+'头条'}</button>` : ''}
      </span>
    </a>`;
  const listRows = restItems.map((item) => {
    /* 紧凑行不再显示时间/字数：大图上已有完整的字数与阅读时长，这行的
     * facts 只会把来源名和行尾两个按钮挤出可视区（实测：加常驻钉选钮后
     * 溢出约 15px，被 overflow:hidden 裁掉半截按钮）。让位给按钮与来源名。 */
    TKShell.favorites.register(item.__fid, item);
    return `<a class="digest-item" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">
      ${item.cover
        ? `<span class="digest-thumb"><img src="${esc(item.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>`
        : `<span class="digest-thumb digest-thumb--text" aria-hidden="true">${esc((item.source || item.title).trim().charAt(0))}</span>`}
      <span class="digest-item-text">
        <b class="digest-item-title" data-clamp="2">${esc(item.title)}</b>
        <span class="digest-item-meta">
          ${item.score ? `<i class="digest-score-inline">${esc(item.score)}</i>` : ''}
          ${item.source ? `<span class="digest-source">${esc(item.source)}</span>` : ''}
          <button type="button" class="tk-fav-btn${item.__fav ? ' is-fav' : ''}" data-fav-id="${esc(item.__fid)}" aria-label="${item.__fav ? '取消收藏' : '收藏'}" title="${item.__fav ? '取消收藏' : '收藏'}">${item.__fav ? TKICON.starOn : TKICON.star}</button>
          ${operator && item.url !== featuredId ? `<button type="button" class="digest-feature-btn" data-feature="${esc(item.url || '')}" title="设为头条">${TKICON.pin}</button>` : ''}
        </span>
      </span>
    </a>`;
  }).join('');
  // 说明里给出真实的条数。
  const favCount = favEntries.length;
  const facts = favCount
    ? (window.TKI18N&&window.TKI18N.lang==='en' ? `${favCount} favorites pinned · Top 20 of the week` : `收藏 ${favCount} 篇常驻 · 七天 Top 20`)
    : (window.TKI18N&&window.TKI18N.lang==='en' ? 'Top 20 this week · tap the star to pin a favorite up front' : '七天 Top 20 · 点星标收藏，好文章常驻最前');
  /* 2026-09-22 滚动保持修复（勿删）：收藏星标点「确认取消」后会触发本函数
   * 整块 innerHTML 重渲，实测两个问题：①列表展开状态被模板里硬编码的
   * is-collapsed 重置（用户展开的 22 篇塌回 8 篇）；②浏览器滚动锚定失效，
   * 视口跳回页面顶部。修复方式：重渲前记两样东西——
   *   collapsedNow：当前列表是否折叠（保留用户的展开选择）；
   *   anchor：视口中心最近的一条文章卡（按 URL 匹配，重排后位置可能变化）。
   * 重渲后按锚点把同一篇文章滚回视口中心，展开状态原样恢复。 */
  const prevList = box.querySelector(".digest-list");
  const collapsedNow = prevList ? prevList.classList.contains("is-collapsed") : true;
  const prevItems = prevList ? [...prevList.querySelectorAll(".digest-item")] : [];
  let anchorUrl = null, anchorOffset = 0;
  if (prevItems.length) {
    /* getBoundingClientRect 返回的是视口坐标系（0..innerHeight），
     * 过滤与距离全部用视口坐标——不要与 scrollY 文档坐标混用。 */
    const viewH = window.innerHeight;
    let best = null, bestDist = Infinity;
    prevItems.forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > viewH) return; // 视口外的卡不参与锚定
      const dist = Math.abs((r.top + r.bottom) / 2 - viewH / 2);
      if (dist < bestDist) { bestDist = dist; best = el; }
    });
    /* 视口内没有列表卡（用户在页面其他区块）时不动：锚定恢复只该在
     * “正在看列表”时介入，别把页面其他地方的滚动劫持回早报区。 */
    if (best) {
      anchorUrl = best.getAttribute("href") || null;
      anchorOffset = best.getBoundingClientRect().top; // 相对视口的偏移
    }
  }
  box.innerHTML = `<div class="digest-head">
      <h2>近七天优质好文</h2>
      <span class="digest-note">${(status === "stale" ? (window.TKI18N&&window.TKI18N.lang==='en' ? "Digest update failed, showing the last successful fetch · " : "早报暂时更新失败，以下为最近一次成功抓取的存量 · ") : "") + (window.TKI18N&&window.TKI18N.lang==='en' ? "BestBlogs human-reviewed · ranked by score · " : "BestBlogs 人工精审 · 评分排序 · ") + esc(facts)}</span>
      <a class="digest-chip" href="/sources">全部来源</a>
      <button type="button" class="digest-chip digest-chip--refresh" id="digest-refresh">${(window.TKI18N&&window.TKI18N.lang==='en')?'Refresh':'更新'}<i aria-hidden="true">↻</i></button>
<a class="digest-chip digest-chip--out" href="https://www.bestblogs.dev/reading/brief" target="_blank" rel="noopener noreferrer">BestBlogs 今日早报<i aria-hidden="true">↗</i></a>
    </div>
    <div class="digest-grid">
      ${hero}
      <div class="digest-list is-collapsed">
        ${listRows}
        <button type="button" class="digest-more" aria-expanded="false"><span>${(window.TKI18N&&window.TKI18N.lang==='en')?`Show all ${restItems.length}`:`展开全部 ${restItems.length} 篇`}</span><span>${(window.TKI18N&&window.TKI18N.lang==='en')?'Collapse':'收起'}</span><i aria-hidden="true">▾</i></button>
      </div>
    </div>`;
  /* 站长钉选头条：写 /api/digest/feature（运营者会话），成功后本地
     更新 featured 并整块重渲。失败静默保持原状。
     绑定必须在 innerHTML 赋值之后：绑定在旧的 DOM 上，新渲出来的按钮
     就没有 handler，点击会冒泡到外层 <a> 直接打开文章（2026-09-23 实测）。
     preventDefault 阻止 a 的导航，stopPropagation 阻止冒泡。 */
  box.querySelectorAll('.digest-feature-btn').forEach((b) => {
    b.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      featureDigest(b.dataset.feature || '');
    };
  });
  const list = box.querySelector(".digest-list");
  const moreBtn = box.querySelector(".digest-more");
  if (moreBtn && restItems.length <= 8) {
    list.classList.remove("is-collapsed");
    moreBtn.remove();
  } else if (moreBtn) {
    moreBtn.onclick = () => {
      const collapsed = list.classList.toggle("is-collapsed");
      moreBtn.setAttribute("aria-expanded", String(!collapsed));
    };
  }
  /* 2026-09-22 滚动保持修复（勿删）：恢复段——与上方捕获段成对。
   * ① 展开状态：模板默认 is-collapsed，这里按捕获的 collapsedNow 还原；
   * ② 滚动位置：按 URL 找到同一条文章卡，把它放回视口内原来的相对位置。
   *    收藏重排会让文章顺序变化（收藏的跳到最前），按 URL 锚定而不是
   *    记 scrollTop，才能“同一篇文章回到眼前”而不是“同一像素高度”。
   *    anchorOffset 是渲染前卡片顶边距视口顶的像素差，恢复时保持该差值。 */
  if (prevList && list) {
    if (!collapsedNow) {
      list.classList.remove("is-collapsed");
      /* 同步按钮语义状态：模板硬编码 aria-expanded="false"，若不同步，
       * 列表视觉已展开而屏幕阅读器仍报"折叠"（2026-09-22 验证实锤）。
       * moreBtn 在条数 ≤8 时已被 remove，须判空。 */
      if (moreBtn) moreBtn.setAttribute("aria-expanded", "true");
    }
    if (anchorUrl !== null) {
      const target = [...list.querySelectorAll(".digest-item")]
        .find((el) => el.getAttribute("href") === anchorUrl);
      if (target) {
        const delta = target.getBoundingClientRect().top - anchorOffset;
        window.scrollBy({ top: delta, behavior: "instant" });
      }
    }
  }
  /* 星标的点击行为统一由 shell 的收藏模块接管（含取消收藏弹窗）。
     box 元素跨渲染复用，bind 内部有防重复挂载的标记。 */
  TKShell.favorites.bind(box);
  /* 收藏变化后立即重排：新收藏的卡要马上跳到最前面，不用等刷新。 */
  document.addEventListener("tk:fav-changed", () => {
    if (digestCache) renderDigest(digestCache.items, digestCache.status);
  });
  // digest 的标题/按钮是中文直写的静态串，进 DOM 后走一遍词典翻译。
  if(window.TKI18N)window.TKI18N.translateDOM(box);
  // 封面加载失败就收掉那一格（同 sources 页的理由：第三方 CDN）。
  // 15px 的 digest-icon 也是外链图标，裂图时是一个空块，一并收掉。
  box.querySelectorAll(".digest-hero-cover img, .digest-thumb img, .digest-icon[data-fallback]").forEach((img) => {
    img.addEventListener("error", () => {
      const wrapper = img.closest(".digest-hero-cover") || img.closest(".digest-thumb") || img;
      if (wrapper) wrapper.remove();
    }, { once: true });
  });
}

async function loadDigest() {
  /* digestCache 已有数据时只重画不重拉：renderHome 每次重建都走到这里，
     no-store 请求挡不住 JS 层的重复 —— 一次页面停留实测拉了三次 79KB。
     手动刷新按钮自己带 refresh=1 回源，不经过这里。 */
  if (digestCache) { renderDigest(digestCache.items, digestCache.status); return; }
  const box = $('#home-digest');
  if (!box) return;
  try {
    // 取全部（服务端按天交错后最多几十条）。
    //
    // 原来是 12 —— 横滑区只放 12 个位置，导致实际有 22 篇时后面 10 篇
    // 读者永远看不到，而说明里写着"22 篇"。现在把全部取回来，
    // 横滑本来就能划到底。
    const response = await fetch('/api/digest?limit=60', { cache: 'no-store' });
    if (!response.ok) throw new Error('unavailable');
    digestCache = await response.json();
  } catch (err) {
    box.hidden = true;
    return;
  }
  /* 收藏列表单独取：它挂了不该拖垮早报展示，降级成无收藏态。 */
  await TKShell.favorites.load().catch(() => {});
  renderDigest(digestCache.items, digestCache.status);
  /* 手动刷新：强制回源（服务端 force=True 绕过缓存）。
   * 为什么敢给这个按钮：早报端点固定两次 API 调用（briefs/today +
   * batch-meta），点一次就两次，不翻页 —— 与旧版"刷新按钮翻 4 页
   * 烧配额"不是一回事。成功后拿新数据重画；失败弹提示，卡片保持原样
   * （数据是缓存的，不会因为刷新失败而消失）。
   * 按钮防抖：刷新中禁用，防连点。 */
  const refreshBtn = $('#digest-refresh');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', async () => {
      if (refreshBtn.disabled) return;
      refreshBtn.disabled = true;
      const label = refreshBtn.querySelector('i');
      if (label) label.classList.add('is-spinning');
      try {
        const response = await fetch('/api/digest?limit=60&refresh=1', { cache: 'no-store' });
        if (!response.ok) throw new Error('unavailable');
        const fresh = await response.json();
        if (fresh && fresh.items && fresh.items.length) {
          digestCache = fresh;
          /* 收藏快照对齐：刷新回来的新数据里若有已收藏文章（按 URL 匹配），
           * 更新它的评分/摘要/封面——收藏文章不再停留在收藏那一刻的样子，
           * 每次更新都拿到最新字段。 */
          const favs = TKShell.favorites;
          const updatedFavs = (favs && favs.refreshItem ? await favs.refreshItem(fresh.items) : 0) || 0;
          renderDigest(digestCache.items, digestCache.status);
          if (updatedFavs > 0) {
            favs.notice((window.TKI18N&&window.TKI18N.lang==='en') ? `Refreshed · ${updatedFavs} favorite${updatedFavs > 1 ? 's' : ''} updated` : `已更新 · ${updatedFavs} 篇收藏同步了最新内容`,
              (window.TKI18N&&window.TKI18N.lang==='en') ? 'Updated' : '已更新');
          }
        } else {
          TKShell.favorites.notice((window.TKI18N&&window.TKI18N.lang==='en') ? 'No new content for now' : '暂时没有新内容');
        }
      } catch (err) {
        TKShell.favorites.notice((window.TKI18N&&window.TKI18N.lang==='en') ? 'Refresh failed, try later' : '刷新失败，稍后再试');
      } finally {
        refreshBtn.disabled = false;
        if (label) label.classList.remove('is-spinning');
      }
    });
  }
}

/* 右侧那一栏：论文怎么追踪、怎么解析 + 去论文追踪的入口。
 *
 * 它和左边「每一篇都回答这四个问题」是对称的 —— 左边说这个库怎么组织
 * 一篇知识，右边说它怎么筛和读一篇论文。**不该显示某篇论文的结论**：
 *
 *   1. 那是二手结论。读者在这里看到的是一个数字（"在 QuALITY 上提升了
 *      20 个点"），但没有上下文 —— 什么条件测的、代价是什么、谁还
 *      复现过。断章取义的分数比不给更误导。
 *   2. 它不稳定。哪篇被引用得多就显示哪篇，今天 RAPTOR、明天换一个，
 *      读者两次看到的内容没有连续性。
 *   3. 左边讲方法，右边讲某个具体结果，两边不对等。
 *
 * 所以这里放的是**管道自己的判断标准** —— 那五条铁律，以及去两万篇
 * 里的入口。它和左边一样是长期的、可积累的。
 */
/* 首页那一行两块，一左一右：
 *
 *   左边 讲知识文章怎么写   —— 「每一篇都回答这四个问题」
 *   右边 讲论文怎么读       —— 「论文只回答一个问题：它真的做到了吗」
 *
 * 两块对称：都是「方法 + 几个可检查的问题」，左边四条右边三条。
 *
 * 右边**不放具体论文的结论**。之前放的是某篇论文报的数字（"在 QuALITY 上
 * 提升 20 个点"），那是二手结论 —— 没有条件、没有代价、没有复现，读者
 * 拿它当判据会被误导。而且哪篇引用多就显示哪篇，今天这个明天那个。
 * 放方法才稳定，也才和左边对等。
 *
 * 文案要求：说人话。"宁缺毋滥""分级投入""主流程瘦"这类是内部术语，
 * 读者看不懂 —— 改成它实际做的事情。
 */
function homeQuotes(){
  const zh = !(window.TKI18N && window.TKI18N.lang === 'en');
  const t_ = (zhText, enText) => (zh ? zhText : enText);
  // 三条判断，对应 知识库管理/方法/论文怎么追踪怎么解析.md 里的规则，
  // 但用的是读者能懂的说法。
  // 四问和左栏**同一套**，只把对象换成论文。
  //
  // 原来右边是三条内部标准（能不能复现、值不值得深读、单篇失败会不会扩散）——
  // 那是我们做收录时约束自己的规则，读者的疑问不长这样。两边必须是同一个框架，
  // 读者一眼看出左右在讲同一件事：怎么读、读到什么程度算读懂了。
  //
  // 右边每条的说明文字也要和左边对得上，否则同一套框架读起来像两套。
  // 第二问曾写成「方法是什么，关键那一步发生了什么」—— 和左栏只差一个字，
  // 而且"方法是什么"和"关键那一步"说的是同一件事，重复了一遍。论文这一问要
  // 落在"它凭什么成立"上：做法，以及那个让结论站得住的交换。
  /* 论文卡的四问对应解析的真实章节（它解决什么问题/核心机制/对知识库的
   * 启发/边界与风险+复核清单）——与知识卡的四问区分：论文卡多一层
   * 「能吸收什么」和「怎么复核」，少一层设计史。解析没有的维度不承诺。 */
  const rules = [
    [t_('它想解决什么', 'What it solves'),
     t_('声称的问题，与它真正适用的场景', 'The claimed problem, and where it actually applies')],
    [t_('核心机制是什么', 'The core mechanism'),
     t_('能力结构与关键设计', 'Capability structure and the key design moves')],
    [t_('能吸收什么', 'What to absorb'),
     t_('对这个知识库可复用的部分与工程思想', 'Parts this library reuses, and the engineering ideas behind them')],
    [t_('边界与怎么复核', 'Bounds and verification'),
     t_('风险在哪，复核清单逐条查什么', 'Where the risks sit, and what the review checklist checks')],
  ];
  const list = rules.map(([name, note]) =>
    /* 占位符与左栏统一为 ——（2026-09-22）：两栏是同一套框架的两种应用
     * （注释见 homeQuotes 上方），但左栏写 ——、右栏写 : ，并排时分隔符
     * 一个粗一个细，看起来像两块各自做的东西。两栏共用 .claim-list i
     * 同一条样式（渲染成细线），字符一致才保证宽度和基线完全对齐。
     * 词典里没有 ":" 这个 key，改动不影响 i18n。 */
    `<li><b>${esc(name)}</b><i>——</i><span>${esc(note)}</span></li>`).join('');
  // 标题说的是读者在这张卡上的动作：先扫解析，值得的才点进原文——
  // 论文卡的独特价值是筛选，不是复述"这篇讲了什么"。
  // 以前写过「论文读的是思路，不是分数」—— 那是讨论时的一句立场，摆在首页上
  // 读者只会困惑"谁在跟谁争"，而且是「不是 A，是 B」的对偶句，读起来像辩解。
  const lead = t_('先扫解析，再决定读不读原文',
                  'Skim the analysis, then pick what deserves the full paper');
  // 导语压到一行，且和左栏一样是"读者拿到什么"的口吻：读解析能判断
  // 这篇讲的什么、代价多大，再决定要不要读原文。
  return `<p class="claim-eyebrow">${esc(t_('论文', 'Papers'))}</p>
    <p class="claim-lead claim-lead--right">${esc(lead)}</p>
    <p class="claim-sub">${esc(t_("收录的是最新研究，每篇都按同一套问题拆开：讲什么、代价在哪、能不能信。", "Recent research, each broken down along the same questions: what it claims, what it costs, whether to trust it"))}</p>
    <ul class="claim-list claim-list--tight">${list}</ul>`;
}

/* 篇数和来源数不写在文案里，由这里按实际笔记算。
 *
 * 写死数字的代价是每加一篇就要回来改一处 —— 之前首页那句「186 篇工程笔记」
 * 就是这么来的，文案和内容不同步时读者看到的是错的事实。
 * 算出来的数字不会过时：加一篇就是 187。
 *
 * 「知识」不是「笔记」。这个库装的不是随手记的碎片，是整篇成稿、有来源支撑的
 * 工程知识，站内其他地方（导航、学习中心、图谱）也都叫它知识。
 */
/* 首页三个统计的口径。
 *
 * 曾经同屏出现三个不同的分母：导语说「384 篇工程知识」（把 34 篇"知识库
 * 管理"元文档和 1 篇"总览"也算成了工程知识），旁边的统计条又说「394 篇
 * 全文」（含 10 篇 Clippings）。读者只看到两句话里的数字对不上，无从判断
 * 哪个是内容规模。
 *
 * 现在按语义分三层，每层只有一个分母：
 *   engineeringCount  工程知识本体 —— 排除 Clippings（剪藏）、总览（导航页）
 *                     和知识库管理（讲怎么维护本站的元文档，不是工程知识）
 *   noteCount         库里全部笔记，含上面排除掉的三类
 *   domainCount       领域数，与首页「知识领域」卡片区一致
 *
 * 实测（2026-09-22）：349 / 394 / 7。且这 349 篇全部在图谱内
 * （exclude_from_graph 为真的 34 篇正是知识库管理），所以"图谱覆盖"不再
 * 单独列一项 —— 它和工程知识总数是同一个数，并列展示等于重复。 */
const NON_ENGINEERING = new Set(["Clippings", "总览", "知识库管理"]);
function engineeringCount(){return state.notes.filter(n=>!NON_ENGINEERING.has(n.category)).length}
function noteCount(){return state.notes.length}
function domainCount(){return new Set(state.notes.filter(n=>!NON_ENGINEERING.has(n.category)).map(n=>n.category)).size}
/* 保留旧名：ingraphCount 曾经是"排除 Clippings + 总览 + exclude_from_graph"，
 * 绕一圈算出来的就是工程知识数。口径统一后它就是 engineeringCount。 */
function ingraphCount(){return engineeringCount()}
/* 来源数与 hero 里另外两个数同口径。
 *
 * 原来它统计 state.notes 全量（含元文档与剪藏），而同一行的
 * 「篇工程知识」「个领域」都是 engineeringCount 口径（排除元文档与剪藏）。
 * 三个数并排，两个说工程知识、一个说全库，读者会以为 349 篇对应 1090 条来源，
 * 实际工程知识只有 968 条 —— 差的 122 条来自元文档和剪藏。
 *
 * 复用 NON_ENGINEERING，不在这里另写一份排除名单（单一来源）。 */
function sourceCount(){return state.notes.filter(n=>!NON_ENGINEERING.has(n.category)).reduce((n,x)=>n+((x.sources||[]).length),0)}
/* 首页 hero 那句导语的措辞。
 *
 * 以前是「工程知识，覆盖 AI 系统、后端、数据、系统性能与软件构建」—— 一句领域
 * 清单。读者从这句话里拿不到用来判断"要不要往下看"的信息：覆盖了哪些领域是
 * 我们要交代的，不是他要知道的。
 *
 * 他现在想知道的是：这些内容是什么形态、读完能做什么。所以按三层写 ——
 * 有多少 → 每条讲什么 → 能得出什么判断。数字按当前内容算，不写死。
 */
function heroLede(zh){
  const n=engineeringCount(), d=domainCount();
  return zh
    ?{text:`${n} 篇工程知识，覆盖 ${d} 个领域，每条讲清一个机制怎么运作、代价在哪。`,lead:'写给在真实系统里做决定的工程师'}
    :{text:`${n} engineering notes across ${d} domains, each spelling out how a mechanism works and what it costs.`,lead:'For engineers making decisions in real systems'};
}
/* 【反复迭代后结果·rt13】知识领域卡片区排除「知识库管理」。
 * 依据：lede 的 domainCount() 口径排除它（6 个领域），但卡片区此前只排了
 * 总览和 Clippings，同屏渲染 7 张卡——读者数卡片得 7，文案说 6，数字打架。
 * 排除后卡片 6 张、文案 6 个，口径一致。可达性保底：卡片区下方
 * 「辅助理解」区新增「知识库管理」卡（元文档入口从领域区迁到那里），
 * 侧栏搜索仍可命中全部 34 篇元文档。多个 AI 并行优化期间由本注释锁定此决策。 */
function renderHome(){const domains=ordered(new Set(state.notes.map(n=>n.category))).filter(d=>d!=='总览'&&d!=='Clippings'&&d!=='知识库管理');const zhHome=!(window.TKI18N&&window.TKI18N.lang==='en');const t_=(zhText,enText)=>(zhHome?zhText:enText);const lede=heroLede(zhHome);const descriptions={'AI 系统工程：从模型能力到生产能力':'模型、训练、上下文、RAG、Agent、推理服务、平台、安全与评测','后端系统：在并发、失败与变化中维持服务':'请求、并发、消息、复制、一致性、故障恢复和基础设施','缺陷分析：从个案到体系':'从真实上游缺陷学判断、复现、合入与回归，每条案例都有上游 commit 可查','数据系统：在并发与故障中保存事实':'建模、SQL、事务、索引、CDC、流处理、治理和恢复','性能工程：从用户等待到资源瓶颈':'进程、CPU、GPU、内存、I/O、网络、观测和容量','软件构建：让变化可以理解、验证与交付':'架构、语言运行时、依赖、测试、CI/CD、发布和调试','知识库管理':'怎么写、怎么判断完善度、缺口怎么补、论文怎么追踪、来源怎么更新'};$('#home').innerHTML=`<section class="hero hero--display" data-crop><div><h1>把技术原理读到能上手用</h1><p class="hero-lede"><span>${esc(lede.text)}</span><span class="hero-lede-lead">${esc(lede.lead)}</span></p></div><div class="hero-meta"><span class="hero-meta-item"><b>${engineeringCount().toLocaleString()}</b><i>${esc(t_('篇工程知识','notes'))}</i></span><span class="hero-meta-item"><b>${domainCount().toLocaleString()}</b><i>${esc(t_('个领域','domains'))}</i></span><span class="hero-meta-item"><b>${sourceCount().toLocaleString()}</b><i>${esc(t_('条来源','sources'))}</i></span></div></section><section class="claim-row"><section class="claim"><p class="claim-eyebrow">${esc(t_('知识','Notes'))}</p><p class="claim-lead">${esc(t_('四个问题，读到能自己下判断','Four questions, until you can judge for yourself'))}</p><p class="claim-sub">${esc(t_('每篇都按这套结构写——读的时候知道自己在哪一步，读完知道证据够不够','Every note follows this structure — you always know which question you are on, and whether the evidence is enough'))}</p><ul class="claim-list"><li><b>${esc(t_('它为什么出现','Why it exists'))}</b><i>——</i><span>${esc(t_('之前卡在哪，没它的时候怎么办','What was stuck before'))}</span></li><li><b>${esc(t_('它怎么运作','How it works'))}</b><i>——</i><span>${esc(t_('机制是什么，关键那一步发生了什么','The mechanism, and its key step'))}</span></li><li><b>${esc(t_('思路怎么来的','Where the idea comes from'))}</b><i>——</i><span>${esc(t_('为什么这样设计，换了什么假设', function bindSourceToggle(){
  /* 两类折叠按钮共用一个绑定：来源串的 .source-toggle（.source-more）
     和论据卡的 .cite-toggle（.cite-list 与 .cite-more）。 */
  document.querySelectorAll('.source-toggle').forEach(btn=>{
    const isCite=btn.classList.contains('cite-toggle');
    const more=btn.closest('.source-line')?.querySelector('.source-more');
    const citeList=btn.closest('.cite-block')?.querySelector('.cite-list');
    const citeMore=btn.closest('.cite-block')?.querySelector('.cite-more');
    btn.onclick=()=>{
      const open=btn.getAttribute('aria-expanded')==='true';
      btn.setAttribute('aria-expanded',String(!open));
      if(isCite){
        if(citeList)citeList.hidden=open;
        if(citeMore)citeMore.hidden=open;
        btn.textContent=open?('('+ (citeList?citeList.querySelectorAll('li').length:0) +')'):TKShell.tr('收起');
      }else{
        if(more)more.hidden=open;
        const n=more?more.querySelectorAll('a').length:0;
        btn.textContent=open
          ?(window.TKI18N&&window.TKI18N.lang==='en'?('+ '+n+' more'):('还有 '+n+' 个'))
          :(window.TKI18N&&window.TKI18N.lang==='en'?'Show fewer':'收起');
      }
    };
  });
}

/* 来源常有十几个，全铺开会把标题和正文之间的呼吸挤掉。
   默认只显示前几条，其余收起来并给出条数。 */
/* 来源分两类显示。
 *
 * 论文和普通链接不是一回事：一篇 arXiv 论文有标题、作者、年份，而且这个知识
 * 页的结论可能就建立在它上面。以前它和"某篇博客"一样被折成一行小链接，读者
 * 看到一个裸编号，看不出这篇东西是什么、有多重。
 *
 * 所以论文单独成块，带标题和作者年份，并可跳到论文页看它支撑的其他结论；
 * 其余来源保持原来的紧凑链接串 —— 那些确实只是链接，铺开反而占地方。
 */
function renderPapers(papers){
  if(!papers || !papers.length)return'';
  /* 这个文件里 tr 是**按函数局部定义**的（见 renderAtlas / renderNetwork 等），
     没有全局的那一个。少了这一行，renderPapers 一被调用就抛
     ReferenceError，而它包在 reader 的渲染里，表现是"这篇笔记暂时无法打开"
     —— 整个知识库的每一篇都打不开，看起来像后端坏了，其实是这里少了一行。 */
  const tr=TKShell.tr; // 全站共享（shell.js），不再各函数局部定义
  const items=papers.map(p=>{
    const authors=(p.authors||[]);
    const shown=authors.slice(0,2).join(', ')+(authors.length>2?(' '+tr('等')):'');
    const year=(p.published||'').slice(0,4);
    const meta=[shown,year].filter(Boolean).join(' · ');
    const title=p.title||p.id;
    return '<li><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(title)+'</a>'
      +'<span class="cite-meta">'+esc(meta)+'<span class="cite-id">arXiv:'+esc(p.id)+'</span></span></li>';
  }).join('');
  /* 论据卡全展开会占 134–270px，把正文压到 424px 以下（2026-09-23 全量审计，
     60 篇 BODY_TOP 违规）。默认折叠为与「来源」同一形式的单行按钮，
     点开才显示论文卡与跳转入口。 */
  return '<div class="cite-block cite-collapsed"><b>'+esc(tr('论据'))+' <button type="button" class="source-toggle cite-toggle" aria-expanded="false">('+papers.length+')</button></b>'
    +'<ul class="cite-list" hidden>'+items+'</ul>'
    +'<a class="cite-more" hidden href="/papers">'+esc(tr('看这些论文还支撑了什么'))+' →</a></div>';
}

function renderSources(sources,papers){
  // 同 renderPapers：这个文件里 tr 是按函数局部定义的，没有全局那一个。
  const tr=TKShell.tr; // 全站共享（shell.js），不再各函数局部定义
  const block=renderPapers(papers);
  if(!sources || !sources.length)return block;
  /* 论文已经从 sources 里单独取出来了，这里跳过它们的裸链接，
     否则同一篇论文会在页面上出现两次。 */
  const paperUrls=new Set((papers||[]).map(p=>p.url));
  const seen=new Set(),visible=[];
  for(const source of sources){
    const value=String(source);
    if(paperUrls.has(value))continue;
    const key=/^https?:\/\//.test(value)?sourceLabel(value):value;
    if(seen.has(key))continue;seen.add(key);visible.push(value);
  }
  if(!visible.length)return block;
  const link=x=>{
    if(/^https?:\/\//.test(x))return '<a href="'+esc(x)+'" title="'+esc(x)+'" target="_blank" rel="noreferrer">'+esc(sourceLabel(x))+'</a>';
    if(x.startsWith('[[')){
      const t=x.slice(2,-2).split('|')[0];
      /* 【rt30·修】显示名改按 path 查 state.notes 的正名（frontmatter title）。
       * 病根：全库 90 篇文件名与 title 不一致（多数空格差、少数改名如
       * 「学习与复习方法.md」→ title「学习与迭代方法」）。旧取法
       * t.split('/').pop() 拿的是文件名，两态都会显示旧名：
       * 中文态与目录列表不一致，EN 态因旧名不在 i18n 词典而漏译
       * （「一篇知识怎么写」的来源面板实测残留中文）。正名已全量入
       * 词典（标题批 1-7），按 path 解析即同时修好两态。链接 href 仍用
       * 原路径（服务器按路径找文件），只改显示文本。wikilink 不带 .md
       * 后缀而 API path 带，两种形态都试；查不到才回退旧取法，保持容错。 */
      const canonical=(state.notes.find(n=>n.path===t||n.path===t+'.md')||{}).title||t.split('/').pop();
      /* 模板笔记的 title 带 Templater 占位符（{{date:YYYY-MM-DD}}），
         这是机器文本，读者看到只会困惑。截到 {{ 处显示人读名。 */
      const cleaned=canonical.split('{{')[0].trim()||canonical;
      return '<a href="/?path='+encodeURIComponent(t)+'">'+esc(tr(cleaned))+'</a>';
    }
    return esc(x);
  };
  const sep='<span class="source-sep">·</span>';
  const shown=visible.slice(0,4),rest=visible.slice(4);
  const more=rest.length?('<span class="source-more" hidden>'+sep+rest.map(link).join(sep)+'</span><button type="button" class="source-toggle" aria-expanded="false">还有 '+rest.length+' 个</button>'):'';
  return block+'<span class="source-line"><b>'+esc(tr('来源'))+'</b> <span class="source-list">'+shown.map(link).join(sep)+'</span>'+more+'</span>';
}
