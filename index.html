<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent 开发知识体系</title>
<style>
:root{--bg:#f8f9fb;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--dim:#9ca3af;--blue:#2563eb;--blue-bg:#eff6ff;--purple:#7c3aed;--purple-bg:#f5f3ff;--green:#059669;--green-bg:#ecfdf5;--amber:#d97706;--amber-bg:#fffbeb;--red:#dc2626;--red-bg:#fef2f2;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.82;font-size:16px}
button{font:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:276px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.sidebar-title{padding:18px 20px 14px;border-bottom:1px solid var(--border);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-toggle{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:5px 10px;font-size:13px;line-height:1.4;cursor:pointer}
.nav-tree{padding:8px 0}
.nav-group{margin-bottom:2px}
.nav-group-label{display:flex;align-items:center;gap:7px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--text);user-select:none}
.nav-group-label:hover{background:var(--bg)}
.nav-group-label .arrow{font-size:11px;color:var(--dim);transition:transform .2s;width:13px}
.nav-group-label .arrow.open{transform:rotate(90deg)}
.nav-children{display:none}
.nav-children.show{display:block}
.nav-item{padding:7px 16px 7px 38px;font-size:14px;line-height:1.55;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg);font-weight:600}

/* Main */
.main{flex:1;min-width:0}
.top-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:20}
.top-tab{padding:16px 26px;font-size:16px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.top-tab:hover{color:var(--text)}
.top-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Q&A Banner */
.qa-banner{background:var(--surface);border-bottom:1px solid var(--border);padding:24px 32px}
.qa-banner h3{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--amber)}
.qa-item{margin-bottom:11px;font-size:16px;line-height:1.82}
.qa-item .q{font-weight:600;color:var(--text)}
.qa-item .q::before{content:"Q: ";color:var(--blue);font-weight:700}
.qa-item .a{color:var(--muted);margin-left:0}
.qa-item .a::before{content:"A: ";color:var(--green);font-weight:700}
.qa-focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.qa-focus-item{padding:14px 16px;border-top:2px solid var(--blue);background:#f8fbff}.qa-focus-item:nth-child(2){border-top-color:var(--green);background:#f3fbf7}.qa-focus-item:nth-child(3){border-top-color:var(--amber);background:#fffaf0}.qa-focus-item:nth-child(4){border-top-color:var(--purple);background:var(--purple-bg)}.qa-focus-item>b{display:block;font-size:16px;line-height:1.55;margin-bottom:6px}.qa-focus-item span{display:block;font-size:15px;line-height:1.72;color:var(--muted)}.qa-focus-item span b{display:inline;font-size:inherit;line-height:inherit;margin:0;color:var(--text)}

/* Content */
.content{padding:30px 32px;width:100%;max-width:none}
.content.knowledge-view{max-width:1680px}
.content.eval-view{display:block;max-width:1680px}
.content.eval-view .section{margin-bottom:28px}
.section{margin-bottom:40px}
.section-title{font-size:22px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.section-title .icon{font-size:24px}
.section-desc{font-size:16px;color:var(--muted);margin-bottom:22px}
.kp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin-bottom:18px;transition:border-color .15s}
.kp:hover{border-color:var(--blue)}
.kp h4{font-size:18px;font-weight:600;margin-bottom:9px}
.kp .tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kp .tag{font-size:12px;padding:3px 8px;border-radius:4px;background:var(--bg);color:var(--dim)}
.kp .meta{display:flex;gap:7px;flex-wrap:wrap;margin:-2px 0 12px;font-size:12px;color:var(--muted)}.kp .meta span{padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:#fafbfc}.kp .meta .priority{color:var(--blue);font-weight:700}.kp .meta .reviewed{color:var(--green)}
.concept-index{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.concept-index section{border:1px solid var(--border);border-radius:6px;padding:14px 16px;background:var(--surface)}.concept-index h3{font-size:14px;margin:0 0 8px}.concept-index dl{margin:0}.concept-index dt{font-size:12px;font-weight:700;margin-top:8px}.concept-index dt:first-child{margin-top:0}.concept-index dd{margin:2px 0 0;font-size:12px;line-height:1.65;color:var(--muted)}.concept-index a{color:var(--blue);text-decoration:none}.concept-index a:hover{text-decoration:underline}
.kp .body{font-size:17px;line-height:1.88;color:var(--text)}
.kp .body b{color:var(--text);font-weight:700}
.kp .body p{margin-bottom:10px}
.kp .body ul{margin:6px 0 10px 18px}
.kp .body li{margin-bottom:4px}
.step-list{display:grid;gap:9px;margin:14px 0}.step-list .step{display:grid;grid-template-columns:27px minmax(0,1fr);gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--border);border-radius:5px;background:#fafbfc}.step-list .step>span{display:flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700}.step-list .step p{margin:0;line-height:1.75}
.kp pre{overflow-x:auto;max-width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:6px;background:#f7f9fc;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.kp .refs{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.kp .refs a{font-size:13px;color:var(--blue);text-decoration:none;margin-right:14px}
.kp .refs a:hover{text-decoration:underline}

/* Eval dimensions */
.eval-dim{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin-bottom:18px}
.eval-dim h4{font-size:18px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:9px}
.eval-dim h4 .num{color:var(--purple);font-size:16px;font-weight:800;line-height:1.4;flex:none}
.eval-dim .why{font-size:14px;color:var(--amber);margin-bottom:11px;font-style:italic}
.eval-dim .check-list{font-size:17px;color:var(--text);line-height:1.88}
.eval-dim .check-list b{color:var(--text)}
.eval-dim .good-bad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.eval-dim .good{background:var(--green-bg);border-radius:var(--radius);padding:12px 15px;font-size:14px}
.eval-dim .bad{background:var(--red-bg);border-radius:var(--radius);padding:12px 15px;font-size:14px}
.eval-dim .good b{color:var(--green)}
.eval-dim .bad b{color:var(--red)}
.eval-dim .link{font-size:13px;color:var(--blue);margin-top:9px}
.eval-dim .improve{font-size:14px;background:var(--amber-bg);border-radius:var(--radius);padding:10px 13px;margin-top:9px;color:var(--amber)}
.workbench,.system-map,.scenario-matrix,.comparison-board{margin:0 0 30px;padding:26px 28px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.evaluation-contract{border-top:3px solid var(--blue)}.evaluation-contract>p{max-width:980px}.evaluation-scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 0 16px;border:1px solid var(--border);background:var(--surface)}.evaluation-scope>div{padding:16px 18px;border-right:1px solid var(--border)}.evaluation-scope>div:last-child{border-right:0}.evaluation-scope>div>b,.evaluation-scope>div>span{display:block}.evaluation-scope>div>b{margin-bottom:6px;font-size:16px}.evaluation-scope>div>span{font-size:15px;line-height:1.72;color:var(--muted)}.evaluation-path{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 15px;border:1px solid var(--border);background:#f7fafc;font-size:15px;line-height:1.55}.evaluation-path b{padding:3px 7px;background:var(--surface);border:1px solid #cdd9ef}.evaluation-path i{font-style:normal;color:var(--blue);font-weight:700}.evaluation-output{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:16px;border-top:1px solid var(--border);border-left:1px solid var(--border)}.evaluation-output>div{padding:15px 17px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.evaluation-output>div>b,.evaluation-output>div>span{display:block}.evaluation-output>div>b{margin-bottom:5px;font-size:16px}.evaluation-output>div>span{font-size:15px;line-height:1.72;color:var(--muted)}.evaluation-output>div.theory{grid-column:1/-1;background:#f8fbff}.evaluation-output>div.theory>b{color:var(--blue)}
.knowledge-guide{margin-bottom:32px}.knowledge-guide h2{font-size:22px;line-height:1.45;margin-bottom:7px}.knowledge-guide>p{font-size:16px;line-height:1.78;color:var(--muted);margin-bottom:18px}.knowledge-guide-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.knowledge-guide-grid>div{padding:16px 18px;border-right:1px solid var(--border)}.knowledge-guide-grid>div:last-child{border-right:0}.knowledge-guide-grid b{display:block;margin-bottom:6px;font-size:16px}.knowledge-guide-grid span{display:block;color:var(--muted);font-size:15px;line-height:1.72}.knowledge-guide .evidence{margin-bottom:0}
.knowledge-compass{margin:0 0 28px;padding:22px 24px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.compass-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden}.compass-step{padding:15px 16px;border-right:1px solid var(--border);background:#fff}.compass-step:last-child{border-right:0}.compass-step h3{font-size:14px;line-height:1.45;margin-bottom:6px}.compass-step p{font-size:12px;line-height:1.65;color:var(--muted)}.compass-step b{display:block;margin-top:8px;font-size:11px;color:var(--green)}
.kicker{font-size:14px;color:var(--blue);font-weight:700;margin-bottom:6px}.workbench h2,.system-map h2,.scenario-matrix h2,.comparison-board h2{font-size:22px;line-height:1.45;margin-bottom:7px}.workbench>p,.system-map>p,.scenario-matrix>p,.comparison-board>p{font-size:16px;color:var(--muted);margin-bottom:19px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:7px;overflow:hidden}.flow>div{min-height:144px;padding:16px 17px;border-right:1px solid var(--border)}.flow>div:last-child{border:0}.flow b{display:block;font-size:15px;margin-bottom:6px}.flow span,.flow small{display:block;font-size:14px;color:var(--muted);line-height:1.68}.flow small{color:var(--green);font-weight:700;margin-top:8px}
.question-grid,.scenario-grid,.diagnostic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:17px}.question-grid>div,.scenario-grid>article,.diagnostic-grid>div{padding:16px;border:1px solid var(--border);background:#fff}.question-grid b,.scenario-grid h3,.diagnostic-grid h3{display:block;font-size:15px;margin-bottom:7px}.question-grid span,.scenario-grid p,.scenario-grid li,.diagnostic-grid p{font-size:14px;color:var(--muted);line-height:1.7}.scenario-grid ul{margin:6px 0 0 17px}.scenario-grid small{display:block;color:var(--green);font-size:12px;font-weight:700;margin-top:9px}
.map-row{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));border:1px solid var(--border);border-bottom:0}.map-row:last-of-type{border-bottom:1px solid var(--border)}.map-row>div{padding:15px;border-left:1px solid var(--border);font-size:14px;line-height:1.68}.map-row>div:first-child{border-left:0;background:#f7f9fc;font-weight:700;display:flex;align-items:center}.map-row b{display:block;font-size:15px;margin-bottom:6px}.map-row span{display:block;color:var(--amber);font-size:12px;margin-top:7px}.map-row small{display:block;color:var(--green);font-size:12px}
.compare{display:grid;grid-template-columns:1fr 52px 1fr;gap:14px;align-items:stretch}.compare>section{padding:18px;border:1px solid var(--border);border-radius:7px}.compare>section:first-child{background:#fffafa}.compare>section:last-child{background:#f4fbf7}.compare h3{font-size:17px;margin-bottom:8px}.compare li{font-size:14px;line-height:1.7}.compare ul{margin-left:18px}.compare>div{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--blue)}
.evaluation-lab{border-color:#c8d7f1}.experiment-context{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 12px}.experiment-context span{padding:4px 8px;border-radius:4px;background:#f1f5fb;color:#385073;font-size:11px;font-weight:700}.experiment-tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.experiment-track{padding:15px;border:1px solid var(--border);border-radius:7px}.experiment-track.baseline{background:#fffafa;border-color:#efcaca}.experiment-track.supported{background:#f4fbf7;border-color:#bfe1ce}.track-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.track-header h3{font-size:14px}.track-status{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px}.baseline .track-status{background:#fee2e2;color:#a33}.supported .track-status{background:#dcfce7;color:#087a4b}.trace-line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.trace-node{position:relative;min-height:92px;padding:10px 9px;border:1px solid var(--border);background:#fff}.trace-node:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:34px;z-index:2;color:var(--dim);font-size:16px}.trace-node b{display:block;font-size:12px;line-height:1.45;margin-bottom:4px}.trace-node span{display:block;font-size:11px;line-height:1.55;color:var(--muted)}.trace-node.fault{border-color:#eea7a7;background:#fff5f5}.trace-node.fault b{color:#b42318}.trace-node.fix{border-color:#95cfad;background:#f3fbf6}.trace-node.fix b{color:#087a4b}.track-result{margin:11px 0 0;padding-top:10px;border-top:1px solid rgba(15,23,42,.1);font-size:12px;line-height:1.65}.baseline .track-result b{color:#b42318}.supported .track-result b{color:#087a4b}.intervention-bridge{display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr;gap:8px;align-items:center;margin:14px 0;padding:12px;border:1px dashed #a9bde0;background:#f7faff}.intervention-bridge>div{padding:9px 10px;background:#fff;border-top:2px solid var(--blue);font-size:12px;line-height:1.55}.intervention-bridge>div:nth-of-type(2){border-top-color:var(--amber)}.intervention-bridge>div:nth-of-type(3){border-top-color:var(--green)}.intervention-bridge b{display:block;font-size:12px;margin-bottom:3px}.intervention-arrow{text-align:center;color:var(--blue);font-size:19px;font-weight:700}.decision-gate{display:grid;grid-template-columns:1fr 34px 1.1fr;gap:10px;align-items:stretch;margin-top:14px}.gate-checks,.gate-outcome{padding:12px 13px;border:1px solid var(--border);font-size:12px;line-height:1.65}.gate-checks{background:#f8fbff}.gate-checks b,.gate-outcome b{display:block;font-size:13px;margin-bottom:4px}.gate-arrow{display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:22px}.gate-outcome{background:#f4fbf7;border-color:#bfe1ce}.gate-outcome em{display:block;margin-top:5px;color:#9b5b00;font-style:normal}
.matrix{width:100%;margin-top:16px;border-collapse:collapse;font-size:14px}.matrix th,.matrix td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border)}.matrix th{background:#f7f9fc}.matrix td:last-child{color:var(--green);font-weight:700}.evidence{margin-top:16px;padding:14px 16px;border-left:4px solid var(--blue);background:#f5f8ff;font-size:15px;line-height:1.75}.evidence b{color:var(--text)}
.evidence-map{margin:0 0 30px;padding:26px 28px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.evidence-map h2{font-size:22px;line-height:1.45;margin-bottom:7px}.evidence-map>p{font-size:16px;color:var(--muted);margin-bottom:19px}.confidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.confidence-grid>div{padding:14px 16px;background:#f8fbff;border-top:2px solid var(--blue);font-size:14px;line-height:1.7}.confidence-grid>div:nth-child(2){border-top-color:var(--amber);background:#fffaf0}.confidence-grid>div:nth-child(3){border-top-color:var(--purple);background:var(--purple-bg)}.confidence-grid b{display:block;font-size:15px;margin-bottom:5px}.claim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.claim-grid article{padding:18px;border:1px solid var(--border);border-radius:7px;background:#fff}.claim-grid h3{font-size:17px;line-height:1.5;margin:5px 0 8px}.claim-grid p{font-size:15px;line-height:1.72;color:var(--muted);margin-bottom:9px}.claim-grid b{color:var(--text)}.claim-grid a{color:var(--blue);text-decoration:none}.claim-tag{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700;margin-right:5px}.claim-tag.caution{background:var(--amber-bg);color:var(--amber)}.workbench> .question-grid:first-of-type{display:none}

.local-notice{background:var(--amber-bg);border:1px solid #fde68a;border-radius:var(--radius);padding:18px 22px;margin-bottom:22px;font-size:15px;color:var(--amber)}
.local-notice b{color:#92400e}
.evidence-panel{margin:0 0 30px;padding:26px 28px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.evidence-panel h2{font-size:22px;line-height:1.45;margin-bottom:7px}.evidence-panel>p{font-size:16px;line-height:1.78;color:var(--muted);margin-bottom:18px}
.evaluation-source-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.evaluation-source-list article{padding:18px;border:1px solid var(--border);border-radius:7px;background:#fff}.evaluation-source-list h3{font-size:17px;line-height:1.45;margin-bottom:8px}.evaluation-source-list p{font-size:15px;line-height:1.72;color:var(--muted)}
.evidence-strip{margin-top:16px;padding:14px 16px;border-left:4px solid var(--blue);background:#f5f8ff;font-size:15px;line-height:1.75}.evidence-strip a{color:var(--blue);text-decoration:none}.evidence-strip a:hover{text-decoration:underline}
.eval-dimensions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:30px}.eval-dimensions .eval-dim{height:100%;margin:0}.eval-dimensions .good-bad{grid-template-columns:1fr}
.qa-details{margin-top:6px}
.qa-details summary{cursor:pointer;color:var(--blue);font-weight:600;list-style-position:inside}
.qa-details[open] summary{margin-bottom:10px}
.section,.kp,.eval-dim{scroll-margin-top:118px}
@media(max-width:1100px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.question-grid,.scenario-grid,.diagnostic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  body{font-size:16px;line-height:1.76}
  .app{display:block}
  .top-tabs{display:flex;height:58px;padding:0;overflow:hidden}
  .top-tab{flex:1;min-width:0;padding:15px 4px 13px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .sidebar{width:100%;height:auto;position:fixed;top:58px;left:0;overflow:visible;border-right:none;border-bottom:1px solid var(--border);z-index:19}
  .sidebar-title{padding:11px 16px;font-size:16px}
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center}
  .nav-tree{display:none;max-height:52vh;overflow-y:auto;padding:6px 0;background:var(--surface);border-top:1px solid var(--border)}
  .sidebar.mobile-open .nav-tree{display:block}
  .nav-group-label{padding:10px 16px;font-size:14px}
  .nav-item{padding:8px 16px 8px 36px;font-size:14px}
  .qa-banner{margin-top:48px;padding:18px 16px}
  .qa-banner h3{font-size:17px;margin-bottom:7px}
  .qa-item{font-size:16px;line-height:1.76;margin-bottom:9px}
  .qa-focus-grid{grid-template-columns:1fr}
  .content{padding:22px 16px}
  .section{margin-bottom:28px}
  .section-title{font-size:21px;line-height:1.45}
  .section-desc{line-height:1.7;margin-bottom:14px}
  .kp,.eval-dim{padding:20px 18px;margin-bottom:14px}
  .kp h4,.eval-dim h4{font-size:18px;line-height:1.55}
  .concept-index{grid-template-columns:1fr}
  .kp .body,.eval-dim .check-list{font-size:17px;line-height:1.84}
  .kp pre{font-size:13px;padding:12px}

<script>
// ==================== DATA ====================
const KNOWLEDGE = {
  qa:   [
    {
      "q": "面对一个真实任务，我现在该补哪一层知识？",
      "a": "先看 <b>任务边界、运行机制、状态与知识、协作治理、工程可靠性</b>；不要从框架名倒推需求。"
    },
    {
      "q": "这些知识点怎样连成一次完整的 Agent 工作？",
      "a": "从 <b>任务与约束</b> 出发，经由 <b>推理、工具、记忆、检索</b> 完成动作，再用 <b>安全、观测、恢复</b> 保证长期运行。"
    },
    {
      "q": "一个知识点何时该优先学、仍然有效，并且能用于当前任务？",
      "a": "<b>先按风险，后看时效。</b>终态、权限、幂等、恢复、评估优先；稳定原则长期掌握，协议/API 看原始来源和日期，具体方法必须用本地任务验证。"
    }
  ],
  categories: [
    {
      id:"reasoning", icon:"🧠", name:"推理与决策",
      desc:"Agent 如何思考、规划、做出决策。这是 Agent 区别于 Chatbot 的核心——不只是生成文本，而是闭环决策。",
      items: [
                {
          "title": "ReAct 范式：推理+行动交替循环",
          "tags": [
            "ReAct",
            "核心",
            "必会"
          ],
          "body": "<p><b>ReAct = Reasoning + Acting</b>（Google 2022）。核心思想：让 LLM 在生成中交替进行<b>推理(Thought)和行动(Action)</b>，并接收外部工具返回的<b>观察(Observation)</b>，把推理锚定在真实数据上。</p>\n<p><b>标准循环：</b></p>\n<ul>\n<li><b>Thought</b>：LLM 分析当前状态，决定下一步做什么</li>\n<li><b>Action</b>：调用工具（Function Call），如 search_order(order_id=\"123\")</li>\n<li><b>Observation</b>：工具返回结果，如 {\"status\":\"已发货\",\"items\":[...]}</li>\n<li>回到 Thought，基于 Observation 决定下一步，直到输出 Final Answer</li>\n</ul>\n<p><b>为什么 ReAct 比 CoT 好：</b>CoT 纯靠模型内部知识推理，容易\"空想\"——比如模型不知道今天天气，只能猜。ReAct 调天气 API 获取真实数据，推理基于事实。</p>\n<p><b>消息格式设计：</b>Observation 用 <b>tool 角色而非 assistant 角色</b>回传。因为 Observation 是外部系统返回的内容，不是模型生成的。如果放 assistant 角色，模型会以为自己说了这些话，后续推理会混乱。</p>\n<p><b>消息格式示例：</b></p>\n<pre>system: 你是客服Agent，可用工具：search_order\nuser: 帮我查订单123的状态\nassistant: Thought: 用户要查订单状态，调用search_order\n        Action: search_order(order_id=\"123\")\ntool: {\"status\":\"已发货\",\"carrier\":\"顺丰\"}\nassistant: Thought: 订单已发货，用顺丰。用户可能想查物流\n        Final Answer: 您的订单123已通过顺丰发货。</pre>\n<p><b>终止条件设计：</b>①最大步数硬限制（通常 10 步）；②LLM 主动输出 finish_reason=stop；③连续 2 步调用相同工具且参数相同→疑似死循环→强制停止。</p>\n<p><b>生产代价：</b>ReAct 每一步都要携带状态、工具定义和观察结果，成本取决于轨迹长度、输出与工具模式。简单任务优先直接响应或确定性流程；只有路径依赖外部观察时才启用循环。</p>",
          "refs": [
            {
              "t": "ReAct: Synergizing Reasoning and Acting (Google 2022)",
              "u": "https://arxiv.org/abs/2210.03629"
            }
          ]
        },
                {
          "title": "CoT / Plan-Execute / ToT / Reflection 对比与选型",
          "tags": [
            "CoT",
            "Plan-Execute",
            "ToT",
            "Reflection",
            "选型"
          ],
          "body": "<p><b>四种推理范式核心区别：</b></p>\n<ul>\n<li><b>CoT (Chain of Thought)</b>：纯脑内推理，一步步想，不调工具。适合数学题、逻辑推理等不需要外部数据的任务。<b>缺点：</b>知识截止日期前的内容可能过时或幻觉。</li>\n<li><b>ReAct</b>：推理+行动交替。每步 Thought→Action→Observation。<b>适合</b>需要查资料、调 API 的任务。<b>代价</b>：每轮都要保留状态并调用工具，成本与延迟应按代表任务测量。</li>\n<li><b>Plan-and-Execute</b>：先制定完整计划，再逐步执行。<b>省 Token</b>（一次规划）、可控性强，但灵活度低——中间步骤发现错误时调整成本高。</li>\n<li><b>Tree of Thoughts (ToT)</b>：每步探索多条推理路径，用 BFS/DFS+评估函数选最优。<b>效果好但 Token 消耗是 CoT 的 3 倍</b>，只适合需要探索多路径的复杂推理。</li>\n<li><b>Reflection / Reflexion</b>：让 Agent 自我审查输出质量，决定是否重试或修正。Reflexion 在反馈与阶段性记忆下总结失败经验。它只在能获得测试、工具结果或明确评分反馈时才值得尝试，不能把自我复述当成可靠修复。</li>\n</ul>\n<p><b>选型决策树：</b></p>\n<ul>\n<li>任务路径不确定，需要观察中间结果 → <b>ReAct</b></li>\n<li>步骤明确可预判 → <b>Plan-Execute</b>（省 Token 可控）</li>\n<li>需要探索多种可能解 → <b>ToT</b>（贵但准）</li>\n<li>长链路任务容易出错 → <b>Reflection</b>（加倍 Token 但提升成功率）</li>\n<li>生产级系统 → <b>混合</b>：大步骤 Plan-Execute 规划，子步骤 ReAct 灵活执行，关键节点 Reflection 自检</li>\n</ul>\n<p><b>必须说出的 trade-off：</b>\"我们项目 CoT→ReAct 准确率提升 15%，但 Token 消耗多了 3 倍。所以简单查询走 CoT，复杂多步推理才用 ReAct。\"</p>",
          "refs": [
            {
              "t": "Tree of Thoughts (Yao et al. 2023)",
              "u": "https://arxiv.org/abs/2305.10601"
            },
            {
              "t": "Reflexion: Language Agents with Verbal RL (Shinn et al. 2023)",
              "u": "https://arxiv.org/abs/2303.11366"
            }
          ]
        },
        {
          title:"Agent Loop 设计与终止策略",
          tags:["Agent Loop","终止条件","死循环"],
          body:`<p><b>Agent Loop 是 Agent 的核心工作引擎</b>——Think → Act → Observe 的循环，直到任务完成。</p>
<p><b>完整循环示例（退换货场景）：</b></p>
<pre>Round 1: Think "需要查订单" → Act search_order(123) → Observe {status:"已发货"}
Round 2: Think "已发货不能直接退，需查退货政策" → Act check_policy(category="book") → Observe {returnable:true}
Round 3: Think "符合退货条件" → Act create_return(order_id=123) → Observe {return_id:"R456"}
Round 4: Think "任务完成" → 输出最终回复</pre>
<p><b>防死循环三层设计：</b></p>
<ul>
<li><b>第一层：硬限制</b>——max_steps=10，到了强制停止。在 System Prompt 里动态更新"你已经执行了 X/N 步"，模型会自觉收敛。</li>
<li><b>第二层：循环检测</b>——连续 2 步调用相同工具且参数相同 → 疑似死循环 → 强制跳出并告知用户"我可能需要更多信息"。</li>
<li><b>第三层：Token 预算</b>——设单次任务最大 Token 消耗，超限自动停止。</li>
</ul>
<p><b>错误处理设计：</b>工具调用失败时，把错误信息包装为 Observation 回传 LLM，让它自主决定重试/换工具/降级。不要在代码层静默吞掉错误——LLM 看不到错误就不知道要调整策略。</p>`,
          refs:[]
        },
      ]
    },
    {
      id:"tools", icon:"🔧", name:"工具与协议",
      desc:"Agent 如何与外部世界交互。从 Function Calling 到 MCP/A2A 标准协议。",
      items: [
        {
          title:"Function Calling 完整实现",
          tags:["FC","核心","必会"],
          body:`<p><b>三步走流程：</b></p>
<ul>
<li><b>定义阶段</b>：在 API 的 tools 参数或 System Prompt 中定义 Tool Schema——name、description（给 LLM 看的，要说清何时用）、parameters（JSON Schema，含 type/enum/required）。</li>
<li><b>调用阶段</b>：LLM 判断需要调工具，输出 function_call JSON（function.name + function.arguments）。</li>
<li><b>执行阶段</b>：代码层解析 JSON → Pydantic 校验参数 → 执行实际函数 → 将结果包装为 tool 角色消息回传 LLM。</li>
</ul>
<p><b>Schema 设计原则（踩过的坑）：</b></p>
<ul>
<li><b>候选值是封闭集合</b>时才用 <b>enum</b>，例如支付方式；备注、搜索词等开放输入不应被伪装成 enum。它减少歧义，但不替代业务校验。</li>
<li><b>类型服务业务语义</b>：数量通常用 integer；货币不要依赖二进制浮点比较，可用最小货币单位的 integer 或 decimal/string 表示。重点是后端的一致性，不是“模型会搞混”。</li>
<li>description 要写<b>使用场景</b>而非定义——"当用户提供订单号时调用此工具查询订单详情"而非"查询订单"。</li>

          body:`<p><b>MCP (Model Context Protocol)</b> 是 Agent/客户端与外部工具、资源交互的协议。它统一消息与能力声明，不替代工具的授权、输入校验或业务验收。</p>

          body:`<p><b>按生命周期和责任划分，而不是背一套“标准层数”：</b></p>

          tags:["上下文","压缩","Token"],
          body:`<p><b>上下文工程的本质</b>不是"塞得下"，而是<b>"塞对的"</b>。核心挑战是<b>注意力竞争</b>——上下文越长，模型对关键信息的注意力越稀释（Lost in the Middle 现象）。</p>

<p><b>四种压缩策略：</b></p>

function knowledgeCompass(){return `<section class="knowledge-compass"><div class="kicker">先回答用户最需要知道的事</div><h2>一个完整的 Agent 知识闭环，应该帮你做出哪些判断？</h2><p>这里不是技术名词目录。带着一个真实需求进入时，先把下面四个问题答清，再进入对应知识域。</p><div class="compass-grid"><section class="compass-step"><h3>1. 这个问题值得用 Agent 吗？</h3><p>用户目标是什么？路径是否开放？规则或工作流能否更稳定地完成？</p><b>先读：应用设计与迭代</b></section><section class="compass-step"><h3>2. 它如何完成一次任务？</h3><p>如何理解目标、选择工具、使用状态与知识、控制循环，并在不确定处停下来？</p><b>再读：推理、工具、记忆、RAG</b></section><section class="compass-step"><h3>3. 它如何长期可用？</h3><p>如何控制权限、副作用、故障恢复、版本、成本和可观测性？</p><b>再读：协作与工程落地</b></section><section class="compass-step"><h3>4. 它如何持续变好？</h3><p>从真实运行中找失败，提出单一改动假设，用固定任务与护栏决定保留还是回退。</p><b>衔接：评估框架</b></section></div></section>`}
function learningWorkbench(){return `<section class="workbench"><div class="kicker">从知识到可验证改进</div><h2>先定义交付，再讨论 Agent 能力</h2><p>没有基线、判定规则与对照运行，任何“优化了”都只是印象。每次改动都应留下可复查的证据。</p><div class="flow"><div><b>1. 定义任务</b><span>目标、约束、成功和失败。</span><small>任务卡与验收规则</small></div><div><b>2. 记录基线</b><span>冻结模型、提示、工具和数据版本。</span><small>基线报告与 Trace</small></div><div><b>3. 定位失败</b><span>按推理、证据、工具、安全、恢复归因。</span><small>失败分类表</small></div><div><b>4. 提出改动</b><span>一次验证一个主要假设，写出代价。</span><small>改动假设</small></div><div><b>5. 验证沉淀</b><span>重复运行、盲评、抽检，达标再灰度。</span><small>决策与回归用例</small></div></div></section>`}
function applicationCanvas(){return `<section class="workbench"><div class="kicker">应用层 Agent 的落点</div><h2>不同应用，先定义不同的可验收结果</h2><p>用户不会因为系统使用了 Agent 获益，而是因为一个具体任务被可靠完成。下面四类应用需要的输入、风险控制和产物不同，不能用同一套“效果不错”来描述。</p><div class="scenario-grid"><article><h3>功能交付</h3><p>把需求转为可运行功能，范围可控且可回归。</p><ul><li>测试与验收断言</li><li>改动范围与回归</li></ul><small>变更、测试与验收记录</small></article><article><h3>缺陷修复</h3><p>先稳定复现，再定位根因并验证最小修复。</p><ul><li>复现用例转绿</li><li>邻近回归集通过</li></ul><small>根因、补丁与回归用例</small></article><article><h3>代码演进</h3><p>行为保持，同时改善结构、性能或安全。</p><ul><li>兼容/性能/安全检查</li><li>迁移与回滚计划</li></ul><small>计划、差异与回滚方案</small></article><article><h3>业务操作</h3><p>在授权边界内完成真实动作，并保留审计与恢复能力。</p><ul><li>状态、权限与幂等断言</li><li>高风险审批</li></ul><small>结构化结果、审计与恢复点</small></article></div></section>`}
function systemMap(){return `<section class="system-map"><div class="kicker">系统地图：症状该落在哪一层</div><h2>输入、决策、执行与治理的可观测位置</h2><p>遇到“结果不好”时先定位节点，再选择改动杠杆，避免把所有问题都归咎于模型或 Prompt。</p><div class="map-row"><div>请求与状态</div><div><b>用户目标</b>范围与成功条件。<span>信号：意图歧义</span><small>杠杆：澄清策略</small></div><div><b>输入边界</b>权限与不可信内容。<span>信号：拦截率</span><small>杠杆：授权校验</small></div><div><b>上下文</b>记忆与检索证据。<span>信号：召回率</span><small>杠杆：切分排序</small></div><div><b>任务状态</b>步骤、预算与版本。<span>信号：冲突率</span><small>杠杆：checkpoint</small></div></div><div class="map-row"><div>决策与执行</div><div><b>规划器</b>拆步骤与终止。<span>信号：漂移/步数</span><small>杠杆：计划约束</small></div><div><b>工具网关</b>选择、校验、执行。<span>信号：成功率</span><small>杠杆：Schema/重试</small></div><div><b>外部系统</b>检索、API、数据库。<span>信号：超时/错误</span><small>杠杆：降级/缓存</small></div><div><b>结果编排</b>合并证据与动作。<span>信号：引用正确</span><small>杠杆：输出校验</small></div></div><div class="diagnostic-grid"><div><h3>回答错但自信</h3><p>先查证据是否召回、引用是否支持答案，再查生成。</p></div><div><h3>任务反复绕圈</h3><p>查目标状态、Observation、步骤和 Token 预算。</p></div><div><h3>一次好一次坏</h3><p>查随机性、输入分层、依赖与评审一致性。</p></div></div></section>`}
function evalWorkbench(){return `<section class="workbench"><div class="kicker">建议审查框架</div><h2>把“哪里有问题”转成有依据的改进建议</h2><p>每个建议都写明失效、可改动作、作用机制、来源支持、反例与置信度；外部证据不能被写成当前系统已经提升。</p><div class="flow"><div><b>1. 失败模式</b><span>建议必须先指出哪类失效。</span><small>没有失败对象，不列建议</small></div><div><b>2. 作用机制</b><span>解释改动会影响哪一层行为。</span><small>机制不对应，降低置信</small></div><div><b>3. 外部来源</b><span>优先原始论文或可复现材料。</span><small>来源不替代本地结论</small></div><div><b>4. 反例与代价</b><span>写明无效条件与复杂度损失。</span><small>没有反例，不给高置信</small></div><div><b>5. 建议状态</b><span>强候选、待补充或不建议。</span><small>这是页面的最终输出</small></div></div><div class="evidence"><b>审查准则：</b>来源质量、机制匹配和边界完整度决定建议的可信度；本页不把外部结果翻译成任何具体系统的效果承诺。</div></section>`}
function evidenceClaims(){return `<section class="evidence-map"><div class="kicker">先筛掉没有根据的改动</div><h2>不是“有哪些方法”，而是“哪一个主张值得在当前 Agent 上尝试”</h2><p>以下来自原始论文或公开可复现基准。它们只能证明特定研究任务中的机制，不承诺当前系统一定收益；卡片同时给出适用信号和足以否决它的反例。</p><div class="confidence-grid"><div><b>A 级：本地已证实</b>代表任务、版本与护栏上重复成立，才能支持实际采用。</div><div><b>B 级：外部同机制证据</b>论文或公开基准验证过相近机制，值得成为候选，但不等于本地收益。</div><div><b>C 级：探索假设</b>只有直觉或零散案例；未进入评估包前不应包装成建议。</div></div><div class="claim-grid"><article><span class="claim-tag">B 级</span><span class="claim-tag caution">路径依赖观察</span><h3>外部观察会改变下一步时，交替推理与行动才值得尝试</h3><p><b>信号：</b>Trace 显示正确路径要由工具或环境返回决定，初始计划常被新事实推翻。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2210.03629" target="_blank">ReAct</a> 在问答、事实核查和交互任务报告提升，机制是 Observation 更新计划。</p><p><b>否决：</b>路径可枚举、工具错误才是主因，或动态步骤只增加成本时，优先工作流和工具校验。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">只解决证据缺失</span><h3>回答缺少可用事实证据时，检索增强是候选而非通用修复</h3><p><b>信号：</b>正确外部知识不在当前上下文，或输出无法提供可核验来源。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2005.11401" target="_blank">RAG</a> 在知识密集型任务验证了检索记忆的价值，也保留了溯源和更新问题。</p><p><b>否决：</b>正确证据已在 Trace 中却被误用，或语料没有答案时，先修上下文组织、生成约束或数据源。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">不是上下文越长越好</span><h3>关键约束落在长上下文中间时，应优先选择与结构化状态</h3><p><b>信号：</b>同一事实的位置变化会改变结果，或摘要后丢失未完成动作、时间和权限。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2307.03172" target="_blank">Lost in the Middle</a> 用位置扰动发现长上下文模型对中间信息的使用会退化。</p><p><b>否决：</b>上下文短且证据始终被正确读取时，问题更可能在检索、工具或任务定义。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">必须有外部反馈</span><h3>反思只在获得测试或工具反馈后才值得尝试</h3><p><b>信号：</b>失败能被测试、工具结果或明确评分指出，而不是让模型自行说“写得更好”。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2303.11366" target="_blank">Reflexion</a> 在编码等任务中通过反馈与阶段性记忆获得提升。</p><p><b>否决：</b>没有可验证反馈、反思不改变后续行动，或额外轮次超过收益时，不应保留。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">复杂自主性必须有对照</span><h3>稳定的软件任务应先与简单、可解释的流程比较</h3><p><b>信号：</b>复杂 Agent 的成本来自无效循环、调度或不可解释长轨迹，而任务能拆为定位、修改和验证。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2407.01489" target="_blank">Agentless</a> 在 SWE-bench Lite 报告简单三阶段方法达到 32% 修复率，说明复杂自主性不是默认更优。</p><p><b>否决：</b>任务确实需要连续外部观察后的动态重规划，简单流程无法覆盖高价值失败时，再提高自主性。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">评审分不能独立定案</span><h3>开放质量可用模型评审扩展，但必须暴露偏差与分歧</h3><p><b>信号：</b>结果不能由规则完全判定，但需要比较候选输出质量。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2306.05685" target="_blank">MT-Bench</a> 报告强评审模型可接近人工偏好，同时验证了位置、长度和自偏好偏差。</p><p><b>否决：</b>权限、金额、删除等确定事实或高风险动作必须由程序断言与人工责任链决定。</p></article></div></section>`}
function scenarioMatrix(){return `<section class="scenario-matrix"><div class="kicker">应用层验收矩阵</div><h2>不同功能，必须用不同的“好”来衡量</h2><p>通用基准只说明能力边界；去留决定来自业务任务夹具、护栏和失败样本。</p><table class="matrix"><thead><tr><th>应用</th><th>自动证据</th><th>人工复核</th><th>改动验证</th></tr></thead><tbody><tr><td>功能交付</td><td>构建、测试、验收断言</td><td>需求与范围</td><td>同任务集比较通过率与回归数</td></tr><tr><td>缺陷修复</td><td>稳定复现与修复断言</td><td>根因与补丁最小性</td><td>比较定位时间、复发率与邻近回归</td></tr><tr><td>代码演进</td><td>兼容、性能与安全检查</td><td>架构与迁移计划</td><td>比较质量门槛、迁移失败与回滚</td></tr><tr><td>业务操作</td><td>状态机、权限与幂等断言</td><td>高风险审批</td><td>比较动作正确率、越权和恢复成功率</td></tr></tbody></table><div class="evidence"><b>优先级：</b>先处理影响大、出现频繁、可稳定检测且有明确修复杠杆的问题。没有可验收结果时，先用确定性工作流或人工节点。</div></section>`}
function evidenceClaimsV2(){return evidenceClaims().replace("哪一个主张值得在当前 Agent 上尝试", "哪一个主张值得被列为候选").replace("A 级：本地已证实</b>代表任务、版本与护栏上重复成立，才能支持实际采用。", "强候选：论证链完整</b>失败模式、作用机制、原始来源和否决条件均明确；仍然只是高质量建议，不是任何系统效果结论。").replace("B 级：外部同机制证据</b>论文或公开基准验证过相近机制，值得成为候选，但不等于本地收益。", "待补充：外部同机制证据</b>论文或公开基准验证过相近机制，值得研究，但失败模式或边界还不能完全对上。").replace("C 级：探索假设</b>只有直觉或零散案例；未进入评估包前不应包装成建议。", "不建议：探索假设</b>只有直觉、二手总结或零散案例；不应包装成有依据的改进建议。 ")}
function comparisonBoard(){return `<section class="comparison-board evaluation-lab"><div class="kicker">建议可信度可视化</div><h2>一个建议从“听起来合理”到“值得研究”，中间缺什么？</h2><p>这张图审查建议的论证链，不呈现任何系统效果数据。左右不是改动前后的性能，而是低质量建议与可解释候选的差别。</p><div class="experiment-context"><span>不代表真实效果</span><span>不替代项目验证</span><span>每一格都必须能追溯</span></div><div class="experiment-tracks"><section class="experiment-track baseline"><div class="track-header"><h3>低质量建议</h3><span class="track-status">不应采用</span></div><div class="trace-line"><div class="trace-node"><b>方法名</b><span>先说“加 RAG / 反思 / 多 Agent”。</span></div><div class="trace-node fault"><b>失败对象缺失</b><span>没有说明它要解决哪种失效。</span></div><div class="trace-node fault"><b>证据跳跃</b><span>用一篇论文直接承诺当前场景有效。</span></div><div class="trace-node fault"><b>没有反例</b><span>忽略复杂度、成本和不适用条件。</span></div></div><p class="track-result"><b>结论：</b>这只是灵感，不是可负责任的改进建议。</p></section><section class="experiment-track supported"><div class="track-header"><h3>可解释候选</h3><span class="track-status">按置信度列出</span></div><div class="trace-line"><div class="trace-node fix"><b>失败模式</b><span>先描述可观察的失效类型。</span></div><div class="trace-node fix"><b>改动机制</b><span>说明改动会影响哪一层行为。</span></div><div class="trace-node fix"><b>外部支撑</b><span>来源只支持相近机制与范围。</span></div><div class="trace-node fix"><b>否决条件</b><span>写出反例、代价和替代方案。</span></div></div><p class="track-result"><b>结论：</b>可标记为强候选、待补充或不建议，绝不写成已有效。</p></section></div><div class="intervention-bridge"><div><b>问题</b>是否先定义了明确失败模式？</div><div class="intervention-arrow">→</div><div><b>质疑</b>来源证明的是同一机制，还是只是一段相似叙述？</div><div class="intervention-arrow">→</div><div><b>输出</b>按边界完整度给出置信度，而非效果承诺。</div></div><div class="decision-gate"><div class="gate-checks"><b>高置信建议的最低构成</b>失败模式明确；改动机制可解释；来源质量可追溯；适用边界和否决条件完整。</div><div class="gate-arrow">→</div><div class="gate-outcome"><b>页面可以给出的唯一结论</b>强候选：论证链完整。待补充：缺少机制匹配或边界。<em>不建议：只有方法名、直觉或无关来源。</em></div></div></section>`}

// ==================== RENDER ====================
let currentTab = 'knowledge';

function buildNav(tab = currentTab) {
  const tree = document.getElementById('navTree');
  const title = document.getElementById('navTitle');
  let html = '';

  if(tab === 'knowledge') {
    title.textContent = 'AI Agent 开发知识体系';
    KNOWLEDGE.categories.forEach(cat => {
      html += `<div class="nav-group"><div class="nav-group-label" onclick="toggleNav(this)"><span class="arrow open">▶</span>${cat.icon} ${cat.name}</div><div class="nav-children show">`;
      cat.items.forEach((item,i) => {
        const itemTitle = item.title.length > 20 ? item.title.substring(0,20)+'...' : item.title;
        html += `<div class="nav-item" onclick="scrollToSection('${cat.id}-${i}',this)">${itemTitle}</div>`;
      });
      html += `</div></div>`;
    });
  } else {
    title.textContent = 'Agent 系统评估框架';
    html = `<div class="nav-group"><div class="nav-group-label"><span class="arrow open">▶</span>🔍 七项核心评估</div><div class="nav-children show">`;
    AGENT_EVALUATION_DIMS.forEach(dim => {
      html += `<div class="nav-item" onclick="scrollToSection('eval-${dim.num}',this)">${dim.num}. ${dim.title}</div>`;
    });
    html += `</div></div>`;
  }
  tree.innerHTML = html;
}

function toggleNav(el) {
  el.querySelector('.arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

function scrollToSection(id, navItem) {
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(navItem) navItem.classList.add('active');
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.matchMedia('(max-width: 760px)').matches) setMobileNav(false);
}

function setMobileNav(open) {
  const sidebar = document.querySelector('.sidebar');
  const toggle = document.getElementById('navToggle');
  sidebar.classList.toggle('mobile-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  toggle.textContent = open ? '收起目录' : '目录';
}

function renderQA(tab) {
  const banner = document.getElementById('qaBanner');
  const qa = tab==='knowledge' ? KNOWLEDGE.qa : EVAL.qa;
  const questions = tab === 'knowledge' ? [qa[2], qa[0], qa[1]] : qa;
  banner.hidden = false;
  const heading = tab === 'knowledge' ? '先用这三个问题把知识学成可用判断' : '先用这三个问题审查改进建议的可信度';
  let html = `<h3>${heading}</h3><div class="qa-focus-grid">`;
  questions.forEach(item => { html += `<div class="qa-focus-item"><b>${item.q}</b><span>${item.a}</span></div>`; });
  banner.innerHTML = html + `</div>`;
}

function knowledgeSources(){return `<section class="evidence-panel"><h3>知识体系的来源与取舍</h3><p>本页按能力闭环组织，而非按单一框架的 API 目录组织：任务设计、推理与工具、上下文与检索、协作、治理分别回答不同问题。每个具体结论仍应回到卡片中的原始论文或规范。</p><div class="evidence-strip"><b>结构参考：</b><a href="https://github.com/microsoft/ai-agents-for-beginners" target="_blank" rel="noopener"><a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/transports" target="_blank" rel="noopener">MCP 2025-11 规范</a>、<a href="https://github.com/a2aproject/A2A/blob/main/docs/specification.md" target="_blank" rel="noopener">A2A 1.0 规范</a>、<a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a> 的轨迹诊断与 <a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP Agent Security</a> 校验闭环中的协议、状态、诊断与权限边界。它们提供当前机制依据，不替代任务本身的验收标准。</div></section>`}
function evaluationSources(){return `<section class="evidence-panel"><div class="kicker">评估工具的能力边界</div><h2>不同工具分别能检查什么？</h2><p>评估工具不是一套通用“分数机”。先确定要检查的是输出、工具参数、行动轨迹，还是多轮会话；同一项目的不同层级不能混成一个结论。</p><div class="evaluation-source-list"><article><h3>LangChain AgentEvals</h3><p><b>适合检查：</b>行动轨迹是否符合预设路径或约束，以及用评审器审阅轨迹。它回答的是过程是否合理。</p></article><article><h3>agentevals</h3><p><b>适合检查：</b>基于 OpenTelemetry Trace 离线重复评分。项目仍在快速迭代，采用时要锁定版本和评分规则。</p></article><article><h3>Strands Evals</h3><p><b>适合检查：</b>输出、工具选择、工具参数、轨迹、会话和多轮模拟。它帮助把不同层级拆开评估。</p></article><article><h3>Inspect</h3><p><b>适合检查：</b>组合工具调用、多轮交互和模型评审组件。它提供组件能力，不替代你的任务验收标准。</p></article></div><div class="evidence-strip"><b>使用边界：</b>这些项目只说明各自能支持哪一类检查；它们不能证明某个改进建议对你的 Agent 一定有效。实际结论仍要回到代表任务、版本和可复查证据。</div></section>`}
function comparisonBoardV2(){return comparisonBoard().replace("先说“加 RAG / 反思 / 多 Agent”。", "只报一个方法名，没有问题定义。")}
function knowledgeResearchPatterns(){return `<section class="evidence-map"><div class="kicker">从当前实现中提炼的知识点</div><h2>理解 Agent，先抓住四个不会随框架变化的对象</h2><p>框架和 SDK 会换，下面五个对象不会：任务契约、能力与授权、运行状态、外部终态与可观测证据。它们把“会调用模型”变成可设计、可追溯的系统。</p><div class="claim-grid"><article><h3>任务契约不是一句用户输入</h3><p><b>应写清：</b>目标、不可违反的约束、可用动作、需要保留的状态和何时算结束。没有终态或拒绝条件，循环只能靠模型猜何时停。</p><p><b>不能推出：</b>任务写得详细，不代表路径必须固定；开放任务仍可允许多条合法轨迹。</p></article><article><h3>协议规定连接，不替代能力与授权</h3><p><b>应区分：</b>Function Calling 是一次调用契约，MCP 是 Agent 到工具/资源的连接协议，A2A 是 Agent 间协作协议。三者都不负责判断动作是否该做。</p><p><b>不能推出：</b>接入标准协议，不等于工具可信、参数正确或具备执行权限。</p></article><article><h3>状态不是聊天记录的别名</h3><p><b>运行状态</b>保存任务进度、预算、未完成动作与恢复点；<b>知识</b>提供可引用事实；<b>记忆</b>保存跨任务信息。三者混写会让恢复、权限和更新不可解释。</p><p><b>不能推出：</b>保存更多历史会提高质量；关键约束必须经过选择与结构化，而不是无限追加上下文。</p></article><article><h3>终态要看外部世界，不只看最终文案</h3><p><b>终态</b>可以是答案忠于证据、目标状态已变化、动作被拒绝并说明原因，或安全地转人工。工具返回 200、模型说“完成”都不是充分条件。</p><p><b>不能推出：</b>一次状态正确，就说明流程可靠；超时、重试和重复副作用仍需独立设计。</p></article><article><h3>可观测证据是运行的一部分</h3><p><b>应记录：</b>任务与版本、状态转换、工具选择和结果、授权/拦截决定、重试与人工接管，并让它们能关联到同一条轨迹。没有这些证据，就无法区分模型、工具、策略还是外部系统导致失败。</p><p><b>不能推出：</b>记录得多不等于可评估；敏感输入、工具参数和输出必须按最小必要原则脱敏、访问控制与保留。</p></article></div><div class="evidence"><b>来源：</b><a href="https://github.com/microsoft/ai-agents-for-beginners" target="_blank" rel="noopener"><a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/transports" target="_blank" rel="noopener">MCP 2025-11</a>、<a href="https://github.com/a2aproject/A2A/blob/main/docs/specification.md" target="_blank" rel="noopener">A2A 1.0</a>、<a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx 2026</a> 与 <a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP Agent Security</a>。页面据此归纳稳定对象，不把任一框架 API 当作通用原理。</div></section>`}
function evaluationContractMap(){return `<section class="evidence-map"><div class="kicker">从当前评估器提炼的判定契约</div><h2>先定义“什么算对”，再讨论任何改进建议</h2><p>轨迹不是天然只有一个正确答案。评估建议若没有说明需要约束顺序、覆盖、参数、终态中的哪一种，引用再多论文也无法证明它对准了问题。</p><div class="claim-grid"><article><h3>顺序正确</h3><p><b>适用：</b>前一步决定后一步的权限、审批或依赖。证据应说明关键动作为什么必须按序发生。</p><p><b>不要误用：</b>把所有探索任务都按严格序列判，会把等价路径误判为失败。</p></article><article><h3>覆盖正确</h3><p><b>适用：</b>必须获得的事实或必经动作明确，但获取顺序可以变化。证据应检查关键集合是否齐全。</p><p><b>不要误用：</b>“都调用过”不能证明参数、引用或最终状态正确。</p></article><article><h3>边界正确</h3><p><b>适用：</b>允许额外探索但必须包含关键动作，或必须禁止多余/高风险动作。参数可按字段定义精确或宽松匹配。</p><p><b>不要误用：</b>宽松匹配不等于放弃安全约束；不可逆动作仍要明确禁止条件。</p></article><article><h3>终态正确</h3><p><b>适用：</b>任务价值取决于外部状态、会话目标或可核验结果。此时需要状态断言，而不是只评最终文字。</p><p><b>不要误用：</b>开放质量无法用状态断言穷尽时，模型评审只能按预写 rubric 提供辅助意见。</p></article></div><div class="evidence"><b>为什么这会改变建议可信度：</b>任何“加入规划、检索或反思”的主张，都应先说明会改变哪一种判定契约；若来源只展示了输出更流畅，却没有覆盖同一契约，它不能作为强支撑。</div><div class="evidence"><b>内部依据：</b><a href="https://github.com/langchain-ai/agentevals" target="_blank" rel="noopener">LangChain AgentEvals</a> 明确区分严格、任意顺序、包含与排除的轨迹匹配，并允许按工具定义参数匹配；<a href="https://github.com/strands-agents/evals" target="_blank" rel="noopener">Strands Evals</a> 将工具选择、工具参数与环境状态拆开处理。</div></section>`}
function toolEvaluationLayers(){return `<section class="evidence-panel"><h3>工具调用至少有三层，不能只看“调用成功”</h3><div class="claim-grid"><article><h3>1. 选择</h3><p>在该时点是否该用这个工具？这是意图、上下文和可用能力的匹配问题。</p></article><article><h3>2. 参数</h3><p>参数是否忠于此前上下文，并且满足业务语义？JSON 合法只是最低门槛。</p></article><article><h3>3. 后果</h3><p>调用后的外部状态是否符合预期、权限和幂等要求？接口成功不代表业务状态正确。</p></article><article><h3>4. 叙述</h3><p>最终回答是否如实使用工具返回，而没有掩盖失败、过度承诺或遗漏限制？</p></article></div><div class="evidence-strip"><b>使用方式：</b>当某项改进声称“优化工具使用”时，必须标出它改善的是哪一层。否则“工具正确率提升”没有可解释含义。Strands 的工具级评估分别处理选择和参数，环境状态断言则单独验证后果。</div></section>`}
function evidenceLadder(){return `<section class="evidence-map"><div class="kicker">证据链的最低门槛</div><h2>先写出能推翻主张的约束，再谈“来源支持”</h2><p>一篇论文、一次公开演示或一个项目 README 都只能提供材料。页面要审查的是：材料能否支撑一个可反驳的机制主张，而不是材料本身是否有名。</p><div class="flow"><div><b>1. 主张</b><span>改动声称缓解哪种失效？</span><small>只有方法名，不成立</small></div><div><b>2. 约束</b><span>若主张正确，哪条行为必须成立？</span><small>写成可观察的不变量</small></div><div><b>3. 支持</b><span>来源是否展示同一机制与条件？</span><small>任务名相似不够</small></div><div><b>4. 反证</b><span>什么结果会直接削弱这个主张？</span><small>没有反证，置信度受限</small></div><div><b>5. 表达</b><span>只报告论证完整度与边界。</span><small>不承诺任何系统效果</small></div></div><div class="evidence"><b>来自当前诊断框架的可借鉴点：</b><a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a> 将原始轨迹归一化，先生成静态与逐步约束、检查违例，再使用模型归因。这里借鉴其证据顺序，而不假装本页已有某个系统的轨迹或检查结果。</div></section>`}

function evaluationReferences(){return `<section class="evidence-map"><div class="kicker">当前参考项目 · 2026-07-26 核对</div><h2>参考项目分别解决哪一环？</h2><p>它们不是同一种“建议生成器”：本页把任务标准、过程证据、失败定位和稳定性验证作为输入，结合具体 Agent 的设计，给出改进点、可改动作、作用机制、边界与置信度。</p><div class="claim-grid"><article><span class="claim-tag">2026-05 · 345 星</span><h3><a href="https://github.com/alphadl/AdaRubrics" target="_blank" rel="noopener">AdaRubric</a>：定义任务专属标准</h3><p><b>可取：</b>从任务契约生成专属子标准，逐步给出分数与置信度；它能显示哪一维未达标，避免平均分掩盖致命失败。</p><p><b>边界：</b>它不替你选择策略：低分维度还要映射成可改的提示、工具、状态或约束；而且仍是很新的研究实现，rubric 生成本身也可能偏差。</p></article><article><span class="claim-tag">ICML 2025 · 801 星</span><h3><a href="https://github.com/metauto-ai/agent-as-a-judge" target="_blank" rel="noopener">Agent-as-a-Judge</a>：收集执行证据</h3><p><b>可取：</b>沿任务过程收集能支持或推翻结论的证据，把“为什么判断这里有问题”变成可复查依据。</p><p><b>边界：</b>评估与逐步反馈只是建议的证据输入，还要映射到可改动作；公开验证主要是 DevAI 代码任务，仍须保留可核验要求与人工复核入口。</p></article><article><span class="claim-tag">2026-02 · 132 星</span><h3><a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a>：定位失败步骤</h3><p><b>可取：</b>把轨迹归一化，先检查静态与逐步不变量，再定位关键失败环节；它为改进假设提供“问题在哪”的起点。</p><p><b>边界：</b>失败步骤与类型指出方案该对准哪里，之后仍需选择相应的修复动作；没有轨迹、工具契约和任务规则时，不能假装能定位根因。</p></article><article><span class="claim-tag">2026-03 · 735 星</span><h3><a href="https://github.com/claw-eval/claw-eval" target="_blank" rel="noopener">Claw-Eval</a>：验证完成与稳定性</h3><p><b>可取：</b>将完成、安全、稳定性分开；连续多次通过才视为可靠，用来判断问题是否只是偶发失败。</p><p><b>边界：</b>它验证某个改动是否稳定，而不解释根因；建议本身仍要来自前面的任务分析。它是通用基准，不能替代具体系统的分析。</p></article></div><div class="evidence"><b>从发现到建议：</b>任务标准回答“该看什么”；过程证据回答“发生了什么”；失败定位回答“问题在哪”；再给出可改动作及其作用机制，才形成一条可审查的改进建议。</div><div class="claim-grid"><article><h3>功能交付 Agent</h3><p>正确性、范围控制、回归处理、验证完整性。</p></article><article><h3>缺陷修复 Agent</h3><p>复现、根因、最小修改、邻近回归。</p></article><article><h3>业务操作 Agent</h3><p>目标状态、授权、工具参数、幂等与恢复。</p></article><article><h3>检索型 Agent</h3><p>证据召回、忠实性、引用、上下文选择。</p></article><article><h3>多 Agent 协作</h3><p>职责边界、交接质量、共享状态、隔离与降级。</p></article></div><div class="evidence"><b>结论边界：</b>没有目标 Agent 的真实任务和轨迹时，只能审查建议是否匹配任务、机制与外部证据，不能断言实际效果。</div></section>`}

function knowledgeSources(){return `<section class="evidence-panel"><h3>知识体系的来源、日期与取舍</h3><p>本页按能力闭环组织，不按某个框架的 API 目录组织。每张卡片的“最后核对”表示本页编辑审校日期；活跃规范以原始规范为准，研究结论以论文与适用条件为准，工程原则必须回到本地任务验证。</p><div class="evidence-strip"><b>活跃规范：</b><a href="https://modelcontextprotocol.io/specification/2025-11-25" target="_blank" rel="noopener">MCP 2025-11 规范</a>（核对 2026-07-27）、<a href="https://a2a-protocol.org/latest/specification/" target="_blank" rel="noopener">A2A 规范</a>（核对 2026-07-27）。<b>安全边界：</b><a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP AI Agent Security</a>（核对 2026-07-27）。<b>研究基线：</b>各卡片引用的原始论文只支持其研究条件，不承诺当前项目效果。</div></section>`}
const CARD_BODY_OVERRIDES = {
  "ReAct 范式：推理+行动交替循环": `<p><b>ReAct 指模型在“选择行动”和“读取外部观察”之间循环。</b>它解决的是下一步依赖真实工具结果或环境状态的任务，不是比 CoT 更高级的默认方案。</p><ul><li><b>Action</b>：模型提出受限的工具调用或下一步。</li><li><b>Observation</b>：应用返回经过边界处理的工具结果、错误或状态变化。</li><li><b>State</b>：应用保存任务进度、预算、已执行动作和外部终态；这部分不应只存在于模型消息里。</li><li><b>Termination</b>：由可验证终态、预算、重复无进展、授权需求或人工接管触发。</li></ul><p><b>何时用：</b>外部观察会改变后续路径，例如排障、检索后决策或跨系统协调。<b>何时不用：</b>步骤已知、无外部动作或可用确定性工作流完成时。</p><p><b>实现边界：</b>不同模型 API 对 tool message 的字段和角色定义不同，应遵循该平台的消息契约；不要把展示给用户的内部推理当作可靠的审计记录。</p>`,
  "CoT / Plan-Execute / ToT / Reflection 对比与选型": `<p><b>这些是控制循环的设计选项，不是从“低级”到“高级”的固定阶梯。</b>先判断下一步是否真的依赖外部观察、是否存在可验证反馈，再选择最小足够的控制方式。</p><ul><li><b>CoT / 直接生成</b>：路径短、无需外部事实或动作时使用；它不保证事实正确。</li><li><b>ReAct</b>：工具或环境返回会改变下一步时使用；成本取决于真实轨迹、工具延迟和上下文，不存在通用倍数。</li><li><b>Plan-and-Execute</b>：高层步骤可预判时先形成计划，在关键观察点重规划；它不天然更省 Token。</li><li><b>ToT / 搜索</b>：候选有限、可比较、错误代价高时才值得探索多路径；需要可靠评估函数。</li><li><b>Reflection</b>：只有测试、工具结果或明确的<b>评分标准（rubric）</b>能指出错误时才有价值；模型自我复述不能作为修复证据。</li></ul><p><b>当前常见做法：</b>用确定性工作流包住模型，把复杂选择限制在少数节点；用同一批代表任务比较完成率、工具错误、P95 延迟、成本和安全拒绝率。<b>不要写“默认提升 X%”或“固定多 Y 倍成本”</b>，这类数字没有离开原实验和本地对照就没有意义。</p>`,
  "Agent Loop 设计与终止策略": `<p><b>Agent Loop 是“读取状态 → 选择受限动作 → 执行 → 记录观察 → 检查终态”的循环。</b>模型可以提议下一步，但任务状态、权限和停止条件应由应用维护。</p><p><b>最低限度的停止与恢复设计：</b></p><ul><li><b>终态</b>：外部状态已达成、答案已被证据支持、明确拒绝，或安全地交给人工。</li><li><b>预算</b>：步骤、时长、工具次数和费用均有任务级上限；具体数值由风险和任务分布决定，不存在“通常 10 步”。</li><li><b>重复检测</b>：根据工具、规范化参数和状态是否没有变化判断；不要只用“连续两次相同”当成普适规则。</li><li><b>失败分类</b>：参数错误可让模型修正；可重试的临时故障按工具语义退避；业务拒绝、权限不足和非幂等写入不应盲目重试。</li><li><b>恢复</b>：副作用动作保存幂等键或 checkpoint；重启后先查询外部状态，再决定继续、补偿或转人工。</li></ul><p><b>落地 gap：</b>一段 Thought/Action 提示词不是运行时。生产代码还需要状态持久化、策略网关、审计事件和可复现的任务夹具。</p>`,
  "MCP 协议：架构、实现与局限": `<p><b>MCP 是模型应用与外部工具/上下文服务之间的开放协议。</b>它定义 Host、Client、Server 的连接、能力协商和消息交互；Server 可提供 Tools、Resources 与 Prompts。</p><p><b>何时采用：</b>当同一套工具或数据能力需要被多个兼容 Host 使用，或者需要标准化能力发现和接入方式时。<b>不应采用：</b>同一进程内的简单确定性函数，只会增加部署与治理成本。</p><p><b>与 Function Calling / A2A 的关系：</b>Function Calling 是某个模型 API 中的调用契约；MCP 是应用到工具/上下文服务的协议；A2A 是独立 Agent 间的任务协作协议。三者可组合，也可以各自独立。</p><p><b>落地 gap：</b>协议互通不等于授权、信任、业务校验或验收。远程 Server 仍要处理来源/身份验证、最小权限、用户同意、工具输出隔离、超时和审计。版本与传输细节以链接中的原始规范为准，页面核对日期为 2026-07-27。</p>`,
  "运行状态、会话上下文与长期记忆": `<p><b>不要按“固定三层”背架构，按责任划分信息。</b></p><ul><li><b>运行状态</b>：任务进度、预算、待处理动作、幂等键和恢复点；丢失后任务无法安全继续。</li><li><b>会话上下文</b>：本轮模型调用选择的近期信息；它不是数据库，也不应承担恢复责任。</li><li><b>长期记忆</b>：跨任务仍有价值且获得授权的用户事实、偏好或历史决策；必须带来源、时间、置信度、作用域和删除策略。</li><li><b>知识库</b>：可检索、可更新、可引用的文档或数据；与用户记忆分开管理。</li></ul><p><b>当前常见做法：</b>先用产品已有数据库和任务状态存储解决结构化事实与恢复，再按确有需要增加向量检索。Redis、TTL 30 分钟、某个向量库或“向量库 + 关系库”都不是通用标准。</p><p><b>安全边界：</b>外部输入写入长期记忆前要验证与隔离；用户应能查看、更正或删除自己的记忆。</p>`,
  "上下文工程与压缩策略": `<p><b>上下文工程的目标是为当前决策选择足够、可信、被授权的信息，不是把窗口填满。</b></p><ul><li><b>保留结构化状态</b>：目标、约束、已完成动作、未决问题、关键实体和异常比逐句聊天记录更容易恢复和审计。</li><li><b>按需装载</b>：历史、工具定义、文档、示例都应根据当前任务选择；原始证据留在系统记录中，摘要只服务当前决策。</li><li><b>压缩前评估</b>：用代表任务测试摘要是否丢失权限、时间、未完成动作或关键事实；不要默认“压缩模型输出优先”。</li><li><b>长文档处理</b>：切分、重叠、排序和摘要策略取决于文档结构、问题类型与召回评测，没有固定窗口、阈值或重叠比例。</li></ul><p><b>落地 gap：</b>上下文变长时，问题可能来自检索错误、状态丢失、权限混入或生成约束，而不是单纯 Token 不够。先定位失败层，再调压缩参数。</p>`
  ,"工具设计模式：错误处理与安全控制": `<p><b>工具调用要把“模型建议”与“系统执行”分开。</b>错误处理和安全控制都应按信任边界与业务后果设计，而不是只靠提示词或关键词过滤。</p><ul><li><b>参数/语义错误</b>：结构校验和业务前置条件失败时，返回可理解的错误；只有可恢复的问题才让模型重试或改参。</li><li><b>临时执行错误</b>：网络、限流或依赖故障可在幂等前提下按退避策略处理；把失败类型、重试和最终结果写入事件。</li><li><b>业务拒绝</b>：余额不足、资源状态冲突、权限不足等不是重试对象，应反馈原因和安全下一步。</li><li><b>授权与审批</b>：按用户、会话、工具、资源和动作范围授权。支付、删除、外发、权限变更等高影响动作需要独立策略校验和明确确认。</li><li><b>不可信输入</b>：用户消息、网页、检索文档、邮件和工具返回都可能含注入指令；区分数据与指令，限制工具能力并隔离输出。</li></ul><p><b>审计最小集：</b>任务/会话 ID、版本、调用主体、工具和规范化参数、授权决定、结果、耗时、重试与外部状态。敏感参数按最小必要原则脱敏和保留。</p>`
  ,"多 Agent 协作模式与选型": `<p><b>多 Agent 的价值来自独立职责、权限边界或可并行的子任务，不来自角色数量。</b>先把任务拆成可交付、可验证、可失败隔离的单元，再决定是否需要多个 Agent。</p><ul><li><b>编排式</b>：一个控制器持有任务状态并委托子任务；适合需要统一验收、审批和恢复的流程。</li><li><b>事件/消息式</b>：独立服务通过消息协作；适合异步、跨团队边界，但必须定义幂等、版本与死信处理。</li><li><b>专长式</b>：不同 Agent 拥有不同工具或数据权限；交接必须包含目标、证据、产物格式、状态和完成条件。</li><li><b>交叉评审</b>：只有存在明确 rubric 或外部测试时才有意义；投票本身不保证正确。</li></ul><p><b>何时不拆：</b>同一模型、同一权限、同一上下文内的顺序步骤，通常应先保留为单 Agent 或工作流。<b>常见 gap：</b>共享状态所有权、权限传播、超时、重试、部分失败与外部副作用，比“如何让 Agent 对话”更难。</p>`
  ,"Agent 系统架构设计（五层）": `<p><b>不存在适用于所有产品的“生产级五层架构”。</b>应按责任边界组织，而不是按框图数量组织。</p><ul><li><b>接入与任务契约</b>：身份、输入、目标、权限和成功终态。</li><li><b>编排与状态</b>：工作流、预算、checkpoint、恢复和人工接管。</li><li><b>模型决策</b>：只在需要理解、选择或生成的受限节点调用模型。</li><li><b>能力网关</b>：工具、检索、外部 API 的验证、授权、幂等和超时。</li><li><b>治理与证据</b>：输出校验、审计、指标、评估集、版本和回退。</li></ul><p><b>当前常见做法：</b>确定性问题优先在模型外解决；高影响动作由独立策略和审批组件判定；每个外部副作用都能恢复或说明不可恢复。具体渠道、FAQ 分流比例、审批超时和组件数量都应由任务数据决定。</p>`
  ,"安全防护：幻觉控制 + Prompt 注入防御": `<p><b>“零幻觉”不是可实现承诺；安全目标是让错误不越过业务边界，并让不确定性可见、可拒绝、可追溯。</b></p><ul><li><b>事实与引用</b>：需要外部事实时检索可授权来源，并分别评估召回、引用正确和答案忠实性；模型自评置信度不能单独当安全控制。</li><li><b>工具与权限</b>：工具按最小权限、资源范围和动作风险授权；高影响动作由独立策略验证并绑定到具体参数和确认记录。</li><li><b>提示注入</b>：用户、网页、文档、邮件和工具输出都按不可信数据处理。关键词过滤可作为弱信号，不能作为主要防线；关键防线是数据/指令分离、能力限制、输出隔离和服务端校验。</li><li><b>验证与演练</b>：把越权、数据泄露、间接注入、重复副作用和拒绝路径放进测试集与发布门禁。</li></ul><p><b>适用边界：</b>医疗、金融、权限和外发等高风险场景还需要领域合规、人工责任链和专门的程序断言。</p>`
  ,"性能与成本优化": `<p><b>性能优化从任务分解和测量开始，不从“换小模型”开始。</b>先在代表流量中拆出模型等待、工具等待、检索、重试、上下文和输出的成本。</p><ul><li><b>减少不必要调用</b>：对确定性计算、格式校验和已知答案使用程序或缓存；缓存键必须包含权限、输入和知识版本。</li><li><b>路由</b>：按质量、风险、延迟和成本门槛为不同子任务选择模型或降级路径，而不是把所有请求送入同一 Agent。</li><li><b>并发与批处理</b>：仅并发无依赖且不会放大外部风险的调用；对限流和取消保持可见。</li><li><b>优化验收</b>：同时比较任务完成、P50/P95 延迟、单任务成本、工具错误和安全拒绝；成本下降但成功率下降不算优化。</li></ul><p><b>不要承诺固定节省比例或缓存命中率。</b>这些数值高度依赖任务分布、模型价格、上下文和数据新鲜度。</p>`
  ,"RAG 全链路：7 步完整流程": `<p><b>RAG 是从“找证据”到“基于证据作答”的可测链路，不是固定七步配方。</b></p><ol><li><b>证据标准</b>：定义可授权、可引用的正确证据，以及无证据时如何拒答或转人工。</li><li><b>解析与切分</b>：保留文档结构、版本、更新时间与权限；策略由语料和问题集验证。</li><li><b>建索引</b>：让文档、chunk、embedding 和索引版本可追溯。</li><li><b>召回与融合</b>：先以 Recall@K 等指标确认正确证据进入候选。RRF 的 <code>k=60</code> 只是常见初始参数，权重和候选数必须调测。</li><li><b>重排与选择</b>：候选噪声会影响模型时再考虑 reranker；上下文要保留来源和必要语境。</li><li><b>受约束生成</b>：答案区分证据、推断和未知项，引用绑定到实际使用的片段。</li><li><b>评测</b>：分别检查召回、排序、引用正确、忠实性、完成率、延迟、成本和拒答质量。</li></ol><p><b>排障顺序：</b>先问正确证据是否被召回；再看排序和上下文；最后才看生成。没有答案的语料不能靠更长 Prompt 修复。</p>`
  ,"混合检索 / Rerank / Agentic RAG / GraphRAG": `<p><b>这些解决不同检索失效，不是从低到高的升级路线。</b></p><ul><li><b>混合检索</b>：稀疏检索擅长字面匹配，稠密检索擅长语义相近；当问题同时需要术语、编号与语义时，比较二者及融合。</li><li><b>Rerank</b>：在已有候选中细排；只在正确证据已入候选但排序不佳时才可能有效，并会增加延迟与成本。</li><li><b>Agentic RAG</b>：依据证据缺口继续检索、改写或调用数据源。它需要停止条件、预算、来源范围和可审计轨迹；不适合稳定的一次检索任务。</li><li><b>GraphRAG</b>：将实体、关系和证据片段组织为图，适合多跳关系、全局主题或实体消歧。图谱抽取错误、更新成本、访问控制和回链原文都要单独验证。</li></ul><p><b>选型方法：</b>从失败样本开始：编号查不到先检查稀疏召回；候选有答案却排不前先测 rerank；跨源、多步证据再评估 Agentic RAG；确有关系推理与维护能力时再考虑图结构。</p>`
  ,"可观测性 + 评估体系": `<p><b>可观测性回答“发生了什么”，评估回答“是否达成任务”。两者都应围绕任务契约，不应围绕某个观测平台。</b></p><ul><li><b>最小 Trace</b>：任务/会话 ID、版本、状态转换、模型与工具调用、授权/拦截、重试、耗时、成本和最终外部状态；敏感内容最小化、脱敏。</li><li><b>指标</b>：任务完成、关键安全拒绝、工具错误、延迟分位数、单任务成本和人工接管。“幻觉率”必须先定义判定规则和样本范围。</li><li><b>离线评测</b>：从真实失败、关键路径、边界和对抗样本建集；按任务选最终答案、工具参数、轨迹或外部终态作为 oracle。</li><li><b>在线验证</b>：灰度比较版本，观察完成、失败类型、成本和安全事件；非确定性任务重复运行并报告分布，次数取决于风险与置信度需求。</li></ul><p><b>工具选择：</b>LangSmith、Langfuse、Phoenix 等只是实现选项。选择时看数据驻留、采样、脱敏、导出、成本和是否支持你的 Trace/评测对象。</p>`
};
