<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Agent 开发知识体系</title>
<style>
:root{--bg:#f8f9fb;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--dim:#9ca3af;--blue:#2563eb;--blue-bg:#eff6ff;--purple:#7c3aed;--purple-bg:#f5f3ff;--green:#059669;--green-bg:#ecfdf5;--amber:#d97706;--amber-bg:#fffbeb;--red:#dc2626;--red-bg:#fef2f2;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;font-size:14px}
button{font:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;z-index:10}
.sidebar-title{padding:16px 20px 12px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-toggle{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:4px 9px;font-size:12px;line-height:1.4;cursor:pointer}
.nav-tree{padding:8px 0}
.nav-group{margin-bottom:2px}
.nav-group-label{display:flex;align-items:center;gap:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);user-select:none}
.nav-group-label:hover{background:var(--bg)}
.nav-group-label .arrow{font-size:10px;color:var(--dim);transition:transform .2s;width:12px}
.nav-group-label .arrow.open{transform:rotate(90deg)}
.nav-children{display:none}
.nav-children.show{display:block}
.nav-item{padding:5px 16px 5px 36px;font-size:12px;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--blue);border-left-color:var(--blue);background:var(--blue-bg);font-weight:600}

/* Main */
.main{flex:1;min-width:0}
.top-tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:20}
.top-tab{padding:14px 24px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.top-tab:hover{color:var(--text)}
.top-tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* Q&A Banner */
.qa-banner{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 28px}
.qa-banner h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--amber)}
.qa-item{margin-bottom:10px;font-size:13px;line-height:1.8}
.qa-item .q{font-weight:600;color:var(--text)}
.qa-item .q::before{content:"Q: ";color:var(--blue);font-weight:700}
.qa-item .a{color:var(--muted);margin-left:0}
.qa-item .a::before{content:"A: ";color:var(--green);font-weight:700}
.qa-focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.qa-focus-item{padding:11px 13px;border-top:2px solid var(--blue);background:#f8fbff}.qa-focus-item:nth-child(2){border-top-color:var(--green);background:#f3fbf7}.qa-focus-item:nth-child(3){border-top-color:var(--amber);background:#fffaf0}.qa-focus-item:nth-child(4){border-top-color:var(--purple);background:var(--purple-bg)}.qa-focus-item b{display:block;font-size:13px;line-height:1.5;margin-bottom:4px}.qa-focus-item span{display:block;font-size:12px;line-height:1.6;color:var(--muted)}

/* Content */
.content{padding:24px 28px;width:100%;max-width:none}
.content.knowledge-view{max-width:1440px}
.content.eval-view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.content.eval-view .section{margin-bottom:0}
.section{margin-bottom:40px}
.section-title{font-size:18px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.section-title .icon{font-size:22px}
.section-desc{font-size:13px;color:var(--muted);margin-bottom:20px}
.kp{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;transition:border-color .15s}
.kp:hover{border-color:var(--blue)}
.kp h4{font-size:15px;font-weight:600;margin-bottom:8px}
.kp .tags{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.kp .tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--dim)}
.kp .body{font-size:13px;line-height:1.9;color:var(--text)}
.kp .body b{color:var(--text)}
.kp .body p{margin-bottom:10px}
.kp .body ul{margin:6px 0 10px 18px}
.kp .body li{margin-bottom:4px}
.kp pre{overflow-x:auto;max-width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:#f7f9fc;font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.kp .refs{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.kp .refs a{font-size:11px;color:var(--blue);text-decoration:none;margin-right:12px}
.kp .refs a:hover{text-decoration:underline}

/* Eval dimensions */
.eval-dim{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px}
.eval-dim h4{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.eval-dim h4 .num{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.eval-dim .why{font-size:12px;color:var(--amber);margin-bottom:10px;font-style:italic}
.eval-dim .check-list{font-size:13px;color:var(--text);line-height:1.9}
.eval-dim .check-list b{color:var(--text)}
.eval-dim .good-bad{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.eval-dim .good{background:var(--green-bg);border-radius:var(--radius);padding:10px 14px;font-size:12px}
.eval-dim .bad{background:var(--red-bg);border-radius:var(--radius);padding:10px 14px;font-size:12px}
.eval-dim .good b{color:var(--green)}
.eval-dim .bad b{color:var(--red)}
.eval-dim .link{font-size:11px;color:var(--blue);margin-top:8px}
.eval-dim .improve{font-size:12px;background:var(--amber-bg);border-radius:var(--radius);padding:8px 12px;margin-top:8px;color:var(--amber)}
.workbench,.system-map,.scenario-matrix,.comparison-board{margin:0 0 28px;padding:22px 24px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.knowledge-compass{margin:0 0 28px;padding:22px 24px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.compass-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden}.compass-step{padding:15px 16px;border-right:1px solid var(--border);background:#fff}.compass-step:last-child{border-right:0}.compass-step h3{font-size:14px;line-height:1.45;margin-bottom:6px}.compass-step p{font-size:12px;line-height:1.65;color:var(--muted)}.compass-step b{display:block;margin-top:8px;font-size:11px;color:var(--green)}
.content.eval-view .workbench,.content.eval-view .scenario-matrix,.content.eval-view .comparison-board{grid-column:1/-1}
.kicker{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:5px}.workbench h2,.system-map h2,.scenario-matrix h2,.comparison-board h2{font-size:18px;line-height:1.45;margin-bottom:6px}.workbench>p,.system-map>p,.scenario-matrix>p,.comparison-board>p{font-size:13px;color:var(--muted);margin-bottom:17px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:7px;overflow:hidden}.flow>div{min-height:125px;padding:14px 15px;border-right:1px solid var(--border)}.flow>div:last-child{border:0}.flow b{display:block;font-size:13px;margin-bottom:5px}.flow span,.flow small{display:block;font-size:12px;color:var(--muted);line-height:1.6}.flow small{color:var(--green);font-weight:700;margin-top:7px}
.question-grid,.scenario-grid,.diagnostic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.question-grid>div,.scenario-grid>article,.diagnostic-grid>div{padding:14px;border:1px solid var(--border);background:#fff}.question-grid b,.scenario-grid h3,.diagnostic-grid h3{display:block;font-size:13px;margin-bottom:6px}.question-grid span,.scenario-grid p,.scenario-grid li,.diagnostic-grid p{font-size:12px;color:var(--muted);line-height:1.65}.scenario-grid ul{margin:6px 0 0 17px}.scenario-grid small{display:block;color:var(--green);font-size:11px;font-weight:700;margin-top:8px}
.map-row{display:grid;grid-template-columns:130px repeat(4,minmax(0,1fr));border:1px solid var(--border);border-bottom:0}.map-row:last-of-type{border-bottom:1px solid var(--border)}.map-row>div{padding:13px;border-left:1px solid var(--border);font-size:12px;line-height:1.6}.map-row>div:first-child{border-left:0;background:#f7f9fc;font-weight:700;display:flex;align-items:center}.map-row b{display:block;font-size:13px;margin-bottom:5px}.map-row span{display:block;color:var(--amber);font-size:11px;margin-top:6px}.map-row small{display:block;color:var(--green);font-size:11px}
.compare{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.compare>section{padding:16px;border:1px solid var(--border);border-radius:7px}.compare>section:first-child{background:#fffafa}.compare>section:last-child{background:#f4fbf7}.compare h3{font-size:14px;margin-bottom:7px}.compare li{font-size:12px;line-height:1.65}.compare ul{margin-left:17px}.compare>div{display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--blue)}
.evaluation-lab{border-color:#c8d7f1}.experiment-context{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0 12px}.experiment-context span{padding:4px 8px;border-radius:4px;background:#f1f5fb;color:#385073;font-size:11px;font-weight:700}.experiment-tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px}.experiment-track{padding:15px;border:1px solid var(--border);border-radius:7px}.experiment-track.baseline{background:#fffafa;border-color:#efcaca}.experiment-track.supported{background:#f4fbf7;border-color:#bfe1ce}.track-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.track-header h3{font-size:14px}.track-status{font-size:11px;font-weight:700;padding:3px 7px;border-radius:999px}.baseline .track-status{background:#fee2e2;color:#a33}.supported .track-status{background:#dcfce7;color:#087a4b}.trace-line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.trace-node{position:relative;min-height:92px;padding:10px 9px;border:1px solid var(--border);background:#fff}.trace-node:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:34px;z-index:2;color:var(--dim);font-size:16px}.trace-node b{display:block;font-size:12px;line-height:1.45;margin-bottom:4px}.trace-node span{display:block;font-size:11px;line-height:1.55;color:var(--muted)}.trace-node.fault{border-color:#eea7a7;background:#fff5f5}.trace-node.fault b{color:#b42318}.trace-node.fix{border-color:#95cfad;background:#f3fbf6}.trace-node.fix b{color:#087a4b}.track-result{margin:11px 0 0;padding-top:10px;border-top:1px solid rgba(15,23,42,.1);font-size:12px;line-height:1.65}.baseline .track-result b{color:#b42318}.supported .track-result b{color:#087a4b}.intervention-bridge{display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr;gap:8px;align-items:center;margin:14px 0;padding:12px;border:1px dashed #a9bde0;background:#f7faff}.intervention-bridge>div{padding:9px 10px;background:#fff;border-top:2px solid var(--blue);font-size:12px;line-height:1.55}.intervention-bridge>div:nth-of-type(2){border-top-color:var(--amber)}.intervention-bridge>div:nth-of-type(3){border-top-color:var(--green)}.intervention-bridge b{display:block;font-size:12px;margin-bottom:3px}.intervention-arrow{text-align:center;color:var(--blue);font-size:19px;font-weight:700}.decision-gate{display:grid;grid-template-columns:1fr 34px 1.1fr;gap:10px;align-items:stretch;margin-top:14px}.gate-checks,.gate-outcome{padding:12px 13px;border:1px solid var(--border);font-size:12px;line-height:1.65}.gate-checks{background:#f8fbff}.gate-checks b,.gate-outcome b{display:block;font-size:13px;margin-bottom:4px}.gate-arrow{display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:22px}.gate-outcome{background:#f4fbf7;border-color:#bfe1ce}.gate-outcome em{display:block;margin-top:5px;color:#9b5b00;font-style:normal}
.matrix{width:100%;margin-top:14px;border-collapse:collapse;font-size:12px}.matrix th,.matrix td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}.matrix th{background:#f7f9fc}.matrix td:last-child{color:var(--green);font-weight:700}.evidence{margin-top:14px;padding:12px 14px;border-left:4px solid var(--blue);background:#f5f8ff;font-size:12px;line-height:1.7}.evidence b{color:var(--text)}
.evidence-map{margin:0 0 28px;padding:22px 24px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}.evidence-map h2{font-size:18px;line-height:1.45;margin-bottom:6px}.evidence-map>p{font-size:13px;color:var(--muted);margin-bottom:17px}.confidence-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.confidence-grid>div{padding:11px 13px;background:#f8fbff;border-top:2px solid var(--blue);font-size:12px;line-height:1.65}.confidence-grid>div:nth-child(2){border-top-color:var(--amber);background:#fffaf0}.confidence-grid>div:nth-child(3){border-top-color:var(--purple);background:var(--purple-bg)}.confidence-grid b{display:block;font-size:13px;margin-bottom:4px}.claim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.claim-grid article{padding:16px;border:1px solid var(--border);border-radius:7px;background:#fff}.claim-grid h3{font-size:14px;line-height:1.5;margin:5px 0 7px}.claim-grid p{font-size:12px;line-height:1.68;color:var(--muted);margin-bottom:8px}.claim-grid b{color:var(--text)}.claim-grid a{color:var(--blue);text-decoration:none}.claim-tag{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--blue-bg);color:var(--blue);font-size:11px;font-weight:700;margin-right:5px}.claim-tag.caution{background:var(--amber-bg);color:var(--amber)}.workbench> .question-grid:first-of-type{display:none}

.local-notice{background:var(--amber-bg);border:1px solid #fde68a;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:13px;color:var(--amber)}
.local-notice b{color:#92400e}
.qa-details{margin-top:6px}
.qa-details summary{cursor:pointer;color:var(--blue);font-weight:600;list-style-position:inside}
.qa-details[open] summary{margin-bottom:10px}
.section,.kp,.eval-dim{scroll-margin-top:118px}
@media(max-width:1100px){.content.eval-view{grid-template-columns:1fr}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.question-grid,.scenario-grid,.diagnostic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  body{font-size:14px;line-height:1.7}
  .app{display:block}
  .top-tabs{display:flex;height:52px;padding:0;overflow:hidden}
  .top-tab{flex:1;min-width:0;padding:12px 4px 11px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .sidebar{width:100%;height:auto;position:fixed;top:52px;left:0;overflow:visible;border-right:none;border-bottom:1px solid var(--border);z-index:19}
  .sidebar-title{padding:9px 16px;font-size:13px}
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center}
  .nav-tree{display:none;max-height:52vh;overflow-y:auto;padding:6px 0;background:var(--surface);border-top:1px solid var(--border)}
  .sidebar.mobile-open .nav-tree{display:block}
  .nav-group-label{padding:8px 16px;font-size:12px}
  .nav-item{padding:7px 16px 7px 34px;font-size:12px}
  .qa-banner{margin-top:42px;padding:14px 16px}
  .qa-banner h3{font-size:14px;margin-bottom:5px}
  .qa-item{font-size:13px;line-height:1.7;margin-bottom:8px}
  .qa-focus-grid{grid-template-columns:1fr}
  .content{padding:18px 16px}
  .section{margin-bottom:28px}
  .section-title{font-size:17px;line-height:1.45}
  .section-desc{line-height:1.7;margin-bottom:14px}
  .kp,.eval-dim{padding:16px;margin-bottom:12px}
  .kp h4,.eval-dim h4{font-size:14px;line-height:1.55}
  .kp .body,.eval-dim .check-list{font-size:13px;line-height:1.8}
  .kp pre{font-size:11px;padding:10px}
  .eval-dim .good-bad{grid-template-columns:1fr;gap:8px}
  .section,.kp,.eval-dim{scroll-margin-top:150px}
  .workbench,.knowledge-compass,.system-map,.scenario-matrix,.comparison-board,.evidence-map{padding:17px 16px}.flow,.question-grid,.scenario-grid,.diagnostic-grid,.compass-grid,.confidence-grid,.claim-grid,.experiment-tracks{grid-template-columns:1fr}.flow>div,.compass-step{min-height:auto;border-right:0;border-bottom:1px solid var(--border)}.flow>div:last-child,.compass-step:last-child{border-bottom:0}.map-row{display:block;border-bottom:1px solid var(--border)}.map-row>div{border-left:0;border-top:1px solid var(--border)}.map-row>div:first-child{border-top:0}.compare{grid-template-columns:1fr}.compare>div{height:25px;transform:rotate(90deg)}.trace-line{grid-template-columns:1fr;gap:18px}.trace-node{min-height:0}.trace-node:not(:last-child)::after{content:"↓";right:auto;left:calc(50% - 5px);top:auto;bottom:-20px}.intervention-bridge{grid-template-columns:1fr;gap:6px}.intervention-arrow{transform:rotate(90deg);height:18px}.decision-gate{grid-template-columns:1fr}.gate-arrow{height:20px;transform:rotate(90deg)}.matrix{display:block;overflow-x:auto;min-width:560px}
}
</style>
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="sidebar-title"><span id="navTitle">AI Agent 开发知识体系</span><button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" title="展开目录">目录</button></div>
  <div class="nav-tree" id="navTree"></div>
</aside>

<div class="main">
<div class="top-tabs">
  <button class="top-tab active" data-tab="knowledge">📚 知识体系</button>
  <button class="top-tab" data-tab="eval">🔍 评估框架</button>
</div>

<div class="qa-banner" id="qaBanner"><h3>页面正在加载</h3><div class="qa-item"><div class="a">正在初始化知识体系内容。</div></div></div>
<div class="content" id="content"><div class="local-notice">如果此提示长时间不消失，说明页面脚本加载失败，请强制刷新或检查控制台错误。</div></div>

</div>
</div>

<script>
window.addEventListener("error", function(event) {
  const banner = document.getElementById("qaBanner");
  const content = document.getElementById("content");
  if (banner) banner.innerHTML = '<div class="qa-banner"><h3>页面加载失败</h3></div>';
  if (content) content.innerHTML = '<div class="local-notice"><b>页面脚本执行失败：</b>' + String(event.message || "未知错误") + '</div>';
});
</script>

<script>
// ==================== DATA ====================
const KNOWLEDGE = {
  qa:   [
    {
      "q": "面对一个真实任务，我现在该补哪一层知识？",
      "a": "先分清任务边界、运行机制、状态与知识、协作治理和工程可靠性；不要从框架名倒推需求，也不要把所有问题都归为模型能力。"
    },
    {
      "q": "这些知识点怎样连成一次完整的 Agent 工作？",
      "a": "从任务与约束出发，经由推理、工具、记忆和检索完成动作，再用安全、观测与恢复让它可长期运行；每一层都有明确输入、输出和失效边界。"
    },
    {
      "q": "什么才算真正理解，而不只是记住概念？",
      "a": "能针对一个任务说清为什么用 Agent、该选规则还是工作流、每一步依赖什么状态和工具、会在哪失败，以及该回到哪个知识域解决。"
    }
  ],
  categories: [
    {
      id:"reasoning", icon:"🧠", name:"推理与决策",
      desc:"Agent 如何思考、规划、做出决策。这是 Agent 区别于 Chatbot 的核心——不只是生成文本，而是闭环决策。",
      items: [
                {
          "title": "ReAct 范式：推理+行动交替循环",
          "tags": [
            "ReAct",
            "核心",
            "必会"
          ],
          "body": "<p><b>ReAct = Reasoning + Acting</b>（Google 2022）。核心思想：让 LLM 在生成中交替进行<b>推理(Thought)和行动(Action)</b>，并接收外部工具返回的<b>观察(Observation)</b>，把推理锚定在真实数据上。</p>\n<p><b>标准循环：</b></p>\n<ul>\n<li><b>Thought</b>：LLM 分析当前状态，决定下一步做什么</li>\n<li><b>Action</b>：调用工具（Function Call），如 search_order(order_id=\"123\")</li>\n<li><b>Observation</b>：工具返回结果，如 {\"status\":\"已发货\",\"items\":[...]}</li>\n<li>回到 Thought，基于 Observation 决定下一步，直到输出 Final Answer</li>\n</ul>\n<p><b>为什么 ReAct 比 CoT 好：</b>CoT 纯靠模型内部知识推理，容易\"空想\"——比如模型不知道今天天气，只能猜。ReAct 调天气 API 获取真实数据，推理基于事实。</p>\n<p><b>消息格式设计：</b>Observation 用 <b>tool 角色而非 assistant 角色</b>回传。因为 Observation 是外部系统返回的内容，不是模型生成的。如果放 assistant 角色，模型会以为自己说了这些话，后续推理会混乱。</p>\n<p><b>消息格式示例：</b></p>\n<pre>system: 你是客服Agent，可用工具：search_order\nuser: 帮我查订单123的状态\nassistant: Thought: 用户要查订单状态，调用search_order\n        Action: search_order(order_id=\"123\")\ntool: {\"status\":\"已发货\",\"carrier\":\"顺丰\"}\nassistant: Thought: 订单已发货，用顺丰。用户可能想查物流\n        Final Answer: 您的订单123已通过顺丰发货。</pre>\n<p><b>终止条件设计：</b>①最大步数硬限制（通常 10 步）；②LLM 主动输出 finish_reason=stop；③连续 2 步调用相同工具且参数相同→疑似死循环→强制停止。</p>\n<p><b>生产代价：</b>ReAct 每一步都要携带状态、工具定义和观察结果，成本取决于轨迹长度、输出与工具模式。简单任务优先直接响应或确定性流程；只有路径依赖外部观察时才启用循环。</p>",

              "t": "ReAct: Synergizing Reasoning and Acting (Google 2022)",
              "u": "https://arxiv.org/abs/2210.03629"
            }
          ]

          "body": "<p><b>四种推理范式核心区别：</b></p>\n<ul>\n<li><b>CoT (Chain of Thought)</b>：纯脑内推理，一步步想，不调工具。适合数学题、逻辑推理等不需要外部数据的任务。<b>缺点：</b>知识截止日期前的内容可能过时或幻觉。</li>\n<li><b>ReAct</b>：推理+行动交替。每步 Thought→Action→Observation。<b>适合</b>需要查资料、调 API 的任务。<b>代价</b>：每轮都要保留状态并调用工具，成本与延迟应按代表任务测量。</li>\n<li><b>Plan-and-Execute</b>：先制定完整计划，再逐步执行。<b>省 Token</b>（一次规划）、可控性强，但灵活度低——中间步骤发现错误时调整成本高。</li>\n<li><b>Tree of Thoughts (ToT)</b>：每步探索多条推理路径，用 BFS/DFS+评估函数选最优。<b>效果好但 Token 消耗是 CoT 的 3 倍</b>，只适合需要探索多路径的复杂推理。</li>\n<li><b>Reflection / Reflexion</b>：让 Agent 自我审查输出质量，决定是否重试或修正。Reflexion 在反馈与阶段性记忆下总结失败经验。它只在能获得测试、工具结果或明确评分反馈时才值得尝试，不能把自我复述当成可靠修复。</li>\n</ul>\n<p><b>选型决策树：</b></p>\n<ul>\n<li>任务路径不确定，需要观察中间结果 → <b>ReAct</b></li>\n<li>步骤明确可预判 → <b>Plan-Execute</b>（省 Token 可控）</li>\n<li>需要探索多种可能解 → <b>ToT</b>（贵但准）</li>\n<li>长链路任务容易出错 → <b>Reflection</b>（加倍 Token 但提升成功率）</li>\n<li>生产级系统 → <b>混合</b>：大步骤 Plan-Execute 规划，子步骤 ReAct 灵活执行，关键节点 Reflection 自检</li>\n</ul>\n<p><b>必须说出的 trade-off：</b>\"我们项目 CoT→ReAct 准确率提升 15%，但 Token 消耗多了 3 倍。所以简单查询走 CoT，复杂多步推理才用 ReAct。\"</p>",

          title:"Function Calling 完整实现",
          tags:["FC","核心","必会"],
          body:`<p><b>三步走流程：</b></p>
<ul>
<li><b>定义阶段</b>：在 API 的 tools 参数或 System Prompt 中定义 Tool Schema——name、description（给 LLM 看的，要说清何时用）、parameters（JSON Schema，含 type/enum/required）。</li>
<li><b>调用阶段</b>：LLM 判断需要调工具，输出 function_call JSON（function.name + function.arguments）。</li>
<li><b>执行阶段</b>：代码层解析 JSON → Pydantic 校验参数 → 执行实际函数 → 将结果包装为 tool 角色消息回传 LLM。</li>
</ul>
<p><b>Schema 设计原则（踩过的坑）：</b></p>
<ul>
<li>参数尽量用 <b>enum</b> 而非 free text——减少 LLM 输出随机性。如支付方式用 enum["alipay","wechat"] 而非 string。</li>

<li>必填字段标 required，可选字段给 default 值。</li>
</ul>
<p><b>稳定性保障三层：</b></p>
<ul>

<li><b>执行层</b>：try/except 包裹，超时 30s，网络错误重试 3 次（指数退避）。</li>

        {
          title:"MCP 协议：架构、实现与局限",
          tags:["MCP","标准化","2026热点"],
          body:`<p><b>MCP (Model Context Protocol)</b> 是 Agent/客户端与外部工具、资源交互的协议。它统一消息与能力声明，不替代工具的授权、输入校验或业务验收。</p>
<p><b>三层架构：</b></p>
<ul>
<li><b>Host</b>：LLM 应用（你的 Agent 系统）</li>
<li><b>Client</b>：协议客户端，1:1 连接一个 Server</li>
<li><b>Server</b>：暴露三种能力——Tools（模型可调用的函数）、Resources（应用可控的数据）、Prompts（预定义提示模板）</li>
</ul>
<p><b>传输层（2025-11）</b>：stdio（本地进程通信）或 Streamable HTTP；后者取代旧版 HTTP+SSE 传输。远程部署还要校验 Origin、认证与暴露范围。</p>
<p><b>核心价值——一次开发，多模型复用：</b></p>
<ul>
<li>原来开发一个"查数据库慢 SQL"工具，要分别适配 OpenAI/Claude/通义千问的 Function Calling 格式</li>
<li>用 MCP 写一次，任何支持 MCP 的模型都能调用</li>
</ul>
<p><b>vs Function Calling 的关系：</b>FC 是各模型厂商的 API 能力（格式略有差异）；MCP 是工具层的标准协议。<b>打个比方</b>——FC 像各自厂商的拨号盘，MCP 像定义了全球统一的电话号码格式。</p>
<p><b>vs Skill 的关系：</b>Skill 是能力单元（"查天气"），FC 是调用方式，MCP 是通信协议。三者层次不同。</p>
<p><b>边界（必须知道）：</b>协议互通不等于工具可信或已获授权；远程服务要做来源校验、身份认证、最小权限和工具输出隔离。延迟与流式能力取决于具体传输、实现和工具链，不能写成固定数字。</p>
<p><b>vs A2A 的关系：</b>MCP 管 Agent↔工具（垂直集成），A2A 管 Agent↔Agent（水平协作）。一个完整的多 Agent 系统两者都需要。</p>`,

          body:`<p><b>按生命周期和责任划分，而不是背一套“标准层数”：</b></p>

          title:"上下文工程与压缩策略",
          tags:["上下文","压缩","Token"],
          body:`<p><b>上下文工程的本质</b>不是"塞得下"，而是<b>"塞对的"</b>。核心挑战是<b>注意力竞争</b>——上下文越长，模型对关键信息的注意力越稀释（Lost in the Middle 现象）。</p>
<p><b>Token 预算管理器：</b></p>

- 工具定义: 800  
- 留给对话: 6892
→ 超过 5000(75%) 时自动触发压缩</pre>
<p><b>四种压缩策略：</b></p>
<ul>
<li><b>关键实体抽取</b>：保留人名/日期/金额/订单号等不可丢失的实体</li>
<li><b>结构化摘要</b>：用轻量模型对旧对话做 summarize，保留 5 维度——用户意图/已提取实体/待完成操作/当前进度/异常情况</li>
<li><b>滑动窗口</b>：最近 5 轮完整保留，更早的只留摘要</li>

</ul>
<p><b>关键原则——优先压缩模型输出，而非用户输入。</b>因为 LLM 的输出有很多填充词和客套话，信息密度低；用户的原始输入每句话都有价值。</p>

          body:`<p><b>7 步全链路，每步都有优化空间：</b></p>
<p><b>① Query 预处理</b>——用户说"咋退"→改写为标准查询"如何申请退货退款"。技术：Query Rewriting（补全简写/纠正错别字）、Query Expansion（生成多个同义查询增加召回）。</p>
<p><b>② Embedding 向量化</b>——用经过代表问题集验证的 Embedding 模型将 query 转为稠密向量；优先比较语言覆盖、召回、更新成本与权限边界，不绑定已过时的型号。</p>
<p><b>③ 双路召回</b>——按语料特征组合稠密与稀疏召回；候选数量由 Recall、延迟和噪声共同决定，不设通用 TopK。</p>

<p><b>⑤ Rerank 重排序</b>——当候选集噪声会挤占上下文时，用 reranker 对候选精排；是否值得增加这一层，要同时看检索质量、延迟和成本。</p>
<p><b>⑥ TopK 截断</b>——把最终上下文控制在任务能消化的证据量；K、片段大小与排序必须由代表问题集上的召回、忠实性和上下文干扰共同确定。</p>

<p><b>参数需要证据</b>：先用离线问题集检查召回、引用正确与忠实性，再根据流量、成本和风险决定是否做线上对照；不要把某次比例或 TopK 当作通用答案。</p>`,

          tags:["混合检索","Rerank","Agentic RAG","GraphRAG"],
          body:`<p><b>为什么需要混合检索：</b>向量检索擅长语义匹配（"退款"="退货"）但弱于精确关键词（订单号 ORD-12345 会被泛化）。BM25 擅长精确匹配但不懂语义。<b>两者互补</b>——向量抓"软匹配"，BM25 抓"硬匹配"。</p>
<p><b>融合比例不是标准答案</b>——取决于文档类型。FAQ 类（语义模糊）向量权重高；规则手册类（关键词重要）BM25 权重高。需要 A/B 测试。</p>
<p><b>Rerank 价值：</b>向量与稀疏检索负责扩大候选覆盖，reranker 负责在有限候选中识别更相关的证据。它可能改善排序，也会增加延迟和成本；是否采用必须在目标语料与问题集上验证。</p>
<p><b>Agentic RAG：</b>传统 RAG 可一次检索后生成；检索型 Agent 则会根据证据充分性继续检索、改写或调用其他工具。它适合路径确实依赖新证据的任务；循环次数、预算和停止条件必须受控。</p>
<p><b>GraphRAG：</b>在 RAG 基础上引入知识图谱——从文档中抽取实体和关系构建图结构。检索时沿图边做多跳遍历。适合理解实体间复杂关系的查询（供应链分析/组织架构）。代价：图谱构建和维护成本高。</p>`,

          "body": "<p><b>RAG 的问题往往在生成前就发生。</b>先按标题、段落、表格和代码块等文档结构切分，再用少量 overlap 保住跨段语义；不要给所有语料套同一个固定长度。</p>\n<ul>\n<li><b>切分：</b>记录 document_id、section、更新时间和权限；小块负责匹配，大块负责回传上下文。</li>\n<li><b>更新：</b>文档、chunk、embedding 和索引都要有版本。新索引完成评测后原子切换，缓存键也带知识版本。</li>\n<li><b>评测：</b>先看 Recall@K、MRR/NDCG 判断证据有没有被找回，再看引用正确性和 Faithfulness 判断答案有没有忠于证据。</li>\n</ul>\n<p><b>排障顺序：</b>答案错时先检查候选里是否有正确证据；有证据却答错才查重排、上下文组织和生成提示。</p>",

          body:`<p><b>四种协作模式：</b></p>
<ul>
<li><b>主从模式 (Orchestrator+Worker)</b>：中央编排器分配任务，Worker 执行并返回。适合确定性流程（如代码 Review Pipeline）。优势——可控性强；劣势——单点故障。</li>
<li><b>对等模式 (消息总线)</b>：Agent 间平等通信，无中心节点。适合开放协作（如 AutoGen 的 group chat）。优势——无单点故障；劣势——协调复杂。</li>
<li><b>层级模式 (Manager→Specialist)</b>：Manager 接收请求后分发给专业 Agent。适合专业分工（如软件工程团队——PM Agent→架构师Agent→开发Agent→QA Agent）。</li>
<li><b>辩论模式</b>：多个 Agent 生成竞争性回答，通过辩论或投票选出最优。提高准确率但 Token 成本翻倍。</li>
</ul>
<p><b>核心原则：能用单 Agent 不拆多。</b>拆的原因必须是——任务可分解+独立+可并行。不是"看起来高级"就上多 Agent。</p>
<p><b>多 Agent 的三大风险：①</b>通信开销（Agent 间传递信息消耗 Token）；<b>②</b>状态一致性（一个 Agent 修改了共享状态，另一个不知道）；<b>③</b>上下文污染（一个 Agent 的错误输出污染另一个的推理）。</p>

function learningWorkbench(){return `<section class="workbench"><div class="kicker">从知识到可验证改进</div><h2>先定义交付，再讨论 Agent 能力</h2><p>没有基线、判定规则与对照运行，任何“优化了”都只是印象。每次改动都应留下可复查的证据。</p><div class="flow"><div><b>1. 定义任务</b><span>目标、约束、成功和失败。</span><small>任务卡与验收规则</small></div><div><b>2. 记录基线</b><span>冻结模型、提示、工具和数据版本。</span><small>基线报告与 Trace</small></div><div><b>3. 定位失败</b><span>按推理、证据、工具、安全、恢复归因。</span><small>失败分类表</small></div><div><b>4. 提出改动</b><span>一次验证一个主要假设，写出代价。</span><small>改动假设</small></div><div><b>5. 验证沉淀</b><span>重复运行、盲评、抽检，达标再灰度。</span><small>决策与回归用例</small></div></div></section>`}
function applicationCanvas(){return `<section class="workbench"><div class="kicker">应用层 Agent 的落点</div><h2>不同应用，先定义不同的可验收结果</h2><p>用户不会因为系统使用了 Agent 获益，而是因为一个具体任务被可靠完成。下面四类应用需要的输入、风险控制和产物不同，不能用同一套“效果不错”来描述。</p><div class="scenario-grid"><article><h3>功能交付</h3><p>把需求转为可运行功能，范围可控且可回归。</p><ul><li>测试与验收断言</li><li>改动范围与回归</li></ul><small>变更、测试与验收记录</small></article><article><h3>缺陷修复</h3><p>先稳定复现，再定位根因并验证最小修复。</p><ul><li>复现用例转绿</li><li>邻近回归集通过</li></ul><small>根因、补丁与回归用例</small></article><article><h3>代码演进</h3><p>行为保持，同时改善结构、性能或安全。</p><ul><li>兼容/性能/安全检查</li><li>迁移与回滚计划</li></ul><small>计划、差异与回滚方案</small></article><article><h3>业务操作</h3><p>在授权边界内完成真实动作，并保留审计与恢复能力。</p><ul><li>状态、权限与幂等断言</li><li>高风险审批</li></ul><small>结构化结果、审计与恢复点</small></article></div></section>`}
function systemMap(){return `<section class="system-map"><div class="kicker">系统地图：症状该落在哪一层</div><h2>输入、决策、执行与治理的可观测位置</h2><p>遇到“结果不好”时先定位节点，再选择改动杠杆，避免把所有问题都归咎于模型或 Prompt。</p><div class="map-row"><div>请求与状态</div><div><b>用户目标</b>范围与成功条件。<span>信号：意图歧义</span><small>杠杆：澄清策略</small></div><div><b>输入边界</b>权限与不可信内容。<span>信号：拦截率</span><small>杠杆：授权校验</small></div><div><b>上下文</b>记忆与检索证据。<span>信号：召回率</span><small>杠杆：切分排序</small></div><div><b>任务状态</b>步骤、预算与版本。<span>信号：冲突率</span><small>杠杆：checkpoint</small></div></div><div class="map-row"><div>决策与执行</div><div><b>规划器</b>拆步骤与终止。<span>信号：漂移/步数</span><small>杠杆：计划约束</small></div><div><b>工具网关</b>选择、校验、执行。<span>信号：成功率</span><small>杠杆：Schema/重试</small></div><div><b>外部系统</b>检索、API、数据库。<span>信号：超时/错误</span><small>杠杆：降级/缓存</small></div><div><b>结果编排</b>合并证据与动作。<span>信号：引用正确</span><small>杠杆：输出校验</small></div></div><div class="diagnostic-grid"><div><h3>回答错但自信</h3><p>先查证据是否召回、引用是否支持答案，再查生成。</p></div><div><h3>任务反复绕圈</h3><p>查目标状态、Observation、步骤和 Token 预算。</p></div><div><h3>一次好一次坏</h3><p>查随机性、输入分层、依赖与评审一致性。</p></div></div></section>`}
function evalWorkbench(){return `<section class="workbench"><div class="kicker">建议审查框架</div><h2>把“哪里有问题”转成有依据的改进建议</h2><p>每个建议都写明失效、可改动作、作用机制、来源支持、反例与置信度；外部证据不能被写成当前系统已经提升。</p><div class="flow"><div><b>1. 失败模式</b><span>建议必须先指出哪类失效。</span><small>没有失败对象，不列建议</small></div><div><b>2. 作用机制</b><span>解释改动会影响哪一层行为。</span><small>机制不对应，降低置信</small></div><div><b>3. 外部来源</b><span>优先原始论文或可复现材料。</span><small>来源不替代本地结论</small></div><div><b>4. 反例与代价</b><span>写明无效条件与复杂度损失。</span><small>没有反例，不给高置信</small></div><div><b>5. 建议状态</b><span>强候选、待补充或不建议。</span><small>这是页面的最终输出</small></div></div><div class="evidence"><b>审查准则：</b>来源质量、机制匹配和边界完整度决定建议的可信度；本页不把外部结果翻译成任何具体系统的效果承诺。</div></section>`}
function evidenceClaims(){return `<section class="evidence-map"><div class="kicker">先筛掉没有根据的改动</div><h2>不是“有哪些方法”，而是“哪一个主张值得在当前 Agent 上尝试”</h2><p>以下来自原始论文或公开可复现基准。它们只能证明特定研究任务中的机制，不承诺当前系统一定收益；卡片同时给出适用信号和足以否决它的反例。</p><div class="confidence-grid"><div><b>A 级：本地已证实</b>代表任务、版本与护栏上重复成立，才能支持实际采用。</div><div><b>B 级：外部同机制证据</b>论文或公开基准验证过相近机制，值得成为候选，但不等于本地收益。</div><div><b>C 级：探索假设</b>只有直觉或零散案例；未进入评估包前不应包装成建议。</div></div><div class="claim-grid"><article><span class="claim-tag">B 级</span><span class="claim-tag caution">路径依赖观察</span><h3>外部观察会改变下一步时，交替推理与行动才值得尝试</h3><p><b>信号：</b>Trace 显示正确路径要由工具或环境返回决定，初始计划常被新事实推翻。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2210.03629" target="_blank">ReAct</a> 在问答、事实核查和交互任务报告提升，机制是 Observation 更新计划。</p><p><b>否决：</b>路径可枚举、工具错误才是主因，或动态步骤只增加成本时，优先工作流和工具校验。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">只解决证据缺失</span><h3>回答缺少可用事实证据时，检索增强是候选而非通用修复</h3><p><b>信号：</b>正确外部知识不在当前上下文，或输出无法提供可核验来源。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2005.11401" target="_blank">RAG</a> 在知识密集型任务验证了检索记忆的价值，也保留了溯源和更新问题。</p><p><b>否决：</b>正确证据已在 Trace 中却被误用，或语料没有答案时，先修上下文组织、生成约束或数据源。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">不是上下文越长越好</span><h3>关键约束落在长上下文中间时，应优先选择与结构化状态</h3><p><b>信号：</b>同一事实的位置变化会改变结果，或摘要后丢失未完成动作、时间和权限。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2307.03172" target="_blank">Lost in the Middle</a> 用位置扰动发现长上下文模型对中间信息的使用会退化。</p><p><b>否决：</b>上下文短且证据始终被正确读取时，问题更可能在检索、工具或任务定义。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">必须有外部反馈</span><h3>反思只在获得测试或工具反馈后才值得尝试</h3><p><b>信号：</b>失败能被测试、工具结果或明确评分指出，而不是让模型自行说“写得更好”。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2303.11366" target="_blank">Reflexion</a> 在编码等任务中通过反馈与阶段性记忆获得提升。</p><p><b>否决：</b>没有可验证反馈、反思不改变后续行动，或额外轮次超过收益时，不应保留。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">复杂自主性必须有对照</span><h3>稳定的软件任务应先与简单、可解释的流程比较</h3><p><b>信号：</b>复杂 Agent 的成本来自无效循环、调度或不可解释长轨迹，而任务能拆为定位、修改和验证。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2407.01489" target="_blank">Agentless</a> 在 SWE-bench Lite 报告简单三阶段方法达到 32% 修复率，说明复杂自主性不是默认更优。</p><p><b>否决：</b>任务确实需要连续外部观察后的动态重规划，简单流程无法覆盖高价值失败时，再提高自主性。</p></article><article><span class="claim-tag">B 级</span><span class="claim-tag caution">评审分不能独立定案</span><h3>开放质量可用模型评审扩展，但必须暴露偏差与分歧</h3><p><b>信号：</b>结果不能由规则完全判定，但需要比较候选输出质量。</p><p><b>证据：</b><a href="https://arxiv.org/abs/2306.05685" target="_blank">MT-Bench</a> 报告强评审模型可接近人工偏好，同时验证了位置、长度和自偏好偏差。</p><p><b>否决：</b>权限、金额、删除等确定事实或高风险动作必须由程序断言与人工责任链决定。</p></article></div></section>`}
function scenarioMatrix(){return `<section class="scenario-matrix"><div class="kicker">应用层验收矩阵</div><h2>不同功能，必须用不同的“好”来衡量</h2><p>通用基准只说明能力边界；去留决定来自业务任务夹具、护栏和失败样本。</p><table class="matrix"><thead><tr><th>应用</th><th>自动证据</th><th>人工复核</th><th>改动验证</th></tr></thead><tbody><tr><td>功能交付</td><td>构建、测试、验收断言</td><td>需求与范围</td><td>同任务集比较通过率与回归数</td></tr><tr><td>缺陷修复</td><td>稳定复现与修复断言</td><td>根因与补丁最小性</td><td>比较定位时间、复发率与邻近回归</td></tr><tr><td>代码演进</td><td>兼容、性能与安全检查</td><td>架构与迁移计划</td><td>比较质量门槛、迁移失败与回滚</td></tr><tr><td>业务操作</td><td>状态机、权限与幂等断言</td><td>高风险审批</td><td>比较动作正确率、越权和恢复成功率</td></tr></tbody></table><div class="evidence"><b>优先级：</b>先处理影响大、出现频繁、可稳定检测且有明确修复杠杆的问题。没有可验收结果时，先用确定性工作流或人工节点。</div></section>`}
function evidenceClaimsV2(){return evidenceClaims().replace("哪一个主张值得在当前 Agent 上尝试", "哪一个主张值得被列为候选").replace("A 级：本地已证实</b>代表任务、版本与护栏上重复成立，才能支持实际采用。", "强候选：论证链完整</b>失败模式、作用机制、原始来源和否决条件均明确；仍然只是高质量建议，不是任何系统效果结论。").replace("B 级：外部同机制证据</b>论文或公开基准验证过相近机制，值得成为候选，但不等于本地收益。", "待补充：外部同机制证据</b>论文或公开基准验证过相近机制，值得研究，但失败模式或边界还不能完全对上。").replace("C 级：探索假设</b>只有直觉或零散案例；未进入评估包前不应包装成建议。", "不建议：探索假设</b>只有直觉、二手总结或零散案例；不应包装成有依据的改进建议。 ")}
function comparisonBoard(){return `<section class="comparison-board evaluation-lab"><div class="kicker">建议可信度可视化</div><h2>一个建议从“听起来合理”到“值得研究”，中间缺什么？</h2><p>这张图审查建议的论证链，不呈现任何系统效果数据。左右不是改动前后的性能，而是低质量建议与可解释候选的差别。</p><div class="experiment-context"><span>不代表真实效果</span><span>不替代项目验证</span><span>每一格都必须能追溯</span></div><div class="experiment-tracks"><section class="experiment-track baseline"><div class="track-header"><h3>低质量建议</h3><span class="track-status">不应采用</span></div><div class="trace-line"><div class="trace-node"><b>方法名</b><span>先说“加 RAG / 反思 / 多 Agent”。</span></div><div class="trace-node fault"><b>失败对象缺失</b><span>没有说明它要解决哪种失效。</span></div><div class="trace-node fault"><b>证据跳跃</b><span>用一篇论文直接承诺当前场景有效。</span></div><div class="trace-node fault"><b>没有反例</b><span>忽略复杂度、成本和不适用条件。</span></div></div><p class="track-result"><b>结论：</b>这只是灵感，不是可负责任的改进建议。</p></section><section class="experiment-track supported"><div class="track-header"><h3>可解释候选</h3><span class="track-status">按置信度列出</span></div><div class="trace-line"><div class="trace-node fix"><b>失败模式</b><span>先描述可观察的失效类型。</span></div><div class="trace-node fix"><b>改动机制</b><span>说明改动会影响哪一层行为。</span></div><div class="trace-node fix"><b>外部支撑</b><span>来源只支持相近机制与范围。</span></div><div class="trace-node fix"><b>否决条件</b><span>写出反例、代价和替代方案。</span></div></div><p class="track-result"><b>结论：</b>可标记为强候选、待补充或不建议，绝不写成已有效。</p></section></div><div class="intervention-bridge"><div><b>问题</b>是否先定义了明确失败模式？</div><div class="intervention-arrow">→</div><div><b>质疑</b>来源证明的是同一机制，还是只是一段相似叙述？</div><div class="intervention-arrow">→</div><div><b>输出</b>按边界完整度给出置信度，而非效果承诺。</div></div><div class="decision-gate"><div class="gate-checks"><b>高置信建议的最低构成</b>失败模式明确；改动机制可解释；来源质量可追溯；适用边界和否决条件完整。</div><div class="gate-arrow">→</div><div class="gate-outcome"><b>页面可以给出的唯一结论</b>强候选：论证链完整。待补充：缺少机制匹配或边界。<em>不建议：只有方法名、直觉或无关来源。</em></div></div></section>`}

// ==================== RENDER ====================
let currentTab = 'knowledge';

function buildNav(tab = currentTab) {
  const tree = document.getElementById('navTree');
  const title = document.getElementById('navTitle');
  let html = '';

  if(tab === 'knowledge') {
    title.textContent = 'AI Agent 开发知识体系';
    KNOWLEDGE.categories.forEach(cat => {
      html += `<div class="nav-group"><div class="nav-group-label" onclick="toggleNav(this)"><span class="arrow open">▶</span>${cat.icon} ${cat.name}</div><div class="nav-children show">`;
      cat.items.forEach((item,i) => {
        const itemTitle = item.title.length > 20 ? item.title.substring(0,20)+'...' : item.title;
        html += `<div class="nav-item" onclick="scrollToSection('${cat.id}-${i}',this)">${itemTitle}</div>`;
      });
      html += `</div></div>`;
    });
  } else {
    title.textContent = 'Agent 系统评估框架';
    html = `<div class="nav-group"><div class="nav-group-label"><span class="arrow open">▶</span>🔍 七项核心评估</div><div class="nav-children show">`;
    AGENT_EVALUATION_DIMS.forEach(dim => {
      html += `<div class="nav-item" onclick="scrollToSection('eval-${dim.num}',this)">${dim.num}. ${dim.title}</div>`;
    });
    html += `</div></div>`;
  }
  tree.innerHTML = html;
}

function toggleNav(el) {
  el.querySelector('.arrow').classList.toggle('open');
  el.nextElementSibling.classList.toggle('show');
}

function scrollToSection(id, navItem) {
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(navItem) navItem.classList.add('active');
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  if(window.matchMedia('(max-width: 760px)').matches) setMobileNav(false);
}

function setMobileNav(open) {
  const sidebar = document.querySelector('.sidebar');
  const toggle = document.getElementById('navToggle');
  sidebar.classList.toggle('mobile-open', open);
  toggle.setAttribute('aria-expanded', String(open));
  toggle.textContent = open ? '收起目录' : '目录';
}

function renderQA(tab) {
  const banner = document.getElementById('qaBanner');
  const qa = tab==='knowledge' ? KNOWLEDGE.qa : EVAL.qa;
  banner.hidden = false;
  const heading = tab === 'knowledge' ? '先用这三个问题把知识学成可用判断' : '先用这三个问题审查改进建议的可信度';
  let html = `<h3>${heading}</h3><div class="qa-focus-grid">`;
  qa.forEach(item => { html += `<div class="qa-focus-item"><b>${item.q}</b><span>${item.a}</span></div>`; });
  banner.innerHTML = html + `</div>`;
}

function knowledgeSources(){return `<section class="evidence-panel"><h3>知识体系的来源与取舍</h3><p>本页按能力闭环组织，而非按单一框架的 API 目录组织：任务设计、推理与工具、上下文与检索、协作、治理分别回答不同问题。每个具体结论仍应回到卡片中的原始论文或规范。</p><div class="evidence-strip"><b>结构参考：</b><a href="https://github.com/microsoft/ai-agents-for-beginners" target="_blank" rel="noopener"><a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/transports" target="_blank" rel="noopener">MCP 2025-11 规范</a>、<a href="https://github.com/a2aproject/A2A/blob/main/docs/specification.md" target="_blank" rel="noopener">A2A 1.0 规范</a>、<a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a> 的轨迹诊断与 <a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP Agent Security</a> 校验闭环中的协议、状态、诊断与权限边界。它们提供当前机制依据，不替代任务本身的验收标准。</div></section>`}
function evaluationSources(){return `<section class="evidence-panel"><h3>当前评估实现：各自能回答什么</h3><p>评估工具不是一套通用“分数机”。先按评估对象选能力：输出内容、工具参数、行动轨迹、整段 Trace 或多轮互动是不同对象；同一项目的不同层级也不能混成一个结论。</p><div class="evidence-strip"><b>轨迹与结构：</b><a href="https://github.com/langchain-ai/agentevals" target="_blank" rel="noopener">LangChain AgentEvals</a> 提供轨迹匹配与轨迹评审；<b>Trace 评分：</b><a href="https://github.com/agentevals-dev/agentevals" target="_blank" rel="noopener">agentevals</a> 面向 OpenTelemetry Trace，可离线重复评分，但项目明确处于快速迭代；<b>分层评估：</b><a href="https://github.com/strands-agents/evals" target="_blank" rel="noopener">Strands Evals</a> 区分输出、工具、轨迹、会话与多轮模拟；<b>通用组合：</b><a href="https://github.com/UKGovernmentBEIS/inspect_ai" target="_blank" rel="noopener">Inspect</a> 提供工具、多轮和模型评审组件。这里引用的是其能力边界，不是对任何建议有效性的背书。</div></section>`}
function comparisonBoardV2(){return comparisonBoard().replace("先说“加 RAG / 反思 / 多 Agent”。", "只报一个方法名，没有问题定义。")}
function knowledgeResearchPatterns(){return `<section class="evidence-map"><div class="kicker">从当前实现中提炼的知识点</div><h2>理解 Agent，先抓住四个不会随框架变化的对象</h2><p>框架和 SDK 会换，下面五个对象不会：任务契约、能力与授权、运行状态、外部终态与可观测证据。它们把“会调用模型”变成可设计、可追溯的系统。</p><div class="claim-grid"><article><h3>任务契约不是一句用户输入</h3><p><b>应写清：</b>目标、不可违反的约束、可用动作、需要保留的状态和何时算结束。没有终态或拒绝条件，循环只能靠模型猜何时停。</p><p><b>不能推出：</b>任务写得详细，不代表路径必须固定；开放任务仍可允许多条合法轨迹。</p></article><article><h3>协议规定连接，不替代能力与授权</h3><p><b>应区分：</b>Function Calling 是一次调用契约，MCP 是 Agent 到工具/资源的连接协议，A2A 是 Agent 间协作协议。三者都不负责判断动作是否该做。</p><p><b>不能推出：</b>接入标准协议，不等于工具可信、参数正确或具备执行权限。</p></article><article><h3>状态不是聊天记录的别名</h3><p><b>运行状态</b>保存任务进度、预算、未完成动作与恢复点；<b>知识</b>提供可引用事实；<b>记忆</b>保存跨任务信息。三者混写会让恢复、权限和更新不可解释。</p><p><b>不能推出：</b>保存更多历史会提高质量；关键约束必须经过选择与结构化，而不是无限追加上下文。</p></article><article><h3>终态要看外部世界，不只看最终文案</h3><p><b>终态</b>可以是答案忠于证据、目标状态已变化、动作被拒绝并说明原因，或安全地转人工。工具返回 200、模型说“完成”都不是充分条件。</p><p><b>不能推出：</b>一次状态正确，就说明流程可靠；超时、重试和重复副作用仍需独立设计。</p></article><article><h3>可观测证据是运行的一部分</h3><p><b>应记录：</b>任务与版本、状态转换、工具选择和结果、授权/拦截决定、重试与人工接管，并让它们能关联到同一条轨迹。没有这些证据，就无法区分模型、工具、策略还是外部系统导致失败。</p><p><b>不能推出：</b>记录得多不等于可评估；敏感输入、工具参数和输出必须按最小必要原则脱敏、访问控制与保留。</p></article></div><div class="evidence"><b>来源：</b><a href="https://github.com/microsoft/ai-agents-for-beginners" target="_blank" rel="noopener"><a href="https://modelcontextprotocol.io/specification/2025-11-25/basic/transports" target="_blank" rel="noopener">MCP 2025-11</a>、<a href="https://github.com/a2aproject/A2A/blob/main/docs/specification.md" target="_blank" rel="noopener">A2A 1.0</a>、<a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx 2026</a> 与 <a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP Agent Security</a>。页面据此归纳稳定对象，不把任一框架 API 当作通用原理。</div></section>`}
function evaluationContractMap(){return `<section class="evidence-map"><div class="kicker">从当前评估器提炼的判定契约</div><h2>先定义“什么算对”，再讨论任何改进建议</h2><p>轨迹不是天然只有一个正确答案。评估建议若没有说明需要约束顺序、覆盖、参数、终态中的哪一种，引用再多论文也无法证明它对准了问题。</p><div class="claim-grid"><article><h3>顺序正确</h3><p><b>适用：</b>前一步决定后一步的权限、审批或依赖。证据应说明关键动作为什么必须按序发生。</p><p><b>不要误用：</b>把所有探索任务都按严格序列判，会把等价路径误判为失败。</p></article><article><h3>覆盖正确</h3><p><b>适用：</b>必须获得的事实或必经动作明确，但获取顺序可以变化。证据应检查关键集合是否齐全。</p><p><b>不要误用：</b>“都调用过”不能证明参数、引用或最终状态正确。</p></article><article><h3>边界正确</h3><p><b>适用：</b>允许额外探索但必须包含关键动作，或必须禁止多余/高风险动作。参数可按字段定义精确或宽松匹配。</p><p><b>不要误用：</b>宽松匹配不等于放弃安全约束；不可逆动作仍要明确禁止条件。</p></article><article><h3>终态正确</h3><p><b>适用：</b>任务价值取决于外部状态、会话目标或可核验结果。此时需要状态断言，而不是只评最终文字。</p><p><b>不要误用：</b>开放质量无法用状态断言穷尽时，模型评审只能按预写 rubric 提供辅助意见。</p></article></div><div class="evidence"><b>为什么这会改变建议可信度：</b>任何“加入规划、检索或反思”的主张，都应先说明会改变哪一种判定契约；若来源只展示了输出更流畅，却没有覆盖同一契约，它不能作为强支撑。</div><div class="evidence"><b>内部依据：</b><a href="https://github.com/langchain-ai/agentevals" target="_blank" rel="noopener">LangChain AgentEvals</a> 明确区分严格、任意顺序、包含与排除的轨迹匹配，并允许按工具定义参数匹配；<a href="https://github.com/strands-agents/evals" target="_blank" rel="noopener">Strands Evals</a> 将工具选择、工具参数与环境状态拆开处理。</div></section>`}
function toolEvaluationLayers(){return `<section class="evidence-panel"><h3>工具调用至少有三层，不能只看“调用成功”</h3><div class="claim-grid"><article><h3>1. 选择</h3><p>在该时点是否该用这个工具？这是意图、上下文和可用能力的匹配问题。</p></article><article><h3>2. 参数</h3><p>参数是否忠于此前上下文，并且满足业务语义？JSON 合法只是最低门槛。</p></article><article><h3>3. 后果</h3><p>调用后的外部状态是否符合预期、权限和幂等要求？接口成功不代表业务状态正确。</p></article><article><h3>4. 叙述</h3><p>最终回答是否如实使用工具返回，而没有掩盖失败、过度承诺或遗漏限制？</p></article></div><div class="evidence-strip"><b>使用方式：</b>当某项改进声称“优化工具使用”时，必须标出它改善的是哪一层。否则“工具正确率提升”没有可解释含义。Strands 的工具级评估分别处理选择和参数，环境状态断言则单独验证后果。</div></section>`}
function evidenceLadder(){return `<section class="evidence-map"><div class="kicker">证据链的最低门槛</div><h2>先写出能推翻主张的约束，再谈“来源支持”</h2><p>一篇论文、一次公开演示或一个项目 README 都只能提供材料。页面要审查的是：材料能否支撑一个可反驳的机制主张，而不是材料本身是否有名。</p><div class="flow"><div><b>1. 主张</b><span>改动声称缓解哪种失效？</span><small>只有方法名，不成立</small></div><div><b>2. 约束</b><span>若主张正确，哪条行为必须成立？</span><small>写成可观察的不变量</small></div><div><b>3. 支持</b><span>来源是否展示同一机制与条件？</span><small>任务名相似不够</small></div><div><b>4. 反证</b><span>什么结果会直接削弱这个主张？</span><small>没有反证，置信度受限</small></div><div><b>5. 表达</b><span>只报告论证完整度与边界。</span><small>不承诺任何系统效果</small></div></div><div class="evidence"><b>来自当前诊断框架的可借鉴点：</b><a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a> 将原始轨迹归一化，先生成静态与逐步约束、检查违例，再使用模型归因。这里借鉴其证据顺序，而不假装本页已有某个系统的轨迹或检查结果。</div></section>`}

function evaluationReferences(){return `<section class="evidence-map"><div class="kicker">当前参考项目 · 2026-07-26 核对</div><h2>参考项目分别解决哪一环？</h2><p>它们不是同一种“建议生成器”：本页把任务标准、过程证据、失败定位和稳定性验证作为输入，结合具体 Agent 的设计，给出改进点、可改动作、作用机制、边界与置信度。</p><div class="claim-grid"><article><span class="claim-tag">2026-05 · 345 星</span><h3><a href="https://github.com/alphadl/AdaRubrics" target="_blank" rel="noopener">AdaRubric</a>：定义任务专属标准</h3><p><b>可取：</b>从任务契约生成专属子标准，逐步给出分数与置信度；它能显示哪一维未达标，避免平均分掩盖致命失败。</p><p><b>边界：</b>它不替你选择策略：低分维度还要映射成可改的提示、工具、状态或约束；而且仍是很新的研究实现，rubric 生成本身也可能偏差。</p></article><article><span class="claim-tag">ICML 2025 · 801 星</span><h3><a href="https://github.com/metauto-ai/agent-as-a-judge" target="_blank" rel="noopener">Agent-as-a-Judge</a>：收集执行证据</h3><p><b>可取：</b>沿任务过程收集能支持或推翻结论的证据，把“为什么判断这里有问题”变成可复查依据。</p><p><b>边界：</b>评估与逐步反馈只是建议的证据输入，还要映射到可改动作；公开验证主要是 DevAI 代码任务，仍须保留可核验要求与人工复核入口。</p></article><article><span class="claim-tag">2026-02 · 132 星</span><h3><a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a>：定位失败步骤</h3><p><b>可取：</b>把轨迹归一化，先检查静态与逐步不变量，再定位关键失败环节；它为改进假设提供“问题在哪”的起点。</p><p><b>边界：</b>失败步骤与类型指出方案该对准哪里，之后仍需选择相应的修复动作；没有轨迹、工具契约和任务规则时，不能假装能定位根因。</p></article><article><span class="claim-tag">2026-03 · 735 星</span><h3><a href="https://github.com/claw-eval/claw-eval" target="_blank" rel="noopener">Claw-Eval</a>：验证完成与稳定性</h3><p><b>可取：</b>将完成、安全、稳定性分开；连续多次通过才视为可靠，用来判断问题是否只是偶发失败。</p><p><b>边界：</b>它验证某个改动是否稳定，而不解释根因；建议本身仍要来自前面的任务分析。它是通用基准，不能替代具体系统的分析。</p></article></div><div class="evidence"><b>从发现到建议：</b>任务标准回答“该看什么”；过程证据回答“发生了什么”；失败定位回答“问题在哪”；再给出可改动作及其作用机制，才形成一条可审查的改进建议。</div><div class="claim-grid"><article><h3>功能交付 Agent</h3><p>正确性、范围控制、回归处理、验证完整性。</p></article><article><h3>缺陷修复 Agent</h3><p>复现、根因、最小修改、邻近回归。</p></article><article><h3>业务操作 Agent</h3><p>目标状态、授权、工具参数、幂等与恢复。</p></article><article><h3>检索型 Agent</h3><p>证据召回、忠实性、引用、上下文选择。</p></article><article><h3>多 Agent 协作</h3><p>职责边界、交接质量、共享状态、隔离与降级。</p></article></div><div class="evidence"><b>结论边界：</b>没有目标 Agent 的真实任务和轨迹时，只能审查建议是否匹配任务、机制与外部证据，不能断言实际效果。</div></section>`}

function renderKnowledge() {
  let html = knowledgeCompass() + learningWorkbench() + applicationCanvas() + systemMap() + knowledgeResearchPatterns() + knowledgeSources();
  KNOWLEDGE.categories.forEach(cat => {
    html += `<div class="section"><h2 class="section-title">${cat.icon} ${cat.name}</h2><p class="section-desc">${cat.desc}</p>`;
    cat.items.forEach((item,i) => {
      html += `<div class="kp" id="${cat.id}-${i}"><h4>${item.title}</h4>`;
      if(item.tags) html += `<div class="tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
      html += `<div class="body">${item.body}</div>`;
      if(item.refs && item.refs.length) {
        html += `<div class="refs">引用：${item.refs.map(r=>`<a href="${r.u}" target="_blank">📄 ${r.t}</a>`).join('')}</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  });
  return html;
}

function targetAgentProfile(){return `<section class="workbench"><div class="kicker">被评测 Agent 画像</div><h2>先识别被评测 Agent 的任务侧重点与差异化价值</h2><p>评估对象可以是任何 Agent。先判断它服务的高价值任务、差异化机制和关键约束，再选择评测维度；不能用同一套权重审查所有 Agent。</p><div class="flow"><div><b>1. README 与文档</b><span>提取目标用户、关键任务、承诺结果与明确不做什么。</span><small>得到声明的价值定位</small></div><div><b>2. 代码与配置</b><span>核对真实任务循环、工具/数据依赖、状态边界和护栏，不只相信介绍文案。</span><small>得到实际实现机制</small></div><div><b>3. 演进记录</b><span>从提交、变更说明和问题修复中识别投入方向、反复故障与被放弃的取舍。</span><small>得到演进证据，不等于质量证明</small></div><div><b>4. 测试与轨迹</b><span>用任务夹具、运行轨迹和重复结果确认它实际完成了什么，以及在哪失效。</span><small>得到可验证的行为证据</small></div></div><div class="evidence"><b>先定评测侧重点：</b>功能交付看正确性与回归；缺陷修复看复现与根因；业务操作看授权与恢复；检索看证据与忠实性。任务不同，维度权重必须不同。</div><div class="evidence"><b>识别差异化价值：</b>把“高价值任务 + 差异化机制/数据/集成 + 可验证终态”连在一起；只列功能名、框架名或提交数量都不能构成竞争力。</div><div class="evidence"><b>定向改进：</b>每项改进都要回答它保护或放大哪项竞争力，改变哪段机制，凭什么预期有效，又会牺牲什么。README 与历史和代码不一致时，先标为待核实，不把任何一方当结论。</div><div class="evidence"><b>分析原则：</b>被评测 Agent 的侧重点决定“评什么”；结果以可视化方式呈现优点、风险、定向方案和置信度。</div></section>`}
function evaluationOutputContract(){return `<section class="workbench"><div class="kicker">评估交付物</div><h2>一次 Agent 评估，最后应交付什么？</h2><p>不是一个总分，而是一条能追溯到任务与证据的判断链。</p><div class="flow"><div><b>1. 已有优势</b><span>当前设计已经覆盖了哪些任务风险，例如授权、状态恢复或证据引用。</span><small>说明优势为何成立</small></div><div><b>2. 问题与风险</b><span>指出发生在任务、工具、状态或终态的具体缺口，并标明它是事实还是待核实假设。</span><small>定位到失效环节</small></div><div><b>3. 改进方案</b><span>写清改什么、为何可能缓解问题、会带来什么成本或副作用，以及何时不该用。</span><small>给出可执行动作</small></div><div><b>4. 证据与置信度</b><span>说明外部来源支持的机制和范围，列出反例后给出强候选、待补充或不建议。</span><small>不把引用当效果结论</small></div><div><b>5. 评估图</b><span>把任务契约、执行证据、优势与风险、改进方案连成一条可追溯路径。</span><small>任务 → 证据 → 判断 → 建议</small></div></div><div class="evidence"><b>资料决定深度：</b>任务 + 当前设计，可做架构审查；再加执行轨迹，可定位失败步骤与状态偏移；再加重复结果，才可比较稳定表现与实际差异。</div><div class="evidence"><b>输出边界：</b>没有目标 Agent 的任务、设计或轨迹时，本页只给基于公开证据的静态候选；不能把它写成该 Agent 已有优点、已有缺陷或已经提升。</div></section>`}
function renderEval() {
  let html = targetAgentProfile() + evaluationOutputContract() + evaluationReferences() + evalWorkbench() + comparisonBoardV2() + evaluationContractMap() + toolEvaluationLayers() + evidenceLadder() + evidenceClaimsV2() + evaluationSources();
  AGENT_EVALUATION_DIMS.forEach(dim => {
    html += `<div class="section" id="eval-${dim.num}"><div class="eval-dim"><h4><span class="num">${dim.num}</span>${dim.title}</h4>`;
    html += `<div class="why">为什么评估这个：${dim.why}</div>`;
    html += `<div class="check-list">${dim.checks}</div>`;
    if(dim.good && dim.bad) {
      html += `<div class="good-bad"><div class="good">${dim.good}</div><div class="bad">${dim.bad}</div></div>`;
    }
    if(dim.improve) html += `<div class="improve">💡 ${dim.improve}</div>`;
    if(dim.link) html += `<div class="link">${dim.link}</div>`;
    html += `<div class="evidence"><b>需要收集的证据：</b>${EVIDENCE[dim.num]}</div>`;
    html += `</div></div>`;
  });
  return html;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.top-tab[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelector('.sidebar').style.display = 'block';
  renderQA(tab);
  const content = document.getElementById('content');
  content.className = `content ${tab}-view`;
  if(tab==='knowledge') content.innerHTML = renderKnowledge();
  else content.innerHTML = renderEval();
  buildNav(tab);
  setMobileNav(false);
}

// Init
buildTab();
function buildTab(){document.querySelectorAll('.top-tab').forEach(tab=>{tab.addEventListener('click',function(){switchTab(this.dataset.tab)})})}
document.getElementById('navToggle').addEventListener('click', () => {
  const sidebar = document.querySelector('.sidebar');
  setMobileNav(!sidebar.classList.contains('mobile-open'));
});
buildNav();
const requestedTab = new URLSearchParams(window.location.search).get('tab');
switchTab(['knowledge','eval'].includes(requestedTab) ? requestedTab : 'knowledge');
</script>
