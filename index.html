.note-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}

.skeleton-note{margin:0 0 14px;color:var(--muted);font-size:var(--text-base)}
.skeleton-group{margin-bottom:18px}
.skeleton-row{display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(0,2fr);gap:18px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-bottom:0}

.skeleton-bar{display:block;height:12px;border-radius:4px;background:linear-gradient(90deg,var(--surface) 25%,#e7edea 50%,var(--surface) 75%);background-size:200% 100%;animation:skeleton-shimmer 1.5s ease-in-out infinite}
.skeleton-bar.w40{width:40%}
.skeleton-bar.w85{width:85%}

@media(prefers-reduced-motion:reduce){.skeleton-bar{animation:none}}
@media(max-width:760px){.skeleton-row{display:block}.skeleton-bar.w40{margin-bottom:8px}}
@media(max-width:760px){
/* 阅读工具在窄屏排成三行太占地方。按钮等宽平铺，去掉"打印"
   （手机上打印没意义，长按即可分享）。 */
.reader-tools{flex-wrap:wrap;gap:6px}
.reader-tool,.reader-back,.reader-study{flex:1 1 auto;text-align:center;padding:7px 8px;font-size:var(--text-sm)}
#reader-print{display:none}
/* 宽表格在手机上会把整个页面撑出横向滚动条。让表格自己滚。 */
.reader-body table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.reader-body table thead,.reader-body table tbody{display:table;width:100%;min-width:520px}
.reader-body table th,.reader-body table td{white-space:nowrap}
/* 单元格内的长文本仍可换行，避免窄屏下横向滚动过长。 */
.reader-body table td{white-space:normal;min-width:120px}
}
/* 阅读进度：长文读到哪了。贴在顶栏下沿的一条细线。 */
.progress-bar{position:fixed;left:286px;right:0;top:0;height:2px;z-index:22;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);transition:transform var(--duration-fast) var(--ease-out)}
@media(max-width:760px){.progress-bar{left:0}}

kbd{display:inline-block;min-width:20px;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--ink);font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}

<script>
const $=s=>document.querySelector(s),state={notes:[],edges:[],domain:'all',topic:'all',expandedDomains:new Set(),query:'',sort:'title',selected:null,graphMode:'network',zoom:1,pan:{x:0,y:0},view:'home',notesSignature:'',learningStatus:null};const order=['总览','AI系统','后端与分布式系统','数据系统','计算机系统与性能','软件构建与质量','Clippings'],topicOrder={'AI系统':['概览','模型基础与训练','模型与上下文','知识与检索','Agent与工作流','推理服务与平台','数据与MLOps','质量与运营','安全与治理','生态与选型'],'后端与分布式系统':['概览','服务设计','任务与并发','分布式可靠性','基础设施'],'数据系统':['概览','数据建模与SQL','事务与存储','查询与索引','数据管道与流处理','数据治理','可靠性与运维'],'计算机系统与性能':['概览','操作系统与运行时','处理器与内存','存储与网络','观测与诊断','性能工程'],'软件构建与质量':['概览','语言与运行时','算法与数据结构','架构与代码','开发工具','测试与交付']},colors=['#147766','#3f70a8','#a45b2a','#7862a3','#567b42','#9b4660','#697772'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ordered=a=>[...a].sort((x,y)=>(order.indexOf(x)<0?99:order.indexOf(x))-(order.indexOf(y)<0?99:order.indexOf(y))||x.localeCompare(y,'zh-CN'));const orderedTopics=(domain,a)=>[...a].sort((x,y)=>{const ranks=topicOrder[domain]||[];const rx=ranks.indexOf(x),ry=ranks.indexOf(y);return (rx<0?999:rx)-(ry<0?999:ry)||x.localeCompare(y,'zh-CN')});
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
/* POST 并把后端的中文错误原样带出来 —— json() 只做 GET，且错误信息是
   JSON body，直接 throw 会显示成 [object Object]。 */
async function postJson(url,payload){
  const r=await fetch(url,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  let data=null;try{data=await r.json()}catch{}
  if(!r.ok)throw Error((data&&data.error)||'请求失败');
  return data||{};
}
function alertUser(message){const box=$('#app-alert');box.textContent=message;box.classList.add('open');clearTimeout(alertUser.timer);alertUser.timer=setTimeout(()=>box.classList.remove('open'),5200)}
/* Re-translate after each view change: the SPA builds its markup in JS, so the
   strings the i18n walk saw at load are not the strings on screen now. */
function retranslate(){window.TKI18N?.translateDOM()}
function show(view){state.view=view;$('#home').style.display=view==='home'?'block':'none';$('#directory').style.display=view==='directory'?'block':'none';$('#reader').classList.toggle('open',view==='reader');$('#graph-view').classList.toggle('open',view==='graph');$('#reader-actions').hidden=view!=='reader';updateReaderStudy();updateSharedNav(view);retranslate()}function noteList(){const q=state.query.toLowerCase();return state.notes.filter(n=>n.category!=='总览'&&(state.domain==='all'||n.category===state.domain)&&(state.topic==='all'||n.topic===state.topic)&&(!q||[n.title,n.path,n.topic,n.search_text,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.sort==='updated'?(b.updated||'').localeCompare(a.updated||'')||a.title.localeCompare(b.title,'zh-CN'):a.title.localeCompare(b.title,'zh-CN'))}
function renderDomains(){
  const domains=ordered(new Set(state.notes.map(n=>n.category))).filter(d=>d!=='总览'&&d!=='Clippings'),clippingCount=state.notes.filter(n=>n.category==='Clippings').length;
  $('#domains').innerHTML=domains.map(d=>{
    const inDomain=state.notes.filter(n=>n.category===d);
    const open=state.expandedDomains.has(d),active=state.domain===d;
    // 时效性文章（type: radar）单独置顶：它标记的是"这份动态有没有更新"，
    // 属于领域级的信息，不属于任何一个主题，所以放在领域标题下方、主题列表之上。
    const radars=inDomain.filter(n=>n.type==='radar').sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
    // 归档是维护资料，不参与领域计数；单独列在最后，避免和真正的知识主题混在一起。
    const current=inDomain.filter(n=>n.topic!=='归档');
    const archived=inDomain.filter(n=>n.topic==='归档');
    const topics=orderedTopics(d,new Set(current.map(n=>n.topic)));
    const radarCards=radars.map(n=>`<button class="radar-card" data-path="${esc(n.path)}" title="时效性内容，每周更新：${esc(n.title)}"><span class="radar-icon" aria-hidden="true">⚡</span><span class="radar-text"><strong>${esc(n.title)}</strong><small>每周更新</small></span></button>`).join('');
    const archiveRow=archived.length?`<button class="topic-button archived" data-domain="${esc(d)}" data-topic="归档"><span>归档</span><span class="count">${archived.length}</span></button>`:'';
    return `<section class="nav-section"><button class="domain-button ${active?'active':''}" data-domain="${esc(d)}" aria-expanded="${open}"><span class="domain-label"><span class="domain-chevron" aria-hidden="true">${open?'▼':'▶'}</span><span>${esc(d)}</span></span><span class="count">${current.length}</span></button>${open?radarCards+topics.map(t=>`<button class="topic-button ${active&&state.topic===t?'active':''}" data-domain="${esc(d)}" data-topic="${esc(t)}"><span>${esc(t)}</span><span class="count">${current.filter(n=>n.topic===t).length}</span></button>`).join('')+archiveRow:''}</section>`;
  }).join('')+(clippingCount?`<div class="sidebar-support"><p>保留资料</p><button class="domain-button ${state.domain==='Clippings'?'active':''}" data-domain="Clippings"><span>Clippings</span><span class="count">${clippingCount}</span></button></div>`:'');
  document.querySelectorAll('.nav-section .domain-button').forEach(button=>button.onclick=()=>{const domain=button.dataset.domain;if(state.expandedDomains.has(domain)){state.expandedDomains.delete(domain);renderDomains();return}state.expandedDomains.add(domain);select(domain,'all')});
  document.querySelectorAll('.sidebar-support .domain-button').forEach(button=>button.onclick=()=>select(button.dataset.domain,'all'));
  document.querySelectorAll('.topic-button').forEach(button=>button.onclick=()=>select(button.dataset.domain,button.dataset.topic));
  document.querySelectorAll('.radar-card').forEach(button=>button.onclick=()=>openNote(button.dataset.path));
}
function renderDirectory(){
  const list=noteList(),groups=new Map();
  for(const n of list){const k=state.domain==='all'?n.category:n.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)}
  const groupRank=g=>state.domain==='all'?(order.indexOf(g)<0?999:order.indexOf(g)):(topicOrder[state.domain]||[]).indexOf(g)<0?999:(topicOrder[state.domain]||[]).indexOf(g);
  // 命中片段高亮：让"为什么这篇被搜出来"直接可见，而不是只列出标题。
  const q=state.query.trim();
  const mark=text=>{
    const raw=String(text??'');
    if(!q)return esc(raw);
    const at=raw.toLowerCase().indexOf(q.toLowerCase());
    if(at<0)return esc(raw);
    return esc(raw.slice(0,at))+'<mark class="hit">'+esc(raw.slice(at,at+q.length))+'</mark>'+esc(raw.slice(at+q.length));
  };
  const sections=[...groups].sort(([a],[b])=>groupRank(a)-groupRank(b)||a.localeCompare(b,'zh-CN')).map(([g,items])=>{
    const rows=items.map(n=>`<article class="note-row" data-path="${esc(n.path)}"><div><h3>${mark(n.title)}</h3><div class="path">${esc(n.topic)} · ${esc(n.change_rate||'')}</div></div><p>${q?mark(n.excerpt||''):esc(n.excerpt||'')}</p></article>`).join('');
    return `<section class="topic-section"><h3 class="topic-title"><span>${esc(g==='总览'?'入口':g)}</span><small>${items.length}</small></h3>${rows}</section>`;
  }).join('');
  // 空结果给可执行的下一步，而不是一句"没有匹配内容"就结束。
  const empty=groups.size?'':
    `<div class="empty"><p class="empty-title">没有找到“${esc(q)}”</p><p class="empty-hint">试试更短的关键词（如 “RAG”“缓存”），或按 <kbd>Esc</kbd> 清空搜索回到全部知识。</p>${state.domain!=='all'?`<button type="button" class="empty-action" id="empty-clear-domain">清除「${esc(state.domain)}」筛选</button>`:''}</div>`;
  $('#directory').innerHTML=`<div class="directory-head"><div><h2>${esc(state.query?'搜索结果':state.topic!=='all'?state.topic:state.domain==='all'?'全部知识':state.domain)}</h2><p>${list.length} 篇 · 主题按知识对象归属</p></div><div class="sort"><button data-sort="title" class="${state.sort==='title'?'active':''}">按标题</button><button data-sort="updated" class="${state.sort==='updated'?'active':''}">按更新</button></div></div>${sections}${empty}`;
  const clearDomain=$('#empty-clear-domain');
  if(clearDomain)clearDomain.onclick=()=>select('all','all');
  document.querySelectorAll('.note-row').forEach(row=>{row.setAttribute('tabindex','0');row.setAttribute('role','button');row.setAttribute('aria-label',row.querySelector('h3')?.textContent||'打开笔记');row.onclick=()=>openNote(row.dataset.path);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openNote(row.dataset.path)}}});

/* 来源常有十几个，全铺开会把标题和正文之间的呼吸挤掉。
   默认只显示前几条，其余收起来并给出条数。 */
function renderSources(sources){
  if(!sources?.length)return'';
  const seen=new Set(),visible=[];
  for(const source of sources){
    const value=String(source),key=/^https?:\/\//.test(value)?sourceLabel(value):value;
    if(seen.has(key))continue;seen.add(key);visible.push(value);
  }
  const link=x=>{
    if(/^https?:\/\//.test(x))return '<a href="'+esc(x)+'" title="'+esc(x)+'" target="_blank" rel="noreferrer">'+esc(sourceLabel(x))+'</a>';
    if(x.startsWith('[[')){const t=x.slice(2,-2).split('|')[0];return '<a href="/?path='+encodeURIComponent(t)+'">'+esc(t.split('/').pop())+'</a>'}
    return esc(x);
  };
  const sep='<span class="source-sep">·</span>';
  const shown=visible.slice(0,4),rest=visible.slice(4);
  const more=rest.length?('<span class="source-more" hidden>'+sep+rest.map(link).join(sep)+'</span><button type="button" class="source-toggle" aria-expanded="false">还有 '+rest.length+' 个</button>'):'';
  return '<b>来源</b><span class="source-list">'+shown.map(link).join(sep)+'</span>'+more;
}

function renderRelations(note){
  // 知识库管理记录的是维护方法而不是技术知识，它的页面照常可读，
  // 但不展示入链和延伸：否则维护资料会挂在正文下方，看起来像技术知识的关联。
  const root=$('#reader-relations');
  if(note.exclude_from_graph){root.innerHTML='';root.hidden=true;return}
  root.hidden=false;
  const notesByPath=new Map(state.notes.map(item=>[item.path,item]));
  const incoming=[],outgoing=[],seenIncoming=new Set(),seenOutgoing=new Set();
  for(const edge of state.edges){
    if(edge.target===note.path&&!seenIncoming.has(edge.source)&&notesByPath.has(edge.source)){seenIncoming.add(edge.source);incoming.push(notesByPath.get(edge.source))}
    if(edge.source===note.path&&!seenOutgoing.has(edge.target)&&notesByPath.has(edge.target)){seenOutgoing.add(edge.target);outgoing.push(notesByPath.get(edge.target))}
  }

  const incomingNodes=incoming.slice(0,mobile?1:3),outgoingNodes=outgoing.slice(0,3);
  const width=mobile?360:1120,height=mobile?410:220,nodeWidth=mobile?290:250,nodeHeight=54;
  const current={x:mobile?35:435,y:mobile?100:83};
  const inputY=index=>mobile?24:incomingNodes.length===1?83:20+index*68;
  const outputY=index=>mobile?185+index*69:20+index*68;
  const node=(item,x,y,kind='')=>`<g class="relation-node ${kind}" data-note="${esc(item.path)}" role="button" tabindex="0" aria-label="打开 ${esc(item.title)}"><title>${esc(item.title)}：${esc(moduleOf(item))}</title><rect x="${x}" y="${y}" width="${nodeWidth}" height="${nodeHeight}" rx="5"></rect><text class="relation-node-title" x="${x+12}" y="${y+22}">${esc(compact(item.title))}</text><text class="relation-node-meta" x="${x+12}" y="${y+40}">${esc(compact(moduleOf(item)))}</text></g>`;
  const edge=(x1,y1,x2,y2,kind='')=>`<path class="relation-edge ${kind}" marker-end="url(#relation-arrow)" d="M${x1} ${y1} C${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"></path>`;
  const lines=[];
  const nodes=[];
  if(mobile){
    incomingNodes.forEach((item,index)=>{const y=inputY(index);lines.push(edge(current.x+nodeWidth/2,y+nodeHeight,current.x+nodeWidth/2,current.y,'incoming'));nodes.push(node(item,35,y))});
    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth/2,current.y+nodeHeight,current.x+nodeWidth/2,y));nodes.push(node(item,35,y))});
  }else{
    incomingNodes.forEach((item,index)=>{const y=inputY(index);lines.push(edge(40+nodeWidth,y+nodeHeight/2,current.x,current.y+nodeHeight/2,'incoming'));nodes.push(node(item,40,y))});
    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth,current.y+nodeHeight/2,830,y+nodeHeight/2));nodes.push(node(item,830,y))});
  }
  root.classList.add('collapsed');
  root.innerHTML=`<div class="article-relations-head"><div class="article-relations-heading"><h3>知识图谱</h3><span>${incoming.length} 条入链 · ${outgoing.length} 条延伸</span></div><button type="button" class="relation-collapse" title="展开知识图谱" aria-label="展开知识图谱" aria-expanded="false">▸</button></div><svg class="relation-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(note.title)} 的直接知识图谱"><defs><marker id="relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8faea4"></path></marker></defs><text class="relation-label" x="${mobile?35:40}" y="${mobile?15:13}">引用当前节点${incoming.length>incomingNodes.length?' · '+incoming.length:''}</text><text class="relation-label" x="${mobile?35:830}" y="${mobile?177:13}">从当前节点延伸${outgoing.length>outgoingNodes.length?' · '+outgoing.length:''}</text>${lines.join('')}${node(note,current.x,current.y,'current')}${nodes.join('')}</svg>`;
  root.querySelectorAll('[data-note]').forEach(nodeElement=>{nodeElement.onclick=()=>openNote(nodeElement.dataset.note);nodeElement.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openNote(nodeElement.dataset.note)}}});
  const toggle=root.querySelector('.relation-collapse');

}

/* ── 键盘操作 ──────────────────────────────────────────────────────────
   阅读时手不离键盘：/ 搜索、j/k 移动、Enter 打开、Esc 返回、
   g+字母跳转、t 切主题、? 看帮助。
   "g" 前缀用 1.2 秒窗口，超时自动清除，避免误触后吞掉下一次按键。 */
function kbdOverlay(open){
  const el=$('#kbd-overlay');
  if(!el)return;
  el.hidden=!open;
  el.classList.toggle('open',open);
  if(open){const close=$('#kbd-close');if(close)close.focus()}
  else if(document.activeElement&&el.contains(document.activeElement))$('#kbd-hint')?.focus();
}
function moveSelection(delta){
  const rows=[...document.querySelectorAll('#directory .note-row')];
  if(!rows.length)return;
  const at=rows.indexOf(document.activeElement);
  const next=at<0?(delta>0?0:rows.length-1):Math.min(rows.length-1,Math.max(0,at+delta));
  rows[next].focus();
  rows[next].scrollIntoView({block:'nearest'});
}
function toggleThemeFromKeyboard(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  try{localStorage.setItem('tk-theme',next)}catch{}
  TKShell.applyTheme(next);
}
function bindKeyboard(){
  let gPending=0;
  document.addEventListener('keydown',event=>{
    const tag=(event.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||event.target.isContentEditable;
    if(event.key==='Escape'){
      if($('#kbd-overlay')?.classList.contains('open')){kbdOverlay(false);event.preventDefault();return}
      if(typing&&event.target.id==='search'){event.target.value='';state.query='';loadHome(false);event.preventDefault();return}
      if(state.view==='reader'){$('#reader-back').click();event.preventDefault()}
      return;
    }
    if(typing)return;
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const key=event.key;
    if(key==='?'||(key==='/'&&event.shiftKey)){kbdOverlay(!$('#kbd-overlay')?.classList.contains('open'));event.preventDefault();return}
    if(key==='/'){$('#search')?.focus();event.preventDefault();return}
    if(key==='t'){toggleThemeFromKeyboard();event.preventDefault();return}
    if(key==='j'||key==='ArrowDown'){moveSelection(1);event.preventDefault();return}
    if(key==='k'||key==='ArrowUp'){moveSelection(-1);event.preventDefault();return}
    // "g <letter>" 跳转。链式状态：第一次 g 只记时间并等待，
    // 第二次按键才查表 —— 但第二次也可能是 g（g g = 图谱），
    // 所以必须先查表再决定是否继续等待。
    if(key==='g'&&Date.now()-gPending>=1200){gPending=Date.now();return}
    if(Date.now()-gPending<1200){
      gPending=0;
      const targets={h:()=>loadHome(true),g:()=>showGraph(),p:()=>location.assign('/projects')};
      const run=targets[key.toLowerCase()];
      if(run){run();event.preventDefault()}
      return;
    }
  });
  $('#kbd-hint').onclick=()=>kbdOverlay(true);
  $('#kbd-close').onclick=()=>kbdOverlay(false);
  $('#kbd-overlay').onclick=event=>{if(event.target.id==='kbd-overlay')kbdOverlay(false)};
}

    if(state.view!=='reader'||!article){bar.style.transform='scaleX(0)';return}
    const top=article.getBoundingClientRect().top+window.scrollY;

    const note=await json('/api/note?path='+encodeURIComponent(article.path));
    const header=`---\ntitle: ${note.title||article.title}\nupdated: ${note.updated||''}\nsource: ${location.origin}/?path=${encodeURIComponent(article.path)}\n---\n\n`;
    const blob=new Blob([note.raw||''],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=safeFileName(note.title,article.path);
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alertUser('已开始下载 Markdown 原文');
  }catch(error){console.error(error);alertUser('下载失败，请稍后重试')}
}
async function copyCurrentLink(){
  const article=currentArticle();
  if(!article.path){alertUser('先打开一篇文章再复制');return}
  const url=location.origin+'/?path='+encodeURIComponent(article.path);
  try{
    await navigator.clipboard.writeText(url);
    alertUser('链接已复制');
  }catch{
    // 剪贴板在非安全上下文会被拒绝，退回手动选择。
    const input=document.createElement('input');
    input.value=url;document.body.appendChild(input);input.select();
    document.execCommand('copy');input.remove();
    alertUser('链接已复制');
  }
}
function bindReaderTools(){
  const download=$('#reader-download'),copy=$('#reader-copy'),printBtn=$('#reader-print');
  if(download)download.onclick=downloadCurrentNote;
  if(copy)copy.onclick=copyCurrentLink;
  if(printBtn)printBtn.onclick=()=>window.print();
}
function dataSignature(data){return data.notes.map(note=>[note.path,note.updated,note.title,note.search_text].join('\u0000')).join('\u0001')+'\u0002'+JSON.stringify(data.edges)}
async function refreshNotes(initial=false){const data=await json('/api/notes'),signature=dataSignature(data);if(signature===state.notesSignature)return;state.notes=data.notes;state.edges=data.edges;state.notesSignature=signature;renderDomains();if(initial){selectFromUrl();return}if(state.view==='home')renderHome();else if(state.view==='directory')renderDirectory();else if(state.view==='graph')renderGraph()}
async function refreshLearningStatus(notify=false){try{state.learningStatus=await json('/api/learning/status');if(state.view==='home')applyHomeStatus()}catch(error){console.error(error);if(!state.learningStatus&&state.view==='home')applyHomeStatus();if(notify)alertUser('学习工具状态暂时不可用，入口仍然可以打开')}}
async function initialize(){
  /* 主题由 shell.js 在加载时就应用并接管按钮，这里不需要再初始化。
     顺序要紧：renderSharedNav() 会重建整个侧边栏（替换 innerHTML 和 className），
     所以「手机上先收起」必须在它之后设置，否则收起状态会被这次重建抹掉 ——
     现象就是手机首屏被 390px 高的域树占满，而折叠按钮看起来没反应。 */
  bindGraph();bindKeyboard();bindFeedback();bindProgress();bindReaderTools();renderSharedNav();bindNavigation();
  // 先给出骨架，避免首屏是一片空白让人以为坏了。
  showLoading();
  const loadingWarning=setTimeout(()=>{if(!state.notes.length)alertUser('知识内容加载较慢，仍在重试…')},6000);
  try{await refreshNotes(true);clearTimeout(loadingWarning)}
  catch(error){console.error(error);showLoadError()}
  await refreshLearningStatus(true);
}
function showLoading(){
  const box=$('#directory');
  if(state.notes.length||box.style.display==='block')return;
  box.innerHTML=`<div class="skeleton" aria-live="polite" aria-busy="true">
    <p class="skeleton-note">正在读取知识库…</p>
    ${[3,2,3].map(n=>`<div class="skeleton-group">${Array.from({length:n}).map(()=>'<div class="skeleton-row"><span class="skeleton-bar w40"></span><span class="skeleton-bar w85"></span></div>').join('')}</div>`).join('')}
  </div>`;
  show('directory');
}
function showLoadError(){
  $('#directory').innerHTML=`<div class="empty"><p class="empty-title">知识内容暂时读不到</p><p class="empty-hint">本机服务可能正在重启。稍等几秒后重试，或检查站点是否在运行。</p><button type="button" class="empty-action" id="load-retry">重新加载</button></div>`;
  const retry=$('#load-retry');
  if(retry)retry.onclick=()=>{
    showLoading();
    // refreshNotes 在数据签名没变时会直接返回，错误界面就会一直挂着。
    // 重试是明确的用户意图，这里强制重新渲染一次。
    refreshNotes(true).then(()=>renderActiveView()).catch(()=>showLoadError());
  };
  show('directory');
}
/* 按当前视图重画内容。重试、以及任何"数据没变但界面需要恢复"的场合都用它。 */
function renderActiveView(){
  if(state.view==='home')renderHome();
  else if(state.view==='graph')renderGraph();
  else renderDirectory();
}
async function refreshApp(){await Promise.allSettled([refreshNotes(),refreshLearningStatus()])}
initialize();setInterval(refreshApp,10000);
</script>
<script src="/static/mermaid.min.js"></script>
<script>
if(window.mermaid){
  window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral'});
  window.renderMermaid=async function(){
    const nodes=[...document.querySelectorAll('pre.mermaid')];
    if(!nodes.length)return;
    nodes.forEach((node,index)=>{node.dataset.mermaidSource=node.textContent||'';node.id=node.id||`mermaid-${index}-${Date.now()}`});
    await window.mermaid.run({nodes});
  };
}
</script>
