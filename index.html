<style>

<script>
const $=s=>document.querySelector(s),state={notes:[],edges:[],domain:'all',topic:'all',query:'',sort:'title',selected:null,graphMode:'network',zoom:1,pan:{x:0,y:0},view:'home'};const order=['总览','AI系统','后端与分布式系统','数据系统','计算机系统与性能','软件构建与质量','Clippings'],topicOrder={'AI系统':['概览','模型基础与训练','模型与上下文','知识与检索','Agent与工作流','推理服务与平台','数据与MLOps','质量与运营','安全与治理','生态与选型'],'后端与分布式系统':['概览','服务设计','任务与并发','分布式可靠性','基础设施'],'数据系统':['概览','数据建模与SQL','事务与存储','查询与索引','数据管道与流处理','数据治理','可靠性与运维'],'计算机系统与性能':['概览','操作系统与运行时','处理器与内存','存储与网络','观测与诊断','性能工程'],'软件构建与质量':['概览','语言与运行时','算法与数据结构','架构与代码','开发工具','测试与交付']},colors=['#147766','#3f70a8','#a45b2a','#7862a3','#567b42','#9b4660','#697772'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ordered=a=>[...a].sort((x,y)=>(order.indexOf(x)<0?99:order.indexOf(x))-(order.indexOf(y)<0?99:order.indexOf(y))||x.localeCompare(y,'zh-CN'));const orderedTopics=(domain,a)=>[...a].sort((x,y)=>{const ranks=topicOrder[domain]||[];const rx=ranks.indexOf(x),ry=ranks.indexOf(y);return (rx<0?999:rx)-(ry<0?999:ry)||x.localeCompare(y,'zh-CN')});
async function json(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
function alertUser(message){const box=$('#app-alert');box.textContent=message;box.classList.add('open');clearTimeout(alertUser.timer);alertUser.timer=setTimeout(()=>box.classList.remove('open'),5200)}
function show(view){state.view=view;$('#home').style.display=view==='home'?'block':'none';$('#directory').style.display=view==='directory'?'block':'none';$('#reader').classList.toggle('open',view==='reader');$('#graph-view').classList.toggle('open',view==='graph');document.querySelectorAll('.nav-actions button').forEach(b=>b.classList.toggle('active',(b.id==='home-button'&&view==='home')||(b.id==='graph-button'&&view==='graph')))}function noteList(){const q=state.query.toLowerCase();return state.notes.filter(n=>n.category!=='总览'&&(state.domain==='all'||n.category===state.domain)&&(state.topic==='all'||n.topic===state.topic)&&(!q||[n.title,n.path,n.topic,n.search_text,(n.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.sort==='updated'?(b.updated||'').localeCompare(a.updated||'')||a.title.localeCompare(b.title,'zh-CN'):a.title.localeCompare(b.title,'zh-CN'))}

function renderDirectory(){

  for(const n of list){const k=state.domain==='all'?n.category:n.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(n)}
  const groupRank=g=>state.domain==='all'?(order.indexOf(g)<0?999:order.indexOf(g)):(topicOrder[state.domain]||[]).indexOf(g)<0?999:(topicOrder[state.domain]||[]).indexOf(g);
  const sections=[...groups].sort(([a],[b])=>groupRank(a)-groupRank(b)||a.localeCompare(b,'zh-CN')).map(([g,items])=>{

><span>文档、知识库、问题、代码仓库或已有笔记</span></div><div class="io-row"><b>处理</b><span>按目标路由到 Chat、Research、Solve、Visualize 或 Mastery Path，并复用来源与记忆</span></div><div class="io-row"><b>产出</b><span>带来源回答、研究报告、笔记、问题集和可持续复习路径</span></div></div><div class="work-actions"><a href="/launch/deeptutor?next=${encodeURIComponent('/chat?prompt='+encodeURIComponent('请围绕我选择的工程主题，通过追问、例子和迁移练习帮助我真正掌握'))}">进入学习工作区</a><a href="/?path=${encodeURIComponent('知识库管理/来源/论文与项目/DeepTutor多智能体学习伴侣.md')}">实现与边界</a></div></article></div></section><section class="section"><h2>评估与工程</h2><p>自研评估项目与外部工程 Skills 分开：前者定义事实边界，后者提供可复用工作流。</p><div class="secondary-grid"><article class="secondary-card"><div class="work-head"><div><h3>自研 Agent 评估</h3><p>任务、Trace、证据与回归</p></div><span class="status design">自研 · 原型期</span></div><div class="io-grid"><div class="io-row"><b>输入</b><span>任务目标、仓库版本、权限、预算和真实执行记录</span></div><div class="io-row"><b>处理</b><span>按任务选择评估维度，把模型判断绑定到命令、日志、产物和测试</span></div><div class="io-row"><b>产出</b><span>当前是设计契约与静态原型；真实执行、Trace 接入和证据投影待开发</span></div></div><div class="work-actions"><a href="/apps/agent-evaluation/index.html">查看自研项目</a><a href="/?path=${encodeURIComponent('工程知识/AI系统/质量与运营/Agent评估系统的设计契约.md')}">设计契约</a></div></article><article class="secondary-card"><div class="work-head"><div><h3>Matt Skills</h3><p>工程任务的可复用 Agent 流程</p></div><span class="status local">已安装</span></div><div class="io-grid"><div class="io-row"><b>输入</b><span>需求、设计文档、代码库与失败反馈</span></div><div class="io-row"><b>处理</b><span>需求对齐、研究、规格、TDD、代码审查和架构改进</span></div><div class="io-row"><b>产出</b><span>边界清楚的实现、测试证据和可进入下一轮的反馈</span></div></div><div class="work-actions"><a href="/projects/mattpocock-skills/README.md">查看 Skills</a><a href="/?path=${encodeURIComponent('知识库管理/来源/论文与项目/Matt Skills工程协作技能.md')}">融合记录</a></div></article></div></section><section class="section"><h2>辅助理解</h2><p>图和项目源码用于理解关系与回溯证据，不占据主要学习路径。</p><div class="aux-grid"><article class="aux-card"><h3>知识关系与系统图</h3><p>内置图谱展示知识连接、学习循环、AI 系统分层和选型象限；Archify 用于需要确定性校验的架构图。</p><a href="/?view=graph" id="home-graph">查看知识图谱 →</a><a href="/?path=${encodeURIComponent('知识库管理/来源/论文与项目/Archify可验证技术图谱.md')}">Archify 方法</a></article><article class="aux-card"><h3>项目与融合记录</h3><p>查看四个上游项目的源码位置、说明、当前状态和进入知识库的方法。</p><a href="/projects">打开项目入口 →</a></article></div></section>`;document.querySelectorAll('.domain-card').forEach(c=>c.onclick=()=>select(c.dataset.domain,'all'));$('#home-graph').onclick=e=>{e.preventDefault();showGraph()}}
function select(domain='all',topic='all',push=true){if(domain==='总览'||topic==='首页'){loadHome(push);return}state.domain=domain;state.topic=topic;state.selected=null;show('directory');renderDomains();renderDirectory();if(matchMedia('(max-width:760px)').matches)$('#sidebar').classList.add('collapsed');if(push)history.pushState({},'',`/?domain=${encodeURIComponent(domain)}${topic==='all'?'':'&topic='+encodeURIComponent(topic)}`);window.scrollTo({top:0})}function sourceLabel(s){try{return new URL(s).hostname.replace(/^www\./,'')}catch{return s}}function renderSources(s){if(!s?.length)return'';return '<b>来源：</b>'+s.map(x=>{x=String(x);if(/^https?:\/\//.test(x))return `<a href="${esc(x)}" target="_blank" rel="noreferrer">${esc(sourceLabel(x))}</a>`;if(x.startsWith('[[')){const t=x.slice(2,-2).split('|')[0];return `<a href="/?path=${encodeURIComponent(t)}">${esc(t.split('/').pop())}</a>`}return esc(x)}).join(' · ')}

/* Theme toggle, matching the companion pages: explicit choice wins, otherwise
   follow the OS until the visitor decides. */
function initTheme(){
  const KEY='tk-theme',media=matchMedia('(prefers-color-scheme: dark)');
  const stored=()=>{try{return localStorage.getItem(KEY)}catch{return null}};
  const apply=t=>{document.documentElement.dataset.theme=t;
    const dark=t==='dark',btn=document.getElementById('theme-toggle');
    if(btn){btn.textContent=dark?'☀ 白天模式':'☾ 夜晚模式';btn.setAttribute('aria-pressed',String(dark))}};
  apply(stored()||(media.matches?'dark':'light'));
  media.addEventListener('change',e=>{if(!stored())apply(e.matches?'dark':'light')});

(()=>{
  const baseShow=show;
  show=view=>{
    baseShow(view);
    const homeButton=$('#home-button');
    if(homeButton)homeButton.classList.toggle('active',view==='home');
  };
  const back=$('#reader-back');
  const mobileMenu=$('#mobile-menu');
  if(mobileMenu){
    const collapsed=$('#sidebar').classList.contains('collapsed');
    mobileMenu.setAttribute('aria-expanded',String(!collapsed));
    mobileMenu.setAttribute('aria-label',collapsed?'打开目录':'收起目录');
    mobileMenu.onclick=()=>{const nextCollapsed=$('#sidebar').classList.toggle('collapsed');mobileMenu.setAttribute('aria-expanded',String(!nextCollapsed));mobileMenu.setAttribute('aria-label',nextCollapsed?'打开目录':'收起目录')};
  }
  if(back)back.onclick=()=>{
    if(state.domain!=='all')select(state.domain,state.topic);
    else if(state.query.trim()){$('#search').focus();show('directory');renderDirectory()}
    else loadHome(true);
  };
  document.querySelectorAll('[data-visual]').forEach(button=>button.addEventListener('click',()=>{
    document.querySelectorAll('[data-visual]').forEach(item=>item.setAttribute('aria-selected',item===button?'true':'false'));
  }));
  const decorate=()=>{
    document.querySelectorAll('.domain-card,.note-row').forEach(item=>{
      if(item.getAttribute('tabindex')!=='0')item.setAttribute('tabindex','0');
      if(item.getAttribute('role')!=='button')item.setAttribute('role','button');
      if(!item.getAttribute('aria-label'))item.setAttribute('aria-label',item.querySelector('h3')?.textContent||'打开笔记');
    });
  };
  decorate();
  new MutationObserver(decorate).observe($('#home'),{childList:true,subtree:true});
  new MutationObserver(decorate).observe($('#directory'),{childList:true,subtree:true});
  document.addEventListener('keydown',event=>{
    if(!['Enter',' '].includes(event.key))return;
    const item=event.target.closest('.domain-card,.note-row');
    if(!item)return;
    event.preventDefault();
    if(item.classList.contains('domain-card'))select(item.dataset.domain,'all');
    else openNote(item.dataset.path);

  setTimeout(()=>{if(!state.notes.length)alertUser('知识内容暂时加载失败，请刷新重试')},6000);
  fetch('/api/learning/status',{cache:'no-store'}).catch(()=>alertUser('学习工具状态暂时不可用，入口仍然可以打开'));

  updateStudy();
  const originalOpenNote=window.openNote;
  if(typeof originalOpenNote==='function')window.openNote=async function(...args){const result=await originalOpenNote(...args);updateStudy();return result};
  const originalLoadHome=window.loadHome;
  if(typeof originalLoadHome==='function')window.loadHome=function(...args){if(study){study.hidden=true;study.href='/learn'}return originalLoadHome(...args)};
})();
</script>
<script>
// Keep learning aids discoverable from the home view.
(() => {
  const addHistoryEntry = () => {
    const grid = document.querySelector('#home .aux-grid');
    if (!grid || grid.querySelector('#home-history')) return;
    const card = document.createElement('article');
    card.className = 'aux-card';
    card.id = 'home-history';
    card.innerHTML = '<h3>课堂历史</h3><p>生成的课堂先在 OpenMAIC 中继续；复核后再整理进 Markdown 知识。</p><a href="/launch/openmaic?next=%2F" target="_blank" rel="noopener noreferrer">打开课堂历史 ↗</a><a href="/learn/history">查看收录方式 →</a>';
    grid.append(card);
  };
  const home = document.querySelector('#home');
  if (home) new MutationObserver(addHistoryEntry).observe(home, { childList: true });
  addHistoryEntry();
})();
</script>
<script>
// Keep navigation state stable while the vault is polled for changes.
(() => {
  const originalSelect = window.select;
  const originalShowGraph = window.showGraph;
  const originalLoadHome = window.loadHome;
  if (typeof originalSelect === 'function') {
    window.select = (domain = 'all', topic = 'all', push = true) => {
      state.query = '';
      const search = document.querySelector('#search');
      if (search) search.value = '';
      return originalSelect(domain, topic, push);
    };
  }
  if (typeof originalShowGraph === 'function') {
    window.showGraph = (push = true) => {
      state.query = '';
      const search = document.querySelector('#search');
      if (search) search.value = '';
      return originalShowGraph(push);
    };
  }
  if (typeof originalLoadHome === 'function') {
    window.loadHome = (...args) => {
      const result = originalLoadHome(...args);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return result;
    };
  }

  const originalRenderDomains = window.renderDomains;
  const originalRenderDirectory = window.renderDirectory;
  const originalRenderHome = window.renderHome;
  const originalRenderGraph = window.renderGraph;
  let lastNotesRef = null;
  let lastNotesKey = '';
  const notesKey = () => {
    if (state.notes !== lastNotesRef) {
      lastNotesRef = state.notes;
      lastNotesKey = state.notes
        .map((note) => [note.path, note.updated, note.title, note.search_text].join('\u0000'))
        .join('\u0001') + '\u0002' + JSON.stringify(state.edges);
    }
    return lastNotesKey;
  };
  const renderKey = (...parts) => `${notesKey()}\u0003${parts.join('\u0000')}`;
  let domainsKey = '';
  let directoryKey = '';
  let homeKey = '';
  let graphKey = '';
  const decorateProjectLinks = () => {
    document.querySelectorAll('#home a[href^="/projects"], #home a[href^="/apps/agent-evaluation"]').forEach((link) => {
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
    });
    const classroom = [...document.querySelectorAll('#home .work-card')].find((card) => card.querySelector('h3')?.textContent === 'OpenMAIC');
    const actions = classroom?.querySelector('.work-actions');
    if (actions && !actions.querySelector('a[href="/learn/openmaic"]')) {
      const guide = document.createElement('a');
      guide.href = '/learn/openmaic';
      guide.target = '_blank';
      guide.rel = 'noopener noreferrer';
      guide.textContent = '完整使用指南';
      actions.insertBefore(guide, actions.lastElementChild);
    }
  };
  window.renderDomains = () => {
    const key = renderKey(state.domain, state.topic);
    if (key === domainsKey) return;
    domainsKey = key;
    originalRenderDomains();
  };
  window.renderDirectory = () => {
    const key = renderKey(state.domain, state.topic, state.query, state.sort);
    if (key === directoryKey) return;
    directoryKey = key;
    originalRenderDirectory();
  };
  window.renderHome = () => {
    const key = renderKey('home');
    if (key === homeKey) return;
    homeKey = key;
    originalRenderHome();
    decorateProjectLinks();
  };
  window.renderGraph = () => {
    const key = renderKey(state.graphMode, state.selected);
    if (key === graphKey) return;
    graphKey = key;
    originalRenderGraph();
  };

  const refreshHomeStatus = () => {
    if (state.view !== 'home') return;
    json('/api/learning/status').then((status) => {
      const cards = [...document.querySelectorAll('#home .work-card')];
      const classroom = cards.find((card) => card.querySelector('h3')?.textContent === 'OpenMAIC');
      const tutor = cards.find((card) => card.querySelector('h3')?.textContent === 'DeepTutor');
      if (classroom) {
        classroom.querySelector('.status').textContent = status.openmaic?.online && status.openmaic?.llm
          ? '互动课堂可用'
          : status.openmaic?.online ? '服务运行中' : '未启动';
      }
      if (tutor) {
        tutor.querySelector('.status').textContent = status.deeptutor?.online && status.deeptutor?.llm
          ? '导师可用' : '配置不完整';
      }
    }).catch(() => {});
  };
  window.setInterval(refreshHomeStatus, 10000);
  const projectButton = document.querySelector('#projects-button');
  if (projectButton) {
    projectButton.onclick = () => {
      const tab = window.open('/projects', '_blank');
      if (tab) tab.opener = null;
      else alertUser('浏览器拦截了新标签，请允许弹出窗口后重试');
    };
  }
})();
</script>
<script src="/static/mermaid.min.js"></script>
<script>
if(window.mermaid){
  window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'neutral'});
  window.renderMermaid=async function(){
    const nodes=[...document.querySelectorAll('pre.mermaid')];
    if(!nodes.length)return;
    nodes.forEach((node,index)=>{node.dataset.mermaidSource=node.textContent||'';node.id=node.id||`mermaid-${index}-${Date.now()}`});
    await window.mermaid.run({nodes});
  };
}
</script>
