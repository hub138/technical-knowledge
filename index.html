  "工具设计模式：错误处理与安全控制": [{t:"OWASP AI Agent Security Cheat Sheet",u:"https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html"}]
};
CARD_BODY_OVERRIDES["RAG 全链路：从证据到可验证答案"] = `<p><b>RAG 的目标不是凑齐固定步骤，而是让答案能回到已授权、可核验的证据。</b></p><div class="step-list"><div class="step"><span>1</span><p><b>定义证据标准：</b>先确定哪些来源可用、何时必须引用、没有证据时是<b>拒答</b>还是<b>转人工</b>。</p></div><div class="step"><span>2</span><p><b>解析与切分：</b>保留标题、表格、版本、更新时间和权限；切分方式由语料结构与问题集验证。</p></div><div class="step"><span>3</span><p><b>建立可追溯索引：</b>文档、chunk、embedding 和索引都要能对应版本，更新时知道答案来自哪一批知识。</p></div><div class="step"><span>4</span><p><b>召回与融合：</b>先用 <b>Recall@K</b> 确认正确证据是否进入候选。RRF 的 <code>k=60</code> 只是常见起点，<b>权重、候选数和延迟</b>都要调测。</p></div><div class="step"><span>5</span><p><b>重排与上下文选择：</b>候选噪声影响模型时才增加 reranker；回传片段保留来源和必要的相邻语境。</p></div><div class="step"><span>6</span><p><b>受约束生成：</b>答案明确区分<b>证据、推断和未知项</b>，引用绑定到实际使用的片段。</p></div><div class="step"><span>7</span><p><b>分层评测：</b>分别检查<b>召回、排序、引用正确、忠实性、完成率、延迟、成本和拒答质量</b>。</p></div></div><p><b>排障顺序：</b>先看正确证据是否被召回，再看排序和上下文，最后才看生成。<b>语料中没有答案</b>，不能靠更长 Prompt 修复。</p>`;
CARD_BODY_OVERRIDES["混合检索 / Rerank / Agentic RAG / GraphRAG"] = `<p><b>它们解决的是不同失效，不是从低到高的升级路线。</b>选型从失败样本开始，而不是先叠技术名词。</p><ul><li><b>混合检索：</b><b>稀疏检索</b>擅长术语、编号和原词匹配，<b>稠密检索</b>擅长语义相近。当问题同时需要“订单号 + 含义相近的描述”时，比较两路结果及融合，而不是预设比例。</li><li><b>Rerank：</b>在<b>已有候选</b>中做细排；只有正确证据已经进入候选、但排序靠后时才可能有效。代价是<b>额外延迟与成本</b>。</li><li><b>Agentic RAG：</b>依据<b>证据缺口</b>继续检索、改写或调用数据源。必须定义<b>停止条件、预算、来源范围和可审计轨迹</b>；稳定的一次检索任务不需要它。</li><li><b>GraphRAG：</b>把<b>实体、关系和证据片段</b>组织成图，适合多跳关系、全局主题或实体消歧。图谱抽取错误、更新成本、访问控制和回链原文都要单独验证。</li></ul><p><b>选型顺序：</b>编号查不到先检查稀疏召回；候选有答案却排不前先测 rerank；需要跨源、多步证据再评估 Agentic RAG；确有关系推理需求与维护能力时才考虑图结构。</p>`;
CARD_BODY_OVERRIDES["Function Calling 完整实现"] = `<p><b>Function Calling 是模型用结构化格式“提出调用工具的请求”。</b>它不是模型直接执行代码：模型只给出工具名和参数，<b>你的服务端</b>决定这次请求是否能真的执行。</p><ul><li><b>定义工具：</b>写清工具做什么、<b>何时该用</b>、要哪些参数。例如“用户给出订单号且已登录时，查询本人订单”。<b>Schema</b> 就是参数的结构说明：字段名、类型、允许值和必填项。</li><li><b>模型提议调用：</b>模型返回结构化参数。它可能缺字段、填错类型或试图调用不该用的工具，因此结果只能算<b>建议</b>。</li><li><b>服务端校验并执行：</b>程序检查格式、当前用户权限、资源归属、金额范围和业务状态；通过后才调用真实接口，并把结果作为外部信息返回模型。</li></ul><p><b>初学者要记住：</b><b>Schema 约束“怎么说”，服务端规则决定“能不能做”。</b>支付、删除、外发等操作还要有最小权限、幂等键和必要的人工确认。</p>`;
CARD_BODY_OVERRIDES["文档切分、版本与检索评测"] = `<p><b>RAG 的错误常在模型回答前就发生：正确内容没有被拆好、没有被找回，或找回后丢了上下文。</b></p><ul><li><b>切分（chunking）：</b>把长文档按标题、段落、表格或代码块拆成可检索的<b>文档片段</b>。必要时保留相邻的一小段重复内容，避免一句话刚好被切在边界；没有适用于所有文档的固定长度。</li><li><b>版本：</b>给原文、文档片段、向量表示和索引都标版本。这样知识更新后，才能追查某个回答用了哪一批资料，并安全切换或回退。</li><li><b>评测：</b><b>Recall@K</b> 看正确证据是否出现在前 K 个候选中；<b>MRR/NDCG</b> 看它是否排得靠前；<b>引用正确</b>看引用是否真支持答案；<b>忠实性（Faithfulness）</b>看答案有没有超出证据编造。</li></ul><p><b>排障顺序：</b>答案错时，先查候选里有没有正确证据；有证据却答错，才查排序、上下文组织和生成约束。</p>`;
CARD_BODY_OVERRIDES["多 Agent 状态、幂等与故障隔离"] = `<p><b>多个 Agent 协作的难点不是通信，而是“谁保存状态、重复执行会不会出事、失败后如何恢复”。</b></p><ul><li><b>状态所有权：</b>指定一个编排服务负责写共享任务状态；子 Agent 只交回结构化结果。<b>版本号或乐观锁</b>的意思是：写入前先确认状态没有被别人改过，避免后来的写入覆盖前面的正确结果。</li><li><b>幂等：</b>同一个请求即使因超时或重试执行两次，也只产生一次业务效果。支付、发信、删除等动作要携带唯一请求号，并先查询是否已经完成。</li><li><b>Checkpoint（恢复点）：</b>在关键步骤保存“已经做到哪里、外部动作是否完成”。进程重启后先从外部系统核对，再决定继续、补偿还是转人工。</li><li><b>故障隔离：</b>每个子任务有独立超时和重试预算；非关键任务可返回部分结果，关键任务失败则停在可恢复位置。</li></ul><p><b>原则：</b>流程确定时先用状态机或工作流。只有确实需要独立专长、权限边界或并行收益时，才拆成多个 Agent。</p>`;
CARD_BODY_OVERRIDES["任务边界：先定义用户要完成什么"] = `<p><b>任务边界是把“做个 Agent”变成一个可验收问题。</b>它先回答用户究竟要完成哪件事，而不是先讨论模型或框架。</p><ul><li><b>任务卡：</b>写清用户是谁、什么情况触发、输入和可用数据、允许的最终动作、不能做什么、成功如何判断、失败交给谁。</li><li><b>把目标写具体：</b>“处理售后”太宽；“在已授权订单上判断退货资格，证据不足时转人工”才知道要查什么、何时停。</li><li><b>先写约束：</b>权限、时效、不可逆操作、数据质量和人工兜底决定系统应该是规则、工作流还是 Agent。</li></ul><p><b>结果：</b>一张任务卡同时成为设计、测试和上线验收的共同依据。</p>`;
CARD_BODY_OVERRIDES["方案取舍：规则、工作流还是 Agent"] = `<p><b>三者不是替代关系，而是处理不同程度的不确定性。</b></p><ul><li><b>规则：</b>输入和判断条件固定，例如金额范围校验；快、可预测、容易验证。</li><li><b>工作流：</b>步骤大体确定，但需要状态、分支、审批和恢复，例如售后审核流程。</li><li><b>Agent：</b>下一步要根据新证据选择工具或路径，例如调查跨系统异常；它带来灵活性，也带来成本和治理责任。</li></ul><p><b>选择顺序：</b>先问任务路径能不能枚举、结果能不能程序校验、失败代价有多大。能稳定用规则或工作流完成的任务，不应为了“更智能”改成 Agent。</p>`;
CARD_BODY_OVERRIDES["模型与系统策略：把能力放在合适的位置"] = `<p><b>模型路由</b>是把一个任务拆开，决定每一步由程序、小模型、大模型还是人工确认完成；不是为所有请求挑一个“最强模型”。</p><ul><li><b>交给程序：</b>格式校验、确定性计算、权限检查和不可逆动作的最终放行。</li><li><b>交给模型：</b>理解模糊语言、归纳证据、在受限工具中做选择、生成面向用户的说明。</li><li><b>交给人工：</b>证据不足、高风险、责任必须由人承担，或系统无法安全恢复的情况。</li></ul><p><b>落地方式：</b>为每类子任务定义质量、延迟、成本和风险门槛，保留降级路径；缓存还要带用户权限和知识版本，避免把错误或越权结果复用。</p>`;
CARD_BODY_OVERRIDES["价值闭环：把反馈变成下一轮可验证改进"] = `<p><b>反馈闭环不是收集一句“好用/不好用”，而是把真实使用转成下次能验证的改动。</b></p><ul><li><b>用户信号：</b>任务是否完成、是否放弃或重复提问、是否转人工、怎样纠正系统。</li><li><b>系统信号：</b>一次任务的执行轨迹（Trace）、工具错误、耗时、成本、安全拦截和最终外部状态。</li><li><b>改进方式：</b>按影响范围、出现频率、能否稳定检测和是否有明确修复方法排优先级；一次只验证一个主要改动，并保留失败样本和相邻边界样本。</li></ul><p><b>结果：</b>得到问题优先级、改动假设、前后对照和回归集，而不是靠 Demo 印象判断“变好了”。</p>`;
CARD_BODY_OVERRIDES["上线发布、SLO 与故障恢复"] = `<p><b>上线不是把新模型或 Prompt 直接推给所有用户，而是让每个版本可观察、可暂停、可恢复。</b></p><ul><li><b>SLO（服务目标）：</b>提前约定哪些指标必须达标，例如任务完成率、工具错误率、响应时间和高风险操作的拒绝是否正确；每项都有阈值和负责人。</li><li><b>灰度发布：</b>先让一小部分用户或流量使用新版本，对比质量、成本和安全事件；指标越线就停止扩大范围。</li><li><b>回滚与恢复：</b>模型、提示、工具参数和知识索引都带版本。外部副作用保存幂等键和恢复点，故障后先查外部状态，再决定重试、补偿或转人工。</li></ul><p><b>复盘要留下：</b>时间线、根因、影响范围、短期修复、长期预防和新增回归用例；没有回归用例，问题很容易再次出现。</p>`;
CARD_BODY_OVERRIDES["ReAct 范式：推理+行动交替循环"] = CARD_BODY_OVERRIDES["ReAct 范式：推理+行动交替循环"].replace("<b>Action</b>", "<b>动作（Action）</b>").replace("<b>Observation</b>", "<b>观察（Observation）</b>").replace("<b>State</b>", "<b>任务状态（State）</b>").replace("<b>Termination</b>", "<b>结束条件（Termination）</b>");
CARD_BODY_OVERRIDES["安全防护：幻觉控制 + Prompt 注入防御"] = CARD_BODY_OVERRIDES["安全防护：幻觉控制 + Prompt 注入防御"].replace("<b>提示注入</b>", "<b>提示注入（Prompt Injection）</b>").replace("<b>事实与引用</b>", "<b>幻觉控制：事实与引用</b>");
CARD_BODY_OVERRIDES["Agent 系统架构设计（五层）"] = CARD_BODY_OVERRIDES["Agent 系统架构设计（五层）"].replace("checkpoint、恢复", "恢复点（checkpoint）、恢复");
function knowledgeCardMeta(item, category) {
  const meta = KNOWLEDGE_CARD_META[item.title] || (category.id === "application" || category.id === "engineering" ? ["稳定工程原则", "本页综合", "2026-07-27"] : ["概念 / 场景方法", "本页综合", "2026-07-27"]);
  return `<div class="meta"><span class="priority">${meta[0]}</span><span>${meta[1]}</span><span class="reviewed">最后核对 ${meta[2]}</span></div>`;
}
function knowledgeFreshness(){return `<section class="workbench"><div class="kicker">先判断内容是否值得投入</div><h2>AI 变化很快：知识体系先回答“现在还对吗、谁该学、落地差在哪”</h2><p>概念不能删，因为它解释方案为什么成立；但概念不能直接变成实施清单。页面将稳定原则、活跃规范、通行做法和研究基线分开，并在每张卡片标注内容状态与最后核对日期。</p><div class="flow"><div><b>1. 风险优先</b><span>终态、权限、幂等、恢复和评估优先于框架或模型热度。</span><small>所有角色先读</small></div><div><b>2. 活跃规范</b><span>MCP、A2A、模型 API 和 SDK 必须回到原始来源、版本与日期。</span><small>平台/集成重点</small></div><div><b>3. 通行做法</b><span>受控工作流、工具网关、检索、Trace 与发布护栏是常见组合，不是通用答案。</span><small>开发者按任务裁剪</small></div><div><b>4. 研究基线</b><span>ReAct、ToT、Reflection 用于理解机制与设计对照，不因流行直接上生产。</span><small>优化者做实验</small></div><div><b>5. 本地验证</b><span>用代表任务、成本和安全护栏验证收益；外部来源不能替代你的验收。</span><small>评估页负责验证</small></div></div><div class="evidence"><b>常见落地 gap：</b>生产系统通常由代码持有任务状态、权限、超时和回退，模型只在受限节点做理解、选择或生成；工具输出和检索内容按不可信数据处理。此处是工程归纳，安全边界可参考 <a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP AI Agent Security（核对 2026-07-27）</a>。</div></section>`}
function knowledgeResearchPatterns(){return `<section class="evidence-map"><div class="kicker">跨框架仍然成立的对象</div><h2>理解 Agent，先抓住任务、能力、状态、终态与证据</h2><p>框架和 SDK 会更换；这五个对象用于解释系统为什么能运行、在哪里会失效、如何验证，而不是替代具体产品设计。</p><div class="claim-grid"><article><h3>任务契约</h3><p><b>写清：</b>目标、约束、可用动作、所需状态、拒绝条件和成功终态。详细任务不意味着只能有一条执行路径。</p></article><article><h3>能力与授权</h3><p><b>区分：</b>Function Calling 是调用契约，MCP 是工具/上下文连接协议，A2A 是 Agent 协作协议。协议不替代权限和业务校验。</p></article><article><h3>运行状态</h3><p><b>分开管理：</b>任务进度与恢复点、给模型的会话上下文、跨任务记忆、可引用知识。存得更多不等于更可靠。</p></article><article><h3>外部终态</h3><p><b>以外部事实验收：</b>答案忠于证据、目标状态已变化、动作被安全拒绝或已转人工。模型说“完成”和 HTTP 200 都不是充分条件。</p></article><article><h3>可观测证据</h3><p><b>关联记录：</b>版本、状态转换、工具结果、授权决定、重试和接管。记录还必须有脱敏、访问控制和保留策略。</p></article></div><div class="evidence"><b>来源与核对：</b><a href="https://modelcontextprotocol.io/specification/2025-11-25" target="_blank" rel="noopener">MCP 2025-11-25</a>、<a href="https://a2a-protocol.org/latest/specification/" target="_blank" rel="noopener">A2A Specification</a>、<a href="https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html" target="_blank" rel="noopener">OWASP AI Agent Security</a>。本页据此归纳对象，最后核对：2026-07-27。</div></section>`}
function evaluationReferences(){return `<section class="evidence-map"><div class="kicker">当前参考项目 · 2026-07-27 核对</div><h2>参考项目分别解决哪一环？</h2><p>这些项目是能力边界的参考，不是评分依据，也不代表当前 Agent 已得到相同结果。采用前仍需核对版本、任务条件和本地证据。</p><div class="claim-grid"><article><span class="claim-tag">任务标准</span><h3><a href="https://github.com/alphadl/AdaRubrics" target="_blank" rel="noopener">AdaRubric</a></h3><p>用于理解如何将任务契约拆成可审查的子标准；rubric 本身也要验证偏差。</p></article><article><span class="claim-tag">执行证据</span><h3><a href="https://github.com/metauto-ai/agent-as-a-judge" target="_blank" rel="noopener">Agent-as-a-Judge</a></h3><p>用于理解沿执行过程收集证据；公开验证范围不自动迁移到你的任务。</p></article><article><span class="claim-tag">失败定位</span><h3><a href="https://github.com/microsoft/AgentRx" target="_blank" rel="noopener">AgentRx</a></h3><p>用于理解轨迹、约束与失败定位的顺序；没有任务规则和轨迹不能声称定位根因。</p></article><article><span class="claim-tag">稳定性验证</span><h3><a href="https://github.com/claw-eval/claw-eval" target="_blank" rel="noopener">Claw-Eval</a></h3><p>用于区分完成、安全和重复稳定性；它不能替代具体系统的验收标准。</p></article></div><div class="evidence"><b>取舍：</b>任务标准回答“该看什么”；过程证据回答“发生了什么”；失败定位回答“问题在哪”；代表任务上的前后对照才回答“改动是否有效”。</div></section>`}
function knowledgeGlossary(){return `<section class="evidence-map"><div class="kicker">概念先导 · 先总览，再进入单点</div><h2>这页出现的核心术语，分别在说什么？</h2><p>每个深入卡片都对应下面一个或多个术语。先读这里的最小定义，再按链接展开机制、边界与落地条件；这样不需要先离开页面查概念。</p><div class="concept-index"><section><h3>任务与决策</h3><dl><dt><a href="#application-0">任务契约</a></dt><dd>把目标、输入、约束、成功终态和失败交接写成可验收边界。</dd><dt><a href="#application-1">规则 / 工作流 / Agent</a></dt><dd>规则处理固定判断，工作流处理预定义分支与恢复，Agent 才在受限范围内动态选路径。</dd><dt><a href="#reasoning-0">ReAct</a></dt><dd>模型根据工具或环境观察决定下一步的循环，不等于展示内部思考。</dd><dt><a href="#reasoning-1">CoT、Plan-Execute、ToT、Reflection</a></dt><dd>分别是直接推理、先计划后执行、搜索多条候选路径、利用外部反馈修正的控制方式。</dd><dt><a href="#reasoning-2">Agent Loop</a></dt><dd>读取状态、提议动作、执行、记录观察、检查终态的受控循环。</dd></dl></section><section><h3>工具、协议与协作</h3><dl><dt><a href="#tools-0">Function Calling / Schema</a></dt><dd>模型按结构化契约提出工具调用；Schema 描述参数，不替代执行层校验与授权。</dd><dt><a href="#tools-1">MCP</a></dt><dd>模型应用与工具、资源、提示服务之间的连接协议。</dd><dt><a href="#tools-2">A2A</a></dt><dd>独立 Agent 之间发现能力、委托任务、追踪状态和交付产物的协作协议。</dd><dt><a href="#tools-3">工具网关</a></dt><dd>在真正执行前负责业务校验、权限、幂等、审计和错误分类的系统边界。</dd><dt><a href="#multi-agent-0">多 Agent</a></dt><dd>为独立职责、权限边界或并行子任务拆分协作者，不是让多个模型随意对话。</dd><dt><a href="#multi-agent-1">幂等 / Checkpoint</a></dt><dd>幂等让重复请求不重复产生副作用；checkpoint 保存安全恢复点。</dd></dl></section><section><h3>状态、知识与检索</h3><dl><dt><a href="#memory-0">运行状态 / 上下文 / 记忆</a></dt><dd>状态用于恢复任务，上下文供当前调用决策，记忆保存跨任务且获授权的信息。</dd><dt><a href="#memory-1">上下文工程</a></dt><dd>按任务选择足够、可信、被授权的信息，而非尽量填满模型窗口。</dd><dt><a href="#rag-0">RAG</a></dt><dd>先检索可引用证据，再让模型基于证据作答并暴露未知项。</dd><dt><a href="#rag-1">混合检索 / Rerank</a></dt><dd>混合检索结合字面与语义召回；rerank 在候选已有证据时再做精细排序。</dd><dt><a href="#rag-1">Agentic RAG / GraphRAG</a></dt><dd>前者按证据缺口多步检索，后者用实体关系图支持关系查询；两者都需要额外评测和治理。</dd><dt><a href="#rag-2">Recall@K、MRR、NDCG、Faithfulness</a></dt><dd>分别衡量证据是否找回、排序位置和答案是否忠于证据。</dd></dl></section><section><h3>工程、治理与验证</h3><dl><dt><a href="#engineering-0">系统架构</a></dt><dd>按任务、状态、模型决策、能力网关和治理证据划分责任，而非套固定层数。</dd><dt><a href="#engineering-1">幻觉 / Prompt Injection</a></dt><dd>前者是无证据或错误输出，后者是不可信内容试图改变指令或越权；两者都不能只靠 Prompt 防护。</dd><dt><a href="#engineering-2">性能与成本</a></dt><dd>比较完成率、延迟、成本、工具错误和安全拒绝，再决定路由、缓存或并发。</dd><dt><a href="#engineering-3">Logs、Traces、Metrics、评测</a></dt><dd>日志记录事件，Trace 串起一次任务，指标看聚合趋势，评测依据任务契约判断结果。</dd><dt><a href="#engineering-4">SLO、灰度、回滚</a></dt><dd>SLO 定义可靠性目标；灰度小范围验证版本；回滚与恢复避免故障扩大。</dd></dl></section></div></section>`}
function knowledgeApplicationTerms(){return `<section class="evidence"><b>应用层两个常被跳过的概念：</b><a href="#application-2">模型路由</a> 是按子任务、风险和门槛决定程序、小模型、大模型或人工确认分别放在哪里；<a href="#application-3">价值反馈闭环</a> 是将完成、放弃、人工接管、失败 Trace 与用户纠错转成优先级、改动假设和回归集。它们分别解释“怎么组合能力”和“为什么持续改进”。</section>`}
function knowledgeUsageGuide(){return `<section class="workbench knowledge-guide"><h2>先判断知识是否仍然适用，再决定学什么、怎么用</h2><p>AI 的框架、模型和接口更新很快，但并非所有知识都会一起过时。这里不把新名词按热度排列：先分清它是稳定原则、正在演进的规范、特定场景的方法，还是必须由本地数据验证的假设。</p><div class="knowledge-guide-grid"><div><b>稳定原则</b><span>任务终态、权限、幂等、恢复、证据和评估不会因换一个框架而失效。所有人先掌握这一层。</span></div><div><b>活跃规范</b><span>MCP、A2A、模型 API 和 SDK 以原始规范、具体版本和核对日期为准；卡片中的“活跃规范”不是永久结论。</span></div><div><b>场景方法</b><span>ReAct、RAG、重排、多 Agent 等解释“在什么失效下可以尝试”，不等于默认应该上生产。</span></div><div><b>本地验证</b><span>真正采用前，用代表任务同时检查完成、安全、成本和延迟；外部论文或案例只能提供候选机制。</span></div></div><div class="evidence"><b>按角色进入：</b>初学者先读“应用设计与迭代”，理解任务、规则、工作流与 Agent 的边界；实现者再读推理、工具、状态和检索；负责上线的人重点看协作、工程与评估。每张卡都标注内容状态和最后核对日期；需要更新时先回到卡片中的原始来源。</div></section>`}
function knowledgeUsageGuide(){return `<section class="workbench knowledge-guide"><h2>先判断知识是否仍然适用</h2><p>不要按新名词的热度学习。先辨别知识属于哪一类，再决定应该长期掌握、查原始规范，还是放进任务里验证。</p><div class="knowledge-guide-grid"><div><b>稳定原则</b><span><b>终态、权限、幂等、恢复、证据、评估</b>不随框架更换而失效。</span></div><div><b>活跃规范</b><span><b>MCP、A2A、模型 API、SDK</b>以原始来源、版本和日期为准。</span></div><div><b>场景方法</b><span><b>ReAct、RAG、重排、多 Agent</b>只说明何时可尝试，不是默认方案。</span></div><div><b>本地验证</b><span>采用前同时检查<b>完成、安全、成本、延迟</b>；论文和案例只是候选证据。</span></div></div></section>`}
function renderKnowledge() {
  let html = knowledgeUsageGuide() + knowledgeCompass() + learningWorkbench() + applicationCanvas() + systemMap() + knowledgeResearchPatterns() + knowledgeSources();
  KNOWLEDGE.categories.forEach((cat, categoryIndex) => {
    html += `<section class="section knowledge-domain"><div class="domain-heading"><span class="domain-number">${String(categoryIndex + 1).padStart(2, "0")}</span><div><h2 class="section-title">${cat.icon} ${cat.name}</h2><p class="section-desc">${cat.desc}</p></div></div><div class="knowledge-item-stack">`;
    cat.items.forEach((item,i) => {
      html += `<div class="kp" id="${cat.id}-${i}"><h4>${item.title}</h4>`;
      if(item.tags) html += `<div class="tags">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
      html += knowledgeCardMeta(item, cat);
      html += `<div class="body">${CARD_BODY_OVERRIDES[item.title] || item.body}</div>`;
      const refs = item.refs && item.refs.length ? item.refs : CARD_EXTRA_REFS[item.title];
      if(refs && refs.length) {
        html += `<div class="refs">引用：${refs.map(r=>`<a href="${r.u}" target="_blank" rel="noopener">📄 ${r.t}</a>`).join('')}<span>内容最后核对：2026-07-27</span></div>`;
      }
      html += `</div>`;
    });
    html += `</div></section>`;
  });
  return html;
}

function evaluationEvidenceContract(){return `<section class="workbench evaluation-contract"><div class="kicker">真实 Agent 评估的输出契约</div><h2>没有阶段与事实，不能给改进建议</h2><p>评估不是根据框架名猜问题。先固定一个任务，再从运行记录找出具体异常；改动建议只能解释这条异常，不应替代事实。</p><div class="evaluation-scope"><div><b>只有代码和 README</b><span>可以说明职责、接口和潜在风险，结论标为<b>结构审查</b>。</span></div><div><b>任务 + Trace + 最终状态</b><span>可以说明<b>哪个阶段发生了什么</b>，并判断问题落在输入、工具、状态、证据还是验收。</span></div><div><b>固定基线 + 前后对照</b><span>才可以说明改动是否改善<b>完成、安全、成本或延迟</b>。</span></div></div><div class="evaluation-path"><b>任务与验收</b><i>→</i><b>运行阶段</b><i>→</i><b>原始现象</b><i>→</i><b>问题判断</b><i>→</i><b>改动与验证</b></div><div class="evaluation-output"><div><b>1. 发生阶段</b><span>例如：工具参数校验、检索召回、结果展示、验收或恢复。</span></div><div><b>2. 原始现象</b><span>引用 Trace、测试、外部终态或可复现样本；写出预期与实际差异。</span></div><div><b>3. 本次判断</b><span>说明为什么这条现象支持某个问题，也写清仍不知道什么。</span></div><div><b>4. 改动与验收</b><span>改哪个机制、预期影响什么、用哪组任务验证；同时写出停止或回滚条件。</span></div><div class="theory"><b>5. 理论依据与边界</b><span>关联本页知识点、原始论文或活跃规范，并写清它支持的机制、适用条件、反例和来源日期。研究只说明<b>为什么值得试</b>，本地对照才说明<b>是否有效</b>。</span></div></div><div class="evidence"><b>拒绝输出：</b>没有阶段和原始记录时，不写“模型推理差”“记忆无效”或“应加多 Agent”；没有基线和对照时，不写“该方案已提升效果”。没有机制依据与适用边界时，也不把“最新研究”包装成默认方案。这三类内容只能列为待核实假设。</div></section>`}

function targetAgentProfile(){return `<section class="workbench"><div class="kicker">被评测 Agent 画像</div><h2>先识别被评测 Agent 的任务侧重点与差异化价值</h2><p>评估对象可以是任何 Agent。先判断它服务的高价值任务、差异化机制和关键约束，再选择评测维度；不能用同一套权重审查所有 Agent。</p><div class="flow"><div><b>1. README 与文档</b><span>提取目标用户、关键任务、承诺结果与明确不做什么。</span><small>得到声明的价值定位</small></div><div><b>2. 代码与配置</b><span>核对真实任务循环、工具/数据依赖、状态边界和护栏，不只相信介绍文案。</span><small>得到实际实现机制</small></div><div><b>3. 演进记录</b><span>从提交、变更说明和问题修复中识别投入方向、反复故障与被放弃的取舍。</span><small>得到演进证据，不等于质量证明</small></div><div><b>4. 测试与轨迹</b><span>用任务夹具、运行轨迹和重复结果确认它实际完成了什么，以及在哪失效。</span><small>得到可验证的行为证据</small></div></div><div class="evidence"><b>先定评测侧重点：</b>功能交付看正确性与回归；缺陷修复看复现与根因；业务操作看授权与恢复；检索看证据与忠实性。任务不同，维度权重必须不同。</div><div class="evidence"><b>识别差异化价值：</b>把“高价值任务 + 差异化机制/数据/集成 + 可验证终态”连在一起；只列功能名、框架名或提交数量都不能构成竞争力。</div><div class="evidence"><b>定向改进：</b>每项改进都要回答它保护或放大哪项竞争力，改变哪段机制，凭什么预期有效，又会牺牲什么。README 与历史和代码不一致时，先标为待核实，不把任何一方当结论。</div><div class="evidence"><b>分析原则：</b>被评测 Agent 的侧重点决定“评什么”；结果以可视化方式呈现优点、风险、定向方案和置信度。</div></section>`}
function evaluationOutputContract(){return `<section class="workbench"><div class="kicker">评估交付物</div><h2>一次 Agent 评估，最后应交付什么？</h2><p>不是一个总分，而是一条能追溯到任务与证据的判断链。</p><div class="flow"><div><b>1. 已有优势</b><span>当前设计已经覆盖了哪些任务风险，例如授权、状态恢复或证据引用。</span><small>说明优势为何成立</small></div><div><b>2. 问题与风险</b><span>指出发生在任务、工具、状态或终态的具体缺口，并标明它是事实还是待核实假设。</span><small>定位到失效环节</small></div><div><b>3. 改进方案</b><span>写清改什么、为何可能缓解问题、会带来什么成本或副作用，以及何时不该用。</span><small>给出可执行动作</small></div><div><b>4. 证据与置信度</b><span>说明外部来源支持的机制和范围，列出反例后给出强候选、待补充或不建议。</span><small>不把引用当效果结论</small></div><div><b>5. 评估图</b><span>把任务契约、执行证据、优势与风险、改进方案连成一条可追溯路径。</span><small>任务 → 证据 → 判断 → 建议</small></div></div><div class="evidence"><b>资料决定深度：</b>任务 + 当前设计，可做架构审查；再加执行轨迹，可定位失败步骤与状态偏移；再加重复结果，才可比较稳定表现与实际差异。</div><div class="evidence"><b>输出边界：</b>没有目标 Agent 的任务、设计或轨迹时，本页只给基于公开证据的静态候选；不能把它写成该 Agent 已有优点、已有缺陷或已经提升。</div></section>`}
function evaluationReport(){return `<section class="workbench"><div class="kicker">评估报告主视图</div><h2>先把 Agent 的现状说清，再讨论改什么</h2><p>报告以现状分析为主：先形成可追溯的当前画像，再把改进方案限定为服务于该画像的下一步。</p><div class="analysis-report"><section class="report-lane current"><div class="report-lane-head"><span>60%</span><h3>现状分析</h3><small>先回答：它现在是什么状态？</small></div><div class="report-item"><b>任务与差异化价值</b><p>目标用户、关键任务、成功终态、非目标，以及真正构成差异的机制、数据或集成。</p><em>输出：项目侧重点与核心价值假设</em></div><div class="report-item"><b>当前设计与运行路径</b><p>任务循环、工具与数据依赖、状态、权限、人工接管和恢复路径；用系统图和轨迹串起来。</p><em>输出：架构/行为可视化</em></div><div class="report-item"><b>优点、短板与风险</b><p>已有控制实际覆盖了什么风险；缺口在哪个任务环节；区分已证实问题、设计推断和尚无证据的未知项。</p><em>输出：优势、风险与证据状态</em></div><div class="report-item"><b>证据覆盖与可信度</b><p>README、代码、演进记录、测试与轨迹是否互相支持；不一致处列为待核实，而不是强行下结论。</p><em>输出：可追溯事实与待补证据清单</em></div></section><section class="report-lane improve"><div class="report-lane-head"><span>40%</span><h3>定向改进</h3><small>再回答：什么值得改？</small></div><div class="report-item"><b>改进优先级</b><p>只处理会保护或放大核心价值的瓶颈；不因“更自主”或“更复杂”本身而加方案。</p><em>输出：与现状风险相连的优先级</em></div><div class="report-item"><b>改动与作用机制</b><p>明确改什么，作用于任务、工具、状态、检索还是控制层，以及为什么可能缓解该问题。</p><em>输出：可执行的改动假设</em></div><div class="report-item"><b>落地条件与代价</b><p>需要哪些代码、数据、流程或权限变化；会损失什么速度、成本、可读性、稳定性或信任。</p><em>输出：实施边界与取舍</em></div><div class="report-item"><b>建议状态</b><p>结合外部研究、公开项目机制与反例，标记强候选、待补充或不建议，不伪造效果结论。</p><em>输出：置信度与下一步证据</em></div></section></div><div class="evidence"><b>报告逻辑：</b>项目资料 → 现状可视化 → 优点/风险/未知项 → 定向改进 → 证据与落地判断。资料不足时，现状中的“未知项”比泛化建议更重要。</div></section>`}
function evaluationReadingGuide(){return `<section class="reader-guide"><div class="kicker">如何阅读一份评估</div><h2>先读结论，再按需要进入证据和代码</h2><p>不需要预先理解 Agent，也能判断一个项目在做什么、哪里可靠、哪里值得改。需要落地时，每个判断都保留对应的任务、轨迹、代码或测试入口。</p><div class="reader-path"><section class="reader-step"><b>它在完成什么事？</b><p>先看目标用户、要完成的任务和什么结果才算完成。</p><small>技术定位：任务契约、终态、版本</small></section><section class="reader-step"><b>它现在做得怎么样？</b><p>看已经可靠的部分、明显风险和暂时没有证据的地方。</p><small>技术定位：流程图、状态、工具、轨迹</small></section><section class="reader-step"><b>为什么建议改这里？</b><p>看这项改动保护哪种用户价值，避免什么失败或返工。</p><small>技术定位：失效环节、作用机制、依赖</small></section><section class="reader-step"><b>这条建议可信到什么程度？</b><p>看项目证据、相近研究、适用条件、成本和反例，而非只看一个分数。</p><small>技术定位：T/P/D/U、吻合度、回滚</small></section></div><div class="reader-contract"><div><b>每条结论固定三层</b><p><b>意义：</b>对用户或项目意味着什么。<b>依据：</b>来自哪份资料或运行现象。<b>定位：</b>落到任务、工具、状态、数据或代码位置。</p></div><div><b>五个产物按阅读顺序衔接</b><p><code>项目画像</code> 说明对象，<code>现状报告</code> 呈现优缺点，<code>证据登记</code> 供复查，<code>改进计划</code> 给动作，<code>决策摘要</code> 帮助取舍。</p></div></div><div class="evidence"><b>表达规则：</b>标题先说结论，不只抛术语；第一次出现的专业词同时说明它观察什么；代码、配置、Trace、Mermaid 图和来源保留为可展开的技术证据。通俗表达不替代技术判断，技术细节也不应藏起结论。</div></section>`}
function evaluationPlaybook(){return `<section class="evaluation-playbook"><div class="kicker">评估执行规范</div><h2>输入、分析、产物要一一对应</h2><p>先定义目标 Agent 的任务与证据，再输出现状报告和定向方案。每个结论回指资料来源，每个建议回指现状问题。</p><div class="spec-rail"><div class="spec-step"><b>01 项目基线</b><span>版本、提交、目标用户与任务范围。</span><small>AssessmentInput</small></div><div class="spec-step"><b>02 任务契约</b><span>终态、约束、非目标、权限与可接受路径。</span><small>TaskContract</small></div><div class="spec-step"><b>03 证据采集</b><span>文档、代码、配置、历史、测试、轨迹分开登记。</span><small>EvidenceRegister</small></div><div class="spec-step"><b>04 现状建模</b><span>任务、决策、工具、状态、外部系统和人工节点。</span><small>CurrentStateMap</small></div><div class="spec-step"><b>05 发现与建议</b><span>优点、风险、未知项与改动一一关联。</span><small>Findings + Plan</small></div><div class="spec-step"><b>06 决策摘要</b><span>现在做什么、先补什么证据、哪些不做。</span><small>DecisionSummary</small></div></div><div class="playbook-grid"><section class="playbook-block"><h3>输入最低要求</h3><ul><li><b>目标定义：</b>任务、用户、成功终态、非目标、风险等级。</li><li><b>实现材料：</b>README/文档、架构、工具 schema、配置、数据与权限边界。</li><li><b>行为材料：</b>测试夹具、运行轨迹、工具输入输出、失败样本与重复结果。</li><li><b>演进材料：</b>关键提交、变更原因、回退、重复修复与未解决问题。</li></ul></section><section class="playbook-block"><h3>分析顺序</h3><ol><li>建立任务契约和项目差异化价值。</li><li>画当前全流程与关键状态/数据流。</li><li>以证据为单位列优点、风险和未知项。</li><li>只针对影响核心价值的风险提出改动。</li><li>评估机制吻合、来源、落地条件、代价与反例。</li><li>把建议归入现在做、先补证据或不建议。</li></ol></section></div><h3>标准产物</h3><table class="artifact-table"><thead><tr><th>产物</th><th>必须字段</th><th>推荐可视化</th><th>结论边界</th></tr></thead><tbody><tr><td>01 ProjectProfile</td><td>任务、用户、终态、差异化价值、版本、材料覆盖</td><td>任务边界图</td><td>README 只证明声明</td></tr><tr><td>02 CurrentStateReport</td><td>架构路径、工具/状态/数据流、优点、风险、未知项</td><td>全流程 Mermaid 图</td><td>无轨迹时行为只能标为推断</td></tr><tr><td>03 EvidenceRegister</td><td>主张、来源、证据类型、观察、矛盾、缺口</td><td>证据覆盖表</td><td>历史与文档不能替代运行证据</td></tr><tr><td>04 ImprovementPlan</td><td>问题、改动、机制、理论依据、来源、代价、落地条件、反例、置信度</td><td>问题到改动关联图</td><td>外部研究不承诺项目效果</td></tr><tr><td>05 DecisionSummary</td><td>现在做、先补证据、不建议、依赖、下一步验证</td><td>优先级清单</td><td>重复结果后才报告实际差异</td></tr></tbody></table><h3>可视化协议</h3><div class="visualization-grid"><div><b>全流程图</b><p>默认用 Mermaid <code>flowchart LR</code>，展示任务、决策、工具、状态、外部系统和终态。</p></div><div><b>细节时序图</b><p>工具失败、授权、重试或人工接管用 <code>sequenceDiagram</code>，只展开问题链路。</p></div><div><b>状态与恢复图</b><p>长任务、异步任务、幂等与恢复用 <code>stateDiagram-v2</code>。</p></div><div><b>数据与权限图</b><p>敏感数据、检索证据、权限传播用带标签的 <code>flowchart</code>。</p></div></div><div class="legend-row"><span class="confirmed">蓝：已确认组件/数据流</span><span class="strength">绿：已验证优势或控制</span><span class="risk">黄：风险或待核实假设</span><span class="failure">红：已观察违例</span><span class="proposal">紫：建议改动</span></div><pre class="mermaid-template">flowchart LR&#10;  U[任务与约束] --&gt; A[Agent 决策] --&gt; T[工具调用]&#10;  T --&gt; S[(状态 / 外部系统)] --&gt; A&#10;  A --&gt; O[可验证终态]&#10;  R[观察到的风险] -.影响.-&gt; T&#10;  P[建议改动] -.保护.-&gt; A&#10;  classDef confirmed fill:#e8f1ff,stroke:#2f6fed,color:#12345b&#10;  classDef risk fill:#fff2cf,stroke:#b97900,color:#5f3c00&#10;  classDef proposal fill:#f1ebff,stroke:#7a4ac7,color:#37205f&#10;  class U,A,T,S,O confirmed&#10;  class R risk&#10;  class P proposal</pre><h3>建议置信度与理论依据</h3><table class="confidence-table"><thead><tr><th>字段</th><th>必须写什么</th><th>判定规则</th></tr></thead><tbody><tr><td>理论依据</td><td>改动影响哪一层机制，为什么能缓解当前风险</td><td>不能只写方法名</td></tr><tr><td>来源等级</td><td>T：目标项目测试/轨迹/代码；P：原始论文或可复现基准；D：项目文档/历史；U：未知</td><td>T 最接近事实，P 支持相近机制，D 只提供线索</td></tr><tr><td>目标吻合</td><td>任务、约束、工具环境与失败模式是否可解释地相近</td><td>任务名相似不等于机制吻合</td></tr><tr><td>落地可行</td><td>代码、数据、权限、流程、成本、用户体验与回滚条件</td><td>会伤害核心路径就不能列为强候选</td></tr><tr><td>建议状态</td><td>强候选 / 待补证据 / 不建议</td><td>强候选需机制、来源、目标吻合与落地条件完整，且无未解释反例</td></tr></tbody></table><h3>标准建议格式</h3><pre class="output-schema">REC-01  &lt;短标题&gt;&#10;目标问题：&lt;风险/未知项 ID&gt;&#10;保护的项目价值：&lt;任务侧重点或差异化价值&gt;&#10;建议改动：&lt;代码、配置、数据或流程动作&gt;&#10;作用机制：&lt;改变哪一层，为什么可能有效&gt;&#10;理论依据与来源：&lt;T/P/D/U + 链接或项目材料&gt;&#10;目标吻合：&lt;高/中/低 + 原因&gt;&#10;落地条件：&lt;依赖、权限、数据、回滚方式&gt;&#10;代价与反例：&lt;成本、可读性、稳定性、何时不适用&gt;&#10;置信度与状态：&lt;强候选/待补证据/不建议&gt;&#10;下一步：&lt;需要补的证据或最小验证动作&gt;</pre><div class="evidence"><b>执行要求：</b>任何 AI 先输出 01-03 的现状产物，再输出 04 的改进计划；找不到来源、轨迹或测试支撑的主张，必须放入未知项/待补证据。</div></section>`}
function renderEval() {
  const references=evaluationReferences().replace('<section class="evidence-map">','<section class="evidence-map reference-projects">').replace('当前参考项目 · 2026-07-26 核对','参考项目 · 2026-07-26 核对').replace('参考项目分别解决哪一环？','参考项目').replace('它们不是同一种“建议生成器”：本页把任务标准、过程证据、失败定位和稳定性验证作为输入，结合具体 Agent 的设计，给出改进点、可改动作、作用机制、边界与置信度。','按实际作用分为任务标准、过程证据、失败定位与稳定性验证；它们为当前 Agent 的现状分析和定向改进提供机制参考，不替代项目自身证据。');
  let html = evaluationEvidenceContract() + evaluationReadingGuide() + targetAgentProfile() + evaluationReport() + evaluationPlaybook() + references + evalWorkbench() + comparisonBoardV2() + evaluationContractMap() + toolEvaluationLayers() + evidenceLadder() + evidenceClaimsV2() + evaluationSources();
  html += `<section class="eval-dimensions" aria-label="七项核心评估维度">`;
  AGENT_EVALUATION_DIMS.forEach(dim => {
    html += `<article class="eval-dim" id="eval-${dim.num}"><h4><span class="num">${dim.num}.</span><span>${dim.title}</span></h4>`;
    html += `<div class="why">为什么评估这个：${dim.why}</div>`;
    html += `<div class="check-list">${dim.checks}</div>`;
    if(dim.good && dim.bad) {
      html += `<div class="good-bad"><div class="good">${dim.good}</div><div class="bad">${dim.bad}</div></div>`;
    }
    if(dim.improve) html += `<div class="improve">💡 ${dim.improve}</div>`;
    if(dim.link) html += `<div class="link">${dim.link}</div>`;
    html += `<div class="evidence"><b>需要收集的证据：</b>${EVIDENCE[dim.num]}</div>`;
    html += `</article>`;
  });
  html += `</section>`;
  return html;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.top-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.top-tab[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelector('.sidebar').style.display = 'block';
  renderQA(tab);
  const content = document.getElementById('content');
  content.className = `content ${tab}-view`;
  if(tab==='knowledge') content.innerHTML = renderKnowledge();
  else content.innerHTML = renderEval();
  buildNav(tab);
  setMobileNav(false);
}

// Init
buildTab();
function buildTab(){document.querySelectorAll('.top-tab').forEach(tab=>{tab.addEventListener('click',function(){switchTab(this.dataset.tab)})})}
document.getElementById('navToggle').addEventListener('click', () => {
  const sidebar = document.querySelector('.sidebar');
  setMobileNav(!sidebar.classList.contains('mobile-open'));
});
buildNav();
const requestedTab = new URLSearchParams(window.location.search).get('tab');
switchTab(['knowledge','eval'].includes(requestedTab) ? requestedTab : 'knowledge');
</script>
