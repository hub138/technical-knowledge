function renderRelations(note){
  // 知识库管理记录的是维护方法而不是技术知识，它的页面照常可读，
  // 但不展示入链和延伸：否则维护资料会挂在正文下方，看起来像技术知识的关联。
  const root=$('#reader-relations');
  if(note.exclude_from_graph){root.innerHTML='';root.hidden=true;return}
  root.hidden=false;
  const notesByPath=new Map(state.notes.map(item=>[item.path,item]));
  const incoming=[],outgoing=[],seenIncoming=new Set(),seenOutgoing=new Set();
  for(const edge of state.edges){
    if(edge.target===note.path&&!seenIncoming.has(edge.source)&&notesByPath.has(edge.source)){seenIncoming.add(edge.source);incoming.push(notesByPath.get(edge.source))}
    if(edge.source===note.path&&!seenOutgoing.has(edge.target)&&notesByPath.has(edge.target)){seenOutgoing.add(edge.target);outgoing.push(notesByPath.get(edge.target))}
  }
  const moduleOf=item=>`${item.category==='总览'?'首页':item.category} / ${item.topic==='首页'?'入口':item.topic}`;
  /* rt16 用户截图反馈修复（2026-09-22）：卡片标题原 compact() 20 字硬截断，
   * 「幻觉的工程边界——哪些场景模型不该被单独信任」被截成「…不该被单…」。
   * SVG text 不支持自动换行，改为 wrap2() 语义拆两行：优先在长破折号/冒号等
   * 自然断点处分行（断点含整个「——」，不劈成两半），找不到才硬拆；
   * 第二行仍超宽才截断加 …。单行 ≤17 字（13px 字号下 ≈221px ≤ 卡内 226px 可用宽）。 */
  /* 【rt26】拉丁标题自适应：实测 34 拉丁字符 ≈222px ≈ 卡内可用 226px。
   * 总长 ≤68：13px 两行装完；超长按 13*68/L 缩字号（下限 9.2px，约 47 字/行），
   * 两行尽量装完；仍超（>96 字符）才截断。wrap2（行预算）与 node()（字号）共用。 */
  /* 【rt27·三修】latinFit 重写为模拟式。前两版（公式给 budget=ceil(L/2)）的病根：
   * 公式假设两行都能填满到预算，但 wrap2 断点在词边界提前断（68 字符题实测
   * 行1 只装 26），行2 必然超预算 → 永远截断，字号怎么调都救不回。
   * 改为模拟：字号从 13 递减到 8.2（步长 0.2），每个字号按词贪婪折行
   * （行预算 = floor(34*13/fs)，34 字符 ≈222px ≈ 卡内 226px 可用宽），
   * 第一个"两行装完"的字号胜出；全部失败才在 8.2px 词边界截断兜底。
   * 返回 {fs, lines}，wrap2 拉丁分支直接消费 lines，不再二次猜测。 */
  const latinFit=v=>{
    const words=v.split(' ');
    const wrap=budget=>{const ls=[];let cur='';
      for(const w of words){if(!cur)cur=w;else if(cur.length+1+w.length<=budget)cur+=' '+w;else{ls.push(cur);cur=w}}
      if(cur)ls.push(cur);return ls};
    for(let fs=13;fs>=8.19;fs-=0.2){const b=Math.floor(35*13/fs);const ls=wrap(b);/* 【rt27·加宽】基准 34→35：卡 290 可用 266px，35 字符 ≈258px。 */
      if(ls.length<=2)return{fs:Math.round(fs*10)/10,lines:ls}}
    const b=Math.floor(35*13/8.2);const ls=wrap(b);
    if(ls.length>2){const rest=ls.slice(1).join(' ');let r=rest.slice(0,b-1);
      const sp=r.lastIndexOf(' ');if(sp>b*0.6)r=r.slice(0,sp);
      return{fs:8.2,lines:[ls[0],r+'…']}}
    return{fs:8.2,lines:ls}};
  const wrap2=(value)=>{
    /* 【rt29·修】CJK 分支病根（中文回归时发现）：max=17 是旧 250px 卡
     * （可用 226px）时代的老预算，rt27 把卡加宽到 290（可用 266px ≈ 20.4 个
     * 13px CJK 字）时只同步了拉丁分支基准（34→35），CJK 分支漏改；
     * 且按字符数计宽把嵌入的拉丁词（Trace、CI）也当整字宽虚估近一倍——
     * 实测「指标、日志、Trace与剖析各答一问，合起来才构成证据」拆行后
     * 第二行 191px 明明装得下，按 21 字符 >17 误判截断成「…」。
     * 改为视觉宽度模型：CJK/全角算 1，ASCII 算 0.55（约半宽），
     * 预算 20（266px 留 1 字余量）。断点搜索与硬截断同旧逻辑。 */
    if(!/[\u4e00-\u9fff]/.test(value))return latinFit(value).lines;
    const vwid=s=>{let w=0;for(const c of s)w+=c.charCodeAt(0)>0x2E7F?1:0.55;return w};
    const max=20;
    if(vwid(value)<=max)return [value];
    /* 单行硬上限：宽度不超预算的最大字符索引（ASCII 多的串字符数会超过 max）。 */
    let hard=value.length;
    while(hard>1&&vwid(value.slice(0,hard))>max)hard--;
    let cut=-1;
    for(let i=hard-1;i>3;i--){
      const ch=value[i];
      if(ch==='：'||ch===':'||ch==='·'||ch==='、'||ch===','||ch===' '){cut=i+1;break}
      if(ch==='—'){cut=(value[i-1]==='—')?i+1:i;break}
    }
    if(cut<0)cut=hard;
    const head=value.slice(0,cut),rest=value.slice(cut);
    /* 【rt29·尾行均衡】断点在句尾标点时尾行只剩 1-2 字（「…平均槽/位」），
     * 全站 117 篇超预算标题里 8 篇会触发。孤字行信息完整但排版碎，
     * 回退为宽度均衡拆行：总宽对半、在附近找标点或直接硬切。
     * 不设总宽下限：21 字题超预算才 1 字，任何两行拆法都装得下，
     * 门槛只会把这类题挡在外面白修。 */
    if(vwid(rest)<3){
      const half=vwid(value)/2;let idx=0,acc=0;
      for(let i=0;i<value.length;i++){acc+=value.charCodeAt(i)>0x2E7F?1:0.55;if(acc>=half){idx=i+1;break}}
      let bcut=-1;
      for(let i=idx;i>=3&&i>idx-8;i--){
        const ch=value[i];
        if(ch==='：'||ch===':'||ch==='·'||ch==='、'||ch===','||ch===' '){bcut=i+1;break}
      }
      bcut=bcut>0?bcut:idx;
      const h2=value.slice(0,bcut),r2=value.slice(bcut);
      if(vwid(r2)<=max)return[h2,r2];
    }
    /* 【rt26】拉丁串截断前先回找词边界（空格），避免「the n…」式劈词。 */
    if(vwid(rest)>max){let r=rest.slice(0,hard);if(!/[\u4e00-\u9fff]/.test(value)){const sp=r.lastIndexOf(' ');if(sp>max*0.6)r=r.slice(0,sp)}while(vwid(r+'…')>max)r=r.slice(0,-1);return[head,r+'…']}
    return [head,rest];
  };
  /* 卡高按行数动态：单行 54（原值），两行 66。间距统一 78，两种卡高都不会重叠。 */
  const nodeH=item=>wrap2((window.TKI18N&&window.TKI18N.lang==='en')?window.TKI18N.t(item.title):item.title).length>1?66:54;/* 【rt26】与 node() 同路径先译后拆，卡高跟着译后行数走。 */
  /* rt16：meta 行原显示 moduleOf 全称（「AI 系统工程：从模型能力到生产能力 / 质量与运营」），
   * 入链/延伸节点几乎全在同一模块，每卡重复一整行长名且必被截断，无信息量还挤占标题空间。
   * 改为只显示主题（子目录）短名；完整「域 / 主题」路径保留在 hover 的 <title> 里不丢失。 */
  const metaOf=item=>(item.category==='总览'||item.topic==='首页')?'首页':item.topic;
  const mobile=matchMedia('(max-width:760px)').matches;
  const incomingNodes=incoming.slice(0,mobile?1:3),outgoingNodes=outgoing.slice(0,3);
  const width=mobile?360:1120,height=mobile?410:250,nodeWidth=290;/* 【rt27·加宽】desktop 卡 250→290（与 mobile 统一）：latinFit 实测最长行 249px 超 250 卡可用 226px；290 卡可用 266px 装下全部实测行宽。 */
  const current={x:mobile?35:415,y:mobile?100:83};/* 【rt27·加宽】三列 20/415/810：列距 105，左右边距对称 20，总宽 810+290=1100 ≤ viewBox 1120。 */
  /* 间距 68→78：配合两行卡的 66 高度（66+12 呼吸），三张两行卡纵排 20+2*78+66=240 ≤ viewBox 250。 */
  const inputY=index=>mobile?24:incomingNodes.length===1?83:20+index*78;
  const outputY=index=>mobile?185+index*78:20+index*78;
  const node=(item,x,y,kind='')=>{
    /* 【rt26】rt24 修的是主图谱视图，本关系图仍原文进 wrap2：两行卡先拆后翻，
       断串（如「重试的正确姿势：退避、」）永不命中词典，实测中心卡与长题邻卡
       停留中文。改为先译后拆，与主图谱同策略。 */
    const trT=(window.TKI18N&&window.TKI18N.lang==='en')?window.TKI18N.t(item.title):item.title;
    /* 【rt27·三修】模拟式折行一次算完 {fs, lines}，标题行与字号同源，不再各算各的。 */
    const fit=(!/[\u4e00-\u9fff]/.test(trT))?latinFit(trT):null;
    const ts=fit?fit.lines:wrap2(trT),two=ts.length>1;
    /* 两行卡：t1 y+20 / t2 y+36 / meta y+55（卡高 66）；单行卡维持原 y+22 / y+40（卡高 54）。 */
    const fs=fit?fit.fs:13;
    const titleTexts=two
      ?`<text class="relation-node-title" style="font-size:${fs}px" x="${x+12}" y="${y+20}">${esc(ts[0])}</text><text class="relation-node-title" style="font-size:${fs}px" x="${x+12}" y="${y+36}">${esc(ts[1])}</text>`
      :`<text class="relation-node-title" style="font-size:${fs}px" x="${x+12}" y="${y+22}">${esc(ts[0])}</text>`;
    const metaY=two?y+55:y+40;
    return `<g class="relation-node ${kind}" data-note="${esc(item.path)}" role="button" tabindex="0" aria-label="${(window.TKI18N&&window.TKI18N.lang==='en')?('Open '+esc(trT)):('打开 '+esc(item.title))}"<!-- 【rt26】拼接串改语言分支。 -->><title>${(window.TKI18N&&window.TKI18N.lang==='en')?(esc(window.TKI18N.t(item.title))+' — '+esc(window.TKI18N.t(moduleOf(item).split(' / ')[0])+' / '+window.TKI18N.t(moduleOf(item).split(' / ')[1]))):(esc(item.title)+'：'+esc(moduleOf(item)))}</title><!-- 【rt24】title 悬浮提示原为整串拼接永不命中；分段 tr。 --><rect x="${x}" y="${y}" width="${nodeWidth}" height="${two?66:54}" rx="5"></rect>${titleTexts}<text class="relation-node-meta" x="${x+12}" y="${metaY}">${esc(metaOf(item))}</text></g>`;
  };
  /* 连线端点跟随两端卡片实际高度（单行 54 / 两行 66），取各自纵向中点。 */
  const edge=(x1,y1,x2,y2,kind='')=>`<path class="relation-edge ${kind}" marker-end="url(#relation-arrow)" d="M${x1} ${y1} C${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"></path>`;
  const lines=[];
  const nodes=[];
  if(mobile){
    incomingNodes.forEach((item,index)=>{const y=inputY(index);lines.push(edge(current.x+nodeWidth/2,y+nodeH(item),current.x+nodeWidth/2,current.y,'incoming'));nodes.push(node(item,35,y))});
    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth/2,current.y+nodeH(note),current.x+nodeWidth/2,y));nodes.push(node(item,35,y))});
  }else{
    incomingNodes.forEach((item,index)=>{const y=inputY(index);lines.push(edge(20+nodeWidth,y+nodeH(item)/2,current.x,current.y+nodeH(note)/2,'incoming'));nodes.push(node(item,20,y))});/* 【rt27·加宽】20/810 跟随新列位。 */
    outgoingNodes.forEach((item,index)=>{const y=outputY(index);lines.push(edge(current.x+nodeWidth,current.y+nodeH(note)/2,810,y+nodeH(item)/2));nodes.push(node(item,810,y))});
  }
  root.classList.add('collapsed');
  root.innerHTML=`<div class="article-relations-head"><div class="article-relations-heading"><h3>知识图谱</h3><span>${(window.TKI18N&&window.TKI18N.lang==='en')?(incoming.length+' incoming · '+outgoing.length+' outgoing'):(incoming.length+' 条入链 · '+outgoing.length+' 条延伸')}</span><!-- 【rt24】原模板直接拼中文整串，词典按整串匹配永不命中；改为按语言分支拼装。 --></div><button type="button" class="relation-collapse" title="折叠知识图谱" aria-label="折叠知识图谱" aria-expanded="true">▾</button></div><svg class="relation-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="${(window.TKI18N&&window.TKI18N.lang==='en')?(esc(window.TKI18N.t(note.title))+' — direct knowledge graph'):(esc(note.title)+' 的直接知识图谱')}"<!-- 【rt26】同修 4。 -->><defs><marker id="relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8faea4"></path></marker></defs><text class="relation-label" x="${mobile?35:20}" y="${mobile?15:13}"><!-- 【rt27·加宽】跟随新列位。 -->${(window.TKI18N&&window.TKI18N.lang==='en')?('Cites this note'+(incoming.length>incomingNodes.length?' · '+incoming.length:'')):('引用当前节点'+(incoming.length>incomingNodes.length?' · '+incoming.length:''))}</text><!-- 【rt24】同计数 span：模板拼数字导致整串永不命中，按语言分支拼装。 --><text class="relation-label" x="${mobile?35:810}" y="${mobile?177:13}"><!-- 【rt27·加宽】跟随新列位。 -->${(window.TKI18N&&window.TKI18N.lang==='en')?('Extends from this note'+(outgoing.length>outgoingNodes.length?' · '+outgoing.length:'')):('从当前节点延伸'+(outgoing.length>outgoingNodes.length?' · '+outgoing.length:''))}</text>${lines.join('')}${node(note,current.x,current.y,'current')}${nodes.join('')}</svg>`;
  root.querySelectorAll('[data-note]').forEach(nodeElement=>{nodeElement.onclick=()=>openNote(nodeElement.dataset.note);nodeElement.onkeydown=event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();openNote(nodeElement.dataset.note)}}});
  /* 与同模块对称：知识图谱默认展开，显式清掉上一篇可能留下的 collapsed。 */
  root.classList.remove('collapsed');
  const toggle=root.querySelector('.relation-collapse');
  toggle.onclick=()=>{const collapsed=root.classList.toggle('collapsed');const en=window.TKI18N&&window.TKI18N.lang==='en';/* 【rt26】点击后重赋的 title/aria-label 原恒为中文，EN 态改分支。 */toggle.textContent=collapsed?'▸':'▾';toggle.title=collapsed?(en?'Expand graph':'展开知识图谱'):(en?'Collapse graph':'折叠知识图谱');toggle.setAttribute('aria-label',toggle.title);toggle.setAttribute('aria-expanded',String(!collapsed))};
}
/* 折叠钮的 aria-label 描述「点下去会发生什么」，必须随折叠态与语言同步：
   点击只改 aria-expanded 的话，收起后读屏仍听到「折叠」；语言切换后组合串
   不命中词典，EN 态读到中文。两个事件都汇到这里统一重算。 */
function syncRailToggleLabels(){
  const en=window.TKI18N&&window.TKI18N.lang==='en';
  const tr=window.TKI18N?window.TKI18N.t:(s)=>s;
  document.querySelectorAll('.reader-siblings,.reader-toc').forEach(rail=>{
    const btn=rail.querySelector('.rail-toggle');
    if(!btn)return;
    const labelEl=rail.querySelector('.rail-head span');
    const label=labelEl?labelEl.textContent.trim():'';
    const collapsed=rail.classList.contains('collapsed');
    btn.setAttribute('aria-label',en?`${collapsed?'Expand':'Collapse'} ${tr(label)}`:`${collapsed?'展开':'折叠'}${label}`);
  });
}
function renderReaderRails(note){
  const siblings=$('#reader-siblings'),toc=$('#reader-toc');
  // Siblings: every note in the same domain/topic, so a reader can move
  // sideways through a module without going back to the directory.
  const peers=state.notes.filter(x=>x.category===note.category&&x.topic===note.topic);
  /* 每次渲染重置折叠态：容器 class 不随 innerHTML 重建，不重置的话
     上一篇手动展开过、下一篇就带着展开态进来（状态跨文章泄漏）。 */
  siblings.classList.add('collapsed');
  siblings.innerHTML=railHead('同模块',peers.length>1,false)+'<ul class="rail-list">'+peers.map(x=>`<li><a href="/?path=${encodeURIComponent(x.path)}" data-note="${esc(x.path)}"${x.path===note.path?' aria-current="page"':''}>${esc(x.title)}</a></li>`).join('')+'</ul>';
  siblings.querySelectorAll('a[data-note]').forEach(a=>a.onclick=e=>{e.preventDefault();openNote(a.dataset.note)});

  // Table of contents from the rendered headings, indented by level.
  const heads=[...$('#reader-body').querySelectorAll('h2,h3,h4')];
  heads.forEach((h,i)=>{h.id=h.id||`h-${i}-${(h.textContent||'').trim().slice(0,20).replace(/\W+/g,'-')}`});
  /* 没有可列标题就撤掉整个目录栏：一个只有"本文目录"四个字的空框
     既占位又没有动作，比没有更糟（待核验内容这类短文实测）。 */
  toc.hidden=heads.length===0;
  toc.innerHTML=railHead('本文目录',heads.length>0)+'<ul class="rail-list toc-list">'+heads.map(h=>`<li><a href="#${h.id}" data-level="${h.tagName[1]}">${esc(h.textContent)}</a></li>`).join('')+'</ul>';
  /* 目录跳转后焦点随迁到目标标题（tabindex=-1 仅在缺省时补），键盘用户按 Tab 从正文继续，不再弹回目录区。 */
  toc.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.getAttribute('href').slice(1));if(t){t.scrollIntoView({behavior:scrollBehavior(),block:'start'});if(!t.hasAttribute('tabindex'))t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}});
  /* 【ui4·TOC scrollspy】目录此前只有跳转没有位置反馈：滚到正文中部
     看不出"在读哪一节"。IntersectionObserver 监听各标题，视口上沿
     附近（rootMargin -96px 顶栏高度，-55% 收口带）最后进入的标题即
当前节，a[aria-current=page] 样式 CSS 规范里已有（accent-soft 底）。
     阈值 0 靠进/出沿触发即可，节标题不像图片需要比例可见。 */
  const tocLinks=new Map(heads.map(h=>[h.id, toc.querySelector(`a[href="#${h.id}"]`)]));
  if('IntersectionObserver' in window && heads.length){
    const spy=new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting)return;
        tocLinks.forEach(a=>a&&a.removeAttribute('aria-current'));
        const a=tocLinks.get(en.target.id);
        /* 滚动位置语义用 location（"当前位置在这"），不用 page（读屏把
           page 当页面切换的 landmark 快捷键目标，滚动驱动标注会误导航）。 */
        if(a){a.setAttribute('aria-current','location');a.scrollIntoView({block:'nearest'})}
      });
    },{rootMargin:'-96px 0px -55% 0px',threshold:0});
    heads.forEach(h=>spy.observe(h));
  }

  [siblings,toc].forEach(rail=>{
    const btn=rail.querySelector('.rail-toggle');
    if(btn)btn.onclick=()=>{const c=rail.classList.toggle('collapsed');btn.setAttribute('aria-expanded',String(!c));btn.textContent=c?'▸':'▾';syncRailToggleLabels()};
  });
}
function railHead(label,hasItems,openByDefault=true){
  /* 阅读页顶部两个信息块默认态不同，各有理由：
   *   知识图谱——默认**展开**：它是读者第一想看的"这篇和谁有关"，有入链/延伸
   *   同模块  ——默认**折叠**：只是同主题兄弟篇，占版面但信息量低，想看再点开
   * （用户实测反馈：原来两个反了。） */
  const chevron=openByDefault?'▾':'▸';
  const state_=String(openByDefault);
  /* aria-label 必须整串按语言分支拼装：${act}${label} 这类组合串在词典里
     永远整串不命中（词典只有"同模块""本文目录"独立词条），EN 态读屏会
     听到中文标签（rt26 同坑）。label 部分走 t() 现译，两段各自命中。 */
  const en=window.TKI18N&&window.TKI18N.lang==='en';

}

function graphCanvas(){
  /* viewBox 必须匹配容器真实的宽高比。
   *
   * 之前写死 1200x690，而 svg 的 CSS 是 width:100% + height:min(70vh,700px)：
   * 容器宽 986px 时宽高比是 1.41，viewBox 是 1.74，SVG 按 xMidYMid meet 缩放
   * 后内容缩在中间 —— 实测内容只占画布宽度的 67%，左边距 8%、右边距 25%，
   * 看起来就是"整体偏左、右边空一大块"。
   *
   * 读容器实际尺寸来定 viewBox，内容就填满可用空间，比例也不再被拉伸。
   */
  const svg=$('#graph');
  const mobile=matchMedia('(max-width:900px)').matches;
  const box=svg.getBoundingClientRect();
  // 首帧或隐藏时 getBoundingClientRect 可能是 0，退回一组保守的默认值。
  const W=Math.max(320, Math.round(box.width)||(mobile?720:1200));
  const H=Math.max(280, Math.round(box.height)||(mobile?920:690));
  svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const defs=svgEl('defs');const marker=svgEl('marker',{id:'graph-arrow',viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'6',markerHeight:'6',orient:'auto'});marker.append(svgEl('path',{d:'M0 0L10 5L0 10z',fill:'currentColor'}));marker.setAttribute('class','graph-arrow');defs.append(marker);const world=svgEl('g',{id:'graph-world'});svg.append(defs,world);
  /* 缩放/平移是探索进度的记忆：rebuild 后按 state 回放，数值显示与图形
   * 同步；zoom=1 且无平移时跳过。往返视图、语言切换后的重建都受益。 */
  if(state.zoom!==1||state.pan.x||state.pan.y)applyTransform();
  return{svg,world,W,H,mobile}}function svgEl(n,a={},text=''){const e=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;return e}/* 窄屏的「知识图谱」：按领域分组的清单。
 *
 * 和力图表达同一件事（哪个领域厚、哪个主题重），但不依赖横向空间。
 * 用 foreignObject 装 HTML，因为这是文字排版而不是图形，交给浏览器排更合适 ——
 * 手写 SVG 的 text 不会换行，窄屏上必然溢出。

function renderNetworkList(svg, domains, notes, tr, filter=null){
  const FO=document.createElementNS('http://www.w3.org/2000/svg','foreignObject');
  FO.setAttribute('x','0'); FO.setAttribute('y','0');
  FO.setAttribute('width','100%'); FO.setAttribute('height','100%');
  const box=document.createElement('div');
  box.className='graph-list';
  const shown=filter?domains.filter(d=>d===filter.domain):domains;
  box.innerHTML=(filter?`<div class="graph-list-focus"><span>${esc(tr('已聚焦：'))}${esc(filter.topic?filter.domain+' / '+filter.topic:filter.domain)}</span><button type="button" class="graph-list-clear">${esc(tr('取消聚焦'))}</button></div>`:'')
    +shown.map((d,di)=>{
    const group=notes.filter(n=>n.category===d);
    const ts=orderedTopics(d,new Set(group.map(n=>n.topic)))
      .map(t=>({t,n:group.filter(x=>x.topic===t).length}))
      .sort((a,b)=>b.n-a.n)
      .filter(item=>!filter||!filter.topic||item.t===filter.topic);
    const color=colors[di%colors.length];
    return `<section class="graph-list-domain" style="--ink:${color}">
      <h3><i></i>${esc(tr(d))}<b>${filter&&filter.topic?(ts[0]?ts[0].n:0):group.length}</b></h3>
      <ul>${ts.map(item=>`<li><button type="button" data-domain="${esc(d)}" data-topic="${esc(item.t)}">
        <span>${esc(tr(item.t))}</span><b>${item.n}</b>
      </button></li>`).join('')}</ul>
    </section>`;
  }).join('');
  FO.append(box);
  svg.append(FO);
  box.querySelectorAll('.graph-list-domain button').forEach(b=>{
    b.onclick=()=>select(b.dataset.domain, b.dataset.topic);
  });
  const clear=box.querySelector('.graph-list-clear');
  if(clear)clear.onclick=()=>toggleGraphFocus(state.graphFocus.mode, state.graphFocus.value);
}

function renderNetwork(){
  /* 这个视图要回答一个问题：这个知识库里到底有什么，怎么分布的。
   *
   * 之前画的是 153 个圆点加 33 个主题点、全部互相连线 —— 那是一个
   * 力导向图的默认外观，不是这张图的答案。点太小看不出是哪篇，线太密
   * 看不出谁连谁，读半天只得到"东西挺多"。
   *
   * 现在的画法：五个领域各占一列，一列里的主题按篇数从上往下排，
   * 每个主题是一个圆，半径表示它有几篇笔记。同一领域内的主题之间连线，
   * 线只在跨主题引用真实存在时才画。看的人一眼能得到三件事：
   * 哪个领域最厚、哪个主题最重、哪些主题互相引用。
   */
  const tr=TKShell.tr; // 全站共享（shell.js），不再各函数局部定义
  const{svg,world,W,H,mobile}=graphCanvas();
  const notes=state.notes.filter(n=>n.category!=='总览'&&n.category!=='Clippings'&&!n.exclude_from_graph);
  const domains=ordered(new Set(notes.map(n=>n.category)));
  /* 数据未到给统一空态，不画空 SVG —— 与全景/进度同一组件。
   * 之前直接开画，空数据渲染出一张空白图，分不清是坏还是慢。 */
  if(!notes.length){svg.innerHTML='';svg.appendChild(tkEmptyState(tr('等待笔记数据…')));return}

  /* 窄屏改画清单，不画力图。
   *
   * 五列布局在 390px 宽下每列只有 78px：主题名、圆、篇数三者必然互相覆盖，
   * 实测文字糊成一团，比不看还糟。图的价值在于"一眼看出分布"，而这个前提
   * 在窄屏不成立 —— 硬画出来的东西读不出任何结论。
   *
   * 所以窄屏换成按领域分组的清单：同样的信息（哪个领域厚、哪个主题重），
   * 用可点的行表达，手机上本来也是清单比图好用。
   */
  if(mobile && W<620 && (!state.graphFocus || state.graphFocus.mode!=='note')){
    /* 窄屏也受理聚焦：全景页「图谱聚焦 →」在手机上带 ?focus= 进来，
     * 之前直接画未过滤清单，聚焦被静默丢弃。域/主题聚焦在清单里有
     * 精确对应（只画该领域/该主题），笔记聚焦只能画力图（清单没有
     * 笔记粒度），走下面的力图分支。 */
    const f=state.graphFocus;
    const filter=f
      ? (f.mode==='domain'
          ? {domain:f.value}
          : {domain:f.value.split('/')[0], topic:f.value.split('/')[1]})
      : null;
    renderNetworkList(svg, domains, notes, tr, filter);
    return;
  }
  const positions=new Map(), topicPos=new Map();
  /* 列中心要按「标签 + 圆」这个整体来居中，不能只按圆。
   *
   * 主题名现在挂在圆心左侧（text-anchor:end），整列的视觉宽度因此向左边多出
   * 一个标签宽。列中心仍按 colW 均分的话，圆的位置没变、但内容的实际左边界
   * 被推到更左 —— 实测左边距 27px、右边距 110px，整幅图看起来偏左。
   *
   * labelW 是给左侧标签预留的宽度；把圆心右移它的一半，标签和圆就一起居中。
   */
  /* 右侧要留出最后一列的「篇数」和悬停标签的空间。
   *
   * 原来只留了 padX，于是 colW 把整个宽度均分给五列 —— 最后一列的圆
   * 落在 padX+colW*4.5+labelW/2，它右边只剩 colW*0.5-labelW/2 ≈ 35px，
   * 放不下计数，圆上的标签也顶到画布边缘被裁掉（实测「架构与代码」
   * 「语言与运行时」这些在 1440 下超出右边界）。
   *
   * 给右边多留一个 labelW：最后一列的可用宽度就和其它列一致了。 */
  const padX=mobile?26:40, top=mobile?96:104;
  const gutter= mobile?78:118;   // 最后一列右侧的余量
  const colW=(W-padX*2-gutter)/domains.length;
  const labelW=Math.min(colW*.42, mobile?72:104);

  const noteDomain=(path)=>{
    const n=state.notes.find(x=>x.path===path);
    return n?n.category:'';
  };
  /* 聚焦判定提前到绘制前：先算出聚焦的边集合与涉及的域集合。
   * 相关项加 focused，其余保持原样——淡化会把连线另一端的名字一起藏掉，
   * 「这条线连到了谁」恰恰是聚焦要回答的问题（实测反馈）。 */
  let focusEdges=null, hitDomains=null, hitTopics=null, linkedNotes=null;
  if(state.graphFocus){
    focusEdges=new Set(); hitDomains=new Set(); hitTopics=new Set();
    if(state.graphFocus.mode==='note')linkedNotes=new Set();
    const inScope=(path)=>{
      const cat=noteDomain(path);
      if(state.graphFocus.mode==='domain')return cat===state.graphFocus.value;
      if(state.graphFocus.mode==='note')return path===state.graphFocus.value;
      const n=state.notes.find(x=>x.path===path);
      return n && state.graphFocus.value===cat+'/'+n.topic;
    };
    for(const e of state.edges){
      if(inScope(e.source)||inScope(e.target)){
        focusEdges.add(e);
        for(const path of [e.source,e.target]){
          const cat=noteDomain(path);
          hitDomains.add(cat);
          const n=state.notes.find(x=>x.path===path);
          if(n)hitTopics.add(cat+'/'+n.topic);
          if(state.graphFocus.mode==='note'&&path!==state.graphFocus.value)linkedNotes.add(path);
        }
      }
    }
    if(state.graphFocus.mode==='domain')hitDomains.add(state.graphFocus.value);
    else{
      const anchor=state.graphFocus.mode==='topic'
        ? state.notes.find(x=>x.category===state.graphFocus.value.split('/')[0]&&x.topic===state.graphFocus.value.split('/')[1])
        : state.notes.find(x=>x.path===state.graphFocus.value);
      if(anchor){
        hitDomains.add(anchor.category);
        hitTopics.add(anchor.category+'/'+anchor.topic);
      }else if(state.graphFocus.mode==='topic')hitDomains.add(state.graphFocus.value.split('/')[0]);
    }
  }

  domains.forEach((d,di)=>{
    const cx=padX+colW*(di+.5)+labelW/2;
    const group=notes.filter(n=>n.category===d);
    const ts=orderedTopics(d,new Set(group.map(n=>n.topic)))
      .map(t=>({t,n:group.filter(x=>x.topic===t).length}))
      .sort((a,b)=>b.n-a.n);
    // A column is a stack of topics. The tallest stack decides the spacing for
    // all of them, so the columns stay aligned and comparable.
    const gap=(H-top-58)/Math.max(ts.length,1);
    ts.forEach((item,ti)=>{
      const y=top+gap*(ti+.5);
      topicPos.set(`${d}/${item.t}`,{x:cx,y,d,t:item.t,n:item.n});
      /* Notes sit on a ring around their topic, not beside it.
       *
       * The previous version put them on "a short arc to the right" and added a
       * hard-coded +18px, while using r*0.5 for x and a different radius for y.
       * The result was dots that did not lie on any circle around the topic:
       * measured, they drifted right of the ring and traced an ellipse. It read
       * as everything being slightly off-grid, which is what it was.
       *
       * One radius, one angle, same origin as the topic circle. The radius
       * grows with the count so a topic with 14 notes does not stack them on
       * top of each other, and stays clear of the ring itself.
       */
      const ns=group.filter(n=>n.topic===item.t);
      let ring=Math.max(18, 10+Math.sqrt(item.n)*4.2);
      /* 聚焦该主题时：环放大、笔记按目标域分组排序。
       * 13 个点挤在一个环上时，13 条线从同一团爆发、互相交叉盖住彼此（实测）；
       * 把连向同一域的笔记排进相邻扇区，线束就分成几股——每股对着它的目标列。 */
      const focusThis = state.graphFocus && state.graphFocus.mode==='topic'
        && state.graphFocus.value===d+'/'+item.t;
      let order2 = ns;
      if(focusThis){
        ring *= 1.6;
        const domainRank=(path)=>{
          for(const e of state.edges){
            if(e.source===path)return noteDomain(e.target);
            if(e.target===path)return noteDomain(e.source);
          }
          return '';
        };
        order2=[...ns].sort((x,y)=>domainRank(x.path).localeCompare(domainRank(y.path),'zh-CN'));
      }
      order2.forEach((n,ni)=>{
        const a=-Math.PI/2 + (ni/Math.max(order2.length,1))*Math.PI*2;
        positions.set(n.path,{x:cx+Math.cos(a)*ring, y:y+Math.sin(a)*ring});
      });
    });
    // Domain heading. The count is the point: 60 vs 14 is the first thing a
    // reader wants to know.
    /* 领域名可能比一列还宽（"Computer systems and performance"），用 foreignObject
       让它按列宽换行。SVG 的 text 不会自动折行，之前五个标题在 1440 下会互相压住。
       高度按实测决定：标题改长后（"AI 系统工程：从模型能力到生产能力"）三行 13px
       换行 ≈ 51px，固定 40 会把第三行连同篇数一起裁掉——上移 y、加高盒子、
       再把第一列主题的 top 相应下移，三处必须一起动，只改盒子会把列顶压住。 */
    /* 2026-09-22 列头只留短名（用户反馈「标题完全不是人看的」）：完整标题
     * 14-18 字、换行两三行，六列并排就是一堵字墙。短名取「：」前的部分
     * （「AI 系统工程」「缺陷分析」），一行放得下；完整名放 title，悬停可见。
     * 盒高公式随之只按短名估宽——中英文冒号都作分隔。 */
    const fullName=tr(d);
    const shortName=fullName.split(/[:：]/)[0];
    const headBoxLines = Math.ceil(shortName.length * 12.4 / (colW - 12));
    const headH = Math.max(36, headBoxLines * 16 + 14);
    const head=svgEl('foreignObject',{x:cx-colW/2+6,y:top-56-(headH-36),width:colW-12,height:headH});
    const headBox=document.createElement('div');
    headBox.className='domain-head';
    /* 2026-09-22 列头最终定稿为短名（用户对比完整名后拍板：长的不好看）。
     * 取「：」前的领域短名（「AI 系统工程」「缺陷分析」），一行干净利落；
     * 完整名放 title 属性，悬停仍可查。拥挤的另一来源（聚焦态批量铺文章
     * 标题）已单独修掉，此处只管列头本身。 */
    headBox.title=fullName;
    headBox.append(document.createTextNode(shortName));
    const headCount=document.createElement('span');
    headCount.textContent=(window.TKI18N&&window.TKI18N.lang==='en')?`${group.length} notes · ${ts.length} topics`:`${group.length} 篇 · ${ts.length} 个主题`;
    headBox.append(headCount);
    headBox.setAttribute('tabindex','0');
    headBox.setAttribute('role','button');
    headBox.setAttribute('aria-pressed', String(!!(state.graphFocus&&state.graphFocus.mode==='domain'&&state.graphFocus.value===d)));
    headBox.setAttribute('aria-label', tr(d)+'，点按聚焦该域');
    headBox.onclick=(e)=>{e.stopPropagation();toggleGraphFocus('domain',d)};
    headBox.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleGraphFocus('domain',d)}};
    if(state.graphFocus){
      if(hitDomains&&hitDomains.has(d))headBox.classList.add('focused');
      else headBox.classList.add('dimmed');
    }
    head.append(headBox);
    world.append(head);
  });

  // Edges first, so nodes draw over them. Only draw an edge when both ends
  // resolve — a dangling reference would otherwise silently disappear.
  /* 连线分两类画，因为它们的信息量不同。
   *
   * 实测 528 条引用里，373 条是同领域的（两端在同一列），74 条横跨 2-4 列。
   * 同领域的两篇笔记本来就同属一个主题，位置上已经挨在一起，那条线只是
   * 在圆和圆之间重复了"它们相关"这件从位置就能读出来的事 —— 而代价是
   * 一列之内几十条线互相交叉，把节点糊住。跨领域的引用才是图里有信息量的
   * 部分：它说明两个原本分开放置的领域之间真的有关联。
   *
   * 所以：跨领域的照画，同领域的只在两端在列内离得够远时画（近的不画，
   * 远的那条反而说明"这个主题的两头有联系"）。两类用不同的 class，
   * 视觉权重也不同。
   */
  for(const e of state.edges){
    const a=positions.get(e.source), b=positions.get(e.target);
    if(!a||!b)continue;
    const crossDomain=noteDomain(e.source)!==noteDomain(e.target);
    if(!crossDomain){
      // 列内距离阈值：同一主题的笔记围在环上，彼此很近，那些线纯属噪音。
      const dx=a.x-b.x, dy=a.y-b.y;
      if(Math.hypot(dx,dy)<90)continue;
    }
    /* 曲线代替直线（d3 link shape 的做法）：控制点取两端中点向画布中心
     * 偏移 15%——同向的边自然分层，交叉点从「线堆」变成可分辨的桥。 */
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const cxp=mx+(W/2-mx)*0.15, cyp=my+(H/2-my)*0.15;
    const line=svgEl('path',{
      d:`M ${a.x} ${a.y} Q ${cxp} ${cyp} ${b.x} ${b.y}`,
      class:crossDomain?'edge edge--cross':'edge edge--inner',
      fill:'none',
      /* 属性层兜底 vector-effect：CSS 规则在部分旧内核不生效，属性直接写在

  // Topic rings. Radius carries the count: sqrt so area, not radius, is
  // proportional to how many notes a topic holds.
  topicPos.forEach(tp=>{
    const r=9+Math.sqrt(tp.n)*3.1;
    const color=colors[domains.indexOf(tp.d)%colors.length];
    /* 圆到笔记点的连线去掉。
     *
     * 点已经落在以圆心为中心的那个环上，线只重复了一遍"它们属于这个主题"
     * 这件已经从位置能读出来的事，代价是每个主题多 n 条线 —— 十四个笔记的
     * 主题就是十四条，全站加起来糊成一片。删掉之后环本身就在表达归属。

    const g=svgEl('g',{class:'topic-node',transform:`translate(${tp.x},${tp.y})`,tabindex:'0',role:'button','aria-label':`${tp.d} / ${tp.t}，${tp.n} 篇`});

     * 0 篇已读就不画——环只在自己有话可说时出现。 */
    const gNotes=state.notes.filter(n=>n.category===tp.d&&n.topic===tp.t&&!n.exclude_from_graph);
    const gDone=gNotes.filter(n=>TKShell.progress.statusOf(n.path)==='learned').length;
    if(gDone>0){
      const cr=r+5.5, circ=2*Math.PI*cr, ratio=gDone/Math.max(gNotes.length,1);

     * 之前"模型基础与训练"直接糊在环上。列内圆心之间的横向空间充足，

  notes.forEach(n=>{

    g.onclick=(e)=>{e.stopPropagation();toggleGraphFocus('note',n.path)};

    const lightEdges=()=>{if(state.graphFocus)return;document.querySelectorAll('.edge').forEach(e=>{if(e.dataset.source===n.path||e.dataset.target===n.path)e.classList.add('focused')})};

       * 连线另一端「是谁」由有名字的主题圆和域标题承载。
       * 主题聚焦时：聚焦主题和对端主题的笔记都正常显示——线两头都要看得见。
       * 笔记聚焦时：聚焦点本身加上下连线两端的邻居点——「这条线连到了谁」

      const key=n.category+'/'+n.topic;

      if(state.graphFocus.mode==='topic' && (state.graphFocus.value===key || hitTopics.has(key)))g.classList.add('focused');
      else if(state.graphFocus.mode==='note' && (state.graphFocus.value===n.path || linkedNotes.has(n.path)))g.classList.add('focused');
      else if(isLearned)g.classList.add('learned-keep');

    }

    const learnedDot = TKShell.progress.statusOf(n.path)==='learned';

    world.append(g);
  });

    const gv=$('#graph-view');

    ? (state.graphFocus.mode==='domain'?'已聚焦域：':state.graphFocus.mode==='note'?'已聚焦笔记：':'已聚焦主题：')
      + (state.graphFocus.mode==='domain'?state.graphFocus.value

    : tr('滚轮或捏合缩放 · 拖拽平移 · 点域、主题或笔记聚焦');
  /* 【ui3·图例升级】i 改用 color 载色：background:currentColor 继承,
     box-shadow halo 用 color-mix 淡化同色。style 只写 color 一个属性。
     三个语义项（大小/已读/已读环）加 .gl-sem 类：CSS 里给首项前加

  $('#legend').innerHTML=domains.map((d,i)=>`<span style="color:${colors[i%colors.length]}"><i></i>${esc(tr(d))}</span>`).join('')
    +`<span class="gl-sem" style="color:var(--color-muted)">${(window.TKI18N&&window.TKI18N.lang==='en')?'A bigger circle means more notes under the topic':'圆越大，主题下的笔记越多'}</span>`

    +`<span class="gl-sem" style="color:var(--color-muted)"><i style="width:12px;height:12px;border-radius:50%;display:inline-block;border:3px solid var(--color-ok);border-top-color:transparent;transform:rotate(-45deg);box-shadow:none"></i>${(window.TKI18N&&window.TKI18N.lang==='en')?'topic mastery ring':'已读环'}</span>`;
}

}function renderGraph(){const tr=TKShell.tr;$('#graph-title').textContent=tr('知识图谱');
  /* 副标题按渲染形态分支：窄屏画的是领域分组清单（renderNetworkList），

    +(listMode
      ? ` <span class="graph-focus-hint">${tr('点主题名查看该主题下的全部笔记')}</span>`
      : ` <span class="graph-focus-hint">${tr('点域名、主题圆或笔记圆点，')}<span class="hint-seg">${tr('只看与它相关的连线；再点一次或按 Esc 取消，双击笔记进原文')}</span></span>`)
    +` <span class="graph-method-note">${tr('实现借鉴 d3 link 曲线、Obsidian 局部图谱与 Cosmograph 的聚焦方式：按领域分列，曲线表达跨域引用，聚焦时点亮相关路径')}</span>`;renderNetwork()}
function bindGraph(){const svg=$('#graph');let drag=null;let pinch=null;const active=new Map();
  /* 2026-09-22 手感改造（用户问题「移动速度太快」）。旧实现三宗罪：

   *   每像素 0.1%，阻尼后再套 smoothstep，轻扫细腻、重划也有力。
   * ② 缩放绕原点 —— 放大时图整体飞向左上角，像「乱动」。改为锚定光标：
   *   先把光标屏幕点换算进图内坐标，缩放后再把该点平移回光标处。

     * 触控板逐像素事件不再按「每事件 ×1.1」累乘爆炸，鼠标滚轮一档 ≈ ×0.84。

  svg.onpointermove=e=>{if(!active.has(e.pointerId))return;active.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&active.size===2){const[p1,p2]=[...active.values()];const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);const t=clampZoom(pinch.zoom*d/pinch.d);

function applyTransform(){
  const world=$('#graph-world');
  if(world){
    world.setAttribute('transform',`translate(${state.pan.x} ${state.pan.y}) scale(${state.zoom})`);
    /* 2026-09-22 文字缩放补偿：world 整体 scale 会把文字一起缩没（用户实测

     * 字面尺寸保持接近 100% 时的观感；放大态不补偿（放大就是要看更大的字）。
     * CSS 端 .node text/.topic-node text 与 .domain-head 消费 --graph-comp。 */
    const comp=state.zoom<1 ? Math.min(1/state.zoom,1.8) : 1;

function selectFromUrl(){const params=new URLSearchParams(location.search),path=params.get('path'),domain=params.get('domain'),topic=params.get('topic');if(path==='知识库首页.md'||path==='知识库首页'||domain==='总览'||topic==='首页'){history.replaceState({},'','/');loadHome(false)}else if(path)openNote(path,false);else if(params.get('view')==='panorama'){state.domain=domain||'all';state.topic=topic||'all';if(params.get('tab')==='stack')state.panoTab='stack';showPanorama(false)}else if(params.get('view')==='graph')showGraph(false);else if(params.get('view')==='progress'){state.panoTab='mine';history.replaceState({},'','/?view=panorama&tab=mine');showPanorama(false)}else if(domain)select(domain,topic||'all',false);else loadHome(false)}

/* 全景页的两个视图共用一次 tab 分发：

 * 八层栈的静态快照就烂过一次）。域筛选只作用于矩阵——八层栈是全网口径。 */
function renderPanoView(){
  const stack=$('#pano-stack-host'), body=$('#panorama-body'), mine=$('#pano-progress');

     （2026-09-24 实测一次约 600ms）。空闲时段跑，不与矩阵渲染抢主线程；
     Safari 没有 requestIdleCallback，退回 setTimeout。 */
  if(tab!=='stack'&&window.TKPanorama&&TKPanorama.prewarm&&state.notes.length){

/* 阅读标注的导出/导入：整包 JSON 下载；导入按「同一路径取较新标注」合并。 */
function bindPgnio(){
  const exp=$('#pg-export');
  if(exp)exp.onclick=()=>{
    const blob=new Blob([JSON.stringify(TKShell.progress.ensure(),null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='knowledge-progress-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();URL.revokeObjectURL(a.href);
  };
  const impBtn=$('#pg-import'), impFile=$('#pg-import-file');
  if(impBtn&&impFile){
    impBtn.onclick=()=>impFile.click();
    impFile.onchange=()=>{
      const file=impFile.files&&impFile.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const incoming=JSON.parse(reader.result);
          if(!incoming||typeof incoming!=='object')throw new Error('shape');
          const cur2=TKShell.progress.ensure();
          for(const bucket of ['learned','planned']){
            const inc=incoming[bucket]||{};
            for(const [path,at] of Object.entries(inc)){
              if(typeof at!=='number')continue;
              if(!cur2[bucket][path]||cur2[bucket][path]<at)cur2[bucket][path]=at;
            }
          }
          TKShell.progress.save();renderProgress();
        }catch(err){alertUser('导入失败：文件不是有效的进度 JSON')}
      };
      reader.readAsText(file);
      impFile.value='';
    };
  }
}

  const stOf=(n)=>TKShell.progress.statusOf(n.path);

  const total=notes.length, learned=notes.filter(n=>stOf(n)==='learned').length, planned=notes.filter(n=>stOf(n)==='planned').length;
  const pct=total?Math.round(learned/total*100):0;

  /* 最近读完 + 稍后读队列：标注后的即时反馈。 */
  const recent=Object.entries(TKShell.progress.ensure().learned)

  const recentBlock=recent.length?`<div class="pg-recent"><span class="pg-recent-label">最近读完</span>${recent.map(n=>`<a class="pg-recent-item" href="/?path=${encodeURIComponent(n.path)}" data-open>${esc(n.title.length>26?n.title.slice(0,25)+'…':n.title)}</a>`).join('')}</div>`:'';
  const nextUp=f==='all'||f==='planned'
    ? Object.entries(TKShell.progress.ensure().planned).sort((x,y)=>x[1]-y[1]).slice(0,3)
        .map(([path])=>state.notes.find(n=>n.path===path)).filter(Boolean)

  const nextBlock=nextUp.length?`<div class="pg-next"><span class="pg-next-label">下一步</span>${nextUp.map(n=>`<span class="pg-next-item"><a href="/?path=${encodeURIComponent(n.path)}" data-open>${esc(n.title.length>30?n.title.slice(0,29)+'…':n.title)}</a><button type="button" class="pg-next-done" data-path="${esc(n.path)}" title="标记为已读">✓</button></span>`).join('')}</div>`:'';

  const body=$('#progress-body');
  if(body)body.innerHTML=`
    <div class="pg-overall">
      <div class="pg-overall-num"><b>${learned}</b> / ${total} <span>已读 · ${pct}%</span>${planned?`<span class="pg-planned-num">稍后读 ${planned}</span>`:''}</div>

  body.querySelectorAll('.pg-check').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();TKShell.progress.toggle(b.dataset.path,'learned')}});
  const clearFilter=$('#pg-clear-filter');

  body.querySelectorAll('.pg-recent-item').forEach(a=>{a.onclick=(e)=>{e.preventDefault();openNote(decodeURIComponent((a.getAttribute('href')||'').replace(/^.*\?path=/,'')))}});

  $('#pg-clear').onclick=()=>{
    if(!confirm('清除全部阅读标注？这会重置这台浏览器上的所有进度。'))return;
    TKShell.progress.data={learned:{},planned:{}};TKShell.progress.save();renderProgress();
  };
}

   g+字母跳转、t 切主题、? 看帮助。
   "g" 前缀用 1.2 秒窗口，超时自动清除，避免误触后吞掉下一次按键。 */
function kbdOverlay(open){
  const el=$('#kbd-overlay');
  if(!el)return;
  el.hidden=!open;
  el.classList.toggle('open',open);
  if(open){const close=$('#kbd-close');if(close)close.focus()}
  else if(document.activeElement&&el.contains(document.activeElement)){const kbdHint=$('#kbd-hint');if(kbdHint)kbdHint.focus()}

function moveSelection(delta){
  const rows=[...document.querySelectorAll('#directory .note-row')];
  if(!rows.length)return;
  const at=rows.indexOf(document.activeElement);
  const next=at<0?(delta>0?0:rows.length-1):Math.min(rows.length-1,Math.max(0,at+delta));
  rows[next].focus();
  rows[next].scrollIntoView({block:'nearest'});
}
function toggleThemeFromKeyboard(){

  TKShell.applyTheme(next);

function bindKeyboard(){
  let gPending=0;
  document.addEventListener('keydown',event=>{
    const tag=(event.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||event.target.isContentEditable;
    /* Cmd/Ctrl+K 聚焦搜索 —— BestBlogs 右上角的同款键位；macOS 浏览器
     * 里 Cmd+K 原生无占用（地址栏搜索是 Cmd+L / Cmd+F 是页内查找），
     * Chrome 里 Ctrl+K 会跳地址栏，preventDefault 拦得下来，实测有效。 */
    if((event.metaKey||event.ctrlKey)&&(event.key==='k'||event.key==='K')){
      event.preventDefault();{const searchBox=$('#search');if(searchBox){searchBox.focus();searchBox.select()}}return;
    }
    if(event.key==='Escape'){
      {const kbdOv=$('#kbd-overlay');if(kbdOv&&kbdOv.classList.contains('open')){kbdOverlay(false);event.preventDefault();return}}
      if(typing&&event.target.id==='search'){event.target.value='';state.query='';loadHome(false);event.preventDefault();return}
      if(state.view==='graph'&&state.graphFocus){state.graphFocus=null;renderGraph();history.replaceState({},'','/?view=graph');event.preventDefault();return}
      /* 全景页 Esc 与图谱页对称：先退格子详情，再退八层栈放大态。
         图谱能 Esc 退 focus 而全景不能，是交互不对称。 */
      if(state.view==='panorama'){
        const detail=document.querySelector('.mx-detail');
        if(detail){detail.remove();if(/^#cell=/.test(location.hash))history.replaceState({},'',location.search);event.preventDefault();return}
        if(window.TKPanorama&&TKPanorama.isZoomed()){TKPanorama.zoomOut();event.preventDefault();return}
      }
      if(state.view==='reader'){$('#reader-back').click();event.preventDefault()}
      return;
    }
    if(typing)return;
    if(event.metaKey||event.ctrlKey||event.altKey)return;
    const key=event.key;
    if(key==='?'||(key==='/'&&event.shiftKey)){const kbdOv2=$('#kbd-overlay');kbdOverlay(!!(kbdOv2&&kbdOv2.classList.contains('open')));event.preventDefault();return}
    if(key==='/'){const searchBox2=$('#search');if(searchBox2)searchBox2.focus();event.preventDefault();return}
    if(key==='t'){toggleThemeFromKeyboard();event.preventDefault();return}
    if(key==='j'||key==='ArrowDown'){moveSelection(1);event.preventDefault();return}
    if(key==='k'||key==='ArrowUp'){moveSelection(-1);event.preventDefault();return}
    // "g <letter>" 跳转。链式状态：第一次 g 只记时间并等待，
    // 第二次按键才查表 —— 但第二次也可能是 g（g g = 图谱），
    // 所以必须先查表再决定是否继续等待。
    if(key==='g'&&Date.now()-gPending>=1200){gPending=Date.now();return}
    if(Date.now()-gPending<1200){
      gPending=0;
      const targets={h:()=>loadHome(true),g:()=>showGraph(),p:()=>location.assign('/projects')};
      const run=targets[key.toLowerCase()];
      if(run){run();event.preventDefault()}
      return;
    }
  });
  $('#kbd-hint').onclick=()=>kbdOverlay(true);
  $('#kbd-close').onclick=()=>kbdOverlay(false);
  $('#kbd-overlay').onclick=event=>{if(event.target.id==='kbd-overlay')kbdOverlay(false)};
}

  try{
    const note=await json('/api/note?path='+encodeURIComponent(article.path));
    const header=`---\ntitle: ${note.title||article.title}\nupdated: ${note.updated||''}\nsource: ${location.origin}/?path=${encodeURIComponent(article.path)}\n---\n\n`;
    const blob=new Blob([note.raw||''],{type:'text/markdown;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;link.download=safeFileName(note.title,article.path);
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    alertUser('已开始下载 Markdown 原文');
  }catch(error){console.error(error);alertUser('下载失败，请稍后重试')}
}
async function copyCurrentLink(){
  const article=currentArticle();
  if(!article.path){alertUser('先打开一篇文章再复制');return}
  const url=location.origin+'/?path='+encodeURIComponent(article.path);
  try{
    await navigator.clipboard.writeText(url);
    alertUser('链接已复制');
  }catch(err){
    // 剪贴板在非安全上下文会被拒绝，退回手动选择。
    const input=document.createElement('input');
    input.value=url;document.body.appendChild(input);input.select();
    document.execCommand('copy');input.remove();
    alertUser('链接已复制');
  }
}
/* 只留「下载 .md」。原来还有「复制链接」和「打印」——
   复制链接在地址栏就能做，打印在浏览器菜单里；两个都占着正文上方的位置，
   而那里最该留给"返回目录"。 */
function bindReaderTools(){
  const download=$('#reader-download');
  if(download)download.onclick=downloadCurrentNote;
}
function dataSignature(data){return data.notes.map(note=>[note.path,note.updated,note.title,note.search_text].join('\u0000')).join('\u0001')+'\u0002'+JSON.stringify(data.edges)}
/* 每 10 秒轮询一次看笔记有没有变。
 *
 * 改前：拉完整 /api/notes（gzip 后 474KB）再在本地算签名 —— 光回答
 * "变没变"就每 10 秒传一次全量。实测一次页面停留会传 3 次。
 *
 * 改后：先问 /api/notes/version（几十字节），签名一致就直接返回，
 * 不一致才拉全量。笔记多数时间不变，所以这条路径几乎总是省下 474KB。 */
async function refreshNotes(initial=false){
  if(!initial){
    try{
      const v=await json('/api/notes/version');
      if(v.signature===state.notesSignature)return;
    }catch(e){/* 版本端点不可用时退回拉全量 */}
  }
  /* 分页拉取：办公网等受限链路会按固定字节数掐断大响应（实测 77KB），
   * 一次性 1.5MB 必然残缺。按页拉（每页 100 条 ≈ 40KB gzip）循环合并，
   * edges/signature 只随第一页带，最后一页组装。本机直连一页就拉完，
   * 循环体只跑一圈，无额外开销。 */
  /* 首页 100 条（带 edges），剩余页**并行**拉（每页 150 条纯 notes）——
     串行 4 页 × 0.35s 的等待在并行下缩成一轮。 */
  const part0=await json('/api/notes?offset=0&limit=100');
  const first=part0;
  let total=typeof part0.total==='number'?part0.total:(part0.notes||[]).length;
  let allNotes=(part0.notes||[]).slice();
  let offset=(part0.notes||[]).length;
  const rest=[];
  let guard=0;
  while(offset<total && guard++<50){rest.push(json('/api/notes?offset='+offset+'&limit=150'));offset+=150}
  (await Promise.all(rest)).forEach(pt=>{allNotes=allNotes.concat(pt.notes||[])});
  const data={...first, notes:allNotes};
  // 用服务端给的签名，不是本地 dataSignature() 算的。
  // 两边算法不同（服务端是 sha256，前端是原始拼接），比较就永远不相等，
  // 版本端点等于白加 —— 第一版就是这个毛病。服务端是唯一事实源。
  const signature=data.signature||dataSignature(data);
  /* 签名相同（数据没变）曾经直接 return，谁都不渲染 —— 二次进入页面时
     showLoading() 的骨架屏就永久挂着，用户看到"正在读取知识库…"不动了
     （showLoadError 的重试注释里记的就是这个坑）。数据没变不代表界面
     已经画好：这里补一次 renderActiveView()，让界面恢复到正确视图。 */
  /* 数据没变也要确认界面已经画好：骨架屏只在初始加载挂起，正常轮询到这条
     路径时首页早已成形 —— 无条件重画等于每 10 秒把首页 innerHTML 连同
     图谱 SVG 全部推倒重来。只在宿主真空着、或还挂着骨架屏时才补一次渲染。 */
  if(signature===state.notesSignature){const host={home:'#home',graph:'#graph-view',panorama:'#panorama-view',reader:'#reader'}[state.view]||'#directory';const el=$(host);if(!el||!el.children.length||el.querySelector('.skeleton'))renderActiveView();return}
  state.notes=data.notes;state.edges=data.edges;state.notesSignature=signature;renderDomains();if(initial){selectFromUrl();return}if(state.view==='home')renderHome();else if(state.view==='directory')renderDirectory();else if(state.view==='graph')renderGraph()}
/* 论文只在启动时取一次。它跟着 vault 走，不像笔记那样几秒一变，
   放进 10 秒的轮询里纯属白跑。取不到就不显示，首页其余部分照常。 */
async function refreshPapers(){/* /api/papers（49KB）拉回来后全站没有消费点：
  右栏论文卡是静态四问（homeQuotes），金句注释是历史。论文入口指向独立页
  /papers，由它自己取数。启动即拉等于每个访客白付 49KB，还触发一次
  renderHome 重建（digest 因此多拉一次）。整条停用。 */}
async function refreshLearningStatus(notify=false){try{state.learningStatus=await json('/api/learning/status');if(state.view==='home')applyHomeStatus()}catch(error){console.error(error);if(!state.learningStatus&&state.view==='home')applyHomeStatus();if(notify)alertUser('学习工具状态暂时不可用，入口仍然可以打开')}}
async function initialize(){
  /* 主题由 shell.js 在加载时就应用并接管按钮，这里不需要再初始化。
     顺序要紧：renderSharedNav() 会重建整个侧边栏（替换 innerHTML 和 className），
     所以「手机上先收起」必须在它之后设置，否则收起状态会被这次重建抹掉 ——
     现象就是手机首屏被 390px 高的域树占满，而折叠按钮看起来没反应。 */
  bindGraph();bindKeyboard();bindFeedback();bindProgress();bindReaderTools();renderSharedNav();bindNavigation();
  bindReaderLearned();document.addEventListener('tk:progress-changed',()=>{if(state.view==='progress')renderProgress();updateReaderStudy();updateReaderLearned();});
  document.addEventListener('tk:domains-rendered',enhanceDomains);
  /* 全景 tab 点击用委托：tab 条是静态 HTML，面板内容会重渲染——
     委托绑一次就够，逐元素 onclick 会在重构里丢（实测丢过）。 */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.pano-tab');
    if (!btn) return;
    const id = btn.id;
    state.panoTab = id === 'pano-tab-stack' ? 'stack' : id === 'pano-tab-mine' ? 'mine' : 'matrix';
    renderPanoView();
  });
  const bt=$('#pano-tab-stack'), bm=$('#pano-tab-matrix');
  /* tab 切换写 URL：selectFromUrl 读 ?tab=stack，这里补上写的一半，
     刷新/分享不再落错 tab。replaceState 不新增历史记录，回退仍是上一个视图。 */
  if(bt)bt.onclick=()=>{
    state.panoTab='stack';renderPanoView();
    history.replaceState({},'','/?view=panorama'+(state.domain!=='all'?'&domain='+encodeURIComponent(state.domain):'')+'&tab=stack')
  };
  if(bm)bm.onclick=()=>{
    state.panoTab='matrix';renderPanoView();
    history.replaceState({},'','/?view=panorama'+(state.domain!=='all'?'&domain='+encodeURIComponent(state.domain):''))
  };
  /* 八层栈的小圆点击：SPA 打开文章（tk:pano-open 由 panorama-view 派发）。 */
  document.addEventListener('tk:pano-open',e=>openNote(e.detail.path));
  document.addEventListener('tk:pano-domain',expandActiveDomain);
  // 首页里凡是按数据渲染出来的部分（论文金句、领域卡片）都不是静态文本，
  // translateDOM 扫不到。切语言后必须整块重画，否则会留下上一种语言的残页。
  /* 全景页两个视图都由 JS 现算（矩阵文案/八层栈导语/图表标注），切语言必须重绘，
     否则留下半中半英残页。home/graph 原有逻辑保留。 */
  document.addEventListener('tk:lang',()=>{syncRailToggleLabels();if(state.view==='home')renderHome();else if(state.view==='graph')renderGraph();else if(state.view==='panorama')renderPanoView();/* 【rt24】reader 视图补重渲染：图谱/同模块的 SVG 是 innerHTML 模板，语言分支在渲染时决定；不重渲染的话中文态会残留英文计数（实测回归）。标题正文节点由 translateDOM 自身覆盖，但模板拼装串必须重跑。 */else if(state.view==='reader'&&state.selected){const n=state.notes.find(x=>x.path===state.selected);if(n)renderRelations(n)}});
  // 先给出骨架，避免首屏是一片空白让人以为坏了。
  showLoading();
  const loadingWarning=setTimeout(()=>{if(!state.notes.length)alertUser('知识内容加载较慢，仍在重试…')},6000);
  try{await refreshNotes(true);clearTimeout(loadingWarning)}
  catch(error){console.error(error);showLoadError()}
  enhanceDomains();
  await refreshPapers();
  await refreshLearningStatus(true);
}
function showLoading(){
  const box=$('#directory');
  if(state.notes.length||box.style.display==='block')return;
  box.innerHTML=`<div class="skeleton" aria-live="polite" aria-busy="true">
    <p class="skeleton-note">正在读取知识库…</p>
    ${[3,2,3].map(n=>`<div class="skeleton-group">${Array.from({length:n}).map(()=>'<div class="skeleton-row"><span class="skeleton-bar w40"></span><span class="skeleton-bar w85"></span></div>').join('')}</div>`).join('')}
  </div>`;
  show('directory');
}
function showLoadError(){
  $('#directory').innerHTML=`<div class="empty"><p class="empty-title">知识内容暂时读不到</p><p class="empty-hint">本机服务可能正在重启。稍等几秒后重试，或检查站点是否在运行</p><button type="button" class="empty-action" id="load-retry">重新加载</button></div>`;
  const retry=$('#load-retry');
  if(retry)retry.onclick=()=>{
    showLoading();
    // refreshNotes 在数据签名没变时会直接返回，错误界面就会一直挂着。
    // 重试是明确的用户意图，这里强制重新渲染一次。
    refreshNotes(true).then(()=>renderActiveView()).catch(()=>showLoadError());
  };
  show('directory');
}
/* 按当前视图重画内容。重试、以及任何"数据没变但界面需要恢复"的场合都用它。 */
function renderActiveView(){
  if(state.view==='home')renderHome();
  else if(state.view==='graph')renderGraph();
  else if(state.view==='panorama')renderPanoView();
  else renderDirectory();
}
async function refreshApp(){await Promise.all([refreshNotes().catch(()=>{}),refreshLearningStatus().catch(()=>{})])}
initialize();setInterval(refreshApp,10000);
</script>
<!-- mermaid 改成按需加载。
     它 gzip 后仍有 957KB（原始 3.5MB），是首页最大的一笔下载 ——
     而首页默认不渲染任何图表：只有打开一篇**带 ```mermaid 代码块**的笔记
     才用得上。同步加载等于让每个访客都为少数几篇笔记付 957KB。

     做法：先扫页面有没有 pre.mermaid，有才插 script 标签。
     没图表时这一整个库连请求都不会发出去。 -->
<script>

/* 图控件：放大 / 缩小 / 复制 / 拖高度。
 * 默认保持 mermaid 原始尺寸（清晰，纵向长图就靠页面滚动看），
 * 想一屏看全点「缩小」——等比缩小会让字变小，所以不默认缩
 * （2026-09-23 反馈：先是不限高太长、再是强行缩到看不见）。 */
function enhanceMermaid(){
  document.querySelectorAll('pre.mermaid').forEach((pre) => {
    if (pre.dataset.mmd) return;
    pre.dataset.mmd = '1';
    const svg = pre.querySelector('svg');
    if (!svg) return;
    const wrap = document.createElement('figure');
    wrap.className = 'mmd-figure';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);

    const bar = document.createElement('div');
    bar.className = 'mmd-bar';
    bar.innerHTML =
      '<button type="button" class="mmd-btn" data-act="out" title="放大" aria-label="放大图表">＋</button>' +
      '<button type="button" class="mmd-btn" data-act="in" title="缩小" aria-label="缩小图表">－</button>' +
      '<button type="button" class="mmd-btn" data-act="copy" title="复制图源码">复制</button>';
    wrap.insertBefore(bar, pre);

    const grip = document.createElement('div');
    grip.className = 'mmd-grip';
    grip.title = '拖动调整高度';
    wrap.appendChild(grip);

    let h = 0;
    const apply = () => {
      if (h <= 0) { svg.style.removeProperty('max-height'); }
      else { svg.style.setProperty('max-height', h + 'px'); }
    };
    apply();

    bar.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const act = b.dataset.act;
      if (act === 'copy') {
        const src = pre.getAttribute('data-mermaidSource') || pre.textContent || '';
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(src);
        b.textContent = '已复制';
        setTimeout(() => { b.textContent = '复制'; }, 1200);
        return;
      }
      const base = h > 0 ? h : svg.getBoundingClientRect().height;
      if (act === 'in') h = Math.max(200, Math.round(base * 0.75));
      else h = Math.min(2400, Math.round((h > 0 ? h : base) * 1.3));
      apply();
    });

    let startY = 0, startH = 0;
    grip.addEventListener('pointerdown', (e) => {
      startY = e.clientY;
      startH = h > 0 ? h : svg.getBoundingClientRect().height;
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener('pointermove', (e) => {
      if (e.buttons !== 1) return;
      h = Math.max(200, Math.min(2400, Math.round(startH + (e.clientY - startY))));
      apply();
    });
  });
}

window.renderMermaid=async function(){
  const nodes=[...document.querySelectorAll('pre.mermaid')];
  if(!nodes.length)return;
  if(!window.mermaid){
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='/static/mermaid.min.js';
      s.onload=resolve;
      s.onerror=()=>reject(new Error('mermaid 加载失败'));
      document.head.appendChild(s);
    });
    window.mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:'base',themeVariables:{
      /* 图要退到内容的层级上：字号不跟正文抢（正文 15px，图内 14px），
         节点用白底 + 站点同源的淡蓝边框（--color-accent-line #c3d0e4），
         不引入站点没有的亮蓝。圆角 8、内边距 16 让节点不挤。 */
      fontSize:'14px',
      fontFamily:'inherit',
      nodePadding:20,
      borderRadius:8,
      mainBkg:'#ffffff',
      nodeBorder:'#7d93af',
      primaryBorderColor:'#7d93af',
      primaryTextColor:'#1f2329',
      lineColor:'#8c8c8c',
      secondaryColor:'#f4f7f5',
      tertiaryColor:'#f8faf9',
      edgeLabelBackground:'#ffffff'
    },flowchart:{htmlLabels:true,nodeSpacing:50,rankSpacing:60}});
  }
  nodes.forEach((node,index)=>{node.dataset.mermaidSource=node.textContent||'';node.id=node.id||`mermaid-${index}-${Date.now()}`});
  await window.mermaid.run({nodes});
  if(window.enhanceMermaid)window.enhanceMermaid();
};
</script>
