<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的阅读 · technical-knowledge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/base.css" />
    <script src="/static/nav.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/legacy-polyfills.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/matrix.js"></script>
    <script>
      /* 侧边栏与反馈组件和主站是同一份（shell.js 渲染），等 DOM 就绪后挂载。 */
      document.addEventListener('DOMContentLoaded', () => TKShell.sidebar({
        page: "reading",
        context: true,
        subnav: window.TK_NAV.subitems,
        auth: true,
      }));
      document.addEventListener('DOMContentLoaded', () => TKShell.feedback({
        where: () => '当前页面：<b>' + (((document.querySelector('.tk-context h2') || {}).textContent || '').trim() || document.title) + '</b>',
        title: () => ((document.querySelector('.tk-context h2') || {}).textContent || '').trim() || document.title,
      }));
    </script>
    <style>
      /* 本页是「我的阅读」单页（全库标注视图，数据是 localStorage 的
         tk-progress-v1）。系统阅读路线已拆成独立页 /panorama/path，
         两者共用同一份进度，勾选后互相刷新（tk:progress-changed）。
         头部走 base.css 的 .hero 身份头规范（顶 40 / 底距 32）。
         此前自造的 .rd-page/.rd-head 没有顶距，h1 直接顶到 0px
         （2026-09-24 用户反馈「太顶了 顶格」），已归入统一规范。
         字号/字重/圆角/间距全部走 tokens.css 标尺。 */
      .rd-sec {
        margin-top: 0;
      }
      .rd-sec h2 {
        font-size: var(--text-h3);
        margin: 0 0 4px;
      }
      .rd-sec-intro {
        color: var(--color-muted);
        font-size: var(--text-small);
        margin: 0 0 14px;
        max-width: 72ch;
      }

      /* ── 我的阅读：动作行 ─────────────────────────────────── */
      .progress-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
      .pg-filter{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-sm);color:var(--color-muted);cursor:pointer}
      .pg-filter input{accent-color:var(--color-accent)}
      .pg-clear{border:1px solid var(--color-line);background:var(--color-panel);color:var(--color-muted);border-radius:5px;padding:5px 9px;font-size:var(--text-sm);cursor:pointer}
      .pg-io{border:1px solid var(--color-line);background:var(--color-panel);color:var(--color-ink-soft);border-radius:5px;padding:5px 9px;font-size:var(--text-sm);cursor:pointer}
      .pg-io:hover{border-color:var(--color-accent);color:var(--color-accent)}
      .pg-clear:hover{border-color:var(--color-danger);color:var(--color-danger)}

      /* ── 我的阅读：总进度 + 域进度条 ──────────────────────── */
      .pg-overall{margin-bottom:24px}
      /* 系统阅读路线进度卡：放在总进度与全库清单之间，回答「我现在
         读到路线哪一篇」；点「继续这条路线」进独立路线页。 */
      .pg-route{background:var(--color-panel);border:1px solid var(--color-line);border-radius:var(--radius-md);padding:18px 20px;margin:0 0 24px}
      .pg-route-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
      .pg-route-label{font-size:var(--text-xs);color:var(--color-accent);font-weight:var(--weight-bold);letter-spacing:.08em}
      .pg-route-link{font-size:var(--text-small);color:var(--color-accent);text-decoration:none}
      .pg-route-link:hover{text-decoration:underline}
      .pg-route-topic{font-size:var(--text-body);font-weight:var(--weight-semibold);margin-bottom:10px}
      .pg-route-num{font-size:var(--text-lg);margin-bottom:8px}
      .pg-route-num b{font-size:var(--text-2xl);font-variant-numeric:tabular-nums}
      .pg-route-num span{color:var(--color-muted)}
      .pg-route-next{margin-top:10px;font-size:var(--text-small);color:var(--color-muted)}
      .pg-route-next a{color:var(--color-accent);text-decoration:none}
      .pg-route-next a:hover{text-decoration:underline}
      .pg-overall-num{font-size:var(--text-lg);margin-bottom:8px}
      .pg-overall-num b{font-size:var(--text-2xl);font-variant-numeric:tabular-nums}
      .pg-overall-num span{color:var(--color-muted)}
      .pg-planned-num{margin-left:10px;color:var(--color-accent)}
      .pg-track{height:10px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;overflow:hidden}
      .pg-track--big{height:14px}
      .pg-track--big i{display:block;height:100%;background:var(--color-ok);border-radius:999px;transition:width var(--duration-slow) var(--ease-out)}
      .pg-domain-bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:8px;margin-top:16px}
      .pg-domain{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:baseline;padding:8px 12px;background:var(--color-panel);border:1px solid var(--color-line);border-radius:6px;color:var(--color-ink-soft);font-size:var(--text-xs)}
      .pg-domain:hover{border-color:var(--color-accent);color:var(--color-accent)}
      .pg-domain-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--weight-semibold)}
      .pg-domain-name+.pg-domain-track{grid-column:1/-1}
      .pg-domain-track{height:6px;background:var(--color-surface);border:1px solid var(--color-line);border-radius:999px;overflow:hidden}
      .pg-domain-track i{display:block;height:100%;background:var(--color-ok)}
      .pg-domain-count{font-variant-numeric:tabular-nums;color:var(--color-muted)}

      /* ── 最近读完 / 下一步 ────────────────────────────────── */
      .pg-next{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;background:var(--color-accent-soft);border:1px solid var(--color-accent-line);border-radius:8px}
      .pg-next-label{font-size:var(--text-xs);color:var(--color-accent);font-weight:var(--weight-semibold)}
      .pg-next-item{display:inline-flex;gap:6px;align-items:center;font-size:var(--text-xs);background:var(--color-panel);border:1px solid var(--color-line);border-radius:999px;padding:3px 5px 3px 10px}
      .pg-next-item a{color:var(--color-ink-soft)}
      .pg-next-item a:hover{color:var(--color-accent)}
      .pg-next-done{width:20px;height:20px;border:0;border-radius:50%;background:var(--color-ok);color:#fff;cursor:pointer;font-size:var(--text-2xs);line-height:1}
      .pg-next-done:hover{filter:brightness(1.1)}
      .pg-recent{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px;padding:8px 12px;background:var(--color-ok-soft);border-radius:8px}
      .pg-recent-label{font-size:var(--text-xs);color:var(--color-ok-ink);font-weight:var(--weight-semibold)}
      .pg-recent-item{font-size:var(--text-xs);color:var(--color-ink-soft);background:var(--color-panel);border:1px solid var(--color-line);border-radius:999px;padding:3px 10px;cursor:pointer}
      .pg-recent-item:hover{color:var(--color-accent);border-color:var(--color-accent)}

      /* ── 我的阅读：域块 + 主题组 + 行 ─────────────────────── */
      .pg-domain-block{margin-bottom:24px}
      .pg-domain-block h3{font-size:var(--text-lg);margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
      .pg-domain-block h3 .pg-domain-count{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--color-muted)}
      .pg-domain-graph{font-size:var(--text-xs);color:var(--color-accent);font-weight:var(--weight-semibold);margin-left:auto}
      .pg-topic-group{margin-bottom:16px}
      .pg-topic-group h4{font-size:var(--text-sm);color:var(--color-muted);margin:0 0 6px;font-weight:var(--weight-semibold)}
      .pg-row{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--color-panel);border:1px solid var(--color-line);border-bottom:0}
      .pg-row:first-of-type{border-radius:8px 8px 0 0}
      .pg-row:last-of-type{border-bottom:1px solid var(--color-line);border-radius:0 0 8px 8px}
      .pg-check,.pg-star{flex:none;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--color-line);border-radius:6px;background:var(--color-panel);cursor:pointer;font-size:var(--text-sm);line-height:1;color:var(--color-muted)}
      .pg-check:hover,.pg-star:hover{border-color:var(--color-accent);color:var(--color-accent)}
      .pg-check.on{background:var(--color-ok);border-color:var(--color-ok);color:#fff}
      .pg-star.on{color:var(--color-star);border-color:var(--color-star-line);background:var(--color-star-soft)}
      .pg-title{color:var(--color-ink);font-size:var(--text-sm);font-weight:var(--weight-semibold);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
      .pg-title:hover{color:var(--color-accent);text-decoration:underline;text-underline-offset:3px}
      .pg-topic{flex:none;font-size:var(--text-xs);color:var(--color-faint)}
      .pg-row.is-learned .pg-title{color:var(--color-faint);text-decoration:line-through;text-decoration-color:var(--color-line-strong)}
      .pg-row.is-planned .pg-title{color:var(--color-ink)}

    </style>
  </head>
  <body class="tk-host">
    <aside class="tk-sidebar" id="tk-sidebar"></aside>
    <div class="tk-shell">
      <section class="hero">
        <h1>我的阅读</h1>
        <p>标记已读、排稍后读——只保存在这台浏览器上，不会上传</p>
      </section>

      <section id="rd-reading" class="rd-sec">
          <h2>已读与稍后读</h2>
          <p class="rd-sec-intro">全库的已读与稍后读都在这里。与阅读页、学习路线共享同一份进度，任一处勾选、全站同步。</p>
          <div class="progress-actions">
            <label class="pg-filter"><input type="radio" name="pg-filter" value="all" checked>全部</label>
            <label class="pg-filter"><input type="radio" name="pg-filter" value="todo">未读</label>
            <label class="pg-filter"><input type="radio" name="pg-filter" value="learned">已读</label>
            <label class="pg-filter"><input type="radio" name="pg-filter" value="planned">稍后读</label>
            <button type="button" class="pg-io" id="pg-export" title="把标注下载成 JSON 文件">导出</button>
            <button type="button" class="pg-io" id="pg-import" title="从 JSON 文件导入标注">导入</button>
            <input type="file" id="pg-import-file" accept=".json,application/json" hidden>
            <button type="button" class="pg-clear" id="pg-clear">清除全部标注</button>
          </div>
          <div id="progress-body"></div>
        </section>

      </article>

      <script>
        (function () {
          "use strict";
          var esc = window.TKShell.esc;

          /* ═══ 第一分区：我的阅读（从 index.html renderProgress 迁移） ═══ */
          var state = { notes: [], pgFilter: "all" };
          var STAR_SVG = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.7-5 2.7 1-5.6-4.1-4 5.6-.8z"/></svg>';

          function tr(text) {
            return window.TKI18N ? window.TKI18N.t(text) : text;
          }

          function ordered(list) {
            var PINNED_FIRST = ["总览", "缺陷分析：从个案到体系"];
            var PINNED_LAST = ["Clippings", "知识库管理"];
            return Array.from(list).sort(function (a, b) {
              var fa = PINNED_FIRST.indexOf(a), fb = PINNED_FIRST.indexOf(b);
              if (fa >= 0 || fb >= 0) return (fa < 0 ? 99 : fa) - (fb < 0 ? 99 : fb) || a.localeCompare(b, "zh-CN");
              var la = PINNED_LAST.indexOf(a), lb = PINNED_LAST.indexOf(b);
              if (la >= 0 || lb >= 0) return (la < 0 ? 99 : la) - (lb < 0 ? 99 : lb) || a.localeCompare(b, "zh-CN");
              return a.localeCompare(b, "zh-CN");
            });
          }

          /* 系统阅读路线进度卡（2026-09-24 用户要求：我的阅读先显示
             系统阅读路线的进度，再给全部文章的阅读清单）。
             路线页把「上次选的领域/主题」存在 tk.learn-path.last，
             已读状态存在全站共用的进度里，两者合成这条卡。 */
          var LP_LAST_KEY = "tk.learn-path.last";
          function routeCard(notes, stOf) {
            var last = null;
            try { last = JSON.parse(localStorage.getItem(LP_LAST_KEY) || "null"); } catch (e) { last = null; }
            if (!last || !last.topic) return "";
            var list = notes.filter(function (n) { return n.topic === last.topic; });
            if (!list.length) return "";
            var done = list.filter(function (n) { return stOf(n) === "learned"; }).length;
            var pctR = Math.round(done / list.length * 100);
            var next = list.find(function (n) { return stOf(n) !== "learned"; });
            return '<div class="pg-route">'
              + '<div class="pg-route-head"><span class="pg-route-label">系统阅读路线</span>'
              + '<a class="pg-route-link" href="/panorama/path">继续这条路线 →</a></div>'
              + '<div class="pg-route-topic">' + esc(last.topic) + '</div>'
              + '<div class="pg-route-num"><b>' + done + '</b> / ' + list.length + ' <span>篇 · ' + pctR + '%</span></div>'
              + '<div class="pg-track pg-track--big"><i style="width:' + pctR + '%"></i></div>'
              + (next ? '<div class="pg-route-next">下一篇：<a href="/?path=' + encodeURIComponent(next.path) + '">' + esc(next.title) + '</a></div>' : '<div class="pg-route-next">这一主题已全部读完。</div>')
              + '</div>';
          }

          function renderProgress() {
            window.TKShell.progress.load();
            var notes = state.notes.filter(function (n) {
              return n.category !== "总览" && n.category !== "Clippings" && n.topic !== "概览" && !n.exclude_from_graph;
            });
            var domains = ordered(new Set(notes.map(function (n) { return n.category; })));
            var f = state.pgFilter;
            var stOf = function (n) { return window.TKShell.progress.statusOf(n.path); };
            var passed = function (n) { return f === "all" || f === stOf(n) || (f === "todo" && !stOf(n)); };
            var total = notes.length;
            var learned = notes.filter(function (n) { return stOf(n) === "learned"; }).length;
            var planned = notes.filter(function (n) { return stOf(n) === "planned"; }).length;
            var pct = total ? Math.round(learned / total * 100) : 0;

            var domainBars = domains.map(function (d) {
              var list = notes.filter(function (n) { return n.category === d; });
              var dn = list.filter(function (n) { return stOf(n) === "learned"; }).length;
              var p = list.length ? Math.round(dn / list.length * 100) : 0;
              return '<a class="pg-domain" href="/?view=graph&focus=' + encodeURIComponent(d) + '" title="在知识图谱中聚焦 ' + esc(d) + '">'
                + '<span class="pg-domain-name">' + esc(tr(d)) + '</span>'
                + '<span class="pg-domain-count">' + dn + "/" + list.length + '</span>'
                + '<span class="pg-domain-track"><i style="width:' + p + '%"></i></span></a>';
            }).join("");

            var groups = domains.map(function (d) {
              var list = notes.filter(function (n) { return n.category === d && passed(n); });
              if (!list.length) return "";
              var dn = notes.filter(function (n) { return n.category === d && stOf(n) === "learned"; }).length;
              var totalD = notes.filter(function (n) { return n.category === d; }).length;
              var topicSet = new Set(list.map(function (n) { return n.topic; }));
              var topics = Array.from(topicSet).sort(function (a, b) { return a.localeCompare(b, "zh-CN"); });
              var sections = topics.map(function (t) {
                var rows = list.filter(function (n) { return n.topic === t; }).map(function (n) {
                  var st = stOf(n);
                  return '<div class="pg-row' + (st === "learned" ? " is-learned" : st === "planned" ? " is-planned" : "") + '" data-path="' + esc(n.path) + '">'
                    + '<button type="button" class="pg-check' + (st === "learned" ? " on" : "") + '" data-path="' + esc(n.path) + '" aria-pressed="' + (st === "learned") + '" title="' + (st === "learned" ? "已读，点击取消" : "标记为已读") + '">✓</button>'
                    + '<button type="button" class="pg-star' + (st === "planned" ? " on" : "") + '" data-path="' + esc(n.path) + '" aria-pressed="' + (st === "planned") + '" title="' + (st === "planned" ? "稍后读，点击取消" : "加入稍后读") + '">' + STAR_SVG + '</button>'
                    + '<a class="pg-title" data-path="' + esc(n.path) + '" role="link" tabindex="0" title="' + esc(n.title) + '">' + esc(n.title) + '</a>'
                    + '<span class="pg-topic">' + esc(tr(t)) + '</span>'
                    + '</div>';
                }).join("");
                return '<div class="pg-topic-group"><h4>' + esc(tr(t)) + '</h4>' + rows + '</div>';
              }).join("");
              return '<section class="pg-domain-block"><h3>' + esc(tr(d))
                + '<span class="pg-domain-count">' + dn + "/" + totalD + ' 已读</span>'
                + '<a class="pg-domain-graph" href="/?view=graph&focus=' + encodeURIComponent(d) + '">图谱聚焦 →</a></h3>'
                + sections + '</section>';
            }).join("");

            var recent = Object.entries(window.TKShell.progress.ensure().learned)
              .sort(function (x, y) { return y[1] - x[1]; }).slice(0, 3)
              .map(function (pair) {
                var path = pair[0];
                return state.notes.find(function (n) { return n.path === path; });
              }).filter(Boolean);
            var recentBlock = recent.length
              ? '<div class="pg-recent"><span class="pg-recent-label">最近读完</span>' + recent.map(function (n) {
                  return '<a class="pg-recent-item" href="/?path=' + encodeURIComponent(n.path) + '">' + esc(n.title.length > 26 ? n.title.slice(0, 25) + "…" : n.title) + '</a>';
                }).join("") + '</div>'
              : "";

            var nextUp = (f === "all" || f === "planned")
              ? Object.entries(window.TKShell.progress.ensure().planned).sort(function (x, y) { return x[1] - y[1]; }).slice(0, 3)
                  .map(function (pair) {
                    var path = pair[0];
                    return state.notes.find(function (n) { return n.path === path; });
                  }).filter(Boolean)
              : [];
            var nextBlock = nextUp.length
              ? '<div class="pg-next"><span class="pg-next-label">下一步</span>' + nextUp.map(function (n) {
                  return '<span class="pg-next-item"><a href="/?path=' + encodeURIComponent(n.path) + '">' + esc(n.title.length > 30 ? n.title.slice(0, 29) + "…" : n.title) + '</a><button type="button" class="pg-next-done" data-path="' + esc(n.path) + '" title="标记为已读">✓</button></span>';
                }).join("") + '</div>'
              : "";

            var body = document.getElementById("progress-body");
            body.innerHTML = ""
              + '<div class="pg-overall">'
              + '<div class="pg-overall-num"><b>' + learned + '</b> / ' + total + ' <span>已读 · ' + pct + '%</span>' + (planned ? '<span class="pg-planned-num">稍后读 ' + planned + '</span>' : "") + '</div>'
              + '<div class="pg-track pg-track--big"><i style="width:' + pct + '%"></i></div>'
              + '<div class="pg-domain-bars">' + domainBars + '</div>'
              + '</div>'
              + routeCard(notes, stOf)
              + nextBlock
              + recentBlock
              + (groups || '<div class="pg-empty-hint">这个过滤条件下没有文章。</div>');

            body.querySelectorAll(".pg-check").forEach(function (b) {
              b.onclick = function (e) { e.stopPropagation(); window.TKShell.progress.toggle(b.dataset.path, "learned"); };
            });
            body.querySelectorAll(".pg-star").forEach(function (b) {
              b.onclick = function (e) { e.stopPropagation(); window.TKShell.progress.toggle(b.dataset.path, "planned"); };
            });
            body.querySelectorAll(".pg-next-done").forEach(function (b) {
              b.onclick = function (e) { e.stopPropagation(); window.TKShell.progress.set(b.dataset.path, "learned"); };
            });
          }

          /* 导出/导入/清除：与主站同一套行为。 */
          document.getElementById("pg-export").onclick = function () {
            var blob = new Blob([JSON.stringify(window.TKShell.progress.ensure(), null, 2)], { type: "application/json" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "knowledge-progress-" + new Date().toISOString().slice(0, 10) + ".json";
            a.click();
            URL.revokeObjectURL(a.href);
          };
          var impFile = document.getElementById("pg-import-file");
          document.getElementById("pg-import").onclick = function () { impFile.click(); };
          impFile.onchange = function () {
            var file = impFile.files && impFile.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function () {
              try {
                var incoming = JSON.parse(reader.result);
                if (!incoming || typeof incoming !== "object") throw new Error("shape");
                var cur = window.TKShell.progress.ensure();
                ["learned", "planned"].forEach(function (bucket) {
                  var inc = incoming[bucket] || {};
                  Object.keys(inc).forEach(function (path) {
                    var at = inc[path];
                    if (typeof at !== "number") return;
                    if (!cur[bucket][path] || cur[bucket][path] < at) cur[bucket][path] = at;
                  });
                });
                window.TKShell.progress.save();
                renderProgress();
              } catch (err) {
                alert("导入失败：文件不是有效的进度 JSON");
              }
            };
            reader.readAsText(file);
            impFile.value = "";
          };
          document.getElementById("pg-clear").onclick = function () {
            if (!confirm("清除全部阅读标注？这会重置这台浏览器上的所有进度。")) return;
            window.TKShell.progress.data = { learned: {}, planned: {} };
            window.TKShell.progress.save();
            renderProgress();
          };

          /* 数据加载：与系统阅读路线页共用 /api/notes 与同一份进度。 */
          function loadNotes(cb) {
            fetch("/api/notes").then(function (r) { return r.json(); }).then(function (data) {
              cb(Array.isArray(data) ? data : (data.notes || []));
            });
          }
          loadNotes(function (notes) {
            state.notes = notes;
            renderProgress();
          });

          var radios = document.querySelectorAll('input[name="pg-filter"]');
          radios.forEach(function (r) {
            r.onchange = function () { state.pgFilter = r.value; renderProgress(); };
          });

        })();
      </script>
    </div>
  </body>
</html>
