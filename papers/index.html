<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>论文追踪 · technical-knowledge</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/base.css" />
    <script src="/static/nav.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/legacy-polyfills.js"></script><script src="/static/shell.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => TKShell.sidebar({ page: 'papers' }));
      document.addEventListener('DOMContentLoaded', () => TKShell.feedback({
        where: () => '当前页面：<b>论文追踪</b>',
        title: () => '论文追踪',
      }));
    </script>
    <style>
      @media (max-width: 760px) {
        .hero p a[target="_blank"] { display:inline-block; padding:6px 10px; margin:2px 0; border:1px solid var(--color-line); border-radius:5px; background:var(--color-panel); }
      }
      /* 论文追踪页。
       *
       * 定位是"追踪"不是"书目"，所以按时间倒序，新的在前。第一版按被引次数
       * 排序，把 2017 年的 Attention 摆在最上面 —— 那是基石清单，读者看不出
       * 最近发生了什么，而"最近发生了什么"才是这个页面存在的理由。
       *
       * 每篇给 L1 的三个要点（问题 / 做法 / 结果），让读者在列表里就能决定
       * 要不要点进去，而不是点开才知道有没有用。
       */
      /* 方法论原本是一整块带标题和说明的横幅，占了首屏近三分之一。
         它是一份"规则出处"，读者在需要的时候才会去看，不需要一直占着地方。
         收成一个按钮，放在工具栏右端 —— 位置固定，想找时找得到。 */
      .method-link {
        flex: none;
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 8px 15px;
        border: 1px solid var(--color-accent-line);
        border-radius: var(--radius-full);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }
      .method-link:hover { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-panel); }

      /* 搜索框样式已收编进 base.css 的 .page-toolbar（全站搜索框
         唯一真源，2026-09-22）。本地这份与真源逐字相同 —— 同款
         组件两处维护正是「间隔不一样」的同族问题，删。
         原来 toolbar 自带 margin（space-6/0/space-3）：头部
         margin-bottom 20 已给首块间距，工具栏自身不再叠间距。 */
      /* 年份筛选：追踪页最常用的切分维度就是"哪一年"。 */
      .paper-count {
        color: var(--color-muted);
        font-size: var(--text-small);
        font-variant-numeric: tabular-nums;
      }

      .paper-year {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: var(--space-6) 0 var(--space-3);
        color: var(--color-ink);
        font-size: var(--text-h3);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
      }
      .paper-year::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-line);
      }
      .paper-year span { color: var(--color-muted); font-size: var(--text-small); font-weight: var(--weight-normal); }

      /* 历史奠基区块。
       *
       * 44 篇里 37 篇是 2024 年前的，摊在列表主体会把新论文压到几十屏之后 ——
       * 一个「追踪新论文」的页面打开先看到 2015 年的论文，定位自己就没了。
       * 数据不删，只是默认不展开。
       *
       * 视觉上跟 .paper-year 同色同字号，但整块读起来像「资料区」而不是
       * 「又一个章节」：底色下沉一档，标题带一个可点的手势。
       * 刻意不用 .paper-year 那条 ::after 发丝线 —— summary 里已经有可点的
       * 三角，再加一条横贯的线会读成「这是分隔符、不可点」。
       */
      .paper-past { margin-top: var(--space-6); }
      .paper-past > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 var(--space-3);
        padding: 10px 14px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-ink);
        font-size: var(--text-h3);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        list-style: none;
      }
      .paper-past > summary::-webkit-details-marker { display: none; }
      .paper-past > summary:hover { border-color: var(--color-accent-line); }
      .paper-past > summary::before {
        content: "▸";
        flex: none;
        color: var(--color-muted);
        transition: transform var(--duration-fast) var(--ease-out);
      }
      .paper-past[open] > summary::before { transform: rotate(90deg); }
      .paper-past .past-title { flex: 1; min-width: 0; }
      .paper-past .past-count {
        flex: none;
        color: var(--color-muted);
        font-size: var(--text-small);
        font-weight: var(--weight-normal);
      }
      /* 展开后的第一个年份标题不要再顶一大段空白，否则看起来像断成两截。 */
      .paper-past-body > .paper-year:first-child { margin-top: var(--space-4); }

      /* 卡片的边界靠 1px 边框自己撑：--color-line-strong 对白卡实测 1.485:1，
       * 在暖白底上分得出来。曾经在这里（和下面 .pn-list）铺过一块 12% 的
       * 下沉灰板来加强对比，2026-09-20 撤掉 —— 读者不要成块的阴影底，
       * 边框加 16px 的卡片间距已经足够把"一张是一条"撑住。
       * 间距依据：卡片高约 218px，12px 只占 5.5%，参考站约 8-10%，最近档是 16。 */
      .paper-list {
        display: grid;
        /* 单列 → 双列。媒体查询在宽屏强制两列（见下方 @media (min-width: 1200px)），
           这里保底单列。列宽下限的取舍：中文摘要 35-45 字/行为宜，600px ≈ 40 字。 */
        grid-template-columns: 1fr;
        gap: var(--space-4);
      }

      /* 宽屏双列。侧边栏 + 内边距后内容区约 1050px，两列各约 520px；
         1200px 断点以上才开两列，避免列宽跌破可读下限。 */
      @media (min-width: 1200px) {
        .paper-list { grid-template-columns: 1fr 1fr; }
      }

      .paper {
        display: grid;
        gap: var(--space-4);
        /* 两列后卡内空间变紧，内边距 20/24 回到 16/20，密度和呼吸感平衡。 */
        padding: var(--space-5) var(--space-5);
        /* 边框 --color-line → --color-line-strong，实测 1.233:1 → 1.485:1。
           1px 的线要靠它自己被看见，浅一档等于没画。这是让卡片显形最强的一招，
           比阴影和衬底都直接（阴影 --shadow-xs 的 alpha 只有 0.04，本来就看不见）。 */
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-lg);
        background-color: var(--color-panel);
        background-image: var(--wash-panel);
        box-shadow: var(--hairline-top), var(--shadow-sm);
        /* transform 也进过渡：hover 要上浮，不写这条会瞬移。 */
        transition:
          border-color var(--duration-base) var(--ease-out),
          box-shadow var(--duration-base) var(--ease-out),
          transform var(--duration-base) var(--ease-out);
      }
      /* 悬停三层一起动：边框收到 accent、阴影升一档、上浮 2px。
         和 index.html 里 .domain-card 的动作完全一致 —— 站内已有的语言，不新造。 */
      .paper:hover {
        border-color: var(--color-accent-line);
        box-shadow: var(--hairline-top), var(--shadow-md);
        transform: translateY(-2px);
      }
      .paper[data-href] { cursor: pointer; }
      .paper[data-href]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      /* 有手写深度解读的，是真正被读过的，值得一个视觉标记。 */
      .paper.read { border-left: 3px solid var(--color-accent); }

      /* 入场：卡片从下方 6px 淡入，组内错峰 20ms。
       *
       * 用 --ease-spring 而不是 --ease-out：弹簧曲线结尾有一点回弹，是"卡片落下"
       * 的手感。--duration-slow(0.28s) 在 0.3s 的感知阈值内。
       *
       * 用 backwards 而不是 both：both 的 fill 会把 transform 锁在结束帧，
       * 和 .paper:hover 的 translateY(-2px) 打架，悬停就不动了。
       * backwards 只在动画开始前应用起始帧，结束后 transform 交回 CSS 规则。
       *
       * 只给前 8 张加延迟：再往后读者已经滚过去了，44 张全加延迟会让靠后的卡片
       * 迟到得很离谱。
       *
       * prefers-reduced-motion 由 tokens.css 的全局规则压成 0.01ms，不用另写。 */
      @keyframes paper-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }
      .enter .paper { animation: paper-in var(--duration-slow) var(--ease-spring) backwards; }
      .enter .paper:nth-child(2) { animation-delay: 20ms; }
      .enter .paper:nth-child(3) { animation-delay: 40ms; }
      .enter .paper:nth-child(4) { animation-delay: 60ms; }
      .enter .paper:nth-child(5) { animation-delay: 80ms; }
      .enter .paper:nth-child(6) { animation-delay: 100ms; }
      .enter .paper:nth-child(7) { animation-delay: 120ms; }
      .enter .paper:nth-child(8) { animation-delay: 140ms; }

      /* gap 12 → 16，与卡片内其它块间距同档，内外一致。 */
      .paper-head { display: flex; align-items: baseline; gap: var(--space-4); }
      .paper h3 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: var(--text-h3);
        /* 1.35 → 1.4：标题占两行时上下不再贴在一起。
           字号不动 —— 18px 已经是 tokens 的卡片标题档。 */
        line-height: 1.4;
      }
      .paper h3 a { color: var(--color-ink); }
      .paper h3 a:hover { color: var(--color-accent); }
      .paper-when { flex: none; color: var(--color-muted); font-size: var(--text-small); font-variant-numeric: tabular-nums; }
      .paper-meta { margin: 0; color: var(--color-muted); font-size: var(--text-small); }
      .paper-meta code {
        padding: 1px 5px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      /* L1 要点表 —— 每篇论文的解析。
       *
       * 这是这一页唯一"有内容可读"的部分（外部收录那两万篇只有标题和标签），
       * 却原来是 13px 的普通文字，和周围的元数据一个体量。
       *
       * 改成 arXivDaily 那种「AI 总结」框：整块衬淡蓝底、圆角、内边距，
       * 字号提到正文级。衬底的作用是把"模型的解析"和"论文原始信息"
       * 在视觉上分开 —— 读者一眼知道哪部分是可以直接读的结论。
       * 字段缺哪条就不显示哪行，不为表格完整去填占位内容。 */
      .l1 {
        display: grid;
        gap: var(--space-2);
        /* 上间距 12 → 16：它是卡内"可读内容"和"元数据"的分界，
           要比其它块间距大一档才读得出分区。 */
        margin: var(--space-4) 0 0;
        padding: var(--space-4) var(--space-5);
        border: 1px solid var(--color-summary-line);
        /* 6 → 8，和外卡片圆角同族，层次才收得住。 */
        border-radius: var(--radius-md);
        background: var(--color-summary-bg);
      }
      /* 行间距 10 → 12：三行（问题/做法/结果）之间要比行内更松。 */
      .l1 div {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: var(--space-3);
        align-items: baseline;
      }
      .l1 dt {
        color: var(--color-summary-label);
        font-size: var(--text-small);
        font-weight: var(--weight-bold);
      }
      .l1 dd {
        margin: 0;
        color: var(--color-summary-text);
        font-size: var(--text-body);
        line-height: 1.65;
      }
      .l1 dd.result { color: var(--color-accent-ink); font-weight: var(--weight-semibold); }

      .paper-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-4);
        padding-top: var(--space-4);
        border-top: 1px solid var(--color-line);
      }
      .paper-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-full);
        background: var(--color-surface);
        color: var(--color-muted);
        /* 11px → 13px。tokens.css 明写 --text-micro"只用于图形/角标，不做文字"，
           这里是标签文字，用 11px 违反了自己定的规则。
           对比度：--color-muted 对 --color-surface 浅色 7.21:1、暗色 7.2:1，
           13px 非粗体需 4.5:1，都通过。 */
        font-size: var(--text-small);
      }
      .paper-tag.evidence { border-color: var(--color-accent-line); background: var(--color-accent-soft); color: var(--color-accent); }
      .paper-more {
        margin-left: auto;
        color: var(--color-accent);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }
      .paper-more:hover { text-decoration: underline; }

      /* 右侧时间线：按年份分组的全部论文，可以跳。
       *
       * 主列表已经按时间排了，但 44 篇滚起来很长，读者想直接跳到某一篇时
       * 只能滚。这一栏把它压成一行一篇的索引，和文章页的目录同一个位置、
       * 同一套视觉。
       */
      .tl-layout { display: block; }
      .p-timeline { display: none; }
      /* [hidden] 必须压得住下面的 display:block。
         属性选择器（0,1,0）和 .p-timeline（0,1,0）同权重，靠后写的生效；
         不显式写这条的话，外部收录视图里时间线会照常显示，
         而它列的是本地那 44 篇的年份 —— 在那个视图里是干扰。 */
      .p-timeline[hidden] { display: none !important; }
      @media (min-width: 1280px) {
        .tl-layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 264px;
          column-gap: 34px;
          align-items: start;
        }
        /* 时间线隐藏时把那一列收掉。
           只藏元素是不够的 —— 网格仍然留着 264px 的空列，正文右边多出
           一条谁也不占的空白。:has() 让容器自己感知到子元素被隐藏。
           （浏览器支持：Chrome 105+ / Safari 15.4+ / Firefox 121+，
           不支持时退回两列布局，也就是现在这样，不会更坏。） */
        .tl-layout:not(:has(.p-timeline:not([hidden]))) {
          grid-template-columns: minmax(0, 1fr);
        }
        .p-timeline {
          display: block;
          position: sticky;
          top: 96px;
          max-height: calc(100vh - 130px);
          overflow: auto;
          font-size: var(--text-sm);
        }
        .p-timeline[hidden] { display: none !important; }
      }
      .p-timeline .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--color-line);
        color: var(--color-muted);
        font-size: var(--text-xs);
        font-weight: var(--weight-bold);
        letter-spacing: 0.06em;
      }
      .p-timeline ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; }
      .p-timeline .tl-year {
        margin: 12px 0 4px;
        padding-left: 8px;
        color: var(--color-ink);
        font-size: var(--text-small);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
      }
      .p-timeline .tl-year:first-child { margin-top: 0; }
      .p-timeline a {
        display: block;
        padding: 4px 8px;
        border-radius: var(--radius-xs);
        color: var(--color-muted);
        line-height: 1.45;
        /* 两行封顶。只显示一行会把标题切在没意义的地方
           （"AutoRAG: Automated Framework for" 就断了），
           而完全不限行又会让年份分组失去节奏。两行是能认出论文的最少行数。 */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .p-timeline a:hover { background: var(--color-accent-soft); color: var(--color-accent); }
      .p-timeline a.read { color: var(--color-ink-soft); }
      .p-timeline a.read::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--color-accent);
        vertical-align: middle;
      }

      .paper-empty {
        padding: var(--space-10);
        border: 1px dashed var(--color-line);
        border-radius: var(--radius-md);
        color: var(--color-muted);
        text-align: center;
        font-size: var(--text-small);
      }

      /* ── 外部收录（PaperNotes）─────────────────────────────────────────
       *
       * 这一页原来的问题不是排版，是数据源：本地的 44 篇最新只到 2024，
       * 而页面叫「追踪新论文」—— 点进来看到 2017 年的论文，一篇新的都没有。
       * 现在主列表是 PaperNotes 的 2.3 万篇（到 ICLR 2026 / CVPR 2026），
       * 本地那 44 篇移到「已精读」子视图。
       */
      .pn-bar {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin: var(--space-4) 0 var(--space-3);
      }
      /* 两个视图的切换按钮。
       *
       * 原来是 13px 的浅灰文字、67×32px 的小方块，读者反馈"完全不知道是啥"。
       * 三个问题一起改：
       *   1. 加大。13px → --text-body，内边距 6/13 → 9/16，高度 32 → 40。
       *   2. 加数字。光看"已精读"不知道有多少篇；带上计数才知道点进去是什么。
       *   3. 未选中的那一个不再是浅灰 —— 它是另一个可选项，不是禁用态。
       */
      .pn-tabs { display: flex; gap: 6px; }
      .pn-tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink);
        font-size: var(--text-body);
        font-weight: var(--weight-semibold);
        cursor: pointer;
      }
      .pn-tab b {
        color: var(--color-muted);
        font-size: var(--text-small);
        font-weight: var(--weight-normal);
        font-variant-numeric: tabular-nums;
      }
      .pn-tab[aria-selected="true"] b { color: var(--color-on-accent); opacity: 0.85; }
      .pn-tab:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      /* 选中态用实心主色 + 白字，和同页的分类芯片一致。
       *
       * 原来写的是浅底（accent-soft）+ 主色文字，但 `b`（计数）另有一条
       * `--color-on-accent` 的白字规则 —— 浅底配白字，对比度 1.12，
       * 那个数字基本看不见。对比度审计抓到了（41/42 → 40/42）。
       *
       * 两处改成实心：底 accent、字 on-accent、计数继承同一色。 */
      .pn-tab[aria-selected="true"] {
        border-color: var(--color-accent);
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-weight: var(--weight-semibold);
      }
      .pn-stat { color: var(--color-muted); font-size: var(--text-small); }

      /* 筛选芯片。标签是这页的主要导航方式 —— 两万篇里找出
         「Agent 相关的」靠的就是它，所以给它足够的视觉重量。 */
      /* 筛选区。
       *
       * 对齐按 PaperNotes 的做法：标签在左固定宽度、芯片在右，同一行
       * baseline 对齐。第一版把标签单独占一行，结果是「分类」和它下面的
       * 芯片分成两块，看起来像两组不相干的东西；而且因为大类多、
       * 会议少，两行的高度还不一样（122px vs 108px），参差不齐。
       *
       * 标签给固定宽度，芯片起点就能对齐成一列 —— 这是"整齐"的来源。
       */
      .pn-filters { display: grid; gap: var(--space-2); margin: var(--space-4) 0 0; }
      /* 标签和**第一行芯片**对齐，不是和整个芯片块居中。
       *
       * 这里踩了两次：第一版用 `align-items:start` 配 `padding-top: 6px`，
       * 标签比芯片低 13px；改成 `align-items:center` 反而更歪（-24px），
       * 因为芯片会换行，行高是两行的，居中就把标签放到两行中间去了 ——
       * 看起来像悬在两行之间。
       *
       * 正确做法是让标签只跟第一行对齐：给它和芯片首行等高的 line-height，
       * 再用 align-self:start。这样无论芯片折成几行，标签始终贴着第一行。
       */
      .pn-filter-row { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: var(--space-2); align-items: start; }
      .pn-filter-label {
        align-self: start;
        /* margin: 0 是关键。
         *
         * 标签用的是 <p>，浏览器默认给它 `margin: 1em 0` —— 13px 字号就是
         * 上下各 13px。网格单元格的顶是对齐的（都是 243），但这个外边距把
         * 段落自己的盒子推下去了 13px，于是标签看起来比芯片低一截。
         * 这就是「歪」的真正来源，跟对齐方式无关。 */
        margin: 0;
        /* 和芯片同高（32px，见下面的 min-height）。用等高的 line-height
           让两段文字落在同一条水平线上，不靠 padding 去凑。 */
        line-height: 32px;
        color: var(--color-ink);
        font-size: var(--text-small);
        font-weight: var(--weight-bold);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      /* 芯片平铺。分类 8 个、会议 10 个、子领域最多 11 个，
         数量本来就会换行，所以不限制行数，只保证左对齐整齐。 */
      .pn-filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }

      /* 芯片走"文字流"语言（2026-09-22 视觉改造第 2 轮）。
       *
       * 原来静止态是带边框的方盒：分类 8 个 + 会议 10 个，一屏 18 个框，
       * 加上选中态的实心块，首屏读起来全是盒子 —— 和优质好文页
       * "卡中卡"摊平解决的是同族问题（一屏框过多）。
       *
       * 静止态去边框去底：纯文字 + 计数，靠字色（ink-soft）保持可读。
       * 悬停给一层淡衬底提示可点，选中才用实心主色块 —— 视觉重量
       * 全部留给"当前选中的是什么"这一件事。
       * min-height/padding 保留：可点区域不变小，只是不画盒子。 */
      .pn-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 36px;
        padding: 0 11px;
        border: none;
        border-radius: var(--radius-xs);
        background: transparent;
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        font-weight: var(--weight-medium);
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      .pn-chip:hover { background: var(--color-surface); color: var(--color-ink); }
      .pn-chip[aria-pressed="true"] {
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-weight: var(--weight-semibold);
      }
      .pn-chip b { color: var(--color-muted); font-weight: var(--weight-normal); font-variant-numeric: tabular-nums; }
      .pn-chip[aria-pressed="true"] b { color: var(--color-on-accent); opacity: 0.85; }

      /* 大类芯片比子领域芯片重一档 —— 它是第一层的选择，
         视觉上要能一眼看出和下面那排不是同级。
         与 .pn-chip 同一套静音语言，字重和字号仍然高它一档。 */
      .pn-cat {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 36px;
        padding: 0 13px;
        border: none;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-ink);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        cursor: pointer;
        white-space: nowrap;
        transition: background var(--duration-fast) var(--ease-out),
                    color var(--duration-fast) var(--ease-out);
      }
      .pn-cat:hover { background: var(--color-surface); }
      .pn-cat[aria-pressed="true"] {
        background: var(--color-accent);
        color: var(--color-on-accent);
      }
      .pn-cat b { color: var(--color-muted); font-weight: var(--weight-normal); font-variant-numeric: tabular-nums; }
      .pn-cat[aria-pressed="true"] b { color: var(--color-on-accent); opacity: 0.85; }

      @media (max-width: 760px) {
        /* 窄屏标签不再占一列 —— 那会把芯片压到只剩两三个的宽度。 */
        .pn-filter-row { grid-template-columns: 1fr; gap: 4px; }
      }

      /* 每条是一张卡片，坐在一块下沉的板上 —— 和下面「已精读」那套同一个读法。
       *
       * 原来 gap 只有 1px、每条只靠一条 border-bottom 分隔，整页读起来是
       * "一整块文字被细线切开"。反馈原话是"挤得很，每个论文的间隔不够，
       * 也没有那种边框的感觉"。而且 1px 缝看不出"一条是一条"，
       * 扫读时容易把上下两条的标签看成一家的。
       *
       * 没有走卡片 + 大间距那种排法：这一栏一屏看十几条才有意义（见下面
       * .pn-summary 的注释）—— 大间距会让一屏只剩四五条，那是牺牲了这栏的
       * 功能去换好看。这里改成"卡片 + 8px 缝"：每条有自己的边界，排得仍然紧。
       *
       * 卡片边界同样只靠边框（--color-line-strong，对白卡 1.485:1）。
       * 这里也铺过一块灰板，2026-09-20 和上面的 .paper-list 一起撤了 ——
       * 成块的阴影底不是读者要的。 */
      .pn-list {
        display: grid;
        /* 双列提升密度：1440 视口内容区 1043px，两列各约 500px。
           中文摘要 500px ≈ 33 字/行，仍在 30-45 字可读区间内；
           三行截断的总结在窄列里仍够用。窄屏回单列。 */
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
        margin-top: var(--space-3);
      }
      @media (max-width: 1100px) {
        .pn-list { grid-template-columns: 1fr; }
      }
      /* 一句话总结 —— 参照 arxivdaily 的排法。
       *
       * 第一版是 13px 细体 + 淡蓝底块。读者反馈：字太小，而且一个色块
       * 把每条撑得很高（整行 149px），一屏看不到几条。
       *
       * 改成：
       *   · 字号提到正文档（15px）—— 它是这一条的主体内容，不是脚注
       *   · 字重加粗（500）—— 和标题同属"要读的东西"，不是辅助说明
       *   · **去掉背景色** —— 用左侧竖线做区分就够了，色块太占地方
       *   · 行距收紧，整条矮下来
       */
      .pn-summary {
        margin: 5px 0 0; padding: 0 0 0 10px;
        border-left: 3px solid var(--color-summary-label);
        background: none;
        color: var(--color-ink-soft);
        font-size: var(--text-base); font-weight: var(--weight-medium);
        line-height: 1.6;
        /* 最多三行。
         *
         * 字放大之后，一条长总结能把整条撑到两百多 px，一屏只放得下三四条。
         * 这里是列表，作用是"判断要不要点进去"，三行足够；要看全文点标题。
         * 截断是有意的，所以标 data-clamp 让布局审计跳过。 */
        display: -webkit-box; -webkit-box-orient: vertical;
        -webkit-line-clamp: 3; overflow: hidden;
      }
      .pn-summary-label {
        color: var(--color-summary-label); font-weight: var(--weight-bold);
        margin-right: 6px;
      }
      /* 每条是一张白卡。原来这里只有一条 border-bottom，没有底色 ——
       * 条目和页面底同色，读者只看到分隔线，看不出"这是一条"。
       *
       * 内边距从 12px 0 提到 14px 18px：左右原来贴到 0，标题和标签的起点
       * 和板边缘齐平，卡片感出不来。
       * 行内 gap 从 3px 提到 8px：标题、中文名、标签行、总结四块原来挤在一起。
       *
       * 边框用 --color-line-strong 而不是 --color-line：1px 的线要自己站得住，
       * 浅一档在白卡上只有 1.23:1，等于没画（--color-line-strong 是 1.49:1）。 */
      .pn-row {
        display: grid;
        gap: var(--space-2);
        padding: 14px 18px;
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-lg);
        background: var(--color-panel);
        transition:
          border-color var(--duration-base) var(--ease-out),
          box-shadow var(--duration-base) var(--ease-out),
          transform var(--duration-base) var(--ease-out);
      }
      /* 和「已精读」的 .paper:hover 同一套动作，站内一致。 */
      .pn-row:hover {
        border-color: var(--color-accent-line);
        box-shadow: var(--shadow-sm);
        transform: translateY(-1px);
      }
      .pn-row a {
        color: var(--color-ink);
        font-size: var(--text-body);
        font-weight: var(--weight-semibold);
        line-height: 1.5;
      }
      .pn-title-cn {
        margin: 2px 0 0; color: var(--color-ink);
        font-size: var(--text-body); font-weight: var(--weight-medium);
        line-height: 1.5;
      }

      .pn-row a:hover { color: var(--color-accent); }
      /* 不用 ↗ 标记外链。
       *
       * 原来每条标题后面挂一个箭头，一屏十几条就是十几个箭头，密而没用 ——
       * 读者早就知道列表里的标题能点。参考的三个站里 BestBlogs 一个箭头
       * 都没有，arXivDaily 和 PaperNotes 也没有；它们靠悬停变色和标题本身
       * 的字重表示可点。
       *
       * 去掉之后靠这两条传达可点：悬停变主色（下面那行）+ 手型光标。
       * 这是列表项，不是文档里的行内链接，不需要额外标记。 */
      .pn-row a { cursor: pointer; }
      .pn-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      /* 子领域和标签做成小芯片。
       *
       * 原来是 11-12px 的纯灰文字，一屏十几条下来全糊成一片，看不出
       * 「学习理论 / 密度比估计 / 扩散蒸馏 / 能量模型」是几个独立的方向标签。
       * 参考 arXivDaily：这些标记是**有底有边的浅色芯片**，颜色还分工
       * （蓝色 cs.AI、橙色「新提交」），一眼能分出哪类是哪类。
       *
       * 会议用主色的淡底，子领域用中性底，标签最轻 —— 三级层次靠底色
       * 而不是靠字号，所以三种芯片同字号也能分清。
       *
       * 字号 11px(--text-xs) → 13px(--text-small)：11px 是 tokens 里留给
       * 图形角标的那一档，拿来排标签文字偏小，反馈里"字太小"是同一件事。
       * 三种芯片一起提，保持底色分工、字号统一。 */
      .pn-conf {
        padding: 3px 9px;
        border-radius: var(--radius-xs);
        background: var(--color-accent-soft);
        color: var(--color-accent-ink);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }
      .pn-sub {
        padding: 3px 9px;
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        font-weight: var(--weight-medium);
        white-space: nowrap;
      }
      .pn-tag {
        padding: 3px 9px;
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-xs);
        color: var(--color-muted);
        font-size: var(--text-small);
        white-space: nowrap;
      }
      .pn-meta { margin-top: 1px; }

      /* display 不写死 block：hidden 属性要靠 UA 的 [hidden]{display:none}
         生效。写死后空结果（0/0）时按钮照样露出来，截图实测抓到过。
         需要块级行为用 [hidden]:not() 组合选择器，hidden 时交给 UA 隐藏。 */
      .pn-more:not([hidden]) {
        display: block;
        width: 100%;
        margin-top: var(--space-4);
        padding: 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        cursor: pointer;
      }
      .pn-more:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      .pn-empty { padding: var(--space-6) 0; color: var(--color-muted); text-align: center; }

      @media (max-width: 760px) {
        .method-pin { display: block; }
        .method-pin a { display: inline-block; margin-top: var(--space-3); }
        .paper-head { display: block; }
        .paper-when { display: inline-block; margin-top: 4px; }
        .l1 div { grid-template-columns: 1fr; gap: 1px; }
        .paper { padding: var(--space-4); }
        .pn-filter-label { min-width: 0; }
        /* 双列网格在窄屏强制回到单列。 */
        .paper-list { grid-template-columns: 1fr; }
      }

      /* 手机上公式常比内容列宽：公式块自身横向滚动，页面不跟横滚。
         KaTeX 的 hide-tail 对超宽公式裁掉尾部（实测 7758px 的 path
         被裁剩 30px 可视），滚动容器里解除裁切让滚动真正可达。 */
      .math, .math--display { max-width: 100%; }
      .katex-display { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding: 4px 2px; }
      @media (max-width: 760px) {
        .katex .hide-tail { overflow-x: auto; overflow-y: hidden; }
        .katex-display > .katex { white-space: normal; }
      }
    </style>

  <body class="tk-host">

规范」。这页点进来先回答「这是什么页」—— 两万三千篇论文的

      <section class="hero">

      <div id="view-external">

           头部里（id=paper-search 已并入 pn-search，两视图共用一个框），

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      const tr = (x) => (window.TKI18N ? window.TKI18N.t(x) : x);
      const lang = () => ((window.TKI18N && window.TKI18N.lang) || "zh");  // i18n 把它暴露成 getter，不是方法
      /* 论文标题是专有名词，两种语言各有各的正确写法：
         中文界面显示中文标题，英文界面显示论文原名 ——
         后者才是读者在 arXiv、在别的文章里会看到的那一行。
         中文标题缺失时回退到原名，不显示空。 */
      const titleOf = (p) => (lang() === "en" ? (p.title_en || p.title) : (p.title_zh || p.title));
      /* L1 三个字段同样中英并存。中文缺了就回退英文 ——
         显示英文总好过显示空白。
         key_result 的中文键叫 result_zh，不是 key_result_zh（历史命名，
         服务端已经这么出了）。不特判的话中文界面下这一行会露出英文原文。 */
      const ZH_KEY = { key_result: "result_zh" };
      const fieldOf = (p, key) => (lang() === "en"
        ? (p[key] || "")
        : (p[ZH_KEY[key] || `${key}_zh`] || p[key] || ""));

      let all = [];
      let methodPath = "";

      function authorLine(authors) {
        if (!authors || !authors.length) return "";
        const shown = authors.slice(0, 2).join(", ");
        return authors.length > 2 ? `${shown} ${tr("等")}` : shown;
      }

      function renderPin() {
        if (!methodPath) return;
        $("#method-slot").innerHTML =
          `<a class="method-link" href="/?path=${encodeURIComponent(methodPath)}">`
          + `${esc(tr("筛选与解析方法"))}</a>`;
      }

      /* 历史奠基的论文只给「解决的问题」和「做法」，不给「关键结果」。
       *
       * 理由：关键结果是给"这篇值不值得跟进"用的，而 2024 年前的论文要么已经
       * 变成常识进了教科书，要么已经被后来的工作超越 —— 它的 2017 年数字对今天
       * 没有决策价值，摆在列表里只是噪音。解决的问题和做法不过时，留下。
       */
      function l1(paper) {
        const rows = [];
        const problem = fieldOf(paper, "problem");
        const approach = fieldOf(paper, "approach");
        const result = fieldOf(paper, "key_result");
        if (problem) rows.push(`<div><dt>${esc(tr("解决的问题"))}</dt><dd>${esc(problem)}</dd></div>`);
        if (approach) rows.push(`<div><dt>${esc(tr("做法"))}</dt><dd>${esc(approach)}</dd></div>`);
        if (result && !isFoundational(paper)) {
          rows.push(`<div><dt>${esc(tr("关键结果"))}</dt><dd class="result">${esc(result)}</dd></div>`);
        }
        return rows.length ? `<dl class="l1">${rows.join("")}</dl>` : "";
      }

      function card(p) {
        const ev = p.evidence_count;
        const tags = [];
        if (ev) tags.push(`<span class="paper-tag evidence">${esc(tr("支撑"))} ${ev} ${esc(tr("篇知识"))}</span>`);
        if (p.survey_count) tags.push(`<span class="paper-tag">${esc(tr("调研引用"))} ${p.survey_count}</span>`);
        if (p.primary) tags.push(`<span class="paper-tag">${esc(p.primary)}</span>`);
        // 有手写深度解读就标出来，让读者知道点进去能看到完整八模块。
        if (p.has_deep_read) tags.push(`<span class="paper-tag evidence">${esc(tr("已深度解析"))}</span>`);
        const href = `/paper?id=${encodeURIComponent(p.id)}`;
        return `<article class="paper${p.has_deep_read ? " read" : ""}" data-href="${esc(href)}" tabindex="0" role="link" aria-label="${esc(titleOf(p) || p.id)}">
          <div class="paper-head">
            <h3><a href="${esc(href)}">${esc(titleOf(p) || p.id)}</a></h3>
            <span class="paper-when">${esc(p.published)}</span>
          </div>
          <p class="paper-meta">${esc(authorLine(p.authors))} · <code>arXiv:${esc(p.id)}</code></p>
          ${l1(p)}
          <div class="paper-foot">
            ${tags.join("")}
            <a class="paper-more" href="${esc(href)}">${esc(tr("解析"))} →</a>
          </div>
        </article>`;
      }

      /* 2024 年前算历史奠基。
       *
       * 写成一个阈值而不是列一串年份：数据每年会涨，列出来的年份表明年就错。
       * published 是 YYYY-MM-DD，取前四位比较即可。 */
      const FOUNDATIONAL_MAX = 2023;
      const isFoundational = (p) => Number((p.published || "").slice(0, 4) || 0) <= FOUNDATIONAL_MAX;

      /* 按年份分组。追踪页最自然的切分是"哪一年"，比一条长列表好扫。 */
      function yearGroups(list) {
        const groups = [];
        let year = null;
        let chunk = [];
        const flush = () => {
          if (!chunk.length) return;
          groups.push({ year, items: chunk });
          chunk = [];
        };
        list.forEach((p) => {
          const y = (p.published || "").slice(0, 4) || "—";
          if (y !== year) { flush(); year = y; }
          chunk.push(p);
        });
        flush();
        return groups;
      }

      function yearBlock({ year, items }) {
        return `<h2 class="paper-year">${esc(year)}<span>${items.length} ${esc(tr("篇"))}</span></h2>`
             + `<div class="paper-list">${items.map(card).join("")}</div>`;
      }

      /* 入场动画是否已播过。见 render() 里挂 .enter 的那段。 */
      let firstPaint = true;
      /* 已精读视图是否被真正显示过。默认 tab 是外部收录，第一次 render() 发生在
         隐藏容器里，动画要留给读者切过来的那一次。见 #tab-read 的 onclick。 */
      let everShownRead = false;

      function render() {
        /* 搜索框在 hero 头部里与外部收录共用（#pn-search）—— 两视图
         同一个框，取词来源只有这一处。 */
      const q = $("#pn-search").value.trim().toLowerCase();
        const filtered = all.filter((p) => {
          if (!q) return true;
          return [p.title, p.id, (p.authors || []).join(" "), p.primary,
                  p.problem, p.approach, p.key_result]
            .join(" ").toLowerCase().includes(q);
        });

        const list = $("#paper-list");
        if (!filtered.length) {
          list.innerHTML = `<div class="paper-empty">${esc(tr("搜「标题 / 作者 / arXiv 编号」都没命中。试试论文标题里的一个词，或者 4 位年份。"))}</div>`;
          $("#paper-count").textContent = `0 / ${all.length}`;
          return;
        }

        const recent = filtered.filter((p) => !isFoundational(p));
        const foundational = filtered.filter(isFoundational);
        let out = yearGroups(recent).map(yearBlock).join("");
        if (foundational.length) {
          /* 搜索时自动展开。搜到的东西必须看得见，默认折叠会把它藏起来 ——
             这是唯一一处折叠状态不由用户决定的地方，所以规则保持单一：
             有搜索词就开，清空就收，不记忆用户的手动展开。 */
          out += `<details class="paper-past"${q ? " open" : ""}>
            <summary>
              <span class="past-title">${esc(tr("2023 及更早 · 历史奠基"))}</span>
              <span class="past-count">${foundational.length} ${esc(tr("篇"))}</span>
            </summary>
            <div class="paper-past-body">${yearGroups(foundational).map(yearBlock).join("")}</div>
          </details>`;
        }
        list.innerHTML = out;
        /* 入场动画只在第一次渲染放一次。
         *
         * 每次搜索都会重写上面的 innerHTML。这里有个反直觉的点：光在首屏加一次
         * .enter 是不够的 —— .enter 留在容器上，之后每次重写 innerHTML 插进去的
         * 新 .paper 仍然匹配 `.enter .paper`，于是每打一个字全列表重播一遍淡入。
         * 实测：加完类再搜一次，有 11 个 paper-in 动画在同时跑。
         *
         * 所以动画播完就把类摘掉，让它真的只发生一次。用 animationend 而不是
         * setTimeout：时长改了不用回来改这里的数字，也不会在标签页切到后台、
         * 动画被暂停时提前摘掉。 */
        if (firstPaint) {
          firstPaint = false;
          list.classList.add("enter");
          /* 摘类用定时器，不用 animationend。
           *
           * 试过盯最后一张卡的 animationend，不成立：屏幕外的卡片浏览器根本不会
           * 启动它的动画（实测 44 张里只有 7 张真的 animateend 过），所以那个
           * 监听永远等不到，类会一直留在容器上，反而回到"每次搜索都重播"。
           *
           * 300ms 是最慢那几张的时长（--duration-slow 0.28s）加最小的错峰余量。
           * 摘早了会打断正在播的卡，摘晚了就是在一次搜索里多挂一小会儿 —— 两边
           * 都不严重，取整到 300。 */
          setTimeout(() => list.classList.remove("enter"), 300);
        }
        /* 整块可点：解析是这一页的主线动作，读者不该被要求瞄准右下角那个
           小链接。卡内已有的链接保持自己的跳转，不重复处理。 */
        list.querySelectorAll(".paper").forEach((card) => {
          const go = (event) => {
            if (event.target.closest("a")) return;
            location.href = card.dataset.href;
          };
          card.onclick = go;
          card.onkeydown = (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); go(event); }
          };
        });

        const withResult = filtered.filter((p) => p.key_result).length;
        $("#paper-count").textContent =
          `${filtered.length} / ${all.length} ${tr("篇")} · ${withResult} ${tr("篇有摘要里的量化结果")}`;
      }

      /* 时间线用全部论文，不跟着搜索过滤 ——
         它的作用是"让我跳到别处"，跟着过滤就把去路也砍掉了。
         已深度解析的用圆点标出来。 */
      function renderTimeline() {
        const aside = $("#timeline");
        if (!all.length) { aside.innerHTML = ""; return; }
        let out = `<div class="rail-head">${esc(tr("时间线"))}<span>${all.length} ${esc(tr("篇"))}</span></div>`;
        let year = null;
        all.forEach((p) => {
          const y = (p.published || "").slice(0, 4) || "—";
          if (y !== year) {
            if (year !== null) out += "</ul>";
            out += `<div class="tl-year">${esc(y)}</div><ul>`;
            year = y;
          }
          out += `<li><a href="/paper?id=${encodeURIComponent(p.id)}"`
               + ` class="${p.has_deep_read ? "read" : ""}"`
               + ` title="${esc(titleOf(p) || p.id)}">${esc(titleOf(p) || p.id)}</a></li>`;
        });
        if (year !== null) out += "</ul>";
        aside.innerHTML = out;
      }

      /* ── 外部收录（PaperNotes 的 2.3 万篇）──────────────────────────────
       *
       * 分页是必需的，不是优化：23802 条一次渲染成 DOM 会让首屏卡住几秒。
       * 服务端按筛选条件返回一页，这里只追加。
       *
       * 筛选状态放在一个对象里，改任何一项都重置翻页并重拉 ——
       * 让"当前看到的是哪一批"永远和筛选条件一致，不做本地增量过滤，
       * 否则「显示更多」之后改条件会留下上一种条件的残留。
       */
      const PAGE = 60;
      const pn = { tag: "", conf: "", cat: "", sub: "", q: "", offset: 0, total: 0, grand: 0, busy: false };

      function pnRow(paper) {
        // 会议 + 子领域 + 前几个标签。
        //
        // 标签要去掉和子领域重复的。比较时要先归一化：PaperNotes 自己的
        // 数据里同一个概念有两种写法 —— 子领域是「物理 / 科学计算」，
        // tags 里是「物理/科学计算」；子领域是「3D 视觉」，tags 里是「3D视觉」。
        // 只比字面的话这些会成对出现，看起来像渲染错了。
        const sub = paper.subfield || "";
        const fold = (s) => s.toLowerCase().replace(/[\s/·、]+/g, "");
        const subKey = fold(sub);
        const tags = (paper.tags || []).filter((t) => fold(t) !== subKey).slice(0, 3);
        return `<article class="pn-row">
          <a href="${esc(paper.url)}" target="_blank" rel="noopener noreferrer">${esc(paper.title)}</a>
          ${/* 中文名。PaperNotes 只给英文标题，这一栏是模型译的 ——
               所以排在第二行、字号小一档：它是帮助理解的对译，
               不是论文自己的标题。译不出来就不显示这一行。 */""}
          ${paper.title_cn ? `<p class="pn-title-cn">${esc(paper.title_cn)}</p>` : ""}
          <div class="pn-meta">
            ${paper.conference ? `<span class="pn-conf">${esc(paper.conference)}</span>` : ""}
            ${sub ? `<span class="pn-sub">${esc(sub)}</span>` : ""}
            ${tags.map((t) => `<span class="pn-tag">${esc(t)}</span>`).join("")}
          </div>
          ${/* 一句话总结。PaperNotes 每篇正文开头都有，是"这篇讲了什么、
               值不值得读"最直接的依据 —— 比标题有用得多。
               它是模型读完论文写的，不是作者原话，所以照站内统一的
               「AI总结」标记来渲染（和 /sources 那套同一个视觉）。
               2026-09-22 i18n 修复（勿删）：标签文案套 tr() 查词表（→ AI summary），
               与 /sources 正文卡同一翻译路径。 */""}
                ${paper.summary ? `<p class="pn-summary" data-clamp><b class="pn-summary-label">${esc(tr("AI总结"))}</b><span>${renderSummary(paper.summary)}</span></p>` : ""}
        </article>`;
      }

      /* 一句话总结里的数学公式。
       *
       * PaperNotes 的总结是 LaTeX 写的：`\(M\)`、`$x$`、`\[...\]` 这些
       * 分隔符直接显示出来的话，读者看到的是 "放大一个倍数 \(M\)" 这种
       * 带着反斜杠和括号的源码。
       *
       * 做法和 paper.html 一致：先把公式抽成占位符，让转义只作用在普通
       * 文本上，再把占位符交给 KaTeX 渲染成真正的公式。公式不经过 esc，
       * 所以不会被破坏；普通文本仍然转义，所以不会引入 XSS。 */
      function renderSummary(text) {
        const parts = [];
        let rest = String(text || "");
        // 行内 \(...\) 与 $...$，以及独立行 \\[...\\] 与 $$...$$
        // 用 new RegExp 写，避免字面量里反斜杠层数数错。
        // 上一版写成正则字面量，括号没配对（Unmatched ')'），整个 script
        // 直接语法错误 —— 结果不是公式没渲染，而是**整页空白**。
        // 公式内部可以有反斜杠（\alpha、\frac 这些），所以用 [\s\S]+?
        // 而不是 [^\\]+? —— 后者会在遇到第一个反斜杠时停住，
        // "放大一个倍数 \(M\)" 里的 M 能匹配，但 \(x_{i}\) 这种就断在半路。
        const patterns = [
          [/\\\[([\s\S]+?)\\\]/g, true],     // \[...\]
          [/\\\(([\s\S]+?)\\\)/g, false],    // \(...\)
          [/\$\$([\s\S]+?)\$\$/g, true],     // $$...$$
          [/\$([^$\n]+?)\$/g, false],        // $...$
        ];
        let out = "";
        let cursor = 0;
        for (;;) {
          let hit = null;
          for (const [re, display] of patterns) {
            re.lastIndex = cursor;
            const m = re.exec(rest);
            if (m && (!hit || m.index < hit.m.index)) hit = { m, display };
          }
          if (!hit) break;
          out += esc(rest.slice(cursor, hit.m.index));
          const tag = hit.display ? "div" : "span";
          out += `<${tag} class="math${hit.display ? " math--display" : ""}" data-tex="${encodeURIComponent(hit.m[1])}"></${tag}>`;
          cursor = hit.m.index + hit.m[0].length;
        }
        out += esc(rest.slice(cursor));
        return out;
      }

      /* 把占位符换成真正的公式。必须在 innerHTML 之后调用。 */
      function renderMath(root) {
        const nodes = (root || document).querySelectorAll(".math[data-tex]");
        if (!nodes.length) return;
        if (!window.katex) {
          // 没加载出来时不要把原文吞掉 —— 显示可读的源码。
          nodes.forEach((n) => { n.className = "math-raw"; n.textContent = decodeURIComponent(n.dataset.tex); });
          return;
        }
        nodes.forEach((n) => {
          const tex = decodeURIComponent(n.dataset.tex);
          try {
            katex.render(tex, n, {
              displayMode: n.classList.contains("math--display"),
              throwOnError: false, strict: "ignore", trust: false,
            });
          } catch (error) {
            n.className = "math-raw";
            n.textContent = tex;
          }
        });
      }

      /* 两层分类：大类一行，选中后展开它的子领域。
       *
       * 为什么不平铺：PaperNotes 有 55 个子领域、篇数从 2066（图像生成）到
       * 2（信号/通信）跨三个数量级。平铺在一起，LLM Agent（504 篇）会被
       * 埋在中间，而一个想找 agent 的人得先扫过一串跟他无关的芯片。
       * 分两层之后「LLM → LLM Agent」是两步明确的动作。
       *
       * 大类的顺序照 PaperNotes 自己的导航 —— LLM 第一，尽管生成与多模态
       * 的篇数更多。读者找论文时先想的是「LLM 相关的」，不是「五百篇以上的」。
       */
      function pnPaintFilters(categories, conferences) {
        // 分类芯片。服务端已经不返回「其他」了（见 site/server.py 的
        // PAPERNOTES_CATEGORY_ORDER），所以这里不需要再特判兜底桶。
        const catRow = categories.map((c) => `
          <button type="button" class="pn-cat" data-cat="${esc(c.name)}"
            aria-pressed="${pn.cat === c.name ? "true" : "false"}">${esc(c.name)}
            <b>${c.count.toLocaleString()}</b></button>`).join("");
        // 选中大类后展开它的子领域；没选就只显示大类。
        const active = categories.find((c) => c.name === pn.cat);
        const subRow = active && active.subfields.length
          ? `<div class="pn-filter-row">
               <p class="pn-filter-label">${esc(tr("子领域"))}</p>
               <div class="pn-filter-chips">
                 <button type="button" class="pn-chip" data-kind="sub-clear"
                   aria-pressed="${pn.sub ? "false" : "true"}">${esc(tr("全部"))} <b>${active.count.toLocaleString()}</b></button>
                 ${active.subfields.map((s) => `<button type="button" class="pn-chip"
                   data-kind="sub" data-name="${esc(s.name)}"
                   aria-pressed="${pn.sub === s.name ? "true" : "false"}">${esc(s.name)} <b>${s.count.toLocaleString()}</b></button>`).join("")}
               </div>
             </div>`
          : "";
        $("#pn-filters").innerHTML = `
          <div class="pn-filter-row">
            <p class="pn-filter-label">${esc(tr("分类"))}</p>
            <div class="pn-filter-chips">
              <button type="button" class="pn-cat" data-cat=""
                aria-pressed="${pn.cat ? "false" : "true"}">${esc(tr("全部"))} <b>${pn.grand.toLocaleString()}</b></button>
              ${catRow}
            </div>
          </div>
          ${subRow}
          <div class="pn-filter-row">
            <p class="pn-filter-label">${esc(tr("会议"))}</p>
            <div class="pn-filter-chips">
              ${conferences.slice(0, 10).map((c) => `<button type="button" class="pn-chip"
                data-kind="conf" data-name="${esc(c.name)}"
                aria-pressed="${pn.conf === c.name ? "true" : "false"}">${esc(c.name)} <b>${c.count.toLocaleString()}</b></button>`).join("")}
            </div>
          </div>`;
        $("#pn-filters").querySelectorAll("button").forEach((button) => {
          button.onclick = () => {
            if (button.dataset.cat !== undefined) {
              pn.cat = button.dataset.cat;
              // 换大类时清掉子领域和会议 —— 上一次的筛选残留在新分类下
              // 会把结果缩到空，而且看不出是为什么。
              pn.sub = "";
              pn.conf = "";
            } else if (button.dataset.kind === "sub") {
              pn.sub = pn.sub === button.dataset.name ? "" : button.dataset.name;
            } else if (button.dataset.kind === "sub-clear") {
              pn.sub = "";
            } else if (button.dataset.kind === "conf") {
              pn.conf = pn.conf === button.dataset.name ? "" : button.dataset.name;
            }
            pn.offset = 0;
            $("#pn-list").innerHTML = "";
            loadExternal();
          };
        });
      }

      async function loadExternal(append) {
        if (pn.busy) return;
        pn.busy = true;
        const params = new URLSearchParams({ offset: String(pn.offset), limit: String(PAGE) });
        if (pn.tag) params.set("tag", pn.tag);
        if (pn.conf) params.set("conf", pn.conf);
        if (pn.cat) params.set("cat", pn.cat);
        if (pn.sub) params.set("sub", pn.sub);
        if (pn.q) params.set("q", pn.q);
        try {
          const response = await fetch(`/api/papernotes?${params}`, { cache: "no-store" });
          if (!response.ok) throw new Error("unavailable");
          const payload = await response.json();
          pn.total = payload.total;
          pn.grand = payload.grand_total;
          // 两个视图的计数：外部是总量（不随筛选变，否则读者会以为库变小了），
          // 已精读是本地那批。
          const extCount = $("#tab-external-count");
          if (extCount) extCount.textContent = pn.grand.toLocaleString();
          if (!append) pnPaintFilters(payload.categories || [], payload.conferences || []);
          const rows = (payload.papers || []).map(pnRow).join("");
          const list = $("#pn-list");
          if (append) list.insertAdjacentHTML("beforeend", rows);
          else list.innerHTML = rows || `<div class="pn-empty">${esc(tr("没有匹配的论文。"))}</div>`;
          // 公式要在 innerHTML 之后渲染：占位符这时候才在 DOM 里。
          renderMath(list);
          pn.offset += (payload.papers || []).length;
          const more = $("#pn-more");
          more.hidden = pn.offset >= pn.total;
          more.textContent = `${tr("显示更多")} (${pn.offset.toLocaleString()} / ${pn.total.toLocaleString()})`;
          const parts = [`${pn.total.toLocaleString()} ${tr("篇")}`];
          if (pn.cat) parts.push(pn.cat);
          if (pn.sub) parts.push(pn.sub);
          if (pn.conf) parts.push(pn.conf);
          // 没筛选时 total 就等于 grand，tab 上已经有「外部收录 23,802」，
          // 这里再说一遍是同屏重复。改为报索引抓取时间（数据新鲜度）——
          // 读者更关心「这批论文截止到什么时候」，总量 tab 已经说了。
          const fetchedText = payload.fetched_at
            ? (() => { try { return new Date(payload.fetched_at).toLocaleDateString(); } catch (err) { return ""; } })()
            : "";
          const head = (pn.cat || pn.sub || pn.conf || pn.q)
            ? `${tr("筛出")} ${parts.join(" · ")}`
            : fetchedText
              ? `${tr("索引抓取于")} ${fetchedText}`
              : `${tr("外部收录")} ${pn.grand.toLocaleString()} ${tr("篇")}`;
          const scope = (pn.cat || pn.sub || pn.conf || pn.q) ? ` / ${tr("总计")} ${pn.grand.toLocaleString()} ${tr("篇")}` : "";
          $("#pn-stat").textContent = head + scope;
        } catch (error) {
          $("#pn-list").innerHTML = `<div class="pn-empty">${esc(tr("读不到论文摘要索引。运行 python3 scripts/fetch-papernotes.py 生成后再刷新。"))}</div>`;
          $("#pn-more").hidden = true;
        } finally {
          pn.busy = false;
        }
      }

      /* 搜索防抖：每敲一个字就发一次请求会打满后端，而且结果闪烁。
         250ms 是打字停顿和响应感之间的折中。 */
      let pnTimer = null;
      /* 一个框服务两个视图：输入在哪个视图就筛哪个 —— 外部收录走
         loadExternal（请求后端），已精读走 render（本地过滤）。
         共用 250ms 防抖，不重复造第二套。 */
      $("#pn-search").oninput = (event) => {
        clearTimeout(pnTimer);
        const value = event.currentTarget.value;
        pnTimer = setTimeout(() => {
          const inRead = !$("#view-read").hidden;
          if (inRead) {
            render();
          } else {
            pn.q = value.trim();
            pn.offset = 0;
            $("#pn-list").innerHTML = "";
            loadExternal();
          }
        }, 250);
      };
      $("#pn-more").onclick = () => loadExternal(true);

      /* ⌘K 聚焦搜索 —— 与主页同款键位（主页 bindKeyboard 的平移）。
       * 主页有、子页没有，键盘用户换了页就断习惯。macOS 的 Cmd+K
       * 原生无占用，Chrome 的 Ctrl+K 跳地址栏可被 preventDefault
       * 拦下（主页注释里实测过，此处同结论）。 */
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && (event.key === "k" || event.key === "K")) {
          event.preventDefault();
          const box = $("#pn-search");
          box.focus();
          box.select();
        }
      });

      /* 两个视图切换。外部收录是默认 —— 它是这页的主内容，
         一个想看新论文的人不该先看到本地那 44 篇。 */
      function pnShowExternal(show) {
        $("#view-external").hidden = !show;
        $("#view-read").hidden = show;
        $("#timeline").hidden = show;
        $("#tab-external").setAttribute("aria-selected", String(show));
        $("#tab-read").setAttribute("aria-selected", String(!show));
        /* hero 头部共用搜索框随视图换语境：placeholder 告诉读者
           这一框此刻筛的是什么；已精读的计数徽章（pn-bar 里）只在
           该视图显示。搜索框值不动 —— 切视图不清词，读者换个口径
           继续筛是常见路径。 */
        $("#pn-search").placeholder = show
          ? "搜标题或方向"
          : "搜标题、作者、arXiv 编号";
        $("#paper-count").hidden = show;
      }
      $("#tab-external").onclick = () => pnShowExternal(true);
      $("#tab-read").onclick = () => {
        pnShowExternal(false);
        /* 外部收录是默认 tab，render() 在它显示时就跑过一遍了 —— 那一遍是在
         * 隐藏容器里，入场动画白白放掉，等读者切过来什么也看不到。
         * 这里把标志复位再画一次，让动画落在真正被看到的那一刻。 */
        if (!everShownRead) {
          everShownRead = true;
          firstPaint = true;
          render();
        }
      };
      // 初始状态显式设一次。只靠 onclick 的话首屏是"两个视图都显示"的
      // 默认状态 —— 外部列表和时间线同时在，而时间线列的是本地旧论文。
      pnShowExternal(true);

      async function load() {
        try {
          const response = await fetch("/api/papers", { cache: "no-store" });
          if (!response.ok) throw new Error("unavailable");
          const payload = await response.json();
          all = payload.papers || [];
          methodPath = payload.method || "";
          const readCount = $("#tab-read-count");
          if (readCount) readCount.textContent = all.length.toLocaleString();
        } catch (error) {
          $("#paper-list").innerHTML = `<div class="paper-empty">${esc(tr("读不到论文注册表。运行 python3 scripts/fetch-papers.py 生成后再刷新。"))}</div>`;
          return;
        }
        renderPin();
        renderTimeline();
        render();
      }

      /* 已精读的过滤也挂到 hero 头部共用框（#pn-search）的防抖上：
         输入即筛，不另立输入框、不另立防抖 —— 一个动作一个入口。 */
      /* （绑定合并见下方 pnTimer 段 —— render 已是其中一支。） */
      /* 这一页的正文全部由 JS 生成，translateDOM 走的是静态 markup，
         够不到这些节点，所以语言切换后要自己重画一遍。 */
      document.addEventListener("tk:lang", () => {
        renderPin();
        renderTimeline();
        render();
        // 外部列表也是 JS 生成的，但它由服务端排序分页，
        // 重画只能整批重拉 —— 语言只影响界面字，不影响内容。
        pn.offset = 0;
        $("#pn-list").innerHTML = "";
        loadExternal();
      });
      load();
      loadExternal();

<script>
(function(){
  function label(el){
    var cls = typeof el.className === 'string' ? el.className.trim().split(/\s+/)[0] : '';
    return el.tagName.toLowerCase() + (cls ? '.' + cls : '');
  }

  var out = {};


  /* Measure only once the sidebar exists.
     --dump-dom snapshots after parsing, which is before the sidebar's
     DOMContentLoaded handler builds the nav. Taking the numbers synchronously
     records the skeleton — the first run of this script reported "0 nav" on
     eight pages and called them clean. So the wait comes first and the
     measurement happens inside it. */
  var waited = 0;
  (function settle(){
    var hasNav = document.querySelectorAll('.tk-nav a').length > 0;
    var hasSidebar = !!document.querySelector('.tk-sidebar');
    var exhausted = waited > 120;
    if((hasNav || (!hasSidebar && exhausted)) && waited > 2){ done(); return; }
    if(exhausted){ done(); return; }
    waited++;
    setTimeout(settle, 40);
  })();

  function done(){ document.title = '@@' + JSON.stringify(measure()); }

  function measure(){
    var out = {};
  /* 1. No horizontal overflow. Elements inside a deliberate scroller — a wide
        table, the mobile nav strip — are excluded: they are meant to scroll. */
  var offenders = [];
  document.querySelectorAll('*').forEach(function(el){
    var r = el.getBoundingClientRect();
    if(r.width < 1 || r.right <= innerWidth + 1) return;
    var n = el.parentElement, inScroller = false;
    while(n){
      var s = getComputedStyle(n);
      if(s.overflowX === 'auto' || s.overflowX === 'scroll'){ inScroller = true; break; }
      n = n.parentElement;
    }
    if(!inScroller) offenders.push(label(el));
  });
  out.overflow = {
    docScrollWidth: document.documentElement.scrollWidth,
    innerWidth: innerWidth,
    offenders: Array.from(new Set(offenders)).slice(0, 6)
  };

  /* 2. The floating feedback button must not sit on text a reader needs.
   *
   * 只看**当前视口里真的可见**的元素。
   *
   * getBoundingClientRect 给的是元素在它滚动容器里的位置 —— 横向滚动列表
   * 里被划到屏幕外的卡片，矩形仍然算在那条轨道上（实测 x=5376），于是
   * 检测说"按钮压住了卡片标题"，而屏幕上根本没有那张卡片。
   * 这不是布局问题，是检测没有把滚动偏移算进来。
   *
   * 判据换成：元素的矩形要落在视口内，而且没有被祖先的横向滚动推到外面。
   */
  var fab = document.querySelector('.tk-fab');
  var covered = [];
  if(fab){
    var fr = fab.getBoundingClientRect();
    document.querySelectorAll('*').forEach(function(el){
      if(el === fab || fab.contains(el)) return;
      if(el.querySelector && el.querySelector('.tk-fab')) return;
      var b = el.getBoundingClientRect();
      if(b.width < 8 || b.height < 8) return;
      // 只算视口内的：滑到屏幕外的内容不构成遮挡。
      if(b.right <= 0 || b.left >= innerWidth) return;
      if(b.bottom <= 0 || b.top >= innerHeight) return;
      if(b.right < fr.left || b.left > fr.right || b.bottom < fr.top || b.top > fr.bottom) return;
      var st = getComputedStyle(el);
      if(st.visibility === 'hidden' || st.display === 'none' || +st.opacity < 0.1) return;
      /* 横向滚动容器里的元素不算 —— 它们在被划到之前不在屏幕上。
       *
       * 一个横向滚动的轨道，未滚到的卡片矩形落在轨道右侧（实测 x=5376），
       * 恰好经过浮动按钮那块区域，于是被报成"按钮压住标题"。但读者
       * 看不到那张卡片，也点不到它 —— 它不是遮挡。
       *
       * 反过来说：真正要防的是**静止内容**被压住，比如正文、表格、
       * 纵向列表。那些不在滚动容器里，这条排除不影响它们被检测到。 */
      var n = el.parentElement, inScroller = false;
      while(n){
        var ps = getComputedStyle(n);
        if(ps.overflowX === 'auto' || ps.overflowX === 'scroll'){ inScroller = true; break; }
        n = n.parentElement;
      }
      if(inScroller) return;
      var ownText = [].some.call(el.childNodes, function(n){
        return n.nodeType === 3 && n.textContent.trim();
      });
      if(ownText) covered.push(label(el));
    });
  }
  out.fabCovers = fab ? Array.from(new Set(covered)).slice(0, 6) : null;

  /* 3. The floating controls must not overlap each other. */
  var boxes = [];
  [['fab', '.tk-fab'], ['theme', '.tk-theme-toggle'],
   ['kbd', '#kbd-hint'], ['lang', '.tk-lang-toggle']].forEach(function(pair){
    var el = document.querySelector(pair[1]);
    if(!el) return;
    var r = el.getBoundingClientRect();
    if(r.width < 1) return;
    boxes.push({name: pair[0], x: r.x, y: r.y, w: r.width, h: r.height});
  });
  var clashes = [];
  for(var i = 0; i < boxes.length; i++){
    for(var j = i + 1; j < boxes.length; j++){
      var a = boxes[i], b = boxes[j];
      var overlap = !(a.x + a.w <= b.x || b.x + b.w <= a.x ||
                      a.y + a.h <= b.y || b.y + b.h <= a.y);
      if(overlap) clashes.push(a.name + '+' + b.name);
    }
  }
  out.controlClashes = clashes;

  /* 4. The sidebar must be where the page expects it. */
  var sb = document.querySelector('.tk-sidebar');
  if(sb){
    var sr = sb.getBoundingClientRect();
    out.sidebar = {
      position: getComputedStyle(sb).position,
      x: Math.round(sr.x),
      width: Math.round(sr.width),
      navItems: document.querySelectorAll('.tk-nav a').length
    };
  } else {
    out.sidebar = null;
  }

  /* 5. The nav must be complete on the first paint, not grown afterwards.
        A bar that reads four items and then five is the flicker this checks. */
  out.navItems = document.querySelectorAll('.tk-nav a').length;

  /* 6. Text clipped by a fixed-height ancestor. */
  var clipped = [];
  document.querySelectorAll('*').forEach(function(el){
    var st = getComputedStyle(el);
    if(st.overflowY === 'auto' || st.overflowY === 'scroll' || st.overflowY === 'visible') return;
    /* 多行截断（-webkit-line-clamp）是有意的排版：摘要限定两行，
       超出部分隐去。它必然让 scrollHeight 大于 clientHeight，但这
       不是缺陷 —— 是设计。用 data-clamp 显式声明，审计跳过。
       这个属性同时也是一份记录：写明"这里是有意截断的"，
       避免后来者以为是 bug 去修。 */
    if(el.hasAttribute('data-clamp')) return;
    /* object-fit: cover 同理 —— 封面图按容器比例裁切是有意的，
       必然让图片的固有尺寸和显示盒不一致。用 data-crop 声明。 */
    if(el.hasAttribute('data-crop')) return;
    /* KaTeX 会给每个公式额外输出一份 MathML —— 那是给屏幕阅读器和
       复制粘贴用的，kaTEX 自己的 CSS 就把它 clip 成 1×1 并绝对定位。
       它必然"溢出"（内容比 1px 的盒子大得多），但那是标准做法，
       不是排版问题。按类名跳过：这个类由 KaTeX 生成，没法给它加属性。 */
    if(el.classList.contains('katex-mathml')) return;
    if(el.clientHeight > 0 && el.scrollHeight > el.clientHeight + 4) clipped.push(label(el));
  });
  out.clipped = Array.from(new Set(clipped)).slice(0, 6);

    return out;
  }
})();
</script>
