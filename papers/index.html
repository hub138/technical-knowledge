<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>论文追踪 · technical-knowledge</title>
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/base.css" />
    <script src="/static/nav.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/shell.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => TKShell.sidebar({ page: 'papers' }));
      document.addEventListener('DOMContentLoaded', () => TKShell.feedback({
        where: () => '当前页面：<b>论文追踪</b>',
        title: () => '论文追踪',
      }));
    </script>
    <style>
      /* 论文追踪页。
       *
       * 定位是"追踪"不是"书目"，所以按时间倒序，新的在前。第一版按被引次数
       * 排序，把 2017 年的 Attention 摆在最上面 —— 那是基石清单，读者看不出
       * 最近发生了什么，而"最近发生了什么"才是这个页面存在的理由。
       *
       * 每篇给 L1 的三个要点（问题 / 做法 / 结果），让读者在列表里就能决定
       * 要不要点进去，而不是点开才知道有没有用。
       */
      /* 方法论原本是一整块带标题和说明的横幅，占了首屏近三分之一。
         它是一份"规则出处"，读者在需要的时候才会去看，不需要一直占着地方。
         收成一个按钮，放在工具栏右端 —— 位置固定，想找时找得到。 */
      .method-link {
        flex: none;
        padding: 8px 15px;
        border: 1px solid var(--color-accent-line);
        border-radius: var(--radius-full);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }
      .method-link:hover { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-panel); }

      .paper-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        margin: var(--space-6) 0 var(--space-3);
      }
      .paper-toolbar input[type="search"] {
        flex: 1 1 240px;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink);
        font: var(--weight-normal) var(--text-body) / 1.4 var(--font-sans);
      }
      .paper-toolbar input[type="search"]:focus {
        border-color: var(--color-accent);
        box-shadow: var(--shadow-ring);
        outline: none;
      }
      /* 年份筛选：追踪页最常用的切分维度就是"哪一年"。 */
      .paper-count {
        color: var(--color-muted);
        font-size: var(--text-small);
        font-variant-numeric: tabular-nums;
      }

      .paper-year {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: var(--space-6) 0 var(--space-3);
        color: var(--color-ink);
        font-size: var(--text-h3);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
      }
      .paper-year::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--color-line);
      }
      .paper-year span { color: var(--color-muted); font-size: var(--text-small); font-weight: var(--weight-normal); }

      /* 历史奠基区块。
       *
       * 44 篇里 37 篇是 2024 年前的，摊在列表主体会把新论文压到几十屏之后 ——
       * 一个「追踪新论文」的页面打开先看到 2015 年的论文，定位自己就没了。
       * 数据不删，只是默认不展开。
       *
       * 视觉上跟 .paper-year 同色同字号，但整块读起来像「资料区」而不是
       * 「又一个章节」：底色下沉一档，标题带一个可点的手势。
       * 刻意不用 .paper-year 那条 ::after 发丝线 —— summary 里已经有可点的
       * 三角，再加一条横贯的线会读成「这是分隔符、不可点」。
       */
      .paper-past { margin-top: var(--space-6); }
      .paper-past > summary {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 var(--space-3);
        padding: 10px 14px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-ink);
        font-size: var(--text-h3);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        list-style: none;
      }
      .paper-past > summary::-webkit-details-marker { display: none; }
      .paper-past > summary:hover { border-color: var(--color-accent-line); }
      .paper-past > summary::before {
        content: "▸";
        flex: none;
        color: var(--color-muted);
        transition: transform var(--duration-fast) var(--ease-out);
      }
      .paper-past[open] > summary::before { transform: rotate(90deg); }
      .paper-past .past-title { flex: 1; min-width: 0; }
      .paper-past .past-count {
        flex: none;
        color: var(--color-muted);
        font-size: var(--text-small);
        font-weight: var(--weight-normal);
      }
      /* 展开后的第一个年份标题不要再顶一大段空白，否则看起来像断成两截。 */
      .paper-past-body > .paper-year:first-child { margin-top: var(--space-4); }

      .paper-list { display: grid; gap: var(--space-3); }

      .paper {
        display: grid;
        gap: var(--space-3);
        padding: var(--space-4) var(--space-5);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-md);
        background-color: var(--color-panel);
        background-image: var(--wash-panel);
        box-shadow: var(--hairline-top), var(--shadow-xs);
        transition: border-color var(--duration-fast) var(--ease-out);
      }
      .paper:hover { border-color: var(--color-accent-line); }
      .paper[data-href] { cursor: pointer; }
      .paper[data-href]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      /* 有手写深度解读的，是真正被读过的，值得一个视觉标记。 */
      .paper.read { border-left: 3px solid var(--color-accent); }

      .paper-head { display: flex; align-items: baseline; gap: var(--space-3); }
      .paper h3 {
        margin: 0;
        flex: 1;
        min-width: 0;
        font-size: var(--text-h3);
        line-height: 1.35;
      }
      .paper h3 a { color: var(--color-ink); }
      .paper h3 a:hover { color: var(--color-accent); }
      .paper-when { flex: none; color: var(--color-muted); font-size: var(--text-small); font-variant-numeric: tabular-nums; }
      .paper-meta { margin: 0; color: var(--color-muted); font-size: var(--text-small); }
      .paper-meta code {
        padding: 1px 5px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      /* L1 要点表。字段缺哪条就不显示哪行，不为表格完整去填占位内容。 */
      .l1 { display: grid; gap: 5px; margin: 0; }
      .l1 div {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr);
        gap: 10px;
        align-items: baseline;
      }
      .l1 dt { color: var(--color-muted); font-size: var(--text-small); font-weight: var(--weight-semibold); }
      .l1 dd { margin: 0; color: var(--color-ink-soft); font-size: var(--text-small); line-height: 1.65; }
      .l1 dd.result { color: var(--color-accent-ink); font-weight: var(--weight-medium); }

      .paper-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-3);
        padding-top: var(--space-3);
        border-top: 1px solid var(--color-line);
      }
      .paper-tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-full);
        background: var(--color-surface);
        color: var(--color-muted);
        font-size: var(--text-micro);
      }
      .paper-tag.evidence { border-color: var(--color-accent-line); background: var(--color-accent-soft); color: var(--color-accent); }
      .paper-more {
        margin-left: auto;
        color: var(--color-accent);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
        white-space: nowrap;
      }
      .paper-more:hover { text-decoration: underline; }

      /* 右侧时间线：按年份分组的全部论文，可以跳。
       *
       * 主列表已经按时间排了，但 44 篇滚起来很长，读者想直接跳到某一篇时
       * 只能滚。这一栏把它压成一行一篇的索引，和文章页的目录同一个位置、
       * 同一套视觉。
       */
      .tl-layout { display: block; }
      .p-timeline { display: none; }
      /* [hidden] 必须压得住下面的 display:block。
         属性选择器（0,1,0）和 .p-timeline（0,1,0）同权重，靠后写的生效；
         不显式写这条的话，外部收录视图里时间线会照常显示，
         而它列的是本地那 44 篇的年份 —— 在那个视图里是干扰。 */
      .p-timeline[hidden] { display: none !important; }
      @media (min-width: 1280px) {
        .tl-layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 264px;
          column-gap: 34px;
          align-items: start;
        }
        /* 时间线隐藏时把那一列收掉。
           只藏元素是不够的 —— 网格仍然留着 264px 的空列，正文右边多出
           一条谁也不占的空白。:has() 让容器自己感知到子元素被隐藏。
           （浏览器支持：Chrome 105+ / Safari 15.4+ / Firefox 121+，
           不支持时退回两列布局，也就是现在这样，不会更坏。） */
        .tl-layout:not(:has(.p-timeline:not([hidden]))) {
          grid-template-columns: minmax(0, 1fr);
        }
        .p-timeline {
          display: block;
          position: sticky;
          top: 96px;
          max-height: calc(100vh - 130px);
          overflow: auto;
          font-size: var(--text-sm);
        }
        .p-timeline[hidden] { display: none !important; }
      }
      .p-timeline .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--color-line);
        color: var(--color-muted);
        font-size: var(--text-xs);
        font-weight: var(--weight-bold);
        letter-spacing: 0.06em;
      }
      .p-timeline ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 1px; }
      .p-timeline .tl-year {
        margin: 12px 0 4px;
        padding-left: 8px;
        color: var(--color-ink);
        font-size: var(--text-small);
        font-weight: var(--weight-bold);
        font-variant-numeric: tabular-nums;
      }
      .p-timeline .tl-year:first-child { margin-top: 0; }
      .p-timeline a {
        display: block;
        padding: 4px 8px;
        border-radius: var(--radius-xs);
        color: var(--color-muted);
        line-height: 1.45;
        /* 两行封顶。只显示一行会把标题切在没意义的地方
           （"AutoRAG: Automated Framework for" 就断了），
           而完全不限行又会让年份分组失去节奏。两行是能认出论文的最少行数。 */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .p-timeline a:hover { background: var(--color-accent-soft); color: var(--color-accent); }
      .p-timeline a.read { color: var(--color-ink-soft); }
      .p-timeline a.read::before {
        content: "";
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--color-accent);
        vertical-align: middle;
      }

      .paper-empty {
        padding: var(--space-10);
        border: 1px dashed var(--color-line);
        border-radius: var(--radius-md);
        color: var(--color-muted);
        text-align: center;
        font-size: var(--text-small);
      }

      /* ── 外部收录（PaperNotes）─────────────────────────────────────────
       *
       * 这一页原来的问题不是排版，是数据源：本地的 44 篇最新只到 2024，
       * 而页面叫「追踪新论文」—— 点进来看到 2017 年的论文，一篇新的都没有。
       * 现在主列表是 PaperNotes 的 2.3 万篇（到 ICLR 2026 / CVPR 2026），
       * 本地那 44 篇移到「已精读」子视图。
       */
      .pn-bar {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin: var(--space-4) 0 var(--space-3);
      }
      .pn-tabs { display: flex; gap: 4px; }
      .pn-tab {
        padding: 6px 13px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        cursor: pointer;
      }
      .pn-tab:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      .pn-tab[aria-selected="true"] {
        border-color: var(--color-accent-line);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-weight: var(--weight-semibold);
      }
      .pn-stat { color: var(--color-muted); font-size: var(--text-small); }

      /* 筛选芯片。标签是这页的主要导航方式 —— 两万篇里找出
         「Agent 相关的」靠的就是它，所以给它足够的视觉重量。 */
      .pn-filters { display: grid; gap: 6px; margin: var(--space-3) 0 0; }
      .pn-filter-row { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
      .pn-filter-label {
        flex: none;
        min-width: 4.5em;
        color: var(--color-faint);
        font-size: var(--text-xs);
      }
      .pn-chip {
        padding: 3px 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        color: var(--color-ink-soft);
        font-size: var(--text-xs);
        cursor: pointer;
        white-space: nowrap;
      }
      .pn-chip:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      .pn-chip[aria-pressed="true"] {
        border-color: var(--color-accent-line);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-weight: var(--weight-semibold);
      }
      .pn-chip b { color: var(--color-faint); font-weight: var(--weight-normal); }
      .pn-chip[aria-pressed="true"] b { color: var(--color-accent); }

      /* 大类芯片比子领域芯片重一档 —— 它是第一层的选择，
         视觉上要能一眼看出和下面那排不是同级。 */
      .pn-cat {
        padding: 5px 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        cursor: pointer;
        white-space: nowrap;
      }
      .pn-cat:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      .pn-cat[aria-pressed="true"] {
        border-color: var(--color-accent-line);
        background: var(--color-accent-soft);
        color: var(--color-accent);
        font-weight: var(--weight-semibold);
      }
      .pn-cat b { color: var(--color-faint); font-weight: var(--weight-normal); }
      .pn-cat[aria-pressed="true"] b { color: var(--color-accent); }
      /* 子领域那一排缩进一点，从位置上也看出它挂在上面的大类下。 */
      .pn-filter-row--sub { padding-left: 1.6em; }

      .pn-list { display: grid; gap: 1px; margin-top: var(--space-3); }
      /* 外部论文一条只有标题+标签，用紧排的列表而不是卡片 ——
         卡片适合"有内容要展开"的条目，这里一屏看二十条才有意义。 */
      .pn-row {
        display: grid;
        gap: 3px;
        padding: var(--space-3) 0;
        border-bottom: 1px solid var(--color-line);
      }
      .pn-row a {
        color: var(--color-ink);
        font-size: var(--text-body);
        font-weight: var(--weight-semibold);
        line-height: 1.5;
      }
      .pn-row a:hover { color: var(--color-accent); }
      .pn-row a::after { content: " ↗"; color: var(--color-muted); font-weight: var(--weight-normal); }
      .pn-meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .pn-conf {
        color: var(--color-accent);
        font-size: var(--text-xs);
        font-weight: var(--weight-semibold);
      }
      .pn-sub { color: var(--color-ink-soft); font-size: var(--text-xs); }
      .pn-tag { color: var(--color-faint); font-size: var(--text-xs); }
      .pn-tag + .pn-tag::before { content: " · "; }

      .pn-more {
        display: block;
        width: 100%;
        margin-top: var(--space-4);
        padding: 9px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        cursor: pointer;
      }
      .pn-more:hover { border-color: var(--color-accent-line); color: var(--color-ink); }
      .pn-empty { padding: var(--space-6) 0; color: var(--color-muted); text-align: center; }

      @media (max-width: 760px) {
        .method-pin { display: block; }
        .method-pin a { display: inline-block; margin-top: var(--space-3); }
        .paper-head { display: block; }
        .paper-when { display: inline-block; margin-top: 4px; }
        .l1 div { grid-template-columns: 1fr; gap: 1px; }
        .paper { padding: var(--space-4); }
        .pn-filter-label { min-width: 0; }
      }
    </style>
  </head>
  <body class="tk-host">
    <aside class="tk-sidebar" id="tk-sidebar"></aside>
    <div class="tk-shell tl-layout">
      <div class="tl-main">
      <section class="hero">
        <div class="eyebrow">PAPERS · 追踪与解析</div>
        <h1>追踪新论文</h1>
        <!-- 句子在锚点处断开是必须的：i18n 按文本节点查词典，
             把链接包进整句会让英文界面下段落外的部分翻不过来。 -->
        <p><span>两万三千篇顶会论文解读，来自</span> <a href="https://papernotes.org/" target="_blank" rel="noopener noreferrer">papernotes.org ↗</a><span>，按论文自己的分类组织。点标题回原站看完整解读。</span></p>
      </section>

      <div class="pn-bar">
        <div class="pn-tabs" role="tablist" aria-label="论文来源">
          <button type="button" class="pn-tab" id="tab-external" role="tab" aria-selected="true">外部收录</button>
          <button type="button" class="pn-tab" id="tab-read" role="tab" aria-selected="false">已精读</button>
        </div>
        <span class="pn-stat" id="pn-stat"></span>
        <span id="method-slot"></span>
      </div>

      <!-- 外部收录视图 -->
      <div id="view-external">
        <div class="paper-toolbar">
          <input type="search" id="pn-search" placeholder="搜标题或方向" autocomplete="off" />
        </div>
        <div class="pn-filters" id="pn-filters"></div>
        <div class="pn-list" id="pn-list"></div>
        <button type="button" class="pn-more" id="pn-more" hidden></button>
      </div>

      <!-- 已精读视图：本地那 44 篇，保留原有的 L1 展示 -->
      <div id="view-read" hidden>
        <div class="paper-toolbar">
          <input type="search" id="paper-search" placeholder="搜标题、作者、arXiv 编号" autocomplete="off" />
          <span class="paper-count" id="paper-count"></span>
        </div>
        <div id="paper-list"></div>
      </div>
      </div>
      <aside class="p-timeline" id="timeline" aria-label="时间线"></aside>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      const tr = (x) => (window.TKI18N ? window.TKI18N.t(x) : x);
      const lang = () => (window.TKI18N?.lang || "zh");  // i18n 把它暴露成 getter，不是方法
      /* 论文标题是专有名词，两种语言各有各的正确写法：
         中文界面显示中文标题，英文界面显示论文原名 ——
         后者才是读者在 arXiv、在别的文章里会看到的那一行。
         中文标题缺失时回退到原名，不显示空。 */
      const titleOf = (p) => (lang() === "en" ? (p.title_en || p.title) : (p.title_zh || p.title));
      /* L1 三个字段同样中英并存。中文缺了就回退英文 ——
         显示英文总好过显示空白。
         key_result 的中文键叫 result_zh，不是 key_result_zh（历史命名，
         服务端已经这么出了）。不特判的话中文界面下这一行会露出英文原文。 */
      const ZH_KEY = { key_result: "result_zh" };
      const fieldOf = (p, key) => (lang() === "en"
        ? (p[key] || "")
        : (p[ZH_KEY[key] || `${key}_zh`] || p[key] || ""));

      let all = [];
      let methodPath = "";

      function authorLine(authors) {
        if (!authors || !authors.length) return "";
        const shown = authors.slice(0, 2).join(", ");
        return authors.length > 2 ? `${shown} ${tr("等")}` : shown;
      }

      function renderPin() {
        if (!methodPath) return;
        $("#method-slot").innerHTML =
          `<a class="method-link" href="/?path=${encodeURIComponent(methodPath)}">`
          + `${esc(tr("筛选与解析方法"))}</a>`;
      }

      /* 历史奠基的论文只给「解决的问题」和「做法」，不给「关键结果」。
       *
       * 理由：关键结果是给"这篇值不值得跟进"用的，而 2024 年前的论文要么已经
       * 变成常识进了教科书，要么已经被后来的工作超越 —— 它的 2017 年数字对今天
       * 没有决策价值，摆在列表里只是噪音。解决的问题和做法不过时，留下。
       */
      function l1(paper) {
        const rows = [];
        const problem = fieldOf(paper, "problem");
        const approach = fieldOf(paper, "approach");
        const result = fieldOf(paper, "key_result");
        if (problem) rows.push(`<div><dt>${esc(tr("解决的问题"))}</dt><dd>${esc(problem)}</dd></div>`);
        if (approach) rows.push(`<div><dt>${esc(tr("做法"))}</dt><dd>${esc(approach)}</dd></div>`);
        if (result && !isFoundational(paper)) {
          rows.push(`<div><dt>${esc(tr("关键结果"))}</dt><dd class="result">${esc(result)}</dd></div>`);
        }
        return rows.length ? `<dl class="l1">${rows.join("")}</dl>` : "";
      }

      function card(p) {
        const ev = p.evidence_count;
        const tags = [];
        if (ev) tags.push(`<span class="paper-tag evidence">${esc(tr("支撑"))} ${ev} ${esc(tr("篇知识"))}</span>`);
        if (p.survey_count) tags.push(`<span class="paper-tag">${esc(tr("调研引用"))} ${p.survey_count}</span>`);
        if (p.primary) tags.push(`<span class="paper-tag">${esc(p.primary)}</span>`);
        // 有手写深度解读就标出来，让读者知道点进去能看到完整八模块。
        if (p.has_deep_read) tags.push(`<span class="paper-tag evidence">${esc(tr("已深度解析"))}</span>`);
        const href = `/paper?id=${encodeURIComponent(p.id)}`;
        return `<article class="paper${p.has_deep_read ? " read" : ""}" data-href="${esc(href)}" tabindex="0" role="link" aria-label="${esc(titleOf(p) || p.id)}">
          <div class="paper-head">
            <h3><a href="${esc(href)}">${esc(titleOf(p) || p.id)}</a></h3>
            <span class="paper-when">${esc(p.published)}</span>
          </div>
          <p class="paper-meta">${esc(authorLine(p.authors))} · <code>arXiv:${esc(p.id)}</code></p>
          ${l1(p)}
          <div class="paper-foot">
            ${tags.join("")}
            <a class="paper-more" href="${esc(href)}">${esc(tr("解析"))} →</a>
          </div>
        </article>`;
      }

      /* 2024 年前算历史奠基。
       *
       * 写成一个阈值而不是列一串年份：数据每年会涨，列出来的年份表明年就错。
       * published 是 YYYY-MM-DD，取前四位比较即可。 */
      const FOUNDATIONAL_MAX = 2023;
      const isFoundational = (p) => Number((p.published || "").slice(0, 4) || 0) <= FOUNDATIONAL_MAX;

      /* 按年份分组。追踪页最自然的切分是"哪一年"，比一条长列表好扫。 */
      function yearGroups(list) {
        const groups = [];
        let year = null;
        let chunk = [];
        const flush = () => {
          if (!chunk.length) return;
          groups.push({ year, items: chunk });
          chunk = [];
        };
        list.forEach((p) => {
          const y = (p.published || "").slice(0, 4) || "—";
          if (y !== year) { flush(); year = y; }
          chunk.push(p);
        });
        flush();
        return groups;
      }

      function yearBlock({ year, items }) {
        return `<h2 class="paper-year">${esc(year)}<span>${items.length} ${esc(tr("篇"))}</span></h2>`
             + `<div class="paper-list">${items.map(card).join("")}</div>`;
      }

      function render() {
        const q = $("#paper-search").value.trim().toLowerCase();
        const filtered = all.filter((p) => {
          if (!q) return true;
          return [p.title, p.id, (p.authors || []).join(" "), p.primary,
                  p.problem, p.approach, p.key_result]
            .join(" ").toLowerCase().includes(q);
        });

        const list = $("#paper-list");
        if (!filtered.length) {
          list.innerHTML = `<div class="paper-empty">${esc(tr("搜「标题 / 作者 / arXiv 编号」都没命中。试试论文标题里的一个词，或者 4 位年份。"))}</div>`;
          $("#paper-count").textContent = `0 / ${all.length}`;
          return;
        }

        const recent = filtered.filter((p) => !isFoundational(p));
        const foundational = filtered.filter(isFoundational);
        let out = yearGroups(recent).map(yearBlock).join("");
        if (foundational.length) {
          /* 搜索时自动展开。搜到的东西必须看得见，默认折叠会把它藏起来 ——
             这是唯一一处折叠状态不由用户决定的地方，所以规则保持单一：
             有搜索词就开，清空就收，不记忆用户的手动展开。 */
          out += `<details class="paper-past"${q ? " open" : ""}>
            <summary>
              <span class="past-title">${esc(tr("2023 及更早 · 历史奠基"))}</span>
              <span class="past-count">${foundational.length} ${esc(tr("篇"))}</span>
            </summary>
            <div class="paper-past-body">${yearGroups(foundational).map(yearBlock).join("")}</div>
          </details>`;
        }
        list.innerHTML = out;
        /* 整块可点：解析是这一页的主线动作，读者不该被要求瞄准右下角那个
           小链接。卡内已有的链接保持自己的跳转，不重复处理。 */
        list.querySelectorAll(".paper").forEach((card) => {
          const go = (event) => {
            if (event.target.closest("a")) return;
            location.href = card.dataset.href;
          };
          card.onclick = go;
          card.onkeydown = (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); go(event); }
          };
        });

        const withResult = filtered.filter((p) => p.key_result).length;
        $("#paper-count").textContent =
          `${filtered.length} / ${all.length} ${tr("篇")} · ${withResult} ${tr("篇有摘要里的量化结果")}`;
      }

      /* 时间线用全部论文，不跟着搜索过滤 ——
         它的作用是"让我跳到别处"，跟着过滤就把去路也砍掉了。
         已深度解析的用圆点标出来。 */
      function renderTimeline() {
        const aside = $("#timeline");
        if (!all.length) { aside.innerHTML = ""; return; }
        let out = `<div class="rail-head">${esc(tr("时间线"))}<span>${all.length} ${esc(tr("篇"))}</span></div>`;
        let year = null;
        all.forEach((p) => {
          const y = (p.published || "").slice(0, 4) || "—";
          if (y !== year) {
            if (year !== null) out += "</ul>";
            out += `<div class="tl-year">${esc(y)}</div><ul>`;
            year = y;
          }
          out += `<li><a href="/paper?id=${encodeURIComponent(p.id)}"`
               + ` class="${p.has_deep_read ? "read" : ""}"`
               + ` title="${esc(titleOf(p) || p.id)}">${esc(titleOf(p) || p.id)}</a></li>`;
        });
        if (year !== null) out += "</ul>";
        aside.innerHTML = out;
      }

      /* ── 外部收录（PaperNotes 的 2.3 万篇）──────────────────────────────
       *
       * 分页是必需的，不是优化：23802 条一次渲染成 DOM 会让首屏卡住几秒。
       * 服务端按筛选条件返回一页，这里只追加。
       *
       * 筛选状态放在一个对象里，改任何一项都重置翻页并重拉 ——
       * 让"当前看到的是哪一批"永远和筛选条件一致，不做本地增量过滤，
       * 否则「显示更多」之后改条件会留下上一种条件的残留。
       */
      const PAGE = 60;
      const pn = { tag: "", conf: "", cat: "", sub: "", q: "", offset: 0, total: 0, grand: 0, busy: false };

      function pnRow(paper) {
        // 会议 + 子领域 + 前几个标签。
        //
        // 标签要去掉和子领域重复的。比较时要先归一化：PaperNotes 自己的
        // 数据里同一个概念有两种写法 —— 子领域是「物理 / 科学计算」，
        // tags 里是「物理/科学计算」；子领域是「3D 视觉」，tags 里是「3D视觉」。
        // 只比字面的话这些会成对出现，看起来像渲染错了。
        const sub = paper.subfield || "";
        const fold = (s) => s.toLowerCase().replace(/[\s/·、]+/g, "");
        const subKey = fold(sub);
        const tags = (paper.tags || []).filter((t) => fold(t) !== subKey).slice(0, 3);
        return `<article class="pn-row">
          <a href="${esc(paper.url)}" target="_blank" rel="noopener noreferrer">${esc(paper.title)}</a>
          <div class="pn-meta">
            ${paper.conference ? `<span class="pn-conf">${esc(paper.conference)}</span>` : ""}
            ${sub ? `<span class="pn-sub">${esc(sub)}</span>` : ""}
            ${tags.map((t) => `<span class="pn-tag">${esc(t)}</span>`).join("")}
          </div>
        </article>`;
      }

      /* 两层分类：大类一行，选中后展开它的子领域。
       *
       * 为什么不平铺：PaperNotes 有 55 个子领域、篇数从 2066（图像生成）到
       * 2（信号/通信）跨三个数量级。平铺在一起，LLM Agent（504 篇）会被
       * 埋在中间，而一个想找 agent 的人得先扫过一串跟他无关的芯片。
       * 分两层之后「LLM → LLM Agent」是两步明确的动作。
       *
       * 大类的顺序照 PaperNotes 自己的导航 —— LLM 第一，尽管生成与多模态
       * 的篇数更多。读者找论文时先想的是「LLM 相关的」，不是「五百篇以上的」。
       */
      function pnPaintFilters(categories, conferences) {
        const catRow = categories.map((c) => `
          <button type="button" class="pn-cat" data-cat="${esc(c.name)}"
            aria-pressed="${pn.cat === c.name ? "true" : "false"}">${esc(c.name)}
            <b>${c.count.toLocaleString()}</b></button>`).join("");
        // 选中大类后展开它的子领域；没选就显示全部大类的概览。
        const active = categories.find((c) => c.name === pn.cat);
        const subRow = active && active.subfields.length
          ? `<div class="pn-filter-row pn-filter-row--sub">
               <span class="pn-filter-label">${esc(tr("子领域"))}</span>
               <button type="button" class="pn-chip" data-kind="sub-clear"
                 aria-pressed="${pn.sub ? "false" : "true"}">${esc(tr("全部"))} <b>${active.count.toLocaleString()}</b></button>
               ${active.subfields.map((s) => `<button type="button" class="pn-chip"
                 data-kind="sub" data-name="${esc(s.name)}"
                 aria-pressed="${pn.sub === s.name ? "true" : "false"}">${esc(s.name)} <b>${s.count.toLocaleString()}</b></button>`).join("")}
             </div>`
          : "";
        $("#pn-filters").innerHTML = `
          <div class="pn-filter-row">
            <span class="pn-filter-label">${esc(tr("分类"))}</span>
            <button type="button" class="pn-cat" data-cat=""
              aria-pressed="${pn.cat ? "false" : "true"}">${esc(tr("全部"))} <b>${pn.grand.toLocaleString()}</b></button>
            ${catRow}
          </div>
          ${subRow}
          <div class="pn-filter-row">
            <span class="pn-filter-label">${esc(tr("会议"))}</span>
            ${conferences.slice(0, 8).map((c) => `<button type="button" class="pn-chip"
              data-kind="conf" data-name="${esc(c.name)}"
              aria-pressed="${pn.conf === c.name ? "true" : "false"}">${esc(c.name)} <b>${c.count.toLocaleString()}</b></button>`).join("")}
          </div>`;
        $("#pn-filters").querySelectorAll("button").forEach((button) => {
          button.onclick = () => {
            if (button.dataset.cat !== undefined) {
              pn.cat = button.dataset.cat;
              // 换大类时清掉子领域和会议 —— 上一次的筛选残留在新分类下
              // 会把结果缩到空，而且看不出是为什么。
              pn.sub = "";
              pn.conf = "";
            } else if (button.dataset.kind === "sub") {
              pn.sub = pn.sub === button.dataset.name ? "" : button.dataset.name;
            } else if (button.dataset.kind === "sub-clear") {
              pn.sub = "";
            } else if (button.dataset.kind === "conf") {
              pn.conf = pn.conf === button.dataset.name ? "" : button.dataset.name;
            }
            pn.offset = 0;
            $("#pn-list").innerHTML = "";
            loadExternal();
          };
        });
      }

      async function loadExternal(append) {
        if (pn.busy) return;
        pn.busy = true;
        const params = new URLSearchParams({ offset: String(pn.offset), limit: String(PAGE) });
        if (pn.tag) params.set("tag", pn.tag);
        if (pn.conf) params.set("conf", pn.conf);
        if (pn.cat) params.set("cat", pn.cat);
        if (pn.sub) params.set("sub", pn.sub);
        if (pn.q) params.set("q", pn.q);
        try {
          const response = await fetch(`/api/papernotes?${params}`, { cache: "no-store" });
          if (!response.ok) throw new Error("unavailable");
          const payload = await response.json();
          pn.total = payload.total;
          pn.grand = payload.grand_total;
          if (!append) pnPaintFilters(payload.categories || [], payload.conferences || []);
          const rows = (payload.papers || []).map(pnRow).join("");
          const list = $("#pn-list");
          if (append) list.insertAdjacentHTML("beforeend", rows);
          else list.innerHTML = rows || `<div class="pn-empty">${esc(tr("没有匹配的论文。"))}</div>`;
          pn.offset += (payload.papers || []).length;
          const more = $("#pn-more");
          more.hidden = pn.offset >= pn.total;
          more.textContent = `${tr("显示更多")} (${pn.offset.toLocaleString()} / ${pn.total.toLocaleString()})`;
          const parts = [`${pn.total.toLocaleString()} ${tr("篇")}`];
          if (pn.cat) parts.push(pn.cat);
          if (pn.sub) parts.push(pn.sub);
          if (pn.conf) parts.push(pn.conf);
          // 没筛选时 total 就等于 grand，再说一遍是重复。
          const head = (pn.cat || pn.sub || pn.conf || pn.q)
            ? `${tr("筛出")} ${parts.join(" · ")}`
            : `${tr("外部收录")} ${pn.grand.toLocaleString()} ${tr("篇")}`;
          const scope = (pn.cat || pn.sub || pn.conf || pn.q) ? ` / ${tr("总计")} ${pn.grand.toLocaleString()} ${tr("篇")}` : "";
          $("#pn-stat").textContent = head + scope;
        } catch (error) {
          $("#pn-list").innerHTML = `<div class="pn-empty">${esc(tr("读不到论文摘要索引。运行 python3 scripts/fetch-papernotes.py 生成后再刷新。"))}</div>`;
          $("#pn-more").hidden = true;
        } finally {
          pn.busy = false;
        }
      }

      /* 搜索防抖：每敲一个字就发一次请求会打满后端，而且结果闪烁。
         250ms 是打字停顿和响应感之间的折中。 */
      let pnTimer = null;
      $("#pn-search").oninput = (event) => {
        clearTimeout(pnTimer);
        const value = event.currentTarget.value;
        pnTimer = setTimeout(() => {
          pn.q = value.trim();
          pn.offset = 0;
          $("#pn-list").innerHTML = "";
          loadExternal();
        }, 250);
      };
      $("#pn-more").onclick = () => loadExternal(true);

      /* 两个视图切换。外部收录是默认 —— 它是这页的主内容，
         一个想看新论文的人不该先看到本地那 44 篇。 */
      function pnShowExternal(show) {
        $("#view-external").hidden = !show;
        $("#view-read").hidden = show;
        $("#timeline").hidden = show;
        $("#tab-external").setAttribute("aria-selected", String(show));
        $("#tab-read").setAttribute("aria-selected", String(!show));
      }
      $("#tab-external").onclick = () => pnShowExternal(true);
      $("#tab-read").onclick = () => pnShowExternal(false);
      // 初始状态显式设一次。只靠 onclick 的话首屏是"两个视图都显示"的
      // 默认状态 —— 外部列表和时间线同时在，而时间线列的是本地旧论文。
      pnShowExternal(true);

      async function load() {
        try {
          const response = await fetch("/api/papers", { cache: "no-store" });
          if (!response.ok) throw new Error("unavailable");
          const payload = await response.json();
          all = payload.papers || [];
          methodPath = payload.method || "";
        } catch (error) {
          $("#paper-list").innerHTML = `<div class="paper-empty">${esc(tr("读不到论文注册表。运行 python3 scripts/fetch-papers.py 生成后再刷新。"))}</div>`;
          return;
        }
        renderPin();
        renderTimeline();
        render();
      }

      $("#paper-search").oninput = render;
      /* 这一页的正文全部由 JS 生成，translateDOM 走的是静态 markup，
         够不到这些节点，所以语言切换后要自己重画一遍。 */
      document.addEventListener("tk:lang", () => {
        renderPin();
        renderTimeline();
        render();
        // 外部列表也是 JS 生成的，但它由服务端排序分页，
        // 重画只能整批重拉 —— 语言只影响界面字，不影响内容。
        pn.offset = 0;
        $("#pn-list").innerHTML = "";
        loadExternal();
      });
      load();
      loadExternal();
    </script>
  </body>
</html>
