<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>论文追踪 · technical-knowledge</title>
    <link rel="stylesheet" href="/static/tokens.css" />
    <link rel="stylesheet" href="/static/base.css" />
    <script src="/static/nav.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/shell.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => TKShell.sidebar({ page: 'papers' }));
      document.addEventListener('DOMContentLoaded', () => TKShell.feedback({
        where: () => '当前页面：<b>论文追踪</b>',
        title: () => '论文追踪',
      }));
    </script>
    <style>
      /* 单篇论文的解析页。
       *
       * 分两层，和追踪方法论里的分级一致：
       *   L1  从论文自己的摘要抽取的要点。可靠，但只是摘要能支撑的部分。
       *   L2  六模块深度解读。需要真读过全文才能写，所以它要么是手写的，
       *       要么明确标成"还没有"。
       *
       * 不给 L2 生造内容。摘要里没有消融实验、超参和局限，靠摘要拼出来的
       * "深度解读"每一句都可能是错的，而读者分辨不出来 —— 宁可空着。
       */
      .p-back { display: inline-block; margin-bottom: var(--space-4); color: var(--color-muted); font-size: var(--text-small); }
      .p-back:hover { color: var(--color-accent); }

      .p-head { border-bottom: 1px solid var(--color-line); padding-bottom: var(--space-5); }
      .p-head h1 { margin: 0 0 var(--space-3); font-size: var(--text-3xl); line-height: 1.25; }
      .p-meta { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); margin: 0; color: var(--color-muted); font-size: var(--text-small); }
      .p-meta code {
        padding: 1px 6px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        font-family: var(--font-mono);
      }
      .p-authors { color: var(--color-ink-soft); }
      .p-links { display: flex; flex-wrap: wrap; gap: var(--space-3); margin: var(--space-4) 0 0; }
      .p-links a {
        padding: 7px 14px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-full);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
      }
      .p-links a:hover { border-color: var(--color-accent); background: var(--color-accent-soft); color: var(--color-accent); }

      .p-level {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: var(--space-6) 0 var(--space-3);
        color: var(--color-muted);
        font-size: var(--text-micro);
        font-weight: var(--weight-bold);
        letter-spacing: var(--tracking-caps);
        text-transform: uppercase;
      }
      .p-level::after { content: ""; width: 28px; height: 1px; background: var(--color-line); }

      /* L1：三到五个字段，每个字段一句话。 */
      .p-l1 { display: grid; gap: var(--space-4); }
      .p-field { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-4); align-items: baseline; }
      .p-field dt { color: var(--color-muted); font-size: var(--text-small); font-weight: var(--weight-semibold); }
      .p-field dd { margin: 0; color: var(--color-ink-soft); font-size: var(--text-body); line-height: 1.75; }
      /* 关键结果是这一页最该被看见的一行：它是论文改变了什么的可核查陈述。 */
      .p-field.result dd { color: var(--color-accent-ink); font-weight: var(--weight-medium); }

      /* 原文摘要收在最后，作为所有 L1 字段的出处。 */
      .p-abstract { margin: var(--space-3) 0 0; }
      .p-abstract summary {
        cursor: pointer;
        color: var(--color-muted);
        font-size: var(--text-small);
        font-weight: var(--weight-semibold);
      }
      .p-abstract summary:hover { color: var(--color-accent); }
      .p-abstract p {
        margin: var(--space-3) 0 0;
        padding: var(--space-4);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
        line-height: 1.8;
      }
      .p-abstract .src { display: block; margin-top: var(--space-2); color: var(--color-muted); font-size: var(--text-micro); }

      .p-evidence { margin: var(--space-6) 0 0; padding-top: var(--space-5); border-top: 1px solid var(--color-line); }
      .p-evidence h2 { margin: 0 0 var(--space-3); font-size: var(--text-h3); }
      .p-evidence ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; }
      .p-evidence a {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 9px 12px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-sm);
        background: var(--color-panel);
        color: var(--color-ink-soft);
        font-size: var(--text-small);
      }
      .p-evidence a:hover { border-color: var(--color-accent-line); background: var(--color-accent-soft); color: var(--color-accent); }
      .p-evidence a b { flex: none; color: var(--color-muted); font-size: var(--text-micro); font-weight: var(--weight-semibold); }

      /* 未深度解析时的说明。要写清缺的是什么、为什么缺、怎么补，
         而不是一句"暂无内容"。 */
      .p-todo {
        padding: var(--space-5);
        border: 1px dashed var(--color-line);
        border-radius: var(--radius-md);
        background: var(--color-surface);
      }
      .p-todo h3 { margin: 0 0 var(--space-3); font-size: var(--text-body); color: var(--color-ink); }
      .p-todo p { margin: 0 0 var(--space-3); color: var(--color-ink-soft); font-size: var(--text-small); line-height: 1.75; }
      .p-todo ol { margin: 0; padding-left: 20px; color: var(--color-ink-soft); font-size: var(--text-small); line-height: 1.9; }
      .p-todo code {
        padding: 1px 5px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-panel);
        font-family: var(--font-mono);
        font-size: 0.92em;
      }

      .p-deep { margin: var(--space-3) 0 0; }
      .p-deep h3 {
        margin: var(--space-6) 0 var(--space-2);
        padding-bottom: 5px;
        border-bottom: 1px solid var(--color-line);
        font-size: var(--text-xl);
      }
      .p-deep p, .p-deep li { color: var(--color-ink-soft); font-size: var(--text-body); line-height: 1.85; }
      .p-deep h4 { margin: var(--space-5) 0 var(--space-2); font-size: var(--text-h3); }
      .p-deep h5 { margin: var(--space-4) 0 var(--space-2); font-size: var(--text-body); }
      .p-deep strong { color: var(--color-ink); font-weight: var(--weight-semibold); }
      .p-deep code {
        padding: 1px 5px;
        border: 1px solid var(--color-line);
        border-radius: var(--radius-xs);
        background: var(--color-surface);
        font-family: var(--font-mono);
        font-size: 0.9em;
      }
      .p-deep a { color: var(--color-accent); }
      .p-deep a:hover { text-decoration: underline; }
      /* 引用块承载"这份解读不完整"的说明，要显眼到不会被跳过。 */
      .p-deep blockquote {
        margin: var(--space-3) 0;
        padding: var(--space-3) var(--space-4);
        border-left: 3px solid var(--color-warm);
        background: var(--color-warm-soft);
        color: var(--color-warm-ink);
        font-size: var(--text-small);
        line-height: 1.8;
      }
      .p-deep hr { margin: var(--space-6) 0; border: 0; border-top: 1px solid var(--color-line); }
      .p-deep ul { margin: var(--space-2) 0; padding-left: 22px; }

      .p-empty { padding: var(--space-10); color: var(--color-muted); text-align: center; }

      /* 右侧目录。深度解读有六个模块，正文长了以后需要能跳 ——
         和知识库文章页的目录用同一套视觉，读者不用重新学。 */
      .p-layout { display: block; }
      .p-toc { display: none; }
      @media (min-width: 1200px) {
        .p-layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 208px;
          column-gap: 28px;
          align-items: start;
        }
        .p-toc {
          display: block;
          position: sticky;
          top: 96px;
          max-height: calc(100vh - 130px);
          overflow: auto;
          font-size: var(--text-sm);
        }
      }
      .p-toc .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 0 9px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--color-line);
        color: var(--color-muted);
        font-size: var(--text-xs);
        font-weight: var(--weight-bold);
        letter-spacing: 0.06em;
      }
      .p-toc ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
      .p-toc a {
        display: block;
        padding: 5px 8px;
        border-radius: var(--radius-xs);
        color: var(--color-muted);
        line-height: 1.5;
      }
      .p-toc a:hover { background: var(--color-accent-soft); color: var(--color-accent); }
      .p-toc a[data-level="3"] { padding-left: 20px; font-size: var(--text-small); }
      .p-toc a[data-level="4"] { padding-left: 32px; font-size: var(--text-small); color: var(--color-faint); }
      .p-toc .rail-group {
        margin: 9px 0 3px;
        padding-left: 8px;
        color: var(--color-muted);
        font-size: var(--text-2xs);
        font-weight: var(--weight-bold);
        letter-spacing: 0.05em;
      }

      @media (max-width: 760px) {
        .p-field { grid-template-columns: 1fr; gap: 3px; }
      }
    </style>
  </head>
  <body class="tk-host">
    <aside class="tk-sidebar" id="tk-sidebar"></aside>
    <div class="tk-shell">
      <div class="p-layout">
        <div class="p-main" id="shell"><div class="p-empty">正在读取…</div></div>
        <aside class="p-toc" id="p-toc" aria-label="本文目录"></aside>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const esc = (v) => String(v ?? "").replace(/[&<>"']/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      const tr = (x) => (window.TKI18N ? window.TKI18N.t(x) : x);
      const lang = () => (window.TKI18N?.lang || "zh");
      const titleOf = (p) => (lang() === "en" ? (p.title_en || p.title) : (p.title_zh || p.title));
      // key_result 的中文键叫 result_zh，不是 key_result_zh（服务端的命名如此）。
      const ZH_KEY = { key_result: "result_zh" };
      const fieldOf = (p, key) => (lang() === "en"
        ? (p[key] || "")
        : (p[ZH_KEY[key] || `${key}_zh`] || p[key] || ""));

      let paper = null;

      function field(label, value, cls) {
        if (!value) return "";
        return `<div class="p-field${cls ? " " + cls : ""}"><dt>${esc(tr(label))}</dt><dd>${esc(value)}</dd></div>`;
      }

      /* 深度解读的六个模块名，与方法论里的 L2 一一对应。
         展示时按这个顺序，缺哪个模块一眼能看出来。 */
      const MODULES = [
        ["背景与问题", "background"],
        ["核心方法", "method"],
        ["技术细节", "detail"],
        ["实验与结果", "results"],
        ["局限性", "limits"],
        ["复现指南", "reproduce"],
      ];

      /* 行内标记：粗体、行内代码、wikilink。
       *
       * 第一版只处理了块级语法，结果 `**动机。**` 和 `> 说明` 原样显示出来，
       * 读者看到的是一堆星号和尖括号 —— 比不渲染更糟，因为它看起来像
       * 内容坏了。这里把行内也补上。
       *
       * 不引第三方 Markdown 库：站点一直坚持零运行时依赖，为一个页面加一个
       * 解析器不值得。代价是只支持写作规范里实际用到的这几种。 */
      /* 把被换行拆开的行内标记接回去。
       *
       * 这个渲染器按行处理，但写 Markdown 时 `**加粗**` 经常跨行断掉 ——
       * 「此前**只在抽取式任务上\n被研究过**，」这种。断在中间的星号两边都不
       * 匹配，页面上就直接把 `**` 露出来了。
       * 在拼接前先把「奇数个 ** 的行」和下一行合并，标记就完整了。
       * 只并 `**`，不并所有软换行 —— 段落内的换行该保留原样。 */
      function foldBold(text) {
        const lines = text.split("\n");
        const out = [];
        for (let i = 0; i < lines.length; i += 1) {
          let line = lines[i];
          // 结尾是残破的 ** 时，往下并，直到补齐或者撞上另一个块级结构。
          let guard = 0;
          while ((line.match(/\*\*/g) || []).length % 2 === 1
                 && i + 1 < lines.length && guard < 10
                 && !/^\s*(#|>|[-*]\s|\d+\.\s)/.test(lines[i + 1])) {
            i += 1;
            line += " " + lines[i].trim();
            guard += 1;
          }
          out.push(line);
        }
        return out.join("\n");
      }

      function inline(text) {
        let out = esc(text);
        // 行内代码先处理，避免它的内容被后面的规则二次加工。
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        // wikilink：[[路径]] 或 [[路径|显示名]]
        out = out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_m, target, label) => {
          const shown = (label || target.split("/").pop());
          return `<a href="/?path=${encodeURIComponent(target)}">${shown}</a>`;
        });
        return out;
      }

      function deepBlock(text) {
        const lines = foldBold(text).split("\n");
        let out = "";
        let list = "";
        const closeList = () => { if (list) { out += `<ul>${list}</ul>`; list = ""; } };
        for (let idx = 0; idx < lines.length; idx += 1) {
          const line = lines[idx].trimEnd();
          if (!line.trim()) { closeList(); continue; }
          // 引用块：连续的 `>` 行合成一个块。
          //
          // 第一版每行单独输出一个 blockquote，结果一段四行的说明变成四个
          // 独立的引用框，看起来像四条互不相干的警告。引用是连续的段落，
          // 就得按段落合并。
          if (/^>\s?/.test(line)) {
            closeList();
            const buf = [];
            let k = idx;
            while (k < lines.length && /^>\s?/.test(lines[k])) {
              buf.push(inline(lines[k].replace(/^>\s?/, "")));
              k += 1;
            }
            out += `<blockquote><p>${buf.join(" ")}</p></blockquote>`;
            idx = k - 1;   // 外层循环会再 +1
            continue;
          }
          let m;
          if ((m = line.match(/^####\s+(.*)$/))) { closeList(); out += `<h5>${inline(m[1])}</h5>`; }
          else if ((m = line.match(/^###\s+(.*)$/))) { closeList(); out += `<h4>${inline(m[1])}</h4>`; }
          else if ((m = line.match(/^##\s+(.*)$/))) { closeList(); out += `<h3>${inline(m[1])}</h3>`; }
          else if ((m = line.match(/^#\s+(.*)$/))) { closeList(); out += `<h3>${inline(m[1])}</h3>`; }
          else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { list += `<li>${inline(m[1])}</li>`; }
          else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { list += `<li>${inline(m[1])}</li>`; }
          else if (/^---+$/.test(line.trim())) { closeList(); out += "<hr>"; }
          else { closeList(); out += `<p>${inline(line)}</p>`; }
        }
        closeList();
        return out;
      }

      function render() {
        if (!paper) return;
        const p = paper;
        const authors = (p.authors || []).join(", ");

        const l1 = [
          field("一句话概括", p.overview),
          field("解决的问题", fieldOf(p, "problem")),
          field("做法", fieldOf(p, "approach")),
          field("关键结果", fieldOf(p, "key_result"), "result"),
        ].join("");

        const evidence = p.evidence?.length ? `
          <div class="p-evidence">
            <h2>${esc(tr("知识库中依赖它的结论"))} · ${p.evidence.length}</h2>
            <ul>${p.evidence.map((c) => `
              <li><a href="/?path=${encodeURIComponent(c.path)}">
                <b>${esc(c.domain || "")}</b><span>${esc(c.title)}</span>
              </a></li>`).join("")}</ul>
          </div>` : "";

        /* L2 两种情况分开写。有就渲染，没有就说清缺什么 ——
           "暂无"会让读者以为是页面坏了，说清原因才知道这是正常的。 */
        const l2 = p.has_deep_read && p.deep_read ? `
          <div class="p-deep">${deepBlock(p.deep_read)}</div>` : `
          <div class="p-todo">
            <h3>${esc(tr("这篇还没有深度解读"))}</h3>
            <p>${esc(tr("上面是 L1，来自论文自己的摘要。深度解读（L2）要把全文读完才能写：摘要里没有消融实验、超参设置、失败案例和复现步骤，靠摘要拼出来的解读每一句都可能是错的。"))}</p>
            <p>${esc(tr("按追踪方法论的 L2 规范，需要补这六个模块："))}</p>
            <ol>${MODULES.map(([name]) => `<li>${esc(tr(name))}</li>`).join("")}</ol>
            <p style="margin-top:var(--space-3)">${esc(tr("写好之后放进"))} <code>vault/知识库管理/归档/来源/论文与项目/解析/${esc(p.id)}.md</code>${esc(tr("，页面会自动显示。"))}</p>
          </div>`;

        const body = `
          <a class="p-back" href="/papers">← ${esc(tr("返回论文追踪"))}</a>
          <header class="p-head">
            <h1>${esc(titleOf(p) || p.id)}</h1>
            <p class="p-meta">
              <span>${esc(p.published)}</span>
              <code>arXiv:${esc(p.id)}</code>
              ${p.primary ? `<span>${esc(p.primary)}</span>` : ""}
            </p>
            <p class="p-meta p-authors" style="margin-top:6px">${esc(authors)}</p>
            <div class="p-links">
              <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(tr("arXiv 原文"))} ↗</a>
              ${p.comment ? `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.comment)}</a>` : ""}
            </div>
          </header>

          <div class="p-level">L1 · ${esc(tr("摘要要点"))}</div>
          <dl class="p-l1">${l1}</dl>
          ${p.abstract ? `<details class="p-abstract">
            <summary>${esc(tr("看原文摘要（上面每个字段的出处）"))}</summary>
            <p>${esc(p.abstract)}<span class="src">arXiv:${esc(p.id)} · ${esc(tr("元数据与摘要来自 arXiv API"))}</span></p>
          </details>` : ""}

          <div class="p-level">L2 · ${esc(tr("深度解读"))}</div>
          ${l2}

          ${evidence}
        `;
        $("#shell").innerHTML = body;
        buildToc();
      }

      /* 目录从渲染出来的标题构建，不另存一份结构 ——
         两份结构迟早会不一致，而读者看到的永远是渲染后的那一份。 */
      function buildToc() {
        const toc = $("#p-toc");
        const heads = [...$("#shell").querySelectorAll("h3, h4")];
        if (!heads.length) { toc.innerHTML = ""; return; }
        heads.forEach((h, i) => {
          h.id = h.id || `p-${i}-${(h.textContent || "").trim().slice(0, 20).replace(/\W+/g, "-")}`;
        });
        toc.innerHTML = `<div class="rail-head">${esc(tr("本文目录"))}</div>`
          + `<ul>${heads.map((h) => `<li><a href="#${h.id}" data-level="${h.tagName[1]}">${esc(h.textContent)}</a></li>`).join("")}</ul>`;
        toc.querySelectorAll('a[href^="#"]').forEach((a) => {
          a.onclick = (event) => {
            event.preventDefault();
            const target = document.getElementById(a.getAttribute("href").slice(1));
            if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
          };
        });
      }

      async function load() {
        const id = new URLSearchParams(location.search).get("id") || "";
        if (!id) {
          $("#shell").innerHTML = `<div class="p-empty">${esc(tr("缺少论文编号。"))} <a href="/papers">${esc(tr("返回论文追踪"))}</a></div>`;
          return;
        }
        try {
          const response = await fetch(`/api/paper?id=${encodeURIComponent(id)}`, { cache: "no-store" });
          if (!response.ok) throw new Error("not found");
          paper = await response.json();
        } catch (error) {
          $("#shell").innerHTML = `<div class="p-empty">${esc(tr("找不到这篇论文。"))} <a href="/papers">${esc(tr("返回论文追踪"))}</a></div>`;
          return;
        }
        render();
      }

      document.addEventListener("tk:lang", render);
      load();
    </script>
