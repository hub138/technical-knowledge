name: pages
# GitHub Pages（项目页）部署。项目页挂在 /technical-knowledge/ 子路径下，
# index.html 里的 /static/... 绝对路径会 404（这正是之前「显示不对」的根因）。
#
# 本站是 SPA：首页从 /api/notes 拿列表、/api/note?path= 拿单篇。静态托管
# 没有后端，所以 scripts/export_static.py 先把 vault 渲染成同形状的静态
# JSON（api/notes.json、notes/<路径>.json 等），再把 index.html 的请求
# 模板改写到这些静态文件上。源 index.html 不动——Mac/dev 的 python 服务
# 仍用真路由。
#
# 静态托管边界：/api/learning/status 无后端（页面自带降级）；早报没有
# BestBlogs 数据源（返回空态）；笔记里的图片 /asset 引用的附件不在
# git（vault 图片被 gitignore），Pages 上不可见。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 导出静态内容并改写请求
        run: |
          mkdir -p _pages
          python3 scripts/export_static.py . _pages
          cp index.html _pages/
          cp -r site _pages/site
          # 1) 静态资源相对化（site/ 就在 index.html 旁边，子路径下天然成立）
          sed -i \
            -e 's|href="/static/|href="site/|g' \
            -e 's|src="/static/|src="site/|g' \
            -e 's|href="/favicon.svg"|href="site/favicon.svg"|g' \
            _pages/index.html
          # 2) API 请求改相对。version 是独立文件名，必须先于通配条目。
          sed -i "s|'/api/notes/version'|'api/notes-version.json'|g" _pages/index.html
          sed -i "s|'/api/notes?|'api/notes.json?|g" _pages/index.html
          sed -i "s|'/api/|'api/|g" _pages/index.html
          # 3) 单篇取用：静态 JSON 按 vault 目录镜像，拼原始路径
          sed -i \
            -e "s|'api/note?path='+encodeURIComponent(path)|'notes/'+path+'.json'|g" \
            -e "s|'api/note?path='+encodeURIComponent(article.path)|'notes/'+article.path+'.json'|g" \
            _pages/index.html
          # 4) 查询类路由（/?path=、/?view=）是 SPA 自己的状态，留在页内
          sed -i 's|href="/?|href="?|g' _pages/index.html
          # pushState 的三种书写形态：无空格、逗号后带空格、反引号模板串。
          # 不改写会跳到域名根（hub138.github.io/?path=...），脱离项目页。
          sed -i \
            -e "s|,'/|,'./|g" \
            -e "s|, '/|, './|g" \
            -e 's|,`/\?|,`./?|g' \
            _pages/index.html
          # 5) 兜底：其余 href="/..." 是真服务器路由（/learn、/launch、
          #    /papers、/projects），静态托管没有，统一指去 dev 完整站。
          sed -i 's|href="/|href="https://21.6.137.121:28788/|g' _pages/index.html
          # 6) site/ 内部同样有绝对引用：base.css 的 @import、js 里的 fetch
          #    与导航。nav.js/matrix-view.js/shell.js 会生成 "/?view="、
          #    "/?path="、"/?domain=" 链接和 "/learn" 这类路由——不改写
          #    就跳到域名根（hub138.github.io/?view=panorama，404）。
          sed -i 's|url("/static/|url("|g' _pages/site/base.css
          sed -i -e 's|"/api/|"api/|g' -e "s|'/api/|'api/|g" \
            _pages/site/*.js
          # 查询路由留在页内（SPA 自己接），先于兜底执行
          sed -i 's|"/?|"?|g' _pages/site/*.js
          # 其余 href="/..." 服务器路由统一指 dev（含 js 动态注入的
          # 链接赋值，如 projects-page 的 learn.href = "/learn"）
          sed -i 's|href="/|href="https://21.6.137.121:28788/|g' _pages/site/*.js
          sed -i 's|\.href = "/|.href = "https://21.6.137.121:28788/|g' _pages/site/*.js
          touch _pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
