name: pages
# GitHub Pages（项目页）部署。项目页挂在 /technical-knowledge/ 子路径下，
# index.html 里的 /static/... 绝对路径会 404（这正是之前「显示不对」的根因）。
#
# 本站是 SPA：首页从 /api/notes 拿列表、/api/note?path= 拿单篇。静态托管
# 没有后端，所以 scripts/export_static.py 先把 vault 渲染成同形状的静态
# JSON（api/notes.json、notes/<路径>.json 等），再把 index.html 的请求
# 模板改写到这些静态文件上。源 index.html 不动——Mac/dev 的 python 服务
# 仍用真路由。
#
# 静态托管边界：/api/learning/status 无后端（页面自带降级）；早报没有
# BestBlogs 数据源（返回空态）；笔记里的图片 /asset 引用的附件不在
# git（vault 图片被 gitignore），Pages 上不可见。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Markdown 渲染依赖
        run: python3 -m pip install -r requirements.txt
      - name: 导出静态内容并改写请求
        # 构建规则只在 scripts/build_pages.sh 里维护一份：Actions 与本地
        # 复现跑同一个脚本，避免两处 sed 规则漂移（漂移过一次，线上和
        # 本地改写出来的链接不一样）。
        run: bash scripts/build_pages.sh . _pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
